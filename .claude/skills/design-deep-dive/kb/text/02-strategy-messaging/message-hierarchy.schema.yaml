# message-hierarchy.schema.yaml — иерархия сообщений страницы: главное сообщение, опоры, доказательства, возражения и
# «сюжет словами» по секциям
#
# Что это. JSON Schema (draft 2020-12), записанная в YAML. Экземпляр — файл `hierarchy-<страница>.yaml`: одна иерархия
# на страницу или шаблон страницы и на один уровень осведомлённости трафика (две аудитории с разным уровнем — два файла,
# связанных `sibling_ids`). Правила — `02-awareness-hierarchy-objections.md` §2–§3.
#
# Границы (`kb/common/owners.md` § Форматы обмена): ПОРЯДОК и набор секций задаёт site (`page-plan`); здесь — какое сообщение несёт
# секция и какой вопрос посетителя она закрывает («вопрос → доказательство → действие»). Секции описываются ролями
# `section_role` словаря site (`../site/02-site-types/vocabulary.yaml`) с черновым порядком (`order`), который задаёт
# план страницы; место в плане — поле `section_id`.
#
# Ссылки: смысл — `meaning_ref` (meaning.schema.yaml); факты — `fact:<id>` / `missing:<id>` (facts.yaml); голос
# клиента — `voc:<id>`; возражения и ценность — id из meaning (`objection_ids`, `value_theme_refs`).
# Потребители: тексты по слотам (text 04), цепочка генерации (text 09), copy-deck (`sections[].message` ← `sections[].message`,
# `slots[].fact_ids` ← `proof_ids`), вход холста (работа секций `site.sections[].job` брифа холста — проекция `x-canvas-map`).
#
# Даты — строкой в кавычках. Проверка: `../../scripts/text/validate_meaning.py` (схема + смысловые
# проверки: тип страницы и роли секций — id словаря site, первая секция — hero у типов страниц с hero в начале сюжета
# (кроме `x-hero-first-optional`), каждая опора стоит хотя бы в одной секции, у опоры есть доказательство или missing,
# возражения-блокеры из meaning закрыты до финального призыва — кроме справочных и служебных страниц,
# `x-blocker-optional`).

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:app-design:text:message-hierarchy:1"
title: "message-hierarchy — что сообщает страница и в каком порядке доводов"
description: >-
  Главное сообщение (одна фраза), 3–5 опор с доказательствами, возражение к каждой опоре и раскладка по секциям:
  у каждой секции один вопрос посетителя, одно сообщение, доказательства и следующий шаг. Формулировки внутренние —
  тексты страницы пишет copy-deck.
date: "2026-09-29"
x-version: 1
x-owner: "text · 02-strategy-messaging"
x-doc: "02-strategy-messaging/02-awareness-hierarchy-objections.md"

type: object
required: [hierarchy_version, date, status, page, core_message, first_screen, pillars, sections]
additionalProperties: false
patternProperties:
  "^x-": {description: "Расширения проекта; валидатор их не проверяет."}
properties:
  hierarchy_version:
    const: 1
  date:
    $ref: "#/$defs/date"
  status:
    enum: [draft, proposed, approved]
  id:
    $ref: "#/$defs/id"
    description: "id иерархии (например, hierarchy-lesnaya-problem-aware)."
  site:
    $ref: "#/$defs/id"
  meaning_ref:
    type: string
    description: "Путь к meaning.yaml проекта или JSON Pointer в site-brief (`/meaning`)."
  lang:
    type: string
    pattern: "^[a-z]{2}(-[A-Z]{2})?$"
  sibling_ids:
    type: array
    items: {$ref: "#/$defs/id"}
    description: "Иерархии той же страницы под другой уровень осведомлённости или сегмент (варианты страницы)."

  page:
    type: object
    additionalProperties: false
    required: [page_type, awareness]
    properties:
      page_type:
        $ref: "#/$defs/page-type"
      page_id:
        type: string
        description: "id страницы плана (page.id) или карты сайта."
      segment_ref:
        $ref: "#/$defs/id"
        description: "Сегмент из meaning.audience (по умолчанию — основной)."
      awareness:
        $ref: "#/$defs/awareness-level"
        description: "Уровень осведомлённости, под который написана эта иерархия."
      traffic_sources:
        type: array
        items: {$ref: "#/$defs/traffic-source"}
      sophistication_stage:
        type: integer
        minimum: 1
        maximum: 5
        description: "Искушённость рынка (Шварц): 1 — простое обещание … 3 — механизм … 5 — идентификация."
      promise_of_source:
        type: string
        description: "Что обещал источник (объявление, запрос, письмо, пост): hero обязан это продолжить (message match)."
      argument_depth:
        enum: [short, medium, long]
        description: >-
          Сколько доводов нужно, чтобы довести этот трафик до действия (Wiebe: длина = аргумент от уровня
          осведомлённости). Подсказка для site: число и порядок секций решает page-plan.
      goal:
        type: object
        additionalProperties: false
        properties:
          action_ref: {type: string, description: "Главное действие (id action словаря site)."}
          secondary_goal: {type: string, description: "Для не готовых сейчас: что запомнить или сделать."}

  core_message:
    type: object
    additionalProperties: false
    required: [text, hero_approach, value_theme_refs]
    description: "Главное сообщение: одна фраза, из которой выводятся hero и все опоры. Не заголовок — источник заголовка."
    properties:
      text:
        type: string
        minLength: 10
        maxLength: 200
      hero_approach:
        enum: [direct-offer, product-benefit, solution-vs-alternatives, problem-story, identity]
        description: >-
          Тип первого экрана по уровню осведомлённости (02 §1.2): direct-offer — most-aware (сделка, цена, условия);
          product-benefit — product-aware (продукт по имени + превосходство); solution-vs-alternatives — solution-aware
          (категория и чем лучше привычных подходов); problem-story — problem-aware (узнаваемая ситуация и её цена);
          identity — unaware (узнавание себя, без цены и названия в заголовке).
      value_theme_refs:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/id"}
        description: "id ценностей из meaning.positioning.value_themes."
      proof_ids: {$ref: "#/$defs/proof-ids"}
      must_not_say:
        type: array
        items: {type: string}
        description: "Чего главное сообщение не говорит (границы meaning.boundaries.not_promised, чужой уровень осведомлённости)."

  first_screen:
    type: object
    additionalProperties: false
    required: [what, for_whom, outcome, next_step]
    description: >-
      Что посетитель должен понять за первый экран (impeccable Persuade: «what this is, why it matters, and what to do
      within seconds»; Wynter: ясность → релевантность → ценность → отличие). Внутренние ответы, не тексты.
    properties:
      what: {type: string, description: "Что это — категория словами клиента."}
      for_whom: {type: string, description: "Для кого — узнаваемый признак сегмента."}
      outcome: {type: string, description: "Какой результат или какая перемена."}
      differentiator: {type: string, description: "Чем отличается от привычной альтернативы (если уровень ≥ solution-aware)."}
      next_step: {type: string, description: "Что сделать (или куда листать, если политика первого экрана site допускает призыв ниже)."}
      proof_ids: {$ref: "#/$defs/proof-ids"}
      message_match:
        type: string
        description: "Как hero продолжает обещание источника (не обязательно дословно; Wiebe: дословное совпадение может звучать неловко)."

  pillars:
    type: array
    minItems: 3
    maxItems: 5
    description: "Опоры: 3–5 утверждений, каждое доказывает главное сообщение с одной стороны; у каждой — доказательство и возражение."
    items: {$ref: "#/$defs/pillar"}

  sections:
    type: array
    minItems: 3
    description: "Сюжет словами: по секциям — вопрос посетителя, сообщение, доказательства, следующий шаг. Порядок — черновой (site решает)."
    items: {$ref: "#/$defs/section"}

  proof_order:
    type: array
    items:
      type: string
      pattern: "^(fact|missing):[a-z0-9]+(-[a-z0-9]+)*$"
    description: "Порядок появления доказательств на странице (зависит от уровня осведомлённости: 02 §1.4)."

  not_said:
    type: array
    items: {type: string}
    description: "Что страница сознательно НЕ говорит (для другого уровня, сегмента, страницы) — чтобы генератор не дописывал."

$defs:

  id:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

  date:
    type: string
    pattern: "^[0-9]{4}-(0[1-9]|1[0-2])(-(0[1-9]|[12][0-9]|3[01]))?$"

  proof-ids:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: "^(fact|missing):[a-z0-9]+(-[a-z0-9]+)*$"

  voc-ids:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: "^voc:[a-z0-9]+(-[a-z0-9]+)*$"

  awareness-level:
    enum: [unaware, problem-aware, solution-aware, product-aware, most-aware]

  traffic-source:
    enum: [search-problem, search-category, search-brand, paid-social, paid-search, ai-answer, referral, email, direct,
           retargeting, maps-local, social-organic, marketplace, messenger, offline]

  page-type:
    $ref: "#/$defs/id"
    description: >-
      Тип страницы — id словаря site (`page_type`, `../../site/02-site-types/vocabulary.yaml`). Перечень один — в
      словаре, как у плана страницы: id сверяет validate_meaning.py (нет в словаре или `out-of-scope` — ошибка).

  section-role:
    $ref: "#/$defs/id"
    description: >-
      Роль секции — id словаря site (`section_role`); место в плане страницы — section_id. Перечень один — в словаре,
      как у плана страницы: id сверяет validate_meaning.py (нет в словаре или `measurement-only` — ошибка).

  pillar:
    type: object
    additionalProperties: false
    required: [id, message, proof_status]
    properties:
      id: {$ref: "#/$defs/id"}
      message: {type: string, maxLength: 200, description: "Утверждение опоры одной фразой (внутреннее)."}
      value_theme_refs:
        type: array
        items: {$ref: "#/$defs/id"}
        description: "Ценности meaning, которые опора доказывает. Обязательны, кроме опоры слоя friction (снятие риска, условия оффера)."
      layer:
        enum: [clarity, relevance, value, differentiation, friction]
        description: "Какой слой сообщения закрывает опора (Laja, Wynter): ясность, релевантность, ценность, отличие, снятие трения."
      proof_status: {enum: [has-proof, missing]}
      proof_ids: {$ref: "#/$defs/proof-ids"}
      objection_ids:
        type: array
        items: {$ref: "#/$defs/id"}
        description: "Возражения из meaning.objections, которые встают против этой опоры."
      counter: {type: string, description: "Как опора отвечает на своё возражение (смысл)."}
      voc_ids: {$ref: "#/$defs/voc-ids"}
    allOf:
      - if: {properties: {proof_status: {const: has-proof}}}
        then: {required: [proof_ids], properties: {proof_ids: {minItems: 1}}}
      - if:
          not:
            required: [layer]
            properties: {layer: {const: friction}}
        then: {required: [value_theme_refs], properties: {value_theme_refs: {minItems: 1}}}

  section:
    type: object
    additionalProperties: false
    required: [order, section_role, question, message]
    properties:
      order: {type: integer, minimum: 1, description: "Черновой порядок; site переопределяет page-plan."}
      section_id: {type: string, description: "id секции из page-plan site (когда появится)."}
      section_role: {$ref: "#/$defs/section-role"}
      question:
        type: string
        description: "Вопрос посетителя, который закрывает секция, его словами («А это точно не разобьют?»)."
      message:
        type: string
        maxLength: 240
        description: "Что секция сообщает — одна мысль (внутренняя формулировка)."
      carries:
        type: array
        items: {type: string, pattern: "^(core|[a-z0-9]+(-[a-z0-9]+)*)$"}
        description: "Какие опоры (id) или главное сообщение (`core`) несёт секция."
      proof_ids: {$ref: "#/$defs/proof-ids"}
      objection_ids: {type: array, items: {$ref: "#/$defs/id"}}
      next_step:
        type: string
        description: "Что дальше: призыв (какой), переход к следующему вопросу, ничего (служебная секция)."
      awareness_shift:
        type: object
        additionalProperties: false
        properties:
          from: {$ref: "#/$defs/awareness-level"}
          to: {$ref: "#/$defs/awareness-level"}
        description: "С какого уровня на какой секция переводит читателя (problem-aware → solution-aware и т. д.)."
      notes: {type: string}

# Страницы, у которых иерархия не обязана закрывать возражение-блокер до главного призыва: справочную и служебную
# страницу читают за адресом, документом или выходом из тупика, решение о покупке принимается не на ней. `page_class` —
# поле `class` типа страницы в словаре site, `page_types` — отдельные типы.
x-blocker-optional:
  page_class: [utility]
  page_types: [contacts-page, location-page, documents-page]

# Первая секция — hero: правило действует у типов страниц, чей сюжет начинается с hero (site
# 03-page-structure/01-narratives-and-section-order.md §3). Страница контактов открывается секцией contacts, служебная
# страница (класс utility: «спасибо», 404, юридическая, результаты поиска) — своей ролью: у них роль первой секции
# проверка не задаёт, а главное сообщение первая секция несёт у любого типа.
x-hero-first-optional:
  page_class: [utility]
  page_types: [contacts-page]

# Проекция во вход холста (references/claude-design.md § 6): работа секции в брифе холста — «вопрос → сообщение;
# доказательства» по секциям плана; остальное воплощено в текстах copy deck.
x-canvas-map:
  source: hierarchy
  stages: [mockup]
  files:
    brief.yaml:
      site.sections[].job:
        rule: derive
        from: [/sections/*/section_id, /sections/*/section_role, /sections/*/question, /sections/*/message, /sections/*/proof_ids]
        note: "«<вопрос посетителя> → <сообщение секции>; доказательства: <id фактов без префикса>» — секции сводятся с секциями плана по section_id (без него — по роли); порядок и состав секций — план страницы"
  drop:
    - {from: [/hierarchy_version, /date, /status, /id, /site, /lang, /sibling_ids, /meaning_ref], note: "служебные поля, ссылки и подпись: статус, путь и отпечаток — в INPUT.md"}
    - {from: [/page], note: "тип страницы, осведомлённость, трафик и цель — план страницы и site-brief, во вход идут их картами"}
    - {from: [/core_message, /first_screen, /pillars, /proof_order, /not_said], note: "главное сообщение, первый экран, опоры и порядок доводов воплощены в текстах copy deck; обещание первого экрана — слот copy deck, product.goal — из смысла"}
    - {from: [/sections/*/order, /sections/*/carries, /sections/*/objection_ids, /sections/*/next_step, /sections/*/awareness_shift, /sections/*/notes], note: "порядок и следующий шаг секции — план страницы; опоры и возражения — уже в текстах"}
x-copy-deck-map:
  - {from: "sections[].message", to: "copy_deck.pages[].sections[].message", note: "опора иерархии одной фразой"}
  - {from: "sections[].proof_ids", to: "copy_deck…slots[].fact_ids", note: "без префикса fact:; missing:<id> → [PLACEHOLDER] в тексте"}
  - {from: "sections[].question", to: "copy_deck…slots[].notes", note: "вопрос посетителя — вход для заголовка секции (заголовок-ответ или заголовок-вопрос — по copy-slots.yaml)"}
