x-never-claim-defaults:
  # Набор ru-default-1: запрет действует на непроверенное; проверенный факт класса с разрешением снимает запрет
  # (lift: with-fact); запреты политики и закона не снимаются (lift: never) или снимаются только юристом (legal-review).
  - {id: nc-counts, text: "Счётчики клиентов, пользователей, заказов и рост в процентах без факта с источником и датой", claim_class: [fact-number], lift: with-fact}
  - {id: nc-ratings, text: "Рейтинги и звёзды без факта с площадкой, шкалой, числом оценок и датой снимка", claim_class: [rating], lift: with-fact}
  - {id: nc-trusted-by, text: "«Нам доверяют», названия и логотипы клиентов и партнёров без факта с письменным разрешением клиента", claim_class: [client-logo], lift: with-fact}
  - {id: nc-awards-press, text: "Награды, премии, «о нас пишут», логотипы СМИ без факта со ссылкой или документом", claim_class: [award-press], lift: with-fact}
  - {id: nc-testimonials, text: "Отзывы, цитаты, имена и фото людей без факта с письменным разрешением (и согласием на распространение ПДн)", claim_class: [testimonial-quote], lift: with-fact}
  - {id: nc-prices-terms, text: "Цены, скидки, сроки доставки, гарантии, сертификаты без факта", claim_class: [price-discount, purchase-terms, guarantee, certification], lift: with-fact}
  - {id: nc-superlatives, text: "«Лучший», «№ 1», «самый», «первый», «лидер» без критерия и объективного подтверждения (Пленум ВАС № 58 п. 29)", claim_class: [superlative], lift: with-fact}
  - {id: nc-comparisons, text: "Сравнения с конкурентами и «в N раз» без метода, даты и документа", claim_class: [comparison], lift: with-fact}
  - {id: nc-health, text: "Обещания здоровья и лечебного эффекта (для немедицинских товаров и услуг — никогда)", claim_class: [health], lift: legal-review, voice: any}
  - {id: nc-income, text: "Обещания дохода, заработка, окупаемости", claim_class: [income-finance], lift: legal-review, voice: any}
  - {id: nc-scarcity, text: "«Осталось N», «последние места» без живого источника остатка", claim_class: [availability-scarcity], lift: with-fact}
  - {id: nc-deadline, text: "Сроки акций и таймеры без реальной даты окончания", claim_class: [promo-deadline], lift: with-fact}
  - {id: nc-forecast, text: "Прогнозы результата без расчёта и оговорки", claim_class: [forecast], lift: with-fact}
  - {id: nc-official-approval, text: "Указание на одобрение органами власти («одобрено Минздравом»)", claim_class: [certification], patterns: ["одобрен\\w*\\s+(минздрав|министерств|правительств|государств|роспотребнадзор)", "рекомендован\\w*\\s+(минздрав|министерств|роспотребнадзор)"], lift: never, voice: any}
  - {id: nc-ai-people, text: "ИИ-люди в роли клиентов, команды, авторов отзывов; выдуманные имена и лица", claim_class: [testimonial-quote, client-logo], lift: never, voice: any}

x-canvas-map:
  # Проекция facts.yaml во вход холста (references/claude-design.md § 6): файл facts.md поверхности — «Факты» (публикуемые),
  # «Нет» (пробелы и непубликуемые факты заглушками), «Нельзя утверждать». Выгрузка — copydeck.py export (facts.md).
  source: facts
  stages: [mockup]
  files:
    facts.md:
      "Факты":
        rule: derive
        from: [/facts/*/id, /facts/*/verbatim, /facts/*/translations, /facts/*/source, /facts/*/use, /facts/*/lang,
               /facts/*/claim_class, /facts/*/verification, /facts/*/permission, /facts/*/valid, /facts/*/legal,
               /facts/*/example, /example, /lang]
        note: "публикуемые факты по publish_filter, строка на формулировку verbatim (на языке страницы — translations.<lang>) с колонками facts_md; демо-данные (example) — с пометкой в колонке источника"
      "Нет":
        rule: derive
        from: [/missing/*/id, /missing/*/what, /missing/*/placeholder, /missing/*/who]
        note: "пробелы missing[] (колонки missing_md) и факты, не прошедшие publish_filter, — строкой с заглушкой [PLACEHOLDER: <id>] и причиной"
      "Нельзя утверждать":
        rule: derive
        from: [/never_claim/*/text, /never_claim/*/claim_class, /never_claim/*/lift, /never_claim/*/translations, /never_claim_defaults]
        note: "never_claim_md: строки запретов проекта и набора x-never-claim-defaults, которые не сняты проверенным фактом"
  drop:
    - {from: [/facts_version, /date, /site, /status, /owner, /collected_by, /intake], note: "служебные поля и подпись: статус, путь и отпечаток — в INPUT.md"}
    - {from: [/jurisdiction], note: "право — вход сверки claims_check.py и брифа (constraints.jurisdiction)"}
    - {from: [/entities], note: "имена для сверки текстов; на холст идут готовые формулировки фактов"}
    - {from: [/facts/*/aliases, /facts/*/kind, /facts/*/canonical, /facts/*/values, /facts/*/entities, /facts/*/basis,
              /facts/*/attribution, /facts/*/original_ref, /facts/*/edits, /facts/*/asset, /facts/*/responsible,
              /facts/*/schema_org, /facts/*/machine, /facts/*/related, /facts/*/tags, /facts/*/notes],
       note: "поля сверки, разметки и происхождения: исполнитель ставит на макет только дословные формулировки; canonical, schema_org и machine — пакет кода; файлы-доказательства — план ассетов"}
    - {from: [/missing/*/aliases, /missing/*/kind, /missing/*/claim_class, /missing/*/needed_for, /missing/*/asked,
              /missing/*/due, /missing/*/blocking, /missing/*/fallback, /missing/*/question],
       note: "как и когда закрыть пробел — работа слоя страницы; блокирующие пробелы — строка пробелов INPUT.md"}
    - {from: [/never_claim/*/id, /never_claim/*/patterns, /never_claim/*/scope, /never_claim/*/voice, /never_claim/*/reason,
              /never_claim/*/lang, /never_claim/*/source],
       note: "механика сверки запрета; на холст — только человеческая фраза запрета"}
  publish_filter: "в «Факты» — только факты, которые сверка разрешает публиковать: verification.status ∈ {verified, stated} (stated — если класс не needs_document), permission.status ∈ {granted, not-required}, разрешение не отозвано и не истекло, source.derivation ≠ inferred, выдержка источника подтверждает слова факта, valid.until ≥ дата сборки, legal.review ∈ {approved, not-needed} для классов legal: required; остальные — строками «Нет» с заглушкой и причиной (фильтр — claims_check.publishable_issues)"
  facts_md:
    "id": "id факта; каждая следующая формулировка verbatim — строка с id «<id>.2», «<id>.3»"
    "дословно": "verbatim[n]; на языке страницы — translations.<lang>.verbatim"
    "источник": "source.who / source.where / source.date (+ source.url); демо-данные (example) — «демо: вымышленные данные»"
    "где можно": "use.section_roles → id секций плана страницы; use.slot_types; use.not_in — «не в …»; use.requires_nearby — «рядом: …»"
  missing_md:
    "id": "missing.id (у непубликуемого факта — id факта)"
    "чего нет": "missing.what (у факта — canonical и причина)"
    "на странице до ответа": "missing.placeholder ([PLACEHOLDER: …])"
    "кто даст": "missing.who (у факта — responsible.role или owner.role)"
  never_claim_md: "строки never_claim[].text (на языке страницы — translations.<lang>.text) и набора x-never-claim-defaults, у которых lift: never или нет снимающего проверенного факта того же класса (legal-review — факта с legal.review.status: approved); запрет стоит только на непроверенном"

