  slot: {slot_type: faq-a, question: "Сколько стоит ремонт двушки под ключ?"}
  naive: "Стоимость ремонта рассчитывается индивидуально и зависит от многих факторов. Свяжитесь с нами — наши специалисты всё посчитают."
  naive_findings: [COPY-GEO-08, COPY-GEO-14]  # linter: geo-evasive-answer; judge: первое предложение не отвечает
  revised: "Работы под ключ в «Отвесе» стоят от 9 800 ₽ за м² без материалов (прайс 2026 года). Замер и смета — бесплатно в черте города; точную сумму считаем после замера."
  revised_facts: [price-from-per-m2, estimate-free]
  note: "производных чисел («двушка 54 м² — от 529 200 ₽») без отдельной записи facts.yaml не писать: claims_check.py их не подтвердит"
