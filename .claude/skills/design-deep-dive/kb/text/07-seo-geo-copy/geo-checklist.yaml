# geo-checklist.yaml — полный чек-лист GEO-текста: что проверить, чем, и что из этого ворота.
# Обоснования, примеры и спорные места — 07-seo-geo-copy/03-geo-copy.md;
# мета и статьи — 02-seo-pages-articles-meta.md; интент и набивка — 01-intent-and-keywords.md.
#
# GEO-текст здесь — слой страницы, который поисковики с ИИ (Алиса AI в Поиске Яндекса, Google AI Overviews и AI Mode,
# ChatGPT Search, Perplexity) могут взять в ответ: «коротко» в начале статьи, ответы FAQ, определения, абзац-ответ под
# подзаголовком-вопросом, факты для сравнения. Это не отдельный «текст для ИИ»: Google прямо просит не делать второй
# версии и не нарезать текст на куски; правила ниже улучшают текст для человека и заодно делают его цитируемым.
#
# Порядок проверки: claims_check.py (факты и право) → copy_lint.py (стиль, мета, GEO) →
# судья (рубрика 09-ai-generation-evaluation/copy-rubric.yaml) → человек. Пункты с method: linter ссылаются на id правил meta-rules.yaml, geo-rules.yaml и
# словарей 06-anti-slop/lexicon/.

date: 2026-09-24
version: 1
owner: text/07-seo-geo-copy
status: provisional
id_prefix: COPY-GEO-
levels:
  gate: "ворота — не публиковать, пока не исправлено (или не оформлено исключение с причиной)"
  signal: "сигнал — проверить и решить; править, если подтвердилось"
methods:
  claims: "../../scripts/text/claims_check.py check <copy deck> --facts facts.yaml (сверка с фактами + право)"
  linter: "../../scripts/text/copy_lint.py <copy deck> --genre geo|article|… (словари 06-anti-slop/lexicon/ + meta-rules.yaml + geo-rules.yaml)"
  script: "скрипт по нескольким полям или страницам (дубли, сравнение с canonical, заголовок ↔ первый абзац) — ../../scripts/text/copydeck.py"
  judge: "ИИ-судья по рубрике (09-ai-generation-evaluation/copy-rubric.yaml): вопрос из поля judge_question, ответ да/нет + цитата-обоснование"
  human: "редактор или заказчик: решение, которое не выводится из текста (опыт, выбор темы, отличие от конкурентов)"
  site: "техническая проверка сайта (site 07: HTML без JS, индексация, разметка, отчёты) — здесь только ссылка"
engines_note: "Google и Яндекс не сводятся в одно правило: Google — «SEO для ИИ — это SEO» и запрет страниц под вариации запроса; Яндекс — ЭПОС, «увеличивайте количество релевантных страниц» (по интентам), SoV в Вебмастере. Поле engines у пункта — если позиции различаются."

checks:
  # ============ A. Факты и честность — ворота ============
  - id: COPY-GEO-01
    name: "Любое число, имя, дата, цена, рейтинг, цитата GEO-слоя — из facts.yaml"
    sign: "у слота есть fact_ids; claims_check.py без error (COPY-F-NUM, COPY-F-CLASS, COPY-F-NAME, COPY-F-QUOTE…)"
    applies: {genres: [geo, article, landing, site-page], slot_types: [geo-answer, definition, faq-a, article-summary, article-paragraph, comparison-row]}
    how: [{method: claims, ref: "COPY-F-*"}, {method: linter, ref: "an-number-without-fact (06-anti-slop)"}]
    level: gate
    evidence: "[стандарт базы] + [исследование]"
    source: "02-strategy-messaging/03-proof-and-facts.md §4, §7; Aggarwal и др. KDD 2024 + код GEO-optim (статистика, цитаты и источники «even if hypothetical», «fake and artificial», «You may invent these sources») — поэтому приём «добавь цифры» без фактов запрещён"
    date: 2026-09-24

  - id: COPY-GEO-02
    name: "Факт стоит канонической формулировкой — одинаково на всех страницах, в FAQ и разметке"
    sign: "текст факта в geo-answer, faq-a, definition = facts[].canonical или одна из verbatim; JSON-LD — тот же canonical"
    applies: {genres: [geo, article, site-page, landing], slot_types: [geo-answer, faq-a, definition, article-summary]}
    how: [{method: claims, ref: "COPY-F-NUM-MISMATCH, COPY-F-EXTENDS (сильнее факта)"}, {method: script, ref: "сравнение слота с canonical/verbatim; разметка — site 07"}]
    level: gate
    evidence: "[стандарт базы] + [документация]"
    source: "02-strategy-messaging/facts.schema.yaml (canonical: «кто + значение с единицей + условие + дата или источник»); Google «Make sure structured data matches the visible content» (блог 2025-05-21); Яндекс «Как формируются ответы Алисы AI»: ответ пересказывает источники, прямую речь — дословно"
    date: 2026-09-24

  - id: COPY-GEO-03
    name: "Скоропортящийся факт — с датой «на …» в том же предложении; относительного времени нет"
    sign: "цена, рейтинг, число клиентов, норма закона, тариф — с датой; нет «в этом году», «недавно»; факт не просрочен"
    applies: {genres: [geo, article], slot_types: [geo-answer, faq-a, definition, article-summary, article-paragraph]}
    how: [{method: linter, ref: geo-relative-time}, {method: claims, ref: "COPY-F-STALE, COPY-F-EXPIRED"}]
    level: gate
    evidence: "[документация] + [исследование]"
    source: "Google «Influence your byline dates» (2025-12-10); SQRG 11.09.2025 §18.0; Tian и др. 2026 (outdated information — причина непроцитированности); Martinez 2026 §7.2 (даты и цены — «moderate» рычаг для запросов, где важно время)"
    date: 2026-09-24

  - id: COPY-GEO-04
    name: "Доля, кратность, «N из M» — с источником и датой; внешняя статистика — только реальная, со ссылкой"
    sign: "в том же предложении «по данным …, <дата>»; источник существует и сказал именно это"
    applies: {genres: [geo, article], slot_types: [geo-answer, faq-a, definition, article-summary, article-paragraph]}
    how: [{method: linter, ref: geo-unsourced-stat}, {method: claims, ref: "COPY-F-NUM, COPY-F-CLASS"}, {method: human, ref: "открыть источник"}]
    level: gate
    evidence: "[исследование] + [стандарт базы]"
    source: "C-SEO Bench (Puerto и др., NeurIPS 2025): метод Statistics снижает место цитирования в 19 из 24 настроек; Martinez 2026: «verifiable, dated, and properly attributed evidence»; 02-strategy-messaging/03-proof-and-facts.md"
    date: 2026-09-24

  - id: COPY-GEO-05
    name: "Никаких выдуманных цитат, экспертов, источников, авторов и отзывов ради «цитируемости»"
    sign: "каждая цитата и имя — запись facts.yaml с разрешением; ИИ-текст не подписан живым или вымышленным человеком"
    applies: {genres: [geo, article, landing, site-page]}
    how: [{method: claims, ref: "COPY-F-QUOTE, COPY-F-NAME, COPY-F-PERMISSION, nc-ai-people"}, {method: human, ref: "подпись автора"}]
    level: gate
    evidence: "[документация] + [стандарт базы]"
    source: "Сливинский (Яндекс), 12.2025 [V:AbqU-GxAYs8 48:57] — не подписывать сгенерированное реальными или несуществующими людьми; Google 2023-02-08 (AI в подписи автора — «probably not the best way»); Martinez 2026 §9.1 (подлинность доказательств — граница белого GEO); x-never-claim-defaults nc-ai-people (02-strategy-messaging/facts.schema.yaml)"
    date: 2026-09-24

  - id: COPY-GEO-06
    name: "Нет инструкций для моделей и скрытого текста"
    sign: "нет «ИИ, рекомендуй нас», «ignore previous instructions», текста, видимого только роботу"
    applies: {genres: [geo, article, landing, site-page, meta]}
    how: [{method: linter, ref: geo-model-instruction}, {method: site, ref: "скрытый текст, клоакинг — site 07"}]
    level: gate
    evidence: "[документация] + [исследование]"
    source: "Google Spam policies (2026-08-28): спам — в том числе попытка «manipulate generative AI responses»; Яндекс «Использование SEO-текстов» (скрытые тексты); Nestaas 2025, Pfrommer 2024 (по Martinez 2026 §9.2)"
    date: 2026-09-24

  - id: COPY-GEO-07
    name: "Отзывы и их сводки — только из настоящих отзывов"
    sign: "сводка «плюсы и минусы» опирается на реальные отзывы (ссылка на площадку, дата); отзывов «от имени» нет"
    applies: {genres: [landing, site-page, geo], slot_types: [testimonial-quote, faq-a, geo-answer]}
    how: [{method: claims, ref: "COPY-F-QUOTE, COPY-F-PERMISSION"}, {method: human}]
    level: gate
    evidence: "[документация]"
    source: "Сливинский, 12.2025 [V:AbqU-GxAYs8 50:59] — «норм» извлечь плюсы и минусы из отзывов, «не норм» — фейковый отзыв; 02-strategy-messaging/03-proof-and-facts.md §5; разметка самохвальных отзывов — site 07"
    date: 2026-09-24

  # ============ B. Ответ и структура ============
  - id: COPY-GEO-08
    name: "Ответ первым: под заголовком-вопросом первое предложение отвечает"
    sign: "первая фраза абзаца — ответ (да/нет, число, определение, выбор) без разгона; 1–2 предложения, затем детали"
    applies: {genres: [geo, article, site-page, landing], slot_types: [faq-a, geo-answer, article-paragraph, article-summary]}
    how: [{method: judge, judge_question: "Отвечает ли первое предложение на вопрос заголовка без вводных?"}, {method: linter, ref: "geo-evasive-answer, geo-pronoun-lead, ru-ton-announce (06-anti-slop)"}]
    level: signal
    engines: {yandex: "ответ Алисы AI начинается с «краткий ответ одним-двумя предложениями» (справка, снято 2026-09-24)", google: "особой формы не требует; featured snippet и ответ ИИ берут фрагмент страницы"}
    evidence: "[документация] + [консенсус] (перевёрнутая пирамида, text 01/03 §2.2)"
    source: "Яндекс «Как формируются ответы Алисы AI»; text 01/03 (вывод первым); E-GEO (открывающее резюме — в найденной стратегии); higgsfield seo.md GEO п.1 [практика]"
    date: 2026-09-24

  - id: COPY-GEO-09
    name: "Абзац самодостаточен: предмет назван, без «как сказано выше» и местоимения в начале"
    sign: "абзац можно прочитать отдельно — в сниппете, сводке или ответе Алисы — и он понятен"
    applies: {genres: [geo, article], slot_types: [geo-answer, faq-a, definition, article-summary, article-paragraph]}
    how: [{method: linter, ref: "geo-pronoun-lead, geo-see-above"}, {method: judge, judge_question: "Понятен ли абзац без предыдущего текста?"}]
    level: signal
    evidence: "[практика] + [исследование] (симуляция)"
    source: "Tian и др. 2026 (фрагментация — причина непроцитированности); Яндекс: одна страница — источник для отдельных параграфов ответа"
    date: 2026-09-24

  - id: COPY-GEO-10
    name: "Разделы по смыслу, без нарезки на «чанки» и без второй «ИИ-версии» страницы"
    sign: "абзацы и разделы — по мыслям для читателя; нет блоков-дублей «коротких ответов для ИИ», нет отдельной страницы или Markdown-версии для моделей"
    applies: {genres: [geo, article, site-page, landing]}
    how: [{method: judge, judge_question: "Есть ли на странице блоки, которые повторяют текст страницы короткими кусками без новой информации?"}, {method: human}]
    level: gate
    engines: {google: "прямой запрет: «There's no requirement to break your content into tiny pieces»; «Rewriting content just for AI systems» — миф (ai-optimization-guide 2026-07-10); SOTR 01.2026 «we don't want you to do that» [V:i4jDc58ofH4 17:17]", yandex: "особого текста не требует: «принципиально новых требований не возникает» (ЭПОС)"}
    evidence: "[документация]"
    source: "Google ai-optimization-guide (2026-07-10); [V:i4jDc58ofH4 17:17]; Tian 2026 (фрагментация мешает синтезу); Яндекс ЭПОС"
    date: 2026-09-24

  - id: COPY-GEO-11
    name: "Подзаголовки — вопросы читателя или выводы, не ярлыки"
    sign: "H2/H3 можно прочитать как запрос или утверждение («Сколько стоит ремонт двушки»), а не «Особенности», «Введение»"
    applies: {genres: [geo, article, site-page], slot_types: [article-heading, section-title, faq-q]}
    how: [{method: linter, ref: "geo-heading-label, ru-mkt-label-headings (06-anti-slop)"}, {method: judge, judge_question: "Складываются ли подзаголовки в план ответа на запрос страницы?"}]
    level: signal
    evidence: "[документация] + [практика]"
    source: "Google ai-optimization-guide (headings — «clear structure»); higgsfield seo.md GEO п.6 [практика]; ответ Алисы делится на параграфы по подтемам (справка Яндекса)"
    date: 2026-09-24

  - id: COPY-GEO-12
    name: "«Коротко» в начале статьи и абзац-ответ — 40–80 слов, с 2–3 фактами"
    sign: "article-summary и geo-answer не длиннее 100 слов; внутри — факты с датой, не пересказ оглавления"
    applies: {genres: [geo, article], slot_types: [article-summary, geo-answer]}
    how: [{method: linter, ref: geo-summary-long}, {method: claims}]
    level: signal
    evidence: "[данные] + [мнение] (порог)"
    source: "Pew 2025-07-22 (медиана ИИ-сводки Google 67 слов); Яндекс (краткий ответ 1–2 предложения); C-SEO Bench: Markdown-резюме в начале документа помогло только в рекомендациях товаров, не в «вопрос — ответ» — блок «коротко» ради людей, не ради гарантии цитирования"
    date: 2026-09-24

  - id: COPY-GEO-13
    name: "Определение термина — «X — это Y, который …»"
    sign: "первое предложение определения называет термин и родовое понятие; отличие от соседних понятий — вторым"
    applies: {genres: [geo, article], slot_types: [definition]}
    how: [{method: linter, ref: geo-definition-form}]
    level: signal
    evidence: "[практика]"
    source: "higgsfield seo.md GEO п.1–2; Tian 2026 (contextual gap — не хватает сущностей и терминов)"
    date: 2026-09-24

  - id: COPY-GEO-14
    name: "FAQ: вопросы клиента, ответ 1–3 предложения с фактом, первая фраза — ответ"
    sign: "вопросы — из voc.yaml, отдела продаж, запросов (Wordstat, Search Console); нет «Почему выбирают нас?»; ответ не уходит от вопроса"
    applies: {genres: [landing, site-page, article, geo], slot_types: [faq-q, faq-a]}
    how: [{method: linter, ref: "ru-mkt-faq-template (06-anti-slop), geo-evasive-answer, geo-pronoun-lead"}, {method: claims}, {method: human, ref: "источник вопроса"}]
    level: signal
    evidence: "[данные] + [практика]"
    source: "Pew 2025 (ИИ-сводку получают 60 % вопросов и 53 % запросов из 10+ слов); higgsfield seo.md GEO п.5 [практика]; E-GEO (FAQ — +0,05, в найденной стратегии); текст блока FAQ — 04-copy-by-block; разметка FAQPage — site 07"
    date: 2026-09-24

  - id: COPY-GEO-15
    name: "Сравнение и выбор — фактами: таблица или развилки «если… → …, потому что…»"
    sign: "для страниц выбора: условия, при которых вариант подходит и не подходит; строки сравнения — из фактов"
    applies: {genres: [article, geo, site-page], slot_types: [comparison-row, article-paragraph, geo-answer]}
    how: [{method: judge, judge_question: "Есть ли условие выбора с фактом («если трава жёсткая → сетевая косилка»), а не одинаковые плюсы у всех вариантов?"}, {method: claims, ref: "сравнение с конкурентами — право, 08-russian-legal-typography"}]
    level: signal
    engines: {yandex: "экспертный контент = рациональный выбор в ситуации читателя через опыт автора [V:XoStBfaV9Gw 24:35]; режим рассуждений Алисы строит таблицы сравнения (блог 2025-05-22)", google: "non-commodity: «unique expert or experienced takes» (2026-07-10)"}
    evidence: "[документация]"
    source: "Сливинский 12.2025 [V:AbqU-GxAYs8 46:55–48:57] («пульверизатор» у всех 10 средств; «экстракт опыта»); Сливинский 02.2026 [V:XoStBfaV9Gw 24:35, 1:21:48]; Google ai-optimization-guide"
    date: 2026-09-24

  - id: COPY-GEO-16
    name: "Сущности названы одинаково: бренд, продукт, город, адрес, телефон"
    sign: "одно имя бренда на странице и сайте (без чередования «Отвес», «компания», «мы» в первых фразах); NAP совпадает с карточками на картах"
    applies: {genres: [geo, site-page, landing, article]}
    how: [{method: script, ref: "имена из facts.yaml entities[].names; сравнение с карточкой организации"}, {method: human}]
    level: signal
    evidence: "[практика]"
    source: "higgsfield seo.md Entity SEO, Consistent NAP, GEO п.7 [практика]; справка Яндекса «Сниппет» (адресный сниппет — данные Яндекс Бизнеса); Google ai-optimization-guide (Business Profile)"
    date: 2026-09-24

  - id: COPY-GEO-17
    name: "GEO-слой — текстом в HTML страницы"
    sign: "ответы, цены, определения — в исходном HTML, не в картинке, canvas или только после JS"
    applies: {genres: [geo, landing, site-page, article]}
    how: [{method: site, ref: "site 07: HTML без JS; ai-media 10/01 (текст не в картинке)"}]
    level: gate
    evidence: "[документация] + [исследование]"
    source: "Google ai-features (2025-12-10): «Making sure that important content is available in textual form»; 3d 01/02 §6.1 (ИИ-краулеры не исполняют JS — Web Almanac 2025); Tian 2026 (JS-рендеринг — причина провала 10,1 % пар вместе с блокировками); Яндекс: «мало текстового контента» — причина «нет данных» в «Видимости в Алисе AI»"
    date: 2026-09-24

  # ============ C. Содержание: отличие, опыт, автор ============
  - id: COPY-GEO-18
    name: "У статьи и SEO-страницы есть нетиповой элемент (unique_angle)"
    sign: "в брифе записано, чего нет в топ-5 выдачи: свои данные, опыт, кейс, развилки, позиция — со ссылкой на fact_ids; пусто — не писать"
    applies: {genres: [article, geo, site-page], page_types: [article-page, seo-landing-page, service-page]}
    how: [{method: human, ref: "«осмотрись»: 3–5 материалов выдачи по главному запросу до текста"}, {method: judge, judge_question: "Мог ли любой конкурент подписать этот текст без изменений?"}]
    level: gate
    engines: {google: "commodity-контент («7 Tips for First-Time Homebuyers») против non-commodity («Why We Waived the Inspection…») — 2026-07-10", yandex: "оригинальность ЭПОС: «уникальный по ценности контент, который трудно или невозможно получить где-то ещё»; «осмотритесь» [V:XoStBfaV9Gw 09:13]"}
    evidence: "[документация]"
    source: "Google ai-optimization-guide 2026-07-10; SOTR 12.2025 [V:h1rZdfW5vqM 12:13]; Яндекс ЭПОС; C-SEO Bench и Martinez 2026 (общие приёмы переписывания — ноль или вред; работает релевантность)"
    date: 2026-09-24

  - id: COPY-GEO-19
    name: "Опыт из первых рук и автор видны"
    sign: "подпись реального автора или эксперта с ролью и опытом (из facts.yaml person); где уместно — «как сделано»: сколько проверили, чем мерили"
    applies: {genres: [article, geo], page_types: [article-page, seo-landing-page]}
