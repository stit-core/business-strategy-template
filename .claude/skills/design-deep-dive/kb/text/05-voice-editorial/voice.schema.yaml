  situations: "список situation — ситуации карты тона сайта (25, предложение text) и интерфейса (15, ux 07/01 §7.1); site ролей тона не задаёт"

x-situations:
  # Ситуации интерфейса — матрица ux 07/01 §7.1: влияние на пользователя и тип сообщения задают тон.
  empty-first-use: "Пустое состояние «ещё ничего нет» — приглашающий тон, допустима лёгкость; без шутки, если пусто из-за неудачи"
  empty-no-results: "Пустое состояние «ничего не найдено» — нейтральный, деловой; без шутки и обвинения"
  empty-all-done: "Пустое состояние «всё сделано» — положительный, завершающий; без подгона создавать новое"
  success-routine: "Подтверждение успеха рутинного действия — максимально сухой; без восклицаний и «успешно»"
  flow-complete: "Завершение сложного сценария — признание достижения, допустима эмоция; без преувеличения"
  waiting: "Ожидание — спокойный, информативный; без извинений и юмора про долгое ожидание"
  input-error: "Ошибка ввода — нейтральный, помогающий; без обвинения, «неверно» и юмора"
  service-error: "Ошибка на стороне сервиса — прямой, с признанием вины; без «что-то пошло не так» и перекладывания вины"
  access-denied: "Отказ в доступе — прямой, без извинений, если отказ правомерен"
  destructive-action: "Деструктивное действие — нейтральный, конкретный; без игривости, восклицаний и «Вы уверены?»"
  money: "Деньги и платежи — нейтральный, точный, полный; без сокращения сумм, юмора и преуменьшения"
  security: "Безопасность и утечка данных — честный и скромный; без юмора, приукрашивания и пассива без субъекта"
  permissions: "Права и роли — скромный, фактический; без оценочности"
  onboarding: "Онбординг — поддерживающий, конкретный; без панибратства и «легко и просто»"
  notification: "Уведомление и письмо — сразу к делу; без приветствий и благодарностей до сути"
