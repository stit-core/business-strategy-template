# voice.schema.yaml — профиль голоса (voice.yaml): как бренд звучит в текстах сайта, писем вокруг форм и статей; той же
# схемой пишется профиль голоса продукта (voice.product.yaml): интерфейс, письма и уведомления продукта
#
# Что это. JSON Schema (draft 2020-12), записанная в YAML (формат — как meaning.schema.yaml). Экземпляр — файл
# `voice.yaml` проекта; на него ссылаются `meaning.voice_ref`, `copy_deck.voice_ref`, промты генерации (text 09).
# Как заполнять — `01-brand-voice.md` §3 (процедура «бриф → голос»); таблица стиля и редполитика — `02-editorial-policy.md`,
# `redpolicy-template.md`; истории и конкретика — `03-storytelling-and-concreteness.md`.
#
# Главные решения формата.
# 1. Голос выражают, а не придумывают: у голоса есть основание (`derived_from.basis`) — бриф, голос клиента (voc.yaml), страницы
#    бренда и конкурентов, интервью; прилагательные заказчика — сырьё, а не принципы (Ross [V:cqnZtGXGwsw 04:03–06:06]).
# 2. Принцип без исполнения — ошибка схемы: у каждого принципа ≥ 2 проверяемых правила `execution` и «каким не бывает»
#    `is_not` (Ross [V:cqnZtGXGwsw 11:11, 14:15]; NN/g anti-tone words).
# 3. «Мы / мы не» — пары, где «мы не» — соседний перегиб, а не антоним («по делу, но не сухо»; Mailchimp «weird but not
#    inappropriate»; GOV.UK «brisk, but not terse»). Обещания («мы не гарантируем…») живут в `never_claim` фактов (facts.yaml),
#    здесь — только ссылка `claims_boundaries_ref`.
# 4. Оси тона NN/g — точка 1–5 на каждой из четырёх; тон меняется по ситуации (`tone_map`), голос — нет.
# 5. Словарь «не говорим» (`vocabulary.avoid`) записан в формате `words` линтера (06-anti-slop/02 §2.1: `*` — продолжение
#    основы, «ё» = [её]); соответствие полей профиля правилам линтера — `x-lint-map` ниже, линтер читает профиль ключом
#    `copy_lint.py --voice`.
# 6. Образцы строк — по `slot_type` словаря site (длины слотов — `copy-slots.yaml`), у голоса продукта — по роли
#    строки интерфейса `role` (ux 07/06 §7.2); числа и имена — только `fact_ids` из facts.yaml; английский —
#    адаптация, а не перевод.
# 7. Проекции: одна строка `projections.tone_of_voice` → `design_system.tone_of_voice` брифа холста (x-canvas-map);
#    `projections.brand_voice` — коротко «говорим / не говорим» для людей; `prompt_brief` — короткая «методичка» для
#    промта генератора (опыт Т—Ж: короткая методичка для авторов, полная редполитика — для редакторов).
# 8. Голос продукта — профиль, у которого все `scope.surfaces[].voice` — product: карта тона — по ситуациям интерфейса
#    ux 07/01 §7.1 (`situation`: empty-first-use … notification, имена — x-situations), образцы — по ролям строк.
#    Профиль самостоятелен: у продукта без сайта (кабинет, приложение, бот) `voice.product.yaml` — единственный профиль
#    голоса, профиль бренда ради него не заводится, а `brand.facts_ref` нужен, только когда образцы ссылаются на факты.
#    Когда профилей два, профиль бренда ссылается на голос продукта `scope.product_voice_ref`.
#
# Даты — строкой в кавычках «ГГГГ-ММ-ДД». Проверка: `scripts/text/validate_voice.py` скилла (метасхема, примеры,
# отрицательные мутации профиля бренда и голоса продукта, смысловые проверки: образцы против обращения, эмодзи,
# восклицаний и словаря «не говорим»; ссылки fact: на facts.yaml; ≥ 8 типов слотов на язык в примерах базы; перечень
# slot-type — слоты вида text словаря site).

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:app-design:text:voice:1"
title: "voice — профиль голоса бренда для генерации и проверки текстов"
description: >-
  Как бренд звучит: зачем он существует и для кого (основание голоса), абзац о голосе, 2–5 принципов с правилами
  исполнения, пары «мы / мы не», точки на четырёх осях тона, обращение, словарь «говорим / не говорим», эмодзи,
  восклицания, юмор (где да, где нет), карта тона по ситуациям, табу, образцы строк по типам слотов (у голоса продукта —
  по ролям строк интерфейса) на русском и английском, проекции во вход холста. Не платформа бренда (вне рамок базы) и не
  правила длины слотов (copy-slots.yaml).
date: "2026-09-29"
x-version: 1
x-status: "v1.1: совместима с v1 — ситуации интерфейса, роль строки у образца, жанр interface и типы слотов словаря site добавлены"
x-owner: "text · 05-voice-editorial (kb/common/owners.md § Темы: бренд — выражение у creative, голос у text)"
x-doc: ["05-voice-editorial/01-brand-voice.md", "05-voice-editorial/02-editorial-policy.md", "05-voice-editorial/03-storytelling-and-concreteness.md"]

type: object
required: [voice_version, date, status, voice_id, brand, scope, derived_from, summary, principles, pairs, axes, address,
           vocabulary, punctuation, humor, samples, projections, languages]
additionalProperties: false
patternProperties:
  "^x-": {description: "Расширения проекта; валидатор их не проверяет."}
properties:
  voice_version:
    const: 1
    description: "Версия формата (эта схема)."
  date:
    $ref: "#/$defs/date"
    description: "Дата последнего изменения профиля."
  status:
    enum: [draft, proposed, approved]
    description: >-
      draft — агент вывел из брифа и источников; proposed — показан заказчику с open_questions и строкой «Going with»;
      approved — заказчик подтвердил, а образцы прошли claims_check.py и copy_lint.py.
  voice_id:
    $ref: "#/$defs/id"
    description: "id профиля (kebab-case): <бренд>[-<суббренд>]. Один бренд — один голос; суббренд — отдельный профиль с тем же ядром."

  brand:
    type: object
    additionalProperties: false
    required: [name, site]
    properties:
      name: {type: string, description: "Имя бренда, как на сайте («Отвес», «Кварц»)."}
      site: {$ref: "#/$defs/id", description: "slug проекта — как в meaning.yaml, facts.yaml и copy deck."}
      category: {type: string, description: "Категория словами клиента (meaning.positioning.market_category.name)."}
      meaning_ref: {type: string, description: "Путь к meaning.yaml."}
      facts_ref: {type: string, description: "Путь к facts.yaml: числа, имена и цитаты образцов — только оттуда."}
      voc_ref: {type: string, description: "Путь к voc.yaml: слова клиента для словаря «говорим»."}
      parent_voice_ref: {type: string, description: "Для суббренда — путь к профилю материнского бренда (ядро голоса общее)."}

  scope:
    type: object
    additionalProperties: false
    required: [genres, surfaces]
    description: "Где действует голос бренда и где начинается голос продукта (два голоса одной компании — 01 §2)."
    properties:
      genres:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: "#/$defs/genre"}
      surfaces:
        type: array
        minItems: 1
        description: "Поверхности и чей на них голос: бренд (маркетинг), продукт (интерфейс, ux 07/01 §6), нейтрально-юридический (text 08/01)."
        items:
          type: object
          additionalProperties: false
          required: [surface, voice]
          properties:
            surface:
              enum: [marketing-site, blog, lead-emails, marketing-emails, transactional-emails, product-ui, support,
                     legal, social, ads, offline]
            voice:
              enum: [brand, product, neutral-legal]
              description: "brand — этот профиль целиком; product — профиль голоса продукта (ux 07/01 §6–8); neutral-legal — точность прежде голоса (оферта, согласия, реквизиты — text 08/01)."
            note: {type: string}
      product_voice_ref:
        type: string
        description: "Поле профиля бренда: путь к профилю голоса продукта (интерфейс за входом), когда у продукта два профиля. Профиль голоса продукта самостоятелен — у продукта без сайта он единственный, и этой ссылки нет. Граница — 01 §2.3."

  derived_from:
    type: object
    additionalProperties: false
    required: [purpose, audience, basis]
    description: "Из чего выведен голос (Ross: назначение → аудитория, конкуренты, категория → личность → принципы)."
    properties:
      purpose:
        type: string
        minLength: 20
        description: "Зачем бренд существует: какую задачу клиента решает — одной-двумя фразами, без миссии и ценностей."
      audience:
        type: string
        minLength: 20
        description: "Кто читает и в каком состоянии (meaning.audience[primary]; осведомлённость; цена ошибки для читателя)."
      subject_risk:
        enum: [low, medium, high]
        description: "Цена ошибки в предмете (деньги, здоровье, право, дом): тон выводится из предмета и цены ошибки, а не из моды (ux 07/01 §7.2)."
      brand_familiarity:
        enum: [unknown, local-known, widely-known]
        description: "Знакомость бренда аудитории: неформальный стиль повышает доверие у знакомых брендов и снижает у незнакомых (Gretry 2017)."
      category_norms:
        type: string
        description: "Как говорит категория (3–5 страниц конкурентов): что у всех одинаково — медианный голос, от которого отличаемся."
      differs_from_competitors:
        type: string
        description: "Чем голос отличается от конкурентов (Ross: «you don't want anyone reading copy from you and thinking it's from somebody else»)."
      brief_adjectives:
        type: array
        items: {type: string}
        description: "Прилагательные заказчика из брифа («тёплый, ремесленный, спокойный») — сырьё; в принципы переходят только с исполнением."
      basis:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/basis"}

  summary:
    type: string
    minLength: 80
    maxLength: 700
    description: "Абзац о голосе (Ross: большой компании — абзац и советы вместо списка прилагательных). Пишется голосом бренда."

  key_phrase:
    type: object
    additionalProperties: false
    required: [ru]
    description: "Ключевое слово или оборот бренда (KitKat — «перерыв»), если есть в брифе или истории бренда; не придумывать."
    properties:
      ru: {type: string}
      en: {type: string}
      rule: {type: string, description: "Где и как часто: «в hero и финальном CTA, не чаще раза на экран»."}
      basis: {$ref: "#/$defs/basis"}

  principles:
    type: array
    minItems: 2
    maxItems: 5
    description: "2–5 принципов голоса (NN/g: «Avoid choosing more than a handful»). Каждый — с исполнением и «каким не бывает»."
    items: {$ref: "#/$defs/principle"}

  pairs:
    type: array
    minItems: 2
    maxItems: 8
    description: >-
      Пары «мы / мы не». «Мы не» — соседний перегиб того же качества («по делу, но не сухо»), а не антоним («дружелюбные,
      но не грубые» — пусто). Обещания и запреты утверждений — в never_claim фактов (claims_boundaries_ref).
    items: {$ref: "#/$defs/pair"}

  axes:
    type: object
    additionalProperties: false
    required: [formality, humor, respect, enthusiasm]
    description: >-
      Точки на четырёх осях тона NN/g (Moran 2016): 1 и 5 — полюса, 3 — середина. Крайние точки для бизнес-текста редки
      («It would be unusual… at the outermost limits… and still be effective»). Эффект тона на восприятие бренда — 0,3–0,7
      балла из 5 (NN/g, 100 человек), доверие объясняет 52 % желания рекомендовать.
    properties:
      formality: {$ref: "#/$defs/axis", description: "1 — формально, 5 — разговорно (formal ↔ casual)."}
      humor: {$ref: "#/$defs/axis", description: "1 — серьёзно, 5 — с попыткой юмора (serious ↔ funny)."}
      respect: {$ref: "#/$defs/axis", description: "1 — почтительно к предмету, 5 — дерзко к предмету, не к читателю (respectful ↔ irreverent)."}
      enthusiasm: {$ref: "#/$defs/axis", description: "1 — сухо, по фактам, 5 — воодушевлённо (matter-of-fact ↔ enthusiastic)."}
      extra:
        type: array
        maxItems: 3
        description: "Свои оси, если четырёх мало (например, «сдержанно ↔ дерзко» для кампании L2)."
        items:
          type: object
          additionalProperties: false
          required: [id, left, right, point]
          properties:
            id: {$ref: "#/$defs/id"}
            left: {type: string}
            right: {type: string}
            point: {type: integer, minimum: 1, maximum: 5}
            note: {type: string}

  tone_words:
    type: object
    additionalProperties: false
    description: "Слова тона из списка NN/g (37, английские id; русские эквиваленты — x-tone-words-ru) или свои с префиксом x-: do — каким звучим, dont — каким нет."
    properties:
      do: {type: array, maxItems: 5, uniqueItems: true, items: {$ref: "#/$defs/tone-word"}}
      dont: {type: array, maxItems: 5, uniqueItems: true, items: {$ref: "#/$defs/tone-word"}}

  address:
    type: object
    additionalProperties: false
    required: [ru_form, capital_vy, self_reference]
    description: "Обращение и кто говорит. По умолчанию базы — «вы» со строчной (ux 07/03 §1.1–1.2)."
    properties:
      ru_form:
        enum: [vy, ty, impersonal]
        default: vy
        description: "vy — «вы»; ty — «ты» (только по голосу бренда и предмету с низкой ценой ошибки); impersonal — без обращения (редко: справка, оферта)."
      capital_vy:
        type: boolean
        default: false
        description: "«Вы» с заглавной — только в личном письме одному адресату; на сайте — false (Контур, Т—Ж)."
      self_reference:
        enum: [we, brand-name, founder-i, mixed]
        description: "Как бренд говорит о себе: «мы»; по имени («Отвес»); «я» основателя (личный бренд, письмо основателя); смешанно (имя в первом упоминании, дальше «мы» — GOV.UK)."
      en_form:
        const: you
        description: "Английский — всегда «you»; формальность передают лексика и синтаксис."
      exceptions:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [where, form, why]
          properties:
            where: {type: string, description: "Слот, секция или канал."}
            form: {enum: [vy, ty, impersonal]}
            why: {type: string}

  vocabulary:
    type: object
    additionalProperties: false
    required: [avoid]
    description: "Словарь «говорим / не говорим». avoid читает линтер как словарь бренда (формат words)."
    properties:
      use:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [term]
          properties:
            term: {type: string}
            why: {type: string}
            instead_of: {type: string, description: "Какое слово заменяет."}
            voc_ids: {$ref: "#/$defs/voc-ids"}
      avoid:
        type: array
        minItems: 3
        items: {$ref: "#/$defs/avoid-term"}
      use_with_care:
        type: array
        description: "Можно при условии (Mailchimp «Words to use carefully»): термин — только с объяснением; категория — в SEO-заголовке."
        items:
          type: object
          additionalProperties: false
          required: [term, condition]
          properties:
            term: {type: string}
            condition: {type: string}
      spellings:
        type: array
        description: "Единое написание: preferred и варианты, которые линтер отметит (Mailchimp «Standardized spellings»; Контур «Спорные слова»)."
        items:
          type: object
          additionalProperties: false
          required: [preferred, variants]
          properties:
            preferred: {type: string}
            variants: {type: array, minItems: 1, items: {type: string}}
            lang: {enum: [ru, en, any], default: any}
            note: {type: string}
      category_name:
        type: object
        additionalProperties: false
        properties:
          ru: {type: string}
          en: {type: string}
          voc_ids: {$ref: "#/$defs/voc-ids"}

  punctuation:
    type: object
    additionalProperties: false
    required: [emoji, exclamation]
    properties:
      emoji:
        type: object
        additionalProperties: false
        required: [policy]
        properties:
          policy: {enum: [never, rare, allowed], description: "never — по умолчанию; rare — только в разрешённых слотах; allowed — по голосу, но не в заголовках, CTA и мета (правило линтера ru-pun-emoji-heading)."}
          allowed_slot_types: {type: array, items: {$ref: "#/$defs/slot-type"}}
          max_per_block: {type: integer, minimum: 0, maximum: 3}
          never_in: {type: array, items: {$ref: "#/$defs/situation"}}
      exclamation:
        type: object
        additionalProperties: false
        required: [policy]
        properties:
          policy: {enum: [never, rare, allowed], description: "Mailchimp: «sparingly, and never more than one at a time… Never… in failure messages»."}
          max_per_page: {type: integer, minimum: 0}
          never_in: {type: array, items: {$ref: "#/$defs/situation"}}
      rhetorical_questions:
        enum: [never, faq-only, rare]
        default: faq-only
        description: "Т—Ж: риторических вопросов нет в заголовках; абзацы из вопросов в начале — запрещены; FAQ — законный вопрос."
      caps:
        const: never
        description: "Капс — решение вёрстки (creative); в copy deck — обычный регистр (COPY-M-PUN-09)."
      dash:
        const: grammar
        description: "Тире — по грамматике; плотность пунктуационных тире — порог жанра (text 06/02 §5.1, text 08/02)."

  humor:
    type: object
    additionalProperties: false
    required: [level, never_in]
    description: >-
      Юмор снижает доверие к источнику (Eisend 2009, 369 корреляций) и рискован (NN/g: страховка «too chummy» —
      −0,3 доверия). Нигде нет юмора в цене и условиях, гарантии, праве, согласиях и ответе на жалобу.
    properties:
      level: {enum: [none, dry, light, playful]}
      forms:
        type: array
        items: {enum: [understatement, self-irony, irony-about-subject, wordplay, contrast, absurd, pop-culture]}
      allowed_in: {type: array, items: {$ref: "#/$defs/situation"}}
      never_in:
        type: array
        items: {$ref: "#/$defs/situation"}
        allOf:
          - contains: {const: pricing-terms}
          - contains: {const: guarantee}
          - contains: {const: legal}
          - contains: {const: form-consent}
          - contains: {const: complaint-response}
      note: {type: string}

  tone_map:
    type: array
    description: "Тон по ситуациям: голос постоянен, тон сдвигается (Mailchimp; NN/g; карта интерфейса — ux 07/01 §7)."
    items:
      type: object
      additionalProperties: false
      required: [situation, rules]
      properties:
        situation: {$ref: "#/$defs/situation"}
        axes_delta:
          type: object
          additionalProperties: false
          properties:
            formality: {type: integer, minimum: -2, maximum: 2}
            humor: {type: integer, minimum: -4, maximum: 2}
            respect: {type: integer, minimum: -2, maximum: 2}
            enthusiasm: {type: integer, minimum: -2, maximum: 2}
        rules: {type: array, minItems: 1, items: {type: string}}

  taboos:
    type: array
    description: "Темы и приёмы, которых голос не касается (страх как рычаг, шутки о деньгах клиента). Запреты утверждений — never_claim (ссылка ниже)."
    items:
      type: object
      additionalProperties: false
      required: [id, what, why]
      properties:
        id: {$ref: "#/$defs/id"}
        what: {type: string}
        why: {type: string}
        refs: {type: array, items: {type: string}, description: "never_claim:<id>, copy-rule:<id> из правил text 08 или text 06, ux 07/06 §…"}

  claims_boundaries_ref:
    type: string
    description: "Ссылка на never_claim фактов (facts.yaml#never_claim): «мы не обещаем …» живёт там, не здесь."

  samples:
    type: array
    minItems: 1
    description: >-
      Образцы строк по slot_type: показывают голос генератору и судье. Для профиля проекта — 8–10 типов слотов на каждый
      язык; числа и имена — только fact_ids; нет факта — [PLACEHOLDER: …]. Длину слота задаёт copy-slots.yaml.
    items: {$ref: "#/$defs/sample"}

  style_sheet:
    type: object
    additionalProperties: false
    description: "Машиночитаемая часть таблицы стиля редполитики (02 §3): то, что можно проверить автоматически."
    properties:
      yo: {enum: [always, when-ambiguous], description: "«ё» сплошь или только при разночтениях и в именах (Контур; Т—Ж)."}
      numbers: {enum: [digits, words-under-10, words-for-approx], description: "Цифрами (сайт, сканирование), до 10 словами (Контур), словами для приблизительного (Т—Ж)."}
      currency: {enum: ["₽", "руб.", "рублей"], description: "Одно обозначение валюты на текст (Контур)."}
      company_names: {enum: [as-they-write, russian-quoted], description: "Чужие компании — как пишут сами (Mailchimp, Контур) или по-русски в кавычках (Т—Ж, медиа)."}
      product_names:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, rule]
          properties:
            name: {type: string}
            rule: {type: string, description: "Кавычки, склонение, первое упоминание полным именем."}
      terms:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [term, definition]
          properties:
            term: {type: string}
            definition: {type: string}
            not: {type: array, items: {type: string}, description: "Синонимы, которыми это понятие не называем."}

  lint:
    type: object
    additionalProperties: false
    description: "Как профиль подключается к copy_lint.py: базовый профиль жанра и поправки уровней по голосу."
    properties:
      base_profile: {$ref: "#/$defs/genre"}
      level_overrides:
        type: object
        description: "Шаблон id правила → уровень (text 06/02 §4): эмодзи в прозе разрешены голосом → «ru-pun-emoji-body»: \"off\"."
        additionalProperties: {enum: [error, warning, info, "off"]}
      address_rule: {type: boolean, default: true, description: "Сгенерировать правило «обращение не по профилю» (формы «ты» при ru_form: vy и наоборот)."}

  projections:
    type: object
    additionalProperties: false
    required: [tone_of_voice]
    properties:
      tone_of_voice:
        type: string
        minLength: 20
        maxLength: 240
        description: "Одна строка голоса для брифа холста (design_system.tone_of_voice): обращение, 2–3 принципа, чего нет."
      brand_voice:
        type: object
        additionalProperties: false
        description: "Коротко о голосе для людей: тон, «говорим», «не говорим»."
        properties:
          tone: {type: string}
          use: {type: array, items: {type: string}}
          avoid: {type: array, items: {type: string}}
      prompt_brief:
        type: string
        maxLength: 1400
        description: "Короткая методичка для промта генератора (≤ 12 строк): принципы с исполнением, «мы / мы не», обращение, запреты. Полный профиль — для проверки."

  languages:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [lang, role]
      properties:
        lang: {$ref: "#/$defs/lang"}
        role: {enum: [primary, adaptation]}
        audience_note: {type: string, description: "Чем аудитория языка отличается (что ей объяснить, что опустить)."}
        adaptation_rules:
          type: array
          items: {type: string}
          description: "Как голос переносится: что сохраняется (принципы, точки осей), что меняется (идиомы, юмор, длина, реалии)."

  open_questions:
    type: array
    maxItems: 7
    items: {$ref: "#/$defs/question"}

  review:
    type: object
    additionalProperties: false
    properties:
      method: {enum: [editor, blind-sort, product-reaction, message-test], description: "Как проверили узнаваемость голоса: редактор; слепая сортировка строк; выбор слов тона пользователями (NN/g); тест сообщения."}
      result: {type: string}
      by: {type: string}
      date: {$ref: "#/$defs/date"}

$defs:

  id:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

  date:
    type: string
    pattern: "^[0-9]{4}-(0[1-9]|1[0-2])(-(0[1-9]|[12][0-9]|3[01]))?$"

  lang:
    type: string
    pattern: "^[a-z]{2}(-[A-Z]{2})?$"

  genre:
    enum: [landing, site-page, article, meta, geo, email-form, interface]
    description: "Жанры текстов: сайт (landing, site-page, article, meta, geo, email-form) и интерфейс продукта (interface — строки экранов, бота, мобильного; профиль линтера — copy_lint.py)."

  slot-type:
    description: "Слоты словаря site вида text (../site/02-site-types/vocabulary.yaml); правила текста — copy-slots.yaml. validate_voice.py сверяет перечень со словарём."
    enum: [meta-title, meta-description, og-title, og-description, og-image-alt, eyebrow, headline, subheadline, hero-proof,
           cta-label, cta-secondary-label, cta-note, section-title, section-lead, body, list-item, card-title, card-body,
           step-title, step-body, stat-value, stat-label, logos-caption, testimonial-quote, testimonial-attribution,
           case-title, case-summary, case-result, pricing-plan-name, pricing-plan-summary, pricing-price,
           pricing-price-note, pricing-feature, badge, guarantee-text, objection-answer, comparison-row, faq-q, faq-a,
           form-title, form-lead, form-next-steps, form-consent, form-success, nav-label, footer-tagline, footer-legal,
           article-title, article-lead, article-summary, article-heading, article-paragraph, article-author, geo-answer,
           definition, email-subject, email-preheader, email-heading, email-body, email-cta-label, email-footer,
           image-alt, in-image-text, spec-row, price-old, stat-source, image-caption, promise, announcement, event-meta,
           quiz-question, quiz-option, result-summary, contact-info, disclaimer, ad-marking, cookie-text, article-date,
           article-sources, email-sender-name]

  situation:
    description: >-
      Ситуации карты тона: сайта (hero … footer; словаря ситуаций у site нет) и интерфейса продукта по матрице
      ux 07/01 §7.1 (empty-first-use … notification; имена — x-situations).
    enum: [hero, benefits, how-it-works, proof, testimonials, case, pricing, pricing-terms, guarantee, objections, faq,
           form, form-consent, form-success, lead-email, reminder-email, complaint-response, error, legal, about,
           careers, article, meta, campaign-slogan, footer,
           empty-first-use, empty-no-results, empty-all-done, success-routine, flow-complete, waiting, input-error,
           service-error, access-denied, destructive-action, money, security, permissions, onboarding, notification]

  ui-role:
    description: "Роль строки интерфейса — закрытый список ux 07/06 §7.2 (тот же, что колонка role реестра texts.md экранов)."
    enum: [title, subtitle, section-title, label, checkbox-label, placeholder, hint, caption, action, link, nav, tab,
           column-header, status, badge, toast, banner, inline-message, error, empty, confirm-title, confirm-body,
           tooltip, setting-description, email, push, aria, alt, marketing, help, user-content]

  tone-word:
    description: "37 слов тона NN/g (id по-английски, русские эквиваленты — x-tone-words-ru) или своё слово с префиксом x-."
    anyOf:
      - enum: [authoritative, caring, cheerful, coarse, conservative, conversational, casual, dry, edgy, enthusiastic,
               formal, frank, friendly, fun, funny, humorous, informative, irreverent, matter-of-fact, nostalgic,
               passionate, playful, professional, provocative, quirky, respectful, romantic, sarcastic, serious, smart,
               snarky, sympathetic, trendy, trustworthy, unapologetic, upbeat, witty]
      - type: string
        pattern: "^x-[a-z0-9-]+$"

  voc-ids:
    type: array
    uniqueItems: true
    items: {type: string, pattern: "^voc:[a-z0-9]+(-[a-z0-9]+)*$"}

  basis:
    type: object
    additionalProperties: false
    required: [kind]
    description: >-
      Основание: brief — бриф; customer — ответ заказчика; voc — голос клиента (voc:<id>); public-page — страница бренда
      (URL + дата); competitor-page — страницы конкурентов (что говорят все); interview — интервью с основателем или
      командой; inferred — вывод агента (из чего); assumption — допущение (нужен вопрос в open_questions).
    properties:
      kind: {enum: [brief, customer, voc, public-page, competitor-page, interview, inferred, assumption]}
      ref: {type: string}
      date: {$ref: "#/$defs/date"}
      question_id: {$ref: "#/$defs/id"}
    allOf:
      - if: {properties: {kind: {const: assumption}}}
        then: {required: [question_id]}
      - if: {properties: {kind: {enum: [voc, public-page, competitor-page, inferred]}}}
        then: {required: [ref]}

  axis:
    type: object
    additionalProperties: false
    required: [point]
    properties:
      point: {type: integer, minimum: 1, maximum: 5}
      note: {type: string, description: "Что точка значит в словах этого бренда."}

  principle:
    type: object
    additionalProperties: false
    required: [id, name, execution, is_not]
    properties:
      id: {$ref: "#/$defs/id"}
      name:
        type: string
        minLength: 4
        description: "Сам принцип коротко: «Говорим фактами, а не оценками», «Спокойно, даже о деньгах»."
      why: {type: string, description: "Откуда (назначение, аудитория, голос клиента, отличие от категории)."}
      execution:
        type: array
        minItems: 2
        description: "Проверяемые правила исполнения: длина фраз, синтаксис, пунктуация, слова, структура (Nike «bold» → «short, sharp statements rather than long, romantic sentences»)."
        items: {type: string, minLength: 12}
      is_not:
        type: string
        minLength: 10
        description: "Каким голос на этом принципе не бывает — соседний перегиб с примером."
      do: {type: array, items: {type: string}}
      dont: {type: array, items: {type: string}}
      checked_by:
        type: array
        uniqueItems: true
        items: {enum: [copy_lint, claims_check, judge, human]}
        description: "Кто ловит нарушение: линтер, сверка claims_check.py, ИИ-судья, только человек (01 §4)."

  pair:
    type: object
    additionalProperties: false
    required: [we_are, we_are_not]
    properties:
      we_are: {type: string}
      we_are_not: {type: string}
      why: {type: string}
      example: {type: string}

  avoid-term:
    type: object
    additionalProperties: false
    required: [term, reason]
    properties:
      term:
        type: string
        minLength: 2
        description: "Слово или фраза в формате words линтера: «*» — продолжение основы («уникальн*»), «ё» совпадает с «е»."
      lang: {enum: [ru, en, any], default: ru}
      unless: {type: string, description: "Когда можно (GOV.UK «unless…»): «в названии категории», «в отзыве клиента», «рядом с числом из facts.yaml»."}
      use_instead: {type: string}
      reason: {type: string}
      level: {enum: [error, warning, info], default: warning}
      slot_types: {type: array, items: {$ref: "#/$defs/slot-type"}}

  sample:
    type: object
    additionalProperties: false
    required: [id, lang, text, fact_ids]
    anyOf: [{required: [slot_type]}, {required: [role]}]
    description: "Образец строки: тип слота сайта (slot_type) или роль строки интерфейса (role) — у голоса продукта."
    properties:
      id: {$ref: "#/$defs/id"}
      slot_type: {$ref: "#/$defs/slot-type"}
      role: {$ref: "#/$defs/ui-role"}
      lang: {$ref: "#/$defs/lang"}
      text: {type: string, minLength: 1}
      fact_ids:
        type: array
        uniqueItems: true
        description: "fact:<id> — факт из facts.yaml; missing:<id> — факта нет, в тексте [PLACEHOLDER]; пусто — строка без утверждений."
        items: {type: string, pattern: "^(fact|missing):[a-z0-9]+(-[a-z0-9]+)*$"}
      principle_ids: {type: array, items: {$ref: "#/$defs/id"}}
      situation: {$ref: "#/$defs/situation"}
      adaptation_of: {$ref: "#/$defs/id", description: "Для английского: id русского образца, который адаптирован (не переведён)."}
      note: {type: string}
      lint_allow:
        type: array
        description: "Законное исключение из правила линтера с причиной (как lint_allow слота copy deck — text 06/02 §9 п. 8): ложное срабатывание или норма голоса."
        items:
          type: object
          additionalProperties: false
          required: [rule, reason]
          properties:
            rule: {type: string}
            reason: {type: string}
      checks:
        type: object
        additionalProperties: false
        properties:
          claims_check: {enum: [pass, fail, "n/a"]}
          copy_lint: {enum: [clean, review, rewrite, fail, overcorrected]}
          date: {$ref: "#/$defs/date"}

  question:
    type: object
    additionalProperties: false
    required: [id, q, why, default]
    properties:
      id: {$ref: "#/$defs/id"}
      q: {type: string}
      why: {type: string}
      options: {type: array, items: {type: string}}
      default: {type: string, description: "Что будет, если заказчик не ответит («Going with»)."}
      affects: {type: array, items: {type: string}}
      answer: {type: string}
      date: {$ref: "#/$defs/date"}

# ───────────────────────── Проекции и связи ─────────────────────────
x-meaning-map:
  meaning.voice_ref: "путь к voice.yaml (эта схема); до профиля — строка-описание со словом «черновик»"
  meaning.brand_character: "прилагательные брифа → derived_from.brief_adjectives (сырьё, не принципы)"
  meaning.positioning.market_category.name: "brand.category и vocabulary.category_name"

x-copy-deck-map:
  copy_deck.voice_ref: "путь к voice.yaml (copy-deck.schema.json)"
  slot.variants[].text: "проверка голоса: vocabulary.avoid, address, punctuation — copy_lint.py с правилами из профиля; принципы — судья"

x-canvas-map:
  # Голос во входе холста — проекция профиля (references/claude-design.md § 6): одна строка тона в брифе холста; свой
  # текст голоса во входе не пишется. Профиль — тот, чей канал scope.surfaces отвечает роду поверхности: сайт и лендинг —
  # voice (voice.yaml), кабинет и приложение — voice-product (voice.product.yaml, та же схема и та же карта).
  source: voice
  stages: [directions, treatment, mockup, motion]
  files:
    brief.yaml:
      design_system.tone_of_voice: {rule: copy, from: [/projections/tone_of_voice], note: "одна строка ≤ 240 знаков: обращение, 2–3 принципа, чего нет"}
      design_system.voice_ref: {rule: derive, from: [/voice_id, /scope/surfaces, /scope/product_voice_ref], note: "путь профиля, из которого взята строка тона: канал scope.surfaces ↔ род поверхности; голос продукта — профиль voice.product.yaml, единственный или названный в product_voice_ref профиля бренда"}
  drop:
    - {from: [/voice_version, /date, /status, /brand, /review, /open_questions], note: "служебные поля, ссылки и подпись: статус, путь и отпечаток — в INPUT.md"}
    - {from: [/scope/genres, /scope/surfaces/*/note, /derived_from, /summary, /key_phrase, /principles, /pairs, /axes, /tone_words,
              /address, /vocabulary, /punctuation, /humor, /tone_map, /taboos, /claims_boundaries_ref, /samples, /style_sheet,
              /lint, /languages],
       note: "голос воплощён в текстах copy deck и реестра текстов экранов; исполнитель тексты дословно ставит, а не пересочиняет"}
    - {from: [/projections/brand_voice, /projections/prompt_brief], note: "для людей и промта генератора текстов; на холст — только строка тона"}

x-lint-map:
  vocabulary.avoid: "правило kind: words, id brand-<voice_id>-avoid-<n>, group EXT, уровень level, unless → поле unless (регулярка из слов), slot_types"
  vocabulary.spellings: "правило words по variants, id brand-<voice_id>-spelling-<n>, warning"
  address.ru_form: "vy → правило «формы ты» (ты, тебя, тебе, твой… и частые повелительные на -и/-й без -те), warning; ty → правило «формы вы», info"
  address.capital_vy: "false → «Вы/Ваш» в середине предложения — warning (Контур, Т—Ж)"
  punctuation.emoji.policy: "never → ru-pun-emoji-body: warning; allowed → ru-pun-emoji-body: off (заголовки и CTA остаются warning)"
  punctuation.exclamation.policy: "never → правило «!» во всех слотах, warning; rare/allowed — правила линтера без изменений"
  lint.level_overrides: "как есть → профиль <base_profile>-<voice_id> в копии profiles.yaml; в copy_lint.py — ключ --voice"

x-checks:
  copy_lint: "словарь «не говорим», единое написание, обращение ты/вы, «Вы» с заглавной, эмодзи, «!», капс, рубленый драматизм, плотность маркеров, сверхкоррекция"
  claims_check: "числа, имена, цитаты, never_claim в образцах и текстах (голос не меняет факты)"
  judge: "принципы с исполнением, пары «мы / мы не», точка на осях, узнаваемость голоса (слепая сортировка), медианный текст без позиции (COPY-M-TON-08), уместность юмора"
  human: "первое утверждение профиля заказчиком, юмор и острота в кампании L2, этические границы, «звучит как мы?»"

