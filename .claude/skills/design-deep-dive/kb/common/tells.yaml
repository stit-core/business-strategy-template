# Реестр примет «дефолтного вида»
#
# Примета — признак решения, которое никто не принимал: значение по умолчанию генератора, кита компонентов или жанра.
# Одна и та же примета записана в нескольких базах под разными именами: капс-надзаголовок — это маркер 30 ui,
# `cliche:caps-eyebrow` creative, COPY-C-18 text, правило словаря запретов ux и проверка утилиты макета. Здесь видно,
# что это одна примета, у кого её норма и какими проверками её ловят на разных стадиях работы.
#
# Файл читают агент скилла — когда пишет бан-лист для задания, разбирает находки проверок или решает, законен ли
# приём, — и утилиты проверки, чтобы сводить находки разных инструментов к одной примете и не считать её дважды.
#
# Как работает реестр
# - Норма приметы живёт у владельца домена (раздел `domains`): что считается приметой, чем её мерить, порог, чем
#   заменить, когда приём законен. Здесь — только кто владелец и где та же примета записана у соседей. Пороги не
#   пересказываются, чтобы правка нормы оставалась правкой одного места.
# - Поверхность решает, чья норма действует. Экран приложения — ui; страница сайта — creative (визуал и движение),
#   site (структура и честность страницы), text (тексты); картинка и видео — ai-media; 3D-ассет — 3d. Где у
#   приметы разные пороги на экране приложения и на странице сайта, `owner` называет место для каждой поверхности.
# - Одна примета — вопрос «было ли это решением», а не дефект. Вердикт ставит кластер: несколько примет в одной
#   единице счёта владельца — экране, сцене страницы, ассете, текстовом блоке (`domains[].unit`, `clusters`). Счета
#   разных доменов не складываются: у каждого своя единица и свой порог. Без всякого кластера блокирует только
#   примета, которая обманывает посетителя, ломает доступность или действие (серьёзность B у владельца).
# - Примету снимает только записанное решение: в приложении — бриф и дизайн-система проекта; на странице сайта —
#   решение арт-дирекции по пяти проверкам (creative/08-uniqueness-anti-slop/01-cliche-policy.md §1, §6). Нормы
#   соседей на странице сайта — умолчание уровня L0: они действуют, пока арт-дирекция не сняла их решением с проверкой
#   результата (там же, §4). Снятая примета не снимает кластер: остальные его приметы проверяются как обычно.
# - Детекторы (внешние анти-слоп-детекторы, баллы детекторов ИИ-текста) и частоты у генераторов — входные данные:
#   они показывают, куда смотреть, но воротами не становятся без нормы владельца.
# - Бан-лист дом-стиля Claude для задания исполнителю — claude-design/06-design-process/05-default-look.md: он называет
#   приметы этого реестра поимённо, с альтернативой значением, и хранит частоты у генераторов.
# - Новая примета сначала записывается у владельца домена; строка здесь появляется, когда примета есть в двух базах
#   или у неё есть проверка макета. Реестр пересматривается вместе с реестром клише creative (его `review_by`):
#   приметы стареют за месяцы, и то, что сегодня советуют как способ отличиться, завтра становится умолчанием.
#
# Ключи приметы (`tells`)
#   id — стабильное имя; где есть запись реестра клише creative, id совпадает с ней (`cliche:<id>`);
#   name — что видно; surface — где встречается: app (экран приложения), page (страница сайта), asset (картинка,
#   видео, 3D), text (тексты);
#   owner — где норма: одно место или по месту на поверхность, если пороги приложения и страницы разные;
#   also — где та же примета записана у соседей и какими проверками её ловят на других стадиях; норма у них та же;
#   check — id проверки утилиты макета `scripts/claude-design/mockup_checks.py` (раздел `checks`);
#   note — как читать примету, если базы называют её по-разному.
#
# Ссылки — путь от kb/ и раздел: `ui/11-styles-trends/04-anti-slop-ui.md §2.9`; запись YAML — `файл#id`.

surfaces:
  app: экран приложения
  page: страница сайта
  asset: картинка, видео, 3D-ассет
  text: тексты страницы и интерфейса

# Домены — у каждого владелец каталога, свои id, своя единица счёта и своё правило вердикта.
domains:
  page-visual:
    name: Визуал и движение страницы сайта
    owner: creative/08-uniqueness-anti-slop/cliche-registry.yaml
    ids: "cliche:<id>"
    unit: сцена страницы (экран, hero-секция) и страница целиком
    diagnosis: >-
      Кластер реестра на одной сцене без решения арт-дирекции (`cluster_rule`); на странице — доза насыщенных приёмов
      по уровню амбиций (creative/08-uniqueness-anti-slop/01-cliche-policy.md §3).
    lift: "решение арт-дирекции `decisions[]` с `technique: cliche:<id>` (creative/01-creative-direction/02-art-direction-document.md)"
  app-visual:
    name: Визуал экрана приложения
    owner: ui/11-styles-trends/04-anti-slop-ui.md
    ids: "маркер 1–34 (`m1`…`m34` в скрипте §3)"
    unit: экран
    diagnosis: >-
      Число маркеров на экране одновременно; шаблонный хром считается отдельно
      (ui/11-styles-trends/04-anti-slop-ui.md §1.3).
    lift: бриф и дизайн-система проекта — выбранное явно приметой не считается (ui/11-styles-trends/04-anti-slop-ui.md §4.1)
  page-structure:
    name: Структура, призывы и честность страницы сайта
    owner: site/09-ai-generation-evaluation/ai-landing-markers.yaml
    ids: AIL-<NN>
    unit: страница
    diagnosis: серьёзность каждого маркера (B, S, D) без счёта кластера; кандидаты `proposed` в ворота не входят
    lift: поле `allow` маркера — решение брифа или плана страницы с причиной
  text-site:
    name: Тексты сайта
    owner: text/06-anti-slop/01-text-slop-markers-by-genre.md
    ids: "COPY-M-<группа>-<nn>; правила лексикона text/06-anti-slop/lexicon/"
    unit: текстовый блок и плотность маркеров на 100 слов по жанру
    diagnosis: >-
      Кластер маркеров разных семей в одном блоке и плотность по порогу жанра
      (text/06-anti-slop/02-linter-spec-and-profiles.md §5); плотность — порог слоп-прозы, а не детектор ИИ.
    lift: профиль жанра и решение редактора с причиной
  text-interface:
    name: Тексты интерфейса
    owner: ux/07-ux-writing/06-banned-words-and-patterns.md
    ids: правила словаря запретов по ролям текста
    unit: текстовый узел с ролью
    diagnosis: уровень правила по роли (запрет, предупреждение)
    lift: не снимается — текст переписывается
  asset-image:
    name: Картинки
    owner: ai-media/01-web-assets-landscape/03-ai-fit-trust-and-slop.md §5.2
    ids: IMG-M<NN>
    unit: ассет
    diagnosis: >-
      Маркеры, найденные человеком по чек-листу, — на ассете и в ключевом слоте (hero, товар, лицо) по правилу §5.1;
      метрики изображения дают только подозрение для человека (ai-media/CONTRADICTIONS.md §[X24]).
    lift: паспорт визуала — `exclusions.forbidden_markers` и решение арт-дирекции для страницы
  asset-video:
    name: Видео
    owner: ai-media/01-web-assets-landscape/03-ai-fit-trust-and-slop.md §5.3
    ids: VID-M<NN>
    unit: ролик и петля
    diagnosis: то же правило, что у картинок (ai-media/01-web-assets-landscape/03-ai-fit-trust-and-slop.md §5.1)
    lift: паспорт визуала
  asset-3d:
    name: 3D-ассеты и сцены
    owner: 3d/11-evaluation-qa/05-master-checklist.md
    ids: BR-*, MAT-*, CAM-* и другие пункты мастер-чек-листа
    unit: 3D-ассет и сцена
    diagnosis: >-
      Пункты мастер-чек-листа — проверки исполнения; клише 3D как приём страницы — записи реестра клише creative
      (домен page-visual).
    lift: решение брифа 3D (BR-02) и арт-дирекции страницы
  house-style:
    name: Дом-стиль Claude в макете
    owner: claude-design/06-design-process/05-default-look.md
    ids: строки бан-листа §3 и приметы §4
    unit: макет (артборд, HTML-копия, сборка)
    diagnosis: >-
      Бан-лист называет приметы этого реестра и берёт пороги у владельцев; проверка макета — группа C
      (claude-design/06-design-process/04-checks.md §3).
    lift: бриф и дизайн-система — ключ `--allow` утилиты только по записанному решению

# Кластеры, которые владельцы определяют поверх нескольких примет. Состав — по id этого реестра. Кластеры реестра клише
# creative (`ai-saas-2024`, `editorial-luxe-2025`, `web3-3d-2022`, `studio-awwwards-kit`) живут в самом реестре клише.
clusters:
  - id: template-chrome
    name: шаблонный хром
    owner: ui/11-styles-trends/04-anti-slop-ui.md §2.9
    unit: экран или макет
    members: [caps-eyebrow, numbered-labels, meta-dots, near-black-literal, mono-captions, arrow-in-button]
    rule: ui/11-styles-trends/04-anti-slop-ui.md §1.3 (кластер хрома)
  - id: cream-serif
    name: тёплый кремовый, контрастный сериф, терракота
    owner: ui/11-styles-trends/04-anti-slop-ui.md §4.1 (кластер 1)
    unit: экран или страница
    members: [warm-paper, cream-serif-terracotta, overused-display-font, accent-word-headline]
  - id: dark-acid
    name: почти чёрный фон и один кислотный акцент
    owner: ui/11-styles-trends/04-anti-slop-ui.md §4.1 (кластер 2)
    unit: экран или страница
    members: [dark-acid-accent, near-black-literal]
  - id: broadsheet
    name: газетная вёрстка
    owner: ui/11-styles-trends/04-anti-slop-ui.md §4.1 (кластер 3)
    unit: экран или страница
    members: [broadsheet-hairlines]
  - id: saas-card-kit
    name: набор одинаковых карточек
    owner: ui/11-styles-trends/04-anti-slop-ui.md §4.1 (кластер 4)
    unit: экран или страница
    members: [one-radius, same-shadow, three-equal-cards, bento-uniform-tiles, mesh-gradient-bg]
  - id: template-chrome-page
    name: шаблонный хром секций страницы (кандидат)
    owner: site/09-ai-generation-evaluation/ai-landing-markers.yaml#AIL-52
    unit: страница
    members: [caps-eyebrow, pill-announcement-chip, numbered-labels, overused-display-font, accent-word-headline]
    rule: >-
      Кандидат `proposed`: порог и серьёзность — после калибровки на макетах; до неё в проверки и ворота не входит.

tells:

  # ── Цвет и фон ──────────────────────────────────────────────────────────────────────────────────────────────────

  - id: purple-neon-band
    name: пурпур и неон в полосе 270–320° без бренда
    surface: [app, page, asset]
    owner:
      asset: ai-media/06-art-direction-consistency/01-visual-dna-from-ui.md §3 (правило R3)
      page: creative/08-uniqueness-anti-slop/cliche-registry.yaml#purple-neon-band
      app: ui/11-styles-trends/04-anti-slop-ui.md §2.1 (маркеры 1, 2)
    also:
      - ai-media/01-web-assets-landscape/03-ai-fit-trust-and-slop.md §5.2 (IMG-M05)
      - ai-media/06-art-direction-consistency/visual-dna.schema.json#palette (`forbidden_hues`)
    note: >-
      Полосу и исключение для бренда задаёт паспорт визуала; бренд не перекрашивают ради полосы — фирменный акцент в ней
      остаётся одним предметом с ограниченной долей.

  - id: purple-gradient-hero
    name: фиолетово-синий градиент hero
    surface: [page]
    owner: creative/08-uniqueness-anti-slop/cliche-registry.yaml#purple-gradient-hero
    also:
      - ui/11-styles-trends/04-anti-slop-ui.md §2.1 (маркеры 1, 3)
      - ui/11-styles-trends/01-style-dictionary-for-quiz.md §18

  - id: gradient-text
    name: градиентная заливка заголовка
    surface: [app, page]
    owner:
      page: creative/08-uniqueness-anti-slop/cliche-registry.yaml#gradient-text
      app: ui/11-styles-trends/04-anti-slop-ui.md §2.1 (маркер 3)
    also:
      - claude-design/06-design-process/05-default-look.md §3
    check: LOOK-GRADIENT-TEXT

  - id: mesh-gradient-bg
    name: градиент как декор фона (mesh, шейдерный градиент)
    surface: [app, page]
    owner:
      page: creative/08-uniqueness-anti-slop/cliche-registry.yaml#mesh-gradient-bg
      app: ui/01-color/06-character-gradients-tools.md §2.1
    also:
      - ui/11-styles-trends/04-anti-slop-ui.md §2.1 (маркер 3), §4.4
      - ux/12-evaluation-checklists/02-master-checklist.md#UX-AIG-06
    note: >-
      В приложении градиент законен только в названных местах; на странице сайта градиентный фон — приём при концепции,
      насыщенный вид — с поворотом.

  - id: aurora-blobs
    name: аврора и размытые цветные пятна за hero
    surface: [page, asset]
    owner: creative/08-uniqueness-anti-slop/cliche-registry.yaml#aurora-blobs
    also:
      - 3d/01-web-3d-landscape/01-effects-catalog.md §22 («фиолетовая аврора в тёмном герое»)
      - ai-media/11-evaluation-qa/03-checklists-by-asset.md §3.2
      - site/09-ai-generation-evaluation/ai-landing-markers.yaml#AIL-47 (смежно — перехват нажатия декоративным слоем)

  - id: neon-glow
    name: неоновое свечение и цветные тени
    surface: [app, page, asset]
    owner:
      page: creative/08-uniqueness-anti-slop/cliche-registry.yaml#neon-glow
      app: ui/11-styles-trends/03-dated-vs-crafted.md §2.3
    also:
      - creative/04-visual-language/03-color-surfaces-product.md §4.3 (токен `shadow.cta-glow` — одна кнопка по решению арт-дирекции)
      - ai-media/01-web-assets-landscape/03-ai-fit-trust-and-slop.md §5.2 (IMG-M05)
      - claude-design/06-design-process/05-default-look.md §3 («светящиеся кнопки»)

  - id: warm-paper
    name: тёплая тонированная бумага фоном страницы
    surface: [page]
    owner: creative/08-uniqueness-anti-slop/cliche-registry.yaml#warm-paper
    also:
      - ui/11-styles-trends/04-anti-slop-ui.md §4.1 (кластер 1)
      - claude-design/06-design-process/05-default-look.md §3, §4
      - ai-media/01-web-assets-landscape/03-ai-fit-trust-and-slop.md §5.2 (IMG-M04 — тёплый сдвиг фото, смежно)
    check: LOOK-BG-WARM
    note: Тонированная нейтраль из токенов бренда — решение, а не примета (claude-design/06-design-process/05-default-look.md §5).

  - id: cream-serif-terracotta
    name: «редакционный люкс» — крем, контрастная антиква, терракота
    surface: [page, asset]
    owner: creative/08-uniqueness-anti-slop/cliche-registry.yaml#cream-serif-terracotta
