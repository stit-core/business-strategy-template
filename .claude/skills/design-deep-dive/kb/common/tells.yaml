# Проверки утилит, которые находят приметы: ключ без префикса — проверка утилиты макета
# `scripts/claude-design/mockup_checks.py`; ключ `ui_audit:<id>` — проверка `scripts/ui/ui_audit.py` (её же находки
# приносит `marketing_audit.py`); ключ `marketing_audit:<id>` — своя проверка подачи `scripts/creative/marketing_audit.py`
# (у её проверок `cliche:<id>` примета — запись реестра с тем же id, строк здесь нет); ключ `copy_lint:<id>` —
# анализатор линтера текстов `scripts/text/copy_lint.py`. Находка утилиты несёт `tell` своей строки. `allow` — ключ `--allow`: он снимает находку, когда бриф или арт-дирекция записали решение; те же ключи
# пишет поле `k3_allow` арт-дирекции creative. Группа: look — приметы вида, honesty — честность содержимого,
# acceptance — проверки приёмки, которые приметами не являются. У проверки приёмки ключ `allow` снимает находку решением
# плана страницы: `no-nav` у `M-NAV` — страница без меню по замыслу (посадочная, вход, «не найдено»); тяжесть находки
# без ключа — как у её пункта приёмки. У проверки `ui_audit` L4 строки нет: она находит разные
# приметы по профилю (декоративный градиент экрана, градиентный текст и фиолетовый герой страницы).
checks:
  LOOK-BG-WARM: {group: look, tell: warm-paper, allow: warm}
  LOOK-ACCENT-WORD: {group: look, tell: accent-word-headline, allow: accent-word}
  LOOK-SERIF-DISPLAY: {group: look, tell: overused-display-font, allow: serif}
  LOOK-EYEBROW: {group: look, tell: caps-eyebrow, allow: eyebrow}
  LOOK-CAPS: {group: look, tell: caps-share, allow: caps}
  LOOK-PILL: {group: look, tell: pill-announcement-chip, allow: pill}
  LOOK-GRADIENT-TEXT: {group: look, tell: gradient-text, allow: gradient}
  LOOK-HERO-CENTER: {group: look, tell: hero-center-fullscreen, allow: center-hero}
  LOOK-HERO-OVERLAY: {group: look, tell: hero-media-veil, allow: photo-hero}
  LOOK-STATS-ROW: {group: look, tell: stats-row, allow: stats}
  LOOK-THREE-CARDS: {group: look, tell: three-equal-cards, allow: cards}
  LOOK-META-DOTS: {group: look, tell: meta-dots, allow: dots}
  LOOK-ARROWS: {group: look, tell: arrow-in-button, allow: arrows}
  LOOK-MONO-LABELS: {group: look, tell: mono-captions, allow: mono}
  LOOK-NUMBERED: {group: look, tell: numbered-labels, allow: numbered}
  LOOK-GLASS: {group: look, tell: glassmorphism-panels, allow: glass}
  LOOK-MARQUEE: {group: look, tell: marquee-strip, allow: marquee}
  LOOK-DRAWN-CHROME: {group: look, tell: dashboard-in-browser-frame, allow: chrome}
  LOOK-WARM-CONTRAST: {group: look, tell: low-contrast-text}
  HON-UNSPLASH: {group: honesty, tell: stock-and-hotlink}
  HON-STOCK: {group: honesty, tell: stock-and-hotlink}
  HON-HOTLINK: {group: honesty, tell: stock-and-hotlink, allow: external}
  HON-NUMBERS: {group: honesty, tell: invented-numbers}
  HON-QUOTE: {group: honesty, tell: unsourced-quotes}
  HON-FILLER: {group: honesty, tell: filler-text}
  HON-CAPTION: {group: honesty, norm: "claude-design/06-design-process/04-checks.md §3 (подписи и alt против списка ассетов)"}
  HON-COPY: {group: honesty, norm: "claude-design/06-design-process/04-checks.md §3 (текст против copy deck)"}
  M-NAV: {group: acceptance, norm: "claude-design/06-design-process/04-checks.md §3 (группа B)", allow: no-nav}
  M-BODY-16: {group: acceptance, norm: "claude-design/06-design-process/04-checks.md §3 (группа B)"}
  M-OVERFLOW: {group: acceptance, norm: "claude-design/06-design-process/04-checks.md §3 (группа B)"}
  M-H1-LINES: {group: acceptance, norm: "claude-design/06-design-process/04-checks.md §3 (группа B)"}
  V-OVERLAP: {group: acceptance, norm: "claude-design/06-design-process/04-checks.md §3 (группа B)"}
  E-LOW-DOM: {group: acceptance, norm: "проверки по разметке неполны: canvas или видео занимают первый экран"}
  LOOK-TYPE-SCALE: {group: look, tell: font-size-count}
  LOOK-HEADER: {group: look, tell: header-height}
  LOOK-BENTO: {group: look, tell: bento-uniform-tiles, allow: cards}
  LOOK-ORBIT: {group: look, tell: logo-orbit-hero, allow: center-hero}
  FORM-FIELDS: {group: acceptance, norm: "site/05-conversion-funnels/lead-forms.yaml (form_sets — поля, подписи, обязательность; блок K приёмки)"}
  FORM-FORBIDDEN: {group: acceptance, norm: "site/05-conversion-funnels/lead-forms.yaml#forbidden и defaults.consent (блоки J, K приёмки)"}
  ui_audit:A1: {group: look, tell: off-scale-spacing}
  ui_audit:H1: {group: look, tell: font-size-count}
  ui_audit:H10: {group: look, tell: caps-share}
  ui_audit:D3: {group: look, tell: glassmorphism-panels}
  ui_audit:D4: {group: look, tell: neon-glow}
  ui_audit:I1: {group: look, tell: low-contrast-text}
  ui_audit:I10: {group: look, tell: near-black-literal}
  ui_audit:K1: {group: look, tell: hover-lift-all}
  ui_audit:L1: {group: look, tell: emoji-sparkle-ai}
  marketing_audit:MKT-C2: {group: look, tell: purple-neon-band}
  marketing_audit:MKT-M1: {group: look, tell: section-fade-up}
  marketing_audit:MKT-M2: {group: look, tell: layout-property-animation}
  copy_lint:an-cards-uniform: {group: look, tell: uniform-card-copy}
