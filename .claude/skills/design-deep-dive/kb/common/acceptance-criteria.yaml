# Критерии приёмки макета и сборки
#
# Список пунктов файла ACCEPTANCE.md входа холста: вопрос (да — норма), серьёзность, способ и место проверки, этап
# холста, с которого пункт проверяется, источник нормы. Файл читает сборщик входа холста
# (scripts/project/canvas_input.py): он отбирает пункты по роду поверхности, проверяет условия и подставляет значения
# проекта; пункты «после сборки» с тяжестью по условиям страницы и способом проверки берёт манифест готовности
# (scripts/project/ready.py через canvas_input.after_build_items). Правка пункта — правка этого файла; условие или
# подстановка, которых сборщик не знает, — ошибка сборки.
#
# Поля пункта:
#   id        id пункта; первая буква — группа (`groups`); у пункта `each: state` — шаблон id с подстановками
#   for       род поверхности: site (лендинг и многостраничник), app (кабинет); поля нет — пункт общий
#   when      условие: пункт берётся, когда оно выполнено (входом холста и манифестом готовности); поля нет — всегда
#   each      state — пункт повторяется на каждое состояние каждого экрана партии входа
#   question  вопрос; `{имя}` — подстановка сборщика
#   add       хвосты вопроса: `text` дописывается, когда выполнено условие `when`
#   severity  B — блокирует: на макете приёмку, после сборки страницу · S — исправить или принять с записью заказчика ·
#             D — по месту. Предмет пункта со способом gates — предмет его ворот страницы
#             (site/07-seo-geo-performance-analytics/page-gates.yaml); тяжесть — наибольшая, которую ворота дают
#             предмету при условиях поверхности (наибольшая по всем условиям — наибольший ключ threshold его ворот,
#             сверяет сборщик): это тяжесть непроверенного пункта, исход проверенного решают строки ворот (check)
#   method    скрипт · глаза · судья · заказчик · протокол
#   where     макет · после сборки
#   stage     этап холста, с которого пункт проверяется: mockup · motion; «—» — у пунктов «после сборки»
#   source    источник нормы
#   check     у пунктов «после сборки» — способ проверки в репозитории кода; манифест готовности несёт пункт как
#             {id, severity, check}:
#               {gates: [id ворот]}         строки вердикта page_gates.py с этими id, кроме зеркал (mirror); исход
#                                           пункта пишет сам вердикт с --ready (поле after_build[])
#               {tool: команда, field: путь, pass: {all: значение} | {none: значение}}
#                                           утилита скилла: команда — путь от scripts/ с ключами, URL в ней — адрес
#                                           собранной страницы; JSON с полями tool и skill_version утилита печатает
#                                           в stdout. Путь выбирает значения JSON: имя — поле верхнего уровня,
#                                           имя[ключ=значение].поле — поле строк списка «имя», у которых ключ равен
#                                           значению; all — каждое выбранное значение равно значению условия, none —
#                                           ни одно не равно
#               code                        тест самого репозитория кода по вопросу и источнику пункта: предмет
#                                           знает только код (формы, события, разметка по плану, сайт целиком)
#               manual                      человек на собранной странице, итог записывается
#             Исход пункта — пройден, провален или не проверен; не пройден — провален или не проверен:
#               gates    строки диагностики (diagnostic: замер не в условиях метода ворот — LCP телефона без
#                        троттлинга) пункт не решают; у какого-либо из его ворот других строк нет или все SKIP — не
#                        проверен; иначе строка FAIL без исключения плана (excepted) — провален с худшей тяжестью
#                        таких строк (её B — уже B вердикта); иначе пройден
#               tool     JSON нет, в нём есть поле error, нет поля «имя» пути (у пути со строками — списка) или у all
#                        выборка пуста — не проверен; условие выполнено — пройден, иначе провален
#               прочие   провален — по своему способу; нет итога (теста, записи) — не проверен
#             Тяжесть непройденного пункта — поле severity, у провала gates — худшая строка; что из этого блокирует —
#             гейт 5 (references/phases.md § Принципы всех этапов).
# Значение severity, stage и source — строка или словарь «условие: значение» с ключом `else`; check — без условий.
#
# Условия (`when` и ключи словарей):
#   site, app        род поверхности
#   a11y             в брифе задана цель доступности
#   dark             у дизайн-системы есть тёмная тема
#   cookie           у страниц партии есть баннер cookie
#   eu               основная юрисдикция страницы — eu (первый элемент page.jurisdiction плана): в манифесте
#                    готовности — своей страницы, во входе холста — какой-либо страницы партии
#   law              основная юрисдикция страницы — ru или eu, право которых есть в базе (legal-requirements.yaml);
#                    без юрисдикции в плане — как ru, умолчание ворот; где — как у eu. Вне права базы (kz, by, us,
#                    other) ворота строк права не пишут: пункт права был бы не проверен всегда, а согласие по праву
#                    такой страны решает юрист заказчика
#   state_required   состояние входит в обязательный набор экрана
#
# Подстановки:
#   общие     themes, a11y, overflow, artboards — темы ДС, цель доступности, ширина проверки вылета, ширины артбордов
#   сайт      mains, a3, h1s, types, events, jur, forms_line — главные действия, политика первого экрана, H1, типы
#             JSON-LD, события, юрисдикции и формы планов партии; pd_consent, privacy_policy, cookie_banner,
#             cookie_mode, ad_marking — блок legal плана; lvl, properties_allowed, in_view_max, under_text_max, modes —
#             уровень страницы и его нормы движения и 3D (ambition-levels.yaml); prof — профиль бюджета
#   кабинет   first_bp, bp_source — первый брейкпоинт ДС и его источник; screen, state_id, state_key — экран и
#             состояние пункта `each: state`
#
# Порядок пунктов — порядок строк ACCEPTANCE.md; группы идут в порядке первого пункта группы.

# Группы пунктов: буква id → название раздела ACCEPTANCE.md. Пункты состояний экранов (ST-…) — группа S.
groups:
  A: Структура
  B: Честность
  C: Система
  D: Адаптив и доступность
  E: Движение
  F: Ассеты и скорость
  G: Публикация и слияние
  H: Арт-директор
  I: SEO и мета
  J: Право
  K: Формы
  L: События
  N: Доступность и узкий экран
  S: Состояния экранов
  V: Среда

# Политики первого экрана — текст подстановки {a3} по `first_screen_policy` плана страницы (site 03/03 §2).
first_screen_policies:
  offer-cta: обещание (что это и результат) и главный призыв в потоке hero, виден признак продолжения
  offer-cta-header: обещание и призыв в шапке или липкой панели без прокрутки, виден признак продолжения
  poster: заявление или образ, видимый признак продолжения и призыв в шапке

