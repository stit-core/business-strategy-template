build:
  stack: Vite + React + TypeScript, CSS modules, react-router
  allowed_packages: [vite@8, typescript@7, react@19, react-dom@19, "@vitejs/plugin-react@6", react-router@8, "@fontsource/golos-text@5"]
  dev_cmd: npm run dev -- --port 5173
  build_cmd: npm run build
  dev_url: "http://localhost:5173"
  viewports: ["1440x900", "768x1024", "390x844"]
  routes: [/orders, /orders/1042, /couriers, /report]
  selector: ""
  src_layout: ""
  out_of_scope: [backend and API, authentication, map and courier routes, notifications, tests]
  perf: {hero_image_kb: 100, first_screen_kb_mobile: 800, lcp_s_mobile: 2.5}

questions:
  - {q: "Статусы заказа", asked: true, answer: "новый → назначен → в пути → доставлен / отменён; меняет диспетчер, «доставлен» — ещё и курьер", source: заказчик, date: 2026-09-24}
  - {q: "Руководитель с телефона", asked: true, answer: "только отчёт смены (адаптив /report)", source: заказчик, date: 2026-09-24}
