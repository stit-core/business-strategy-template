missing_slots: []

decisions:
  mobile: "responsive: /report is fully usable at 390x844 (manager on a phone); other screens fall back to one column without horizontal page scroll (wide tables scroll inside their container)"
  motion: {level: none, thesis: "", moments: [], library: css}
  assets_mode: typographic
  three_d: {mode: none, files: [], poster: "", notes: ""}
  variants: 1
  iterations_max: 3
