  - {file: assets/img/lamp-desk.jpg, source: src/assets/img/lamp-desk.jpg, slot: problem, role: informational, caption: "Кварц у кресла для чтения, прототип", alt: "Настольная лампа Кварц у кресла рядом со стопкой книг", focal: "60% 45%", variants: "1600x1067", licence: "фото заказчика, 2026"}
  - {file: assets/img/lamp-detail.jpg, source: src/assets/img/lamp-detail.jpg, slot: how, role: informational, caption: "Кольцо яркости", alt: "Крупный план кольца регулировки яркости лампы Кварц", focal: "50% 50%", variants: "1200x1200", licence: "фото заказчика, 2026"}
  - {file: assets/img/lamp-usb.jpg, source: src/assets/img/lamp-usb.jpg, slot: specs, role: informational, caption: "Порт USB-C в основании", alt: "Порт USB-C в основании лампы Кварц", focal: "40% 70%", variants: "1200x900", licence: "фото заказчика, 2026"}
