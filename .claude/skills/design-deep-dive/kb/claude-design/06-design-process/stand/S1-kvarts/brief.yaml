  logo: {primary: assets/brand/logo.svg, on_dark: "", mark: "", min_width_px: 96, clear_space: высота буквы К со всех сторон, never: [redraw, recolor, stretch or rotate, add effects or shadows]}
  imagery: {style: фото прототипа на светлом поле, products_dir: assets/img/, people_policy: людей нет}
  voice: {tone: на «вы», коротко, use: [свет, книга, вечер], avoid: [здоровье глаз, революционный, уникальный]}

