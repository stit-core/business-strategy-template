  - {file: assets/3d/kvarts-poster.jpg, source: src/assets/3d/kvarts-poster.jpg, slot: object3d, role: informational, caption: "Постер 3D-модели", alt: "Лампа Кварц, вид три четверти", focal: "50% 50%", variants: "1024x1024", licence: "рендер из той же модели (3d)"}
missing_slots: []

decisions:
  mobile: responsive (on phones the 3D block shows the poster until the visitor taps it)
  motion:
    level: subtle
    thesis: свет лампы в блоке «как работает» теплеет, когда блок входит в экран
    moments: ["how enters the viewport: warm light layer opacity 0 -> 1, 400 ms, ease-out", "primary button hover: translateY(-2px), 150 ms"]
    library: css
  assets_mode: provided
  three_d: {mode: model-viewer, files: [assets/3d/kvarts.glb], poster: assets/3d/kvarts-poster.jpg, notes: "camera-controls on, auto-rotate off, no AR button"}
  variants: 1
  iterations_max: 3
  extra: ["No reviews, press logos or countdown timers"]

build:
  stack: Vite + vanilla TypeScript (no framework), one page
  allowed_packages: [vite@8, typescript@7, "@google/model-viewer@4", "@fontsource/unbounded@5", "@fontsource/golos-text@5"]
  dev_cmd: npm run dev -- --port 5173
  build_cmd: npm run build
  dev_url: "http://localhost:5173"
  viewports: ["1440x900", "768x1024", "390x844"]
  routes: []
  selector: "main > section"
  src_layout: ""
  out_of_scope: [payment backend (the /preorder link is a placeholder route), analytics, tests, CMS]
  perf: {hero_image_kb: 150, first_screen_kb_mobile: 1500, lcp_s_mobile: 2.5}

questions:
  - {q: "Главная кнопка", asked: true, answer: "«Забронировать за 990 ₽» → /preorder", source: заказчик, date: 2026-09-24}
  - {q: "Направление", asked: true, answer: "A — Инженерный паспорт", source: заказчик, date: 2026-09-24}
  - {q: "3D и фото", asked: true, answer: "фото заказчика + 3D с вращением (model-viewer), постер из той же модели", source: заказчик, date: 2026-09-24}
