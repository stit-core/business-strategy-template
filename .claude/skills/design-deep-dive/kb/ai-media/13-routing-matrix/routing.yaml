# routing.yaml — матрица маршрутов генерации: «задача → модель → параметры → цена → запас → чем проверять».
# Обоснования — 03-routing-matrix.md (раздел по коду маршрута), доказательства — 02-existing-evidence.md.
# Метки: живой прогон — `[проверено: условия]` с числом образцов; `[стенд: …]` — по правилу
# 04-update-procedure.md §3 (≥ 2 задачи, ≥ 70 % решающих пар).
# Проверка: python3 ../../scripts/ai-media/routing_check.py — 0 ошибок: коды, поля, модели, параметры и цены вариантов
# сходятся с последними снимками каталогов (цена варианта polza = polza_catalog.py price).
version: 2
checked_at: "2026-09-25"
catalog_snapshots:                                 # снимки каталогов, с которыми матрицу сверяли при обновлении: имена папок в $DDD_HOME/cache/ai-media/<канал>/
  polza: "2026-09-25_1411"
  routerai: "2026-09-25_1411"
  genapi: "2026-09-25_1411"

enums:
  channel:
    polza: "Media API polza (polza.py); ключ ~/.config/polza/api_key; живой прогон: 205 генераций, 1 316,71 ₽ (журнал = spentAmount − 147,70 до прогона)"
    polza-chat: "chat/completions polza (mp_client.py): LLM → SVG, VLM-судья, OCR-чтение; тот же баланс polza; живой прогон: 190 вызовов 17,06 ₽ + 2 пустых ответа со списанием 9,80 ₽"
    polza-images: "/v2/images/generations polza (mp_client.py); тот же баланс polza; ступень цены по size не документирована; в живом прогоне не вызывался (H-02 отменён)"
    routerai: "RouterAI /api/v1/images (mp_client.py); отдельный баланс, ROUTERAI_BUDGET_TOTAL по умолчанию 0; живой прогон: 26 генераций 212,68 ₽ (usage ключа = журнал)"
    genapi: "Gen-API /api/v1/networks/{slug} (mp_client.py); отдельный баланс, GENAPI_BUDGET_TOTAL по умолчанию 0; живой прогон: 30 генераций 384 ₽; цена ступенями по параметрам (cost каталога — минимум), списание по факту"
    local: "локальная утилита на этой машине (0 ₽)"
    code: "код (CSS/SVG/HTML/шейдер/LLM в сессии), 0 ₽"
    blender: "../3d — детерминированный рендер"
    external: "вне доступа: иностранная оплата или нет API (fal, Luma, Recraft напрямую, KIE, Midjourney)"
  legal_flags:
    research: "веса под исследовательской лицензией (Qwen Image 2.1): только черновики и тесты, не финал (12/01 §5, 04 §2 стр. 21)"
    nc-weights: "некоммерческие веса локальной модели (RMBG-2.0 по умолчанию в rembg, Depth Anything Base/Large, FLUX.2 dev/klein): модель задавать явно"
    nc-weights-disputed: "веса без явной лицензии на некоммерческом датасете (isnet-general-use, DIS5K): для финала — u2netp/хромакей/BiRefNet (12/01 §4)"
    no-automation: "условия запрещают автоматизацию (Midjourney ToS 27.05.2026 §1) — не в конвейер"
    visible-vendor-mark: "возможна видимая метка вендора на кадре (MiniMax H3 — ToS требует «prominent mark… within generated content», 12/01 §2; Seedream «AI-generated» — только прямой API: через mie метки нет — E-01 Seedream 4 и проверка углов 7 кадров Seedream 4.5 / 5 Pro 25.09, флаг у Seedream снят в v2): решение заказчика, не вырезать тихо (04 §2 стр. 23)"
    vendor-mark-keep: "метки вендора (C2PA, SynthID, AIGC, <recraft-signature>) в мастере не удалять (BFL, Recraft DT 6.4, Кодекс ЕС); производная — XMP DigitalSourceType или паспорт; у SVG Recraft производная без <metadata> — манифест после чистки Invalid (25.09)"
    people-consent: "реалистичные люди: спросить заказчика; ЕС — видимая иконка AI (04 §2 стр. 12–14)"
    product-real-only: "товар — только настоящий, композитом; проверка edit_check --protect (04 §2 стр. 7–9)"
  labels: ["[проверено]", "[стенд]", "[документация]", "[мнение вендора]", "[исследование]", "[консенсус]", "[практика]", "[мнение]", "[спорно]", "[не проверено]"]
  evidence_class:
    A: "слепые голоса или метрика с методикой, независимо, модели ≤ 1 мес. (AA, LMArena, Rapidata 09.2026, PaintBench, FEPBench)"
    B: "методика есть, но один судья / старые версии / заинтересованный автор / малая категория (GenAI Showdown, GDB, OCRGenBench, Pinterest, Lucida, Design Arena B+)"
    C: "N ≤ 4, партнёрский, вендорская витрина (klerk, Хабр, Substack, Simon Willison n = 1)"
    stand: "результат стенда (N задач × моделей × повторов, судья, дата) — по 04-update-procedure.md §3; в живом прогоне правило стенда не выполнено ни разу"
    run: "живой прогон (25.09.2026): 1–2 образца на модель, метрика кодом и/или голос заказчика вслепую (1 чел.)"
  audit_modes: [image, cutout, edit, texture, series, video-loop, video-alpha, svg-icon, og]

defaults:
  provider: {only: [mie], allow_fallbacks: false}   # явно; у H3 Max и Wan Prime — openrouter; T5 (25.09): provider в Media API работает — NB2 Lite через google-ai-studio 4,06 ₽ против 2,90 у mie
  price_params_explicit: true                       # запасная ступень = максимум у 13 моделей (Seedance 2 «только промт» = 415 ₽); T8 (25.09): без image_resolution Sunburst взял ступень каталога 1K 4 ₽, не запасную 11
  sound: "выключать параметром, где он есть (generate_audio/sound = \"false\" — T4: строки приняты, ступень без звука 5,25 ₽, дорожки нет); у Veo, Omni, Wan 2.5/2.6, Grok, H3 — -an при кодировании (живой прогон: звук есть у Grok 1.5 и GA Omni 1.1, у Seedance и Kling с \"false\" — нет)"
  fx: {polza_usd_rub: 117.992, note: "долларовые провайдеры polza +0,2 % к 23.09 09:21 (openrouter); 25.09 цены медиа polza те же (снимки 1111 и 1411)"}
  dialects: 05-prompting/dialects.yaml             # v0.4; компилятор ../../scripts/ai-media/prompt_compile.py v2.1
  compile_policy:
    description_language: en
    enhancers: off                                 # enhance_prompt / enable_prompt_expansion — false
    prompt_form: "живой прогон (D2-01, D2-04, D2-05, D2-11, D2-12): JSON как формат промта выигрыша не дал ни в одной проверке (правило Δ ≥ 10 п. п. и ДИ > 0) → умолчания диалектов не меняются; JSON — спецификация системы (asset-spec → компилятор)"
    negatives_last:
      video: true
      image: false
      decision: "24.09: у картинок порядок v1 оставлен — включение меняет 146 скомпилированных заданий (D2-01, D2-09, стенд) и ломает сопоставимость плеч; вернуться, если D2-09 (порядок блоков) даст эффект ≥ 10 п. п.; D2-09 не прогонялся (отменено) — порядок v1 в силе"
  text_policy: "текст интерфейса, цены, кнопки, юр. строки, факты — HTML/CSS поверх; в картинке — только короткая декоративная надпись с OCR и вычиткой человеком"
  people_policy: "слоты-доказательства (люди, отзывы, команда, товар) не генерировать: реальный человек/товар + ИИ-окружение (ai-media 01/03, 12/04 §2)"
  unit_of_choice: "модели внутри интервала лидера по голосам равны → дешевле, затем быстрее (01-stand-method.md §5)"
  best_of: "2 кандидата на дорогой модели — основной прирост выхода (Pinterest: 8 вместо 2 → +3 п. п.); постеры/баннеры с текстом — 4 (PosterBench +2,4)"
  moderation_refusal: "отказ модерации → запасная модель того же маршрута, не переформулировка обходом"
  deprecated: ["openai/gpt-5-image (выкл. 23.10.2026)", "openai/gpt-image-1.5 и openai/gpt-5-image-mini (01.12.2026)", "google/gemini-2.5-flash-image", "qwen/image", "qwen/image-2", "black-forest-labs/flux.2-flex (дубль pro ×2,8)", "x-ai/grok-imagine-image (база, не 2.0)", "sora-2 (API снят 24.09.2026)", "gemini-omni-video (preview до 30.09.2026)", "gpt-image-2-5-flare (переименован 25.09.2026 → openai/gpt-image-2.5-flare: параметры и цены 4/7/11 ₽ те же, старого id в снимке 2026-09-25_1411 нет)"]
  unavailable_2026_09_25:                          # выбыли в живом прогоне по правилу «две ошибки модели в блоке — модель выбывает»; списаний 0 ₽; повторить при следующем снимке
    - {model: minimax/hailuo-3-max, channel: polza, provider: openrouter, error: "503 SERVICE_UNAVAILABLE «Нет доступных провайдеров для генерации медиа типа video» × 2 (12:22, 13:27)", tests: [VM-01, I-10]}
    - {model: topaz/video-upscale, channel: polza, provider: mie, error: "INTERNAL_ERROR провайдера × 2 (12:24, 12:29)", tests: [VM-05]}
    - {model: alibaba/wan-3.0, channel: polza, error: "503 SERVICE_UNAVAILABLE × 1 (14:00); петлю и так не строит (один кадр)", tests: [VM-03]}
  unavailable:                                     # выбывшие по правилу «две ошибки модели в блоке — модель выбывает»; вариантом — только с final: false или в not; вернуть — после успешного вызова на свежем снимке каталога
    - {model: topaz/image-upscale, channel: polza, provider: mie, error: "внутренняя ошибка модели × 2"}
  not_routes:                                      # возможности, проверенные живым прогоном и не ставшие маршрутом (кодов таксономии у них нет или код снят)
    - what: "3D-модель по картинке (GLB) для страницы"
      tried: "Gen-API: TRELLIS 4 ₽ (раковина, флакон), TRELLIS.2 1024 75 ₽, Tripo Standard 75 ₽, Hunyuan3D с текстурой 96 ₽ (каталог — 32: ступень «с покраской»)"
      why: "органика — узнаваема, но только после обязательной доводки (сырой GLB 4,5–5,6 МБ, metallicFactor 1 без карты → 0; TRELLIS-раковина после meshopt + WebP 1K — 241 КБ); стекло → белый фарфор, надпись теряется; вердикт заказчика: «генерация 3D-моделей — так себе, лишнее»; красоту, блик и надпись даёт видео-модель по картинке (VID-I2V-PRODUCT, 10,5–50 ₽)"
    - what: "правка готового видео (V2V) — код VID-V2V"
      why: "не нужна; I-17, I-20 не запускались; preview gemini-omni-video снимается 30.09.2026"
    - what: "альфа генерацией у Riverflow 2.5 fast (RouterAI, background: transparent)"
      why: "CM-05: 2 × пустой ответ без data[] (0 ₽)"
  channel_rules:                                   # поведение каналов, проверенное живым прогоном
    polza: "лишние поля молча принимаются и списываются (T7: negative_prompt у Z-Image — 1,40 ₽); неверное значение → 400 без списания (T6); id генерации gen_…; обрыв POST (12 раз за день) — не повторять, сначала GET /v1/history/generations → если не создана, запись NETWORK_RESOLVED и повтор (двойных списаний 0); рассуждения чата биллятся сверх max_tokens и могут съесть ответ (G-03 Claude Sonnet 5 — пустой ответ «length» за 9,77 ₽; DeepSeek V4.1 Flash 1,17 ₽ при оценке 0,17); сверка: spentAmount − 147,70 = журнал до копейки; polza-chat списывает по ставке провайдера, взявшего вызов, а не по оценке: судья Gemini 3.1 Flash Lite — ×1,8–2,6 (29,70 / 178,21 ₽ за 1 млн, K-03/K-04/K-05), DeepSeek V4.1 Flash — ×3,6 (G-04) → закреплять provider.only или считать по верхней ставке; VLM по листу кадров временных дефектов видео не видит (K-03: 2 и 3 из 14) — видео только метриками"
    routerai: "сверка — usage ключа = сумма журнала (4 обрыва сети не списаны); controls доходит до Recraft (B2-01: неверный → 200 без data[], 0 ₽); FLUX.2 max списал 11,04 ₽ при ожидании 7,73 (+43 %) → по правилу «цена разошлась > 10 %» модель остановлена; GPT Image через RouterAI — списываются только выходные токены × 0,0033113 ₽ (входной текст не списан, оценка mp_client выше на 0,18–0,21 ₽); <recraft-signature> в SVG нет, есть C2PA-манифест в <metadata> (17,7 КБ)"
    genapi: "цена сети — ступенями по параметрам, cost каталога — минимум (Hunyuan3D 96 против 32, Hunyuan Image V3 45 против 22,5, TRELLIS.2 1024 — 75, Tripo Standard — 75); списание по факту — сверка по балансу; data:URI в url_or_file / image_url → 422 (вход — публичный URL, например хранилище polza); result приходит объектом {\"0\": url, …}; prompt ≤ 1 000 символов (Bria FIBO — 422); negative_prompt — строка (Imagen 4 — 422 на пустом); 402 — кончились деньги (Ideogram V3)"
  delivery:
    image: "AVIF по SSIMULACRA2 ≥ 80 (hero) / ≥ 70 (прочее) — avif_pick.sh; WebP-запас ≤ 1920 px в <picture type>; JPEG XL — первым необязательным <source> с 06.10.2026 (Chrome 155); srcset 640…3840 + точный sizes; телефону — свой мастер 4:5 через <source media width height>; LCP-картинка без lazy, fetchpriority=high, ≤ 150/80 КБ; XMP DigitalSourceType — provenance_check.py stamp (10/01, 08/04, 12/02 §5)"
    image_alpha: "AVIF/WebP с альфой (PNG только < 256 px); поле ≥ 2 % под ореол и тень; тень — отдельным слоем multiply (08/01 §6–7)"
    video: "AV1 10 бит первым <source> + H.264 запасом; CRF по motion_keep ≥ 0,75 (AV1 24–28, H.264 18–20) и для петли — по шву после кодирования ≤ 2,5 (пульс ключевого кадра: мезонин RIFE 0,8 → 2,4 при AV1 CRF 28, 1,8 при H.264 -tune grain); полные теги BT.709 (setparams); выходы Seedance, Kling, GA Omni приходят без цветовых тегов, Kling и Omni ближе к BT.601 → явное преобразование BT.601 → BT.709 (n = 5); -an; -map_metadata 0 -movflags use_metadata_tags+faststart; постер = кадр 0 финального AV1 через Pillow → AVIF; reduce/Save-Data/2G → 0 байт видео; движение > 5 с — кнопка паузы или стоп ≤ 5 с (WCAG 2.2.2); петля ≤ 1,5 МБ / 600 КБ телефон (10/02, 09/03)"
    video_alpha: "stacked alpha (AV1/HEVC/H.264) + WebGL2 (≈ 12,5 КБ на 2 с); VP9-alpha 16–30 КБ; HEVC-alpha — только Safari; libx265 альфу молча теряет (09/02, 10/02)"
    svg: "svgo 4 (preset-default; фон-прямоугольник удалить до svgo); иконки — спрайт <symbol>/<use> + currentColor; Recraft через RouterAI: мастер с C2PA-манифестом в <metadata> (17,7 КБ, 30–79 % веса) хранить побайтно, на страницу — производная без <metadata> (после чистки манифест Invalid); без манифеста иконки, споты и фоны — 2,3–10,1 КБ (inline и спрайт допустимы), фото → вектор — ≈ 53 КБ (<img>/AVIF); сетка иконок одним SVG → нарезка по ячейкам сетки из задания (`split_recraft.py --grid … --names …`; 8 SVG по 0,9–2,5 КБ) (07/02–03)"
    og: "HTML/CSS-шаблон → Playwright → PNG/JPEG 1200×630 ≤ 300 КБ (10/01)"
  check_always: "asset_audit.py audit <файл|папка с паспортами> --strict → fail чинить до показа человеку; провенанс: scan мастера → кодирование → stamp → audit --stage web (11/01, 12/02)"

routes:

  IMG-HERO-PHOTO:
    name: "фотореалистичный hero / key visual"
    slots: [hero, key-visual, blog-cover, cta]
    ai_fit: "⚠️ атмосфера и сцена без людей; ❌ сам товар и люди-«клиенты» (A 01 §2.1)"
    options:
      - {role: primary, channel: polza, provider: mie, model: openai/gpt-image-2.5-sunburst, params: {image_resolution: "2K", aspect_ratio: "16:9"}, price_rub: 7.0, final: true, note: "E-08: «хорошо» (голос вслепую, 1 чел.), живая сцена, чертёж стула в увеличении верен; F-04: с блоком композиции 3 из 3; тёплый сдвиг (QA-COLOR-WARM) — грейдом; люди и руки — GPT 2.x; 4K = 3840×2160 за 11 ₽ (E-01)"}
      - {role: alt, channel: polza, provider: mie, model: openai/gpt-image-2.5-flare, params: {image_resolution: "2K", aspect_ratio: "16:9"}, price_rub: 7.0, final: true, note: "E-08: «хорошо» — равный запас той же цены; чертёж стула верен, самая живая мастерская вместе с Sunburst; id до 25.09.2026 — gpt-image-2-5-flare"}
      - {role: fallback, channel: polza, provider: mie, model: google/gemini-3.1-flash-image-preview, params: {image_resolution: "2K", aspect_ratio: "16:9"}, price_rub: 7.2, final: true, note: "E-08: «хорошо», но в увеличении стул — «не стул» (проверять предметы); задирает насыщенность — slop_color"}
      - {role: cheap, channel: polza, provider: mie, model: bytedance/seedream-4, params: {image_resolution: "4K", aspect_ratio: "21:9"}, price_rub: 3.0, final: true, note: "E-01: «4K» 21:9 = 2352×1008 (≈ 2,4K, не 4K) — лента 21:9; видимой метки через mie нет, C2PA Valid"}
      - {role: alt, channel: routerai, model: openai/gpt-image-2.5-sunburst, params: {aspect_ratio: "16:9", quality: medium}, price_rub: 0.93, final: true, gate: "1536×864 (1,33 Мп) — для hero 1920 апскейл Lanczos ×1,25 или 2K polza", note: "N-01 (25.09): medium 0,93 ₽ ≈ high 3,57 ₽ ≈ polza 1K 4 ₽ (1672×941) — на глаз при ×2 не различимы, метрики резкости в пределах разброса генераций (n = 2 брифа) → «polza отдаёт ниже high» не подтверждено; списываются только выходные токены × 0,0033113 ₽"}
      - {role: alt, channel: routerai, model: qwen/qwen-image-3, params: {aspect_ratio: "16:9"}, price_rub: 3.3113223, final: false, note: "CM-09 (1 образец, глаз): настоящие 2K (2048×1152) по цене 1K; свет ровный «каталожный»; лицензия выхода не разобрана → мини-стенд"}
      - {role: alt, channel: routerai, model: krea/krea-2-medium, params: {aspect_ratio: "16:9"}, price_rub: 3.3113223, final: false, note: "CM-09 (1 образец, глаз): самый «плёночный» и естественный кадр (глаз A), приглушённый, кресло мелко (глаз V); зона заголовка 0,0010; выход 1376×768 (1K) → мини-стенд"}
      - {role: draft, channel: polza, provider: mie, model: google/gemini-3.1-flash-lite-image, params: {aspect_ratio: "16:9"}, price_rub: 2.9, final: false}
    not:
      - {model: seedream/5-pro-text-to-image, why: "E-08 (голос вслепую, 1 чел.): «сразу минус», у людей — «стоковые» улыбки (при верном стуле в увеличении); раньше: Rapidata Photorealism #33 против LMArena #9 — спор решён против"}
      - {model: google/gemini-3-pro-image-preview, why: "E-08: «слишком ровно» за 13,5 ₽, в увеличении стул — «не стул»; раньше: Rapidata Photo #12, AA Live-Action #7"}
      - {model: black-forest-labs/flux.2-pro, why: "E-08: «так себе» (1K 5 ₽; первая попытка — INTERNAL_ERROR провайдера, 0 ₽)"}
