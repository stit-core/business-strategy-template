<!doctype html>
<!-- three r186 + @paper-design/shaders 0.0.81 — [проверено] шейдерный фон героя без Blender.
     ?v=gradient (фрагментный, fbm-шум) | ribbon (вершинный, как у Stripe) | paper (библиотека) | sdf (raymarching метаболов)
     | swatch (проверка цвета uniform; &cs=off — без colorspace_fragment); &res=0.5 — половинное разрешение; &dpr=N -->
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shader background</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #14122b; background: #f6f3ff; }
  .hero { position: relative; height: 100vh; min-height: 520px; overflow: hidden;
          background: linear-gradient(120deg, #ffb38a, #b9a6ff 55%, #8fd8ff); }   /* запас без WebGL и при сбое */
  .bg, .bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .copy { position: relative; padding: 18vh 7vw 0; max-width: 760px; }
  h1 { font-size: clamp(36px, 6vw, 76px); line-height: 1.02; margin: 0 0 .35em; }
  .copy p { font-size: 20px; max-width: 520px; }
  .cta { display: inline-block; margin-top: 10px; padding: 12px 22px; border-radius: 999px; background: #14122b; color: #fff; text-decoration: none; }
  main { padding: 8vh 7vw 60vh; max-width: 760px; }
</style>
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.min.js",
  "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.core.js":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.core.min.js",
  "@paper-design/shaders":"https://cdn.jsdelivr.net/npm/@paper-design/shaders@0.0.81/dist/index.js"}}</script>
</head><body>
<section class="hero" id="hero">
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="copy"><h1>Платежи, которые просто работают</h1>
    <p>Фон — один полноэкранный шейдер без ассетов; текст и кнопка — HTML поверх.</p><a class="cta" href="#more">Начать</a></div>
</section>
<main id="more"><p>Ниже — обычный контент страницы. Фон останавливается, когда герой уходит из вида.</p></main>
<script type="module">
const q = new URLSearchParams(location.search);
const V = q.get('v') || 'gradient';
const RES = +(q.get('res') || (V === 'sdf' ? 0.5 : 1));           // SDF по умолчанию в ½ разрешения
const DPR = +(q.get('dpr') || Math.min(devicePixelRatio, 1)) * RES; // размытому фону чёткость не нужна: DPR ≤ 1
const el = document.getElementById('bg'), hero = document.getElementById('hero');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const PALETTE = ['#ff6a3d', '#ffb36b', '#7a5cff', '#29c4ff'];     // бренд: hex в sRGB

if (V === 'paper') {
  const { ShaderMount, meshGradientFragmentShader, getShaderColorFromString } = await import('@paper-design/shaders');
  const mount = new ShaderMount(el, meshGradientFragmentShader, {
    u_colors: PALETTE.map(getShaderColorFromString), u_colorsCount: PALETTE.length,
    u_distortion: 0.8, u_swirl: 0.15, u_grainMixer: 0, u_grainOverlay: 0 }, undefined, reduce.matches ? 0 : 0.6);
  const upd = () => mount.setSpeed?.(reduce.matches ? 0 : 0.6);
  reduce.addEventListener('change', upd);
  window.__info = { v: V, lib: '@paper-design/shaders 0.0.81' };
  window.__ready = true;
} else {
  const THREE = await import('three');
  const renderer = new THREE.WebGLRenderer({ antialias: V === 'ribbon', powerPreference: 'low-power' });
  renderer.setPixelRatio(DPR);
  renderer.toneMapping = THREE.NoToneMapping;                        // фон не тонмаппится: hex бренда = пиксель
  el.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const cols = PALETTE.map((h) => new THREE.Color(h));               // Color хранит ЛИНЕЙНЫЕ значения (ColorManagement)
  const uniforms = { uTime: { value: 0 }, uRes: { value: new THREE.Vector2() },
    uC0: { value: cols[0] }, uC1: { value: cols[1] }, uC2: { value: cols[2] }, uC3: { value: cols[3] } };
  const NOISE = /* glsl */`
    float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); vec2 u = f * f * f * (f * (f * 6. - 15.) + 10.);   // квинтика: без «квадратов» решётки
      return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y); }
    float fbm(vec2 p) { float a = .5, s = 0.; for (int i = 0; i < 3; i++) { s += a * vnoise(p); p *= 2.03; a *= .5; } return s; }`;
  const FULL_VS = /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`;
  const OUT = V === 'swatch' && q.get('cs') === 'off' ? '' : '\n#include <colorspace_fragment>\n'; // #include — только с начала строки  // линейный → sRGB вывода
  let mesh, camera = new THREE.Camera();
  if (V === 'gradient' || V === 'swatch') {
    const fs = V === 'swatch'
      ? `uniform vec3 uC0; void main() { gl_FragColor = vec4(uC0, 1.); ${OUT} }`
      : `uniform float uTime; uniform vec2 uRes; uniform vec3 uC0, uC1, uC2, uC3; varying vec2 vUv; ${NOISE}
         void main() {
           vec2 p = vUv * vec2(uRes.x / uRes.y, 1.) * 1.2;
           float t = uTime * .05;
           vec2 w = vec2(fbm(p + vec2(t, -t)), fbm(p + vec2(4.1 - t, 1.7 + t)));          // деформация домена
           float n = fbm(p * 1.3 + w * 1.6 + t);
           vec3 c = mix(uC0, uC1, smoothstep(.3, .6, n));                               // пороги ≈ медиана fbm (0,44), иначе цвет не проявится
           c = mix(c, uC2, smoothstep(.36, .56, w.x));
           c = mix(c, uC3, smoothstep(.42, .62, w.y));
           c += (hash(gl_FragCoord.xy + uTime) - .5) / 255.;                            // дизеринг против бандинга
           gl_FragColor = vec4(c, 1.); ${OUT}
         }`;
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({ uniforms, vertexShader: FULL_VS, fragmentShader: fs }));
  } else if (V === 'ribbon') {
    // как у Stripe: деформация и цвет в вершинном шейдере на сетке 128×128 (≈ 16,6 тыс. вершин), фрагментный — одна строка
    camera = new THREE.PerspectiveCamera(30, 1, 0.1, 10); camera.position.set(0, 0, 2.6);
    const vs = `uniform float uTime; uniform vec3 uC0, uC1, uC2, uC3; varying vec3 vColor; ${NOISE}
      void main() {
        vec2 nc = uv * vec2(3., 4.);                                                    // асимметрия → «природные» формы
        float t = uTime * .08;
        float tilt = -.8 * uv.y, incline = uv.x * .5, offset = incline * mix(-.25, .25, uv.y);
        float n = fbm(vec2(nc.x + t * 3., nc.y + t));
        vec3 pos = position + vec3(0., 0., max(0., n - .25) * .9 + tilt + offset);
        vec3 c = uC0;
        c = mix(c, uC1, smoothstep(.35, .65, fbm(nc * .8 + vec2(t * 2., -t))));
        c = mix(c, uC2, smoothstep(.4, .7, fbm(nc * .9 + vec2(-t, t * 2.5) + 7.)));
        c = mix(c, uC3, smoothstep(.45, .75, fbm(nc * 1.1 + vec2(t * 1.5, t) + 13.)));
        vColor = c;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.);
      }`;
    const fs = `varying vec3 vColor; void main() { gl_FragColor = vec4(vColor, 1.); ${OUT} }`;
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 2.6, 128, 128), new THREE.ShaderMaterial({ uniforms, vertexShader: vs, fragmentShader: fs }));
    mesh.rotation.set(-0.35, 0.2, -0.25);
    scene.background = new THREE.Color('#f6f3ff');
  } else if (V === 'sdf') {
    const fs = `uniform float uTime; uniform vec2 uRes; uniform vec3 uC0, uC1, uC2, uC3; varying vec2 vUv;
      float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.) / k; return min(a, b) - h * h * h * k / 6.; }
      float map(vec3 p) { float d = 1e3; float t = uTime * .35;
        for (int i = 0; i < 5; i++) { float fi = float(i);
          vec3 c = vec3(sin(t * (.7 + .13 * fi) + fi * 1.7) * 1.1, cos(t * (.5 + .11 * fi) + fi * 2.3) * .6, sin(t * .3 + fi) * .4);
          d = smin(d, length(p - c) - (.42 + .06 * fi), .55); }
        return d; }
      vec3 nrm(vec3 p) { const vec2 e = vec2(1e-3, -1e-3);                               // тетраэдр: 4 выборки вместо 6
        return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx)); }
      void main() {
        vec2 p = (vUv - .5) * vec2(uRes.x / uRes.y, 1.);
        vec3 ro = vec3(0., 0., 4.), rd = normalize(vec3(p, -1.6));
        float t = 0.; bool hit = false;
        for (int i = 0; i < 64; i++) { float d = map(ro + rd * t); if (d < 1e-3) { hit = true; break; } t += d; if (t > 9.) break; }
        vec3 bg = mix(uC1, uC3, vUv.y) * .35 + .62;                                      // светлый фон-градиент
        vec3 col = bg;
        if (hit) { vec3 n = nrm(ro + rd * t);
          vec3 base = mix(mix(uC0, uC2, n.y * .5 + .5), uC3, pow(1. - max(dot(n, -rd), 0.), 2.));
          float dif = max(dot(n, normalize(vec3(.5, .8, .6))), 0.);
          col = base * (.45 + .6 * dif) + pow(max(dot(reflect(rd, n), normalize(vec3(.5, .8, .6))), 0.), 24.) * .35; }
        gl_FragColor = vec4(col, 1.);
#include <colorspace_fragment>
      }`;
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({ uniforms, vertexShader: FULL_VS, fragmentShader: fs }));
  }
  mesh.frustumCulled = false; scene.add(mesh);
  const size = () => { const r = hero.getBoundingClientRect(); renderer.setSize(r.width, r.height, false);
    uniforms.uRes.value.set(r.width, r.height); if (camera.isPerspectiveCamera) { camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); } };
  size(); addEventListener('resize', () => { size(); renderer.render(scene, camera); });
  const timer = new THREE.Timer(); timer.connect(document);          // r183+: Timer вместо Clock
  const tick = () => { timer.update(); uniforms.uTime.value = timer.getElapsed(); renderer.render(scene, camera); };
  let visible = true;
  const update = () => { const run = visible && !document.hidden && !reduce.matches;
    renderer.setAnimationLoop(run ? tick : null); if (!run) renderer.render(scene, camera); };  // reduce: один кадр
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; update(); }).observe(hero);
  document.addEventListener('visibilitychange', update); reduce.addEventListener('change', update);
  uniforms.uTime.value = 12.3; renderer.render(scene, camera); update();
  const gl = renderer.getContext(), px = new Uint8Array(4);
  window.__bench = (n = 120) => { const t = []; for (let i = 0; i < n + 5; i++) { const t0 = performance.now(); uniforms.uTime.value += 1 / 60;
    renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); if (i >= 5) t.push(performance.now() - t0); }
    t.sort((a, b) => a - b); return { frames: n, ms_avg: +(t.reduce((a, b) => a + b, 0) / n).toFixed(2), ms_p95: +t[Math.floor(n * .95)].toFixed(2),
      px: [renderer.domElement.width, renderer.domElement.height] }; };
  window.__swatch = () => { renderer.render(scene, camera); const w = renderer.domElement.width, h = renderer.domElement.height;
    gl.readPixels(w >> 1, h >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return [px[0], px[1], px[2]]; };
  window.__info = { v: V, dpr: renderer.getPixelRatio(), canvas: [renderer.domElement.width, renderer.domElement.height],
    vertices: mesh.geometry.attributes.position.count, cs: OUT !== '' };
  window.__ready = true;
}
</script>
</body></html>
