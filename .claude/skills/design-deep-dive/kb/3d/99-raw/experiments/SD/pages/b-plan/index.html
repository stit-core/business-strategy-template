<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>plan-only</title>
<link rel="stylesheet" href="_shared/fonts.css"><link rel="stylesheet" href="_shared/marketing-tokens.css"><link rel="stylesheet" href="style.css">
<style>body{margin:0;background:#fff}.plan{width:1600px;border:0}.plan__cap{display:none}</style></head><body><figure class="plan" data-slot="hero-visual" aria-labelledby="plan-cap">
      <div class="plan__stage">
        <picture>
          <source type="image/avif" srcset="assets/iso-h1b-1600.avif">
          <source type="image/webp" srcset="assets/iso-h1b-1600.webp">
          <img class="plan__img" src="assets/iso-h1b-1600.webp" width="1600" height="1175" alt="Изометрический разрез той же квартиры 58 м²: стены срезаны на высоте 1,1 м, красными булавками отмечены семь дефектов — 1 трещина в стяжке гостиной, 2 продувает окно, 3 уклон пола 9 мм, 4 розетка без заземления, 5 течь под раковиной, 6 нет тяги в вентиляции кухни, 7 дверь не закрывается" fetchpriority="high" decoding="async">
        </picture>
        <ul class="plan__rooms" aria-hidden="true">
          <li style="--x:17.55%;--y:61.00%">Гостиная<span>17,8 м²</span></li>
          <li style="--x:42.72%;--y:38.36%">Спальня<span>13,4 м²</span></li>
          <li style="--x:41.16%;--y:66.11%">Прихожая<span>7,6 м²</span></li>
          <li style="--x:68.93%;--y:48.35%">Кухня<span>11,2 м²</span></li>
          <li style="--x:58.76%;--y:60.68%">С/у<span>4,1 м²</span></li>
        </ul>
        <ol class="plan__pins" aria-hidden="true" data-moment="hero-marks">
          <li style="--x:27.15%;--y:47.25%;--i:0">1</li>
          <li style="--x:14.78%;--y:41.61%;--i:1">2</li>
          <li style="--x:35.37%;--y:47.59%;--i:2">3</li>
          <li style="--x:58.29%;--y:19.37%;--i:3">4</li>
          <li style="--x:59.16%;--y:44.53%;--i:4">5</li>
          <li style="--x:80.35%;--y:36.71%;--i:5">6</li>
          <li style="--x:57.60%;--y:35.15%;--i:6">7</li>
        </ol>
      </div>
      <figcaption id="plan-cap" class="plan__cap">
        <span class="plan__cap-lead">Так выглядит первая страница акта:</span>
        <ol class="plan__list">
          <li><b>1</b> Трещина в&nbsp;стяжке гостиной</li>
          <li><b>2</b> Продувает окно: нет пароизоляции шва</li>
          <li><b>3</b> Уклон пола 9&nbsp;мм на&nbsp;2&nbsp;м</li>
          <li><b>4</b> Розетка без заземления</li>
        </ol>
      </figcaption>
    </figure></body></html>
