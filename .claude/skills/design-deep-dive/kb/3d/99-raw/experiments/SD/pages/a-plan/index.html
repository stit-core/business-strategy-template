<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>plan-only</title>
<link rel="stylesheet" href="_shared/fonts.css"><link rel="stylesheet" href="_shared/marketing-tokens.css"><link rel="stylesheet" href="style.css">
<style>body{margin:0;background:#fff}.plan{width:1600px;border:0}.plan__cap{display:none}</style></head><body><figure class="plan" data-slot="hero-visual" aria-labelledby="plan-cap">
      <svg class="plan__svg" viewBox="0 0 640 470" role="img" aria-labelledby="plan-title plan-desc">
        <title id="plan-title">План двухкомнатной квартиры 58 м² с отметками семи дефектов</title>
        <desc id="plan-desc">Отметки: 1 — трещина в стяжке гостиной, 2 — продувает окно, 3 — уклон пола 9 мм, 4 — розетка без заземления, 5 — течь под раковиной, 6 — нет тяги в вентиляции кухни, 7 — дверь не закрывается.</desc>
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--c-grid)" stroke-width="1"/></pattern>
        </defs>
        <rect x="0" y="0" width="640" height="470" fill="url(#grid)"/>
        <g class="plan__walls" fill="none" stroke="var(--c-ink)" stroke-linecap="square">
          <path d="M40 40H600V430H40Z" stroke-width="10"/>
          <path d="M300 40V250M300 300V430M40 260H130M180 260H300M300 190H430M480 190H600M430 300H600M430 300V430M370 300H430" stroke-width="5"/>
          <path d="M40 330H120" stroke-width="5"/>
        </g>
        <g class="plan__windows" stroke="var(--c-paper)" stroke-width="6">
          <path d="M90 40H230M370 40H540M600 230V280M90 430H230M470 430H560"/>
        </g>
        <g fill="none" stroke="var(--c-ink)" stroke-width="1.5">
          <path d="M90 36H230M90 44H230M370 36H540M370 44H540M596 230V280M604 230V280M90 426H230M90 434H230M470 426H560M470 434H560"/>
        </g>
        <g class="plan__doors" fill="none" stroke="var(--c-ink-2)" stroke-width="1.5">
          <path d="M130 260A50 50 0 0 1 180 210M180 260V210"/>
          <path d="M300 250A50 50 0 0 0 350 300M300 300H350"/>
          <path d="M430 190A50 50 0 0 1 480 240M480 190V240"/>
          <path d="M370 300A60 60 0 0 1 310 360"/>
        </g>
        <g class="plan__labels" fill="var(--c-ink-2)" font-size="15">
          <text x="70" y="120">Гостиная</text><text x="70" y="140" class="plan__area">17,8 м²</text>
          <text x="340" y="100">Спальня</text><text x="340" y="120" class="plan__area">13,4 м²</text>
          <text x="70" y="300">Прихожая</text><text x="70" y="320" class="plan__area">7,6 м²</text>
          <text x="455" y="350">Кухня</text><text x="455" y="370" class="plan__area">11,2 м²</text>
          <text x="315" y="385">С/у</text><text x="315" y="405" class="plan__area">4,1 м²</text>
        </g>
        <g class="plan__marks" data-moment="hero-marks">
          <g transform="translate(190 175)"><g class="mark" style="--i:0"><circle r="14"/><text y="5">1</text></g></g>
          <g transform="translate(160 62)"><g class="mark" style="--i:1"><circle r="14"/><text y="5">2</text></g></g>
          <g transform="translate(235 225)"><g class="mark" style="--i:2"><circle r="14"/><text y="5">3</text></g></g>
          <g transform="translate(575 150)"><g class="mark" style="--i:3"><circle r="14"/><text y="5">4</text></g></g>
          <g transform="translate(395 340)"><g class="mark" style="--i:4"><circle r="14"/><text y="5">5</text></g></g>
          <g transform="translate(575 405)"><g class="mark" style="--i:5"><circle r="14"/><text y="5">6</text></g></g>
          <g transform="translate(455 262)"><g class="mark" style="--i:6"><circle r="14"/><text y="5">7</text></g></g>
        </g>
      </svg>
      <figcaption id="plan-cap" class="plan__cap">
        <span class="plan__cap-lead">Так выглядит первая страница акта:</span>
        <ol class="plan__list">
          <li><b>1</b> Трещина в&nbsp;стяжке гостиной</li>
          <li><b>2</b> Продувает окно: нет пароизоляции шва</li>
          <li><b>3</b> Уклон пола 9&nbsp;мм на&nbsp;2&nbsp;м</li>
          <li><b>4</b> Розетка без заземления</li>
        </ol>
      </figcaption>
    </figure></body></html>
