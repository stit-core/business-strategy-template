# motion-spec v1 — рабочий пример L2 «Звено» (флагманский запуск продукта, «история продукта»). Рецепт creative 10-recipes/03-product-launch-l2.md.
# Демо: бренд и характеристики вымышлены; 3D — код (three 0.186.1).
# Проверка схемой: $DDD_HOME/venv/bin/python scripts/creative/spec_check.py spec <этот файл>
# Сверка сборки: python3 scripts/creative/motion_check.py index.html --level L2 --spec <этот файл>
motion_spec_version: "1.0"
id: zveno-launch
example: true
status: proposed
checked_at: "2026-09-25"
refs:
  page_plan: "../../recipes/03-product-launch-l2.recipe.yaml#/page_plan"
  tokens: ../../../../creative/04-visual-language/marketing-tokens.json
  effects: ../../../../creative/06-effects-catalog/effects.yaml
  block_treatments: ../../../../creative/09-ai-execution-evaluation/block-treatments.yaml
level: L2
executor: {target: any, harness: any, video_in: false}
page:
  thesis: "Движется только сам продукт и только по вашей прокрутке: рука разбирается на модули, собирается поворотом колец и открывает сустав; текст стоит."
  character: [precise, calm, confident]
  base: {duration_ms: 900, easing: {token: motion.marketing.easing.out-expo}}
  primitives: [fade-up, line-draw]
  lcp: {target: hero.hero-visual, entrance: none, note: "LCP — постер своего рендера (img, fetchpriority high); холст гаснет поверх после load + простоя, H1 не анимируется"}
  toggle: {required: true, attr: data-motion, states: [system, reduced, full], placement: sticky-header, remember: true}
  scroll: {smooth: false, tail_ms_max: 450, jacking: never}
  transitions: {kind: none}
  properties_allowed: [transform, opacity, stroke-dashoffset, "uniform:uScanC"]
  # Вариант A «код v3»: JS эффектов до взаимодействия — three 118 + сцена 14 + motion.js 1 = 133 КБ br (телефон и десктоп);
  # чанк поста (95 КБ, только десктоп) грузится после готовности сцены. Бюджет примера v2 был 130 (124,4 факт); уровень L2 — JS 3D ≤ 250/350.
  budget: {loops_in_view_max: 0, loops_in_view_max_mobile: 0, first_screen_scene_ms_max: 1200, js_kb_br_effects_max: 150, long_frames_pct_max: 2, cls_scroll_max: 0.1}
  never:
    - "плавная прокрутка (Lenis) и перехват колеса: сцены — на родной прокрутке, хвост только у сглаживания кадра ≤ 0,45 с"
    - "непрерывное «парение» или вращение в покое (cliche:floating-bob-loop): холст рисует только при прокрутке, указателе и одном пробуждении"
    - "текст, цифры и призыв в canvas (CRV-AL-04); прелоадер и ворота «Enter» (продукт, не кампания-мир)"
    - "свой курсор, частицы, хром и перелив (cliche:custom-cursor-follower, particle-swarm, chrome-liquid-metal, iridescent-holo)"
    - "эффекты в цене и форме (конверсия — L0)"
sections:
  - id: hero
    block: hero-media
    role: accent
    level: L2
    intent: "первый кадр — постер той же сцены; когда сцена готова, постер гаснет за 600 мс, рука один раз «просыпается» (1,2 с: поворот основания и кисти) и замирает"
    moments:
      - id: hero-copy-rise
        class: one-shot
        purpose: guide
        transition_type: entrance
        effect: "effect:hero-entrance-once"
        target: hero.subheadline
        selector_hint: ".hero__lead"
        stagger_targets: [hero.cta, hero.hero-proof]
        trigger: {type: load}
        model: time
        tracks:
          - {property: transform, from: "translateY(var(--mm-shift-reveal))", to: "none", unit_note: "--mm-shift-reveal = 16px"}
          - {property: opacity, from: 0.01, to: 1}
        duration: {token: motion.marketing.duration.reveal}
        easing: {token: motion.marketing.easing.out-expo}
        stagger: {each: {token: motion.marketing.stagger.group}, order: dom, max_items: 3, total_ms_max: 700}
        repeat: once
        interrupt: jump-to-end
        lcp: not-lcp
        reduce: {strategy: final-state, describe: "лид, кнопки и факты видны с первого кадра"}
        mobile: {strategy: same}
      # MS-05 (spec_check): у сцены два момента на одном холсте — скраб сюжета (scroll-linked) и одно «пробуждение» по времени
      # (one-shot); запись каталога держит оба: effects.yaml 3d-scene motion.kind: [scroll-linked, one-shot],
      # MS-05 принимает класс из списка — 0 предупреждений.
      - id: hero-wake
        class: one-shot
        purpose: personality
        transition_type: entrance
        effect: "effect:3d-scene"
        target: hero.fx-stage
        selector_hint: "canvas.stage"
        trigger: {type: load, delay_ms: 650}
        note: "старт — когда сцена готова (import scene.js после load + requestIdleCallback) и постер погас; только если страница вверху (t < 0,05)"
        model: time
        tracks:
          - {property: "uniform:uWake", from: 0, to: 0, unit_note: "позы суставов: j1 +0,22 рад, кисть −0,3 рад, поворот кисти +0,9 рад по sin(π·ease(u)) — туда и обратно за 1200 мс; не петля"}
        duration: {ms: 1200}
        easing: {token: motion.marketing.easing.in-out}
        repeat: once
        interrupt: jump-to-end
        lcp: not-lcp
        reduce: {strategy: static-poster, describe: "сцены нет: постер той же позы"}
        mobile: {strategy: same}
    storyboard:
      frames:
        - {id: hero-t0, at: {time_ms: 0}, viewport: desktop, describe: "Постер: тёмная студия, рука справа в рабочей позе, H1 слева в две-три строки, кнопка оранжевая", check: "H1 и постер в первом кадре"}
        - {id: hero-t3000, at: {time_ms: 3000}, viewport: desktop, describe: "Холст на месте постера, рука после «пробуждения» в той же позе; в покое ничего не движется", check: "движение в покое 0 %"}
    reduce: {strategy: static-poster, describe: "постер своего рендера; 0 байт three.js"}
    mobile: {strategy: same, describe: "рука в верхней части кадра (сдвиг кадра по Y), текст внизу; постер 600×1300"}
    budget: {js_kb_br: 1.6, loops_in_view: 0, load: eager}
    acceptance:
      - {id: hero-lcp, check: "LCP — постер (IMG), не canvas; H1 не выпал", tool: motion_check, gate: EG-PERF-08, metric: vitals.lcp_canvas, at: desktop}
      - {id: hero-idle6, check: "на 6-й секунде первый экран неподвижен (пробуждение закончилось)", tool: motion_check, gate: EG-A11Y-01, metric: derived.moving_6s_without_pause, at: desktop}
  - id: story-modules
    block: product-showcase
    role: peak
    level: L2
    intent: "рука выпрямляется, разносится на восемь модулей (сборочный чертёж), затем собирается снизу вверх — каждый модуль доворачивает кольцо-замок на 90° — и делает первое движение"
    scene:
      pin: sticky
      length_vh: 220
      length_vh_mobile: 180
      camera: track
      stations:
        # станции холста — долей at (шаги стоят по --at той же доли); якорь DOM не задаём: зонд станций мерит край цели, а цель —
        # fixed-холст (край «+450 px» в отчёте зонда — не про сцену); сверка — кадром станции
        - {id: s1, at: 0.42, describe: "8 модулей разнесены влево-вправо по высоте, камера отъехала; панель «Разберём, чтобы показать» на середине окна"}
        - {id: s2, at: 0.8, describe: "основание, J1, J2, L1 на месте, J3 садится с доворотом кольца, верхние ещё в воздухе"}
        - {id: s3, at: 0.99, describe: "рука собрана и повернулась в рабочую позу (изгиб боком к камере)"}
    moments:
      - id: modules-explode-assemble
        class: scroll-linked
        purpose: narrate
        transition_type: persistent
        effect: "effect:3d-scene"
        target: story-modules.fx-stage
        selector_hint: "canvas.stage"
        trigger: {type: scroll-scrub, subject: story-modules, range: {start: "contain 0%", end: "contain 100%"}}
        model: scrub
        tracks:
          - {property: "uniform:uStory", from: 1, to: 2, unit_note: "t сцены = 1 + прогресс секции; доли: выпрямление 0,06–0,2; разнос 0,16–0,34; станция 0,34–0,52; сборка модуля i: 0,52 + 0,04i … 0,64 + 0,04i, кольцо доворачивается в последней трети; первое движение 0,88–1,0"}
        easing: {none: true}
        scrub: {smoothing_s: 0.4, snap: none}
        interrupt: follow-input
        reduce: {strategy: stations, describe: "три картинки-станции своего рендера (разнесено, сборка, собран) в обычном потоке, 0 байт three.js"}
        mobile: {strategy: simplified, describe: "то же на холсте DPR ≤ 1,25, рука в верхней части кадра, сцена 280svh"}
    storyboard:
      frames:
        - {id: mod-s1, at: {station: s1}, viewport: desktop, describe: "Разнесённые модули справа от центра, панель шага слева", check: "видны все 8 модулей, ни один не обрезан"}
        - {id: mod-s3, at: {station: s3}, viewport: desktop, describe: "Собранная рука в рабочей позе", check: "в покое 0 % движения"}
    reduce: {strategy: stations, describe: "станции-картинки + тот же текст шагов"}
    mobile: {strategy: simplified, describe: "холст DPR 1,25, шаги — в нижней трети окна"}
    fallback: {no_js: "станции-картинки в потоке", unsupported: "нет WebGL — createScene бросает ошибку → класс gl-pending снят → станции-картинки"}
    budget: {js_kb_br: 125, loops_in_view: 0, long_frames_pct_max: 2, idle_motion_pct_s_max: 0, cls_scroll_max: 0.1, load: after-lcp}
    acceptance:
      - {id: mod-idle, check: "в паузах прокрутки холст не рисует (0 вызовов)", tool: motion_check, gate: EG-A11Y-16, metric: loops.under_text, at: desktop}
      - {id: mod-cls, check: "CLS при прокрутке ≤ 0,1 (sticky-холст, без pin-spacer)", tool: motion_check, gate: EG-PERF-02, metric: scroll.cls, at: desktop, threshold: 0.1}
      - {id: mod-loaf, check: "длинные кадры при прокрутке ≤ 2 % десктоп / ≤ 10 % телефон", tool: motion_check, gate: EG-PERF-01, metric: scroll.loaf_pct, at: desktop, threshold: 2}
  - id: story-inside
    block: feature-spotlight
    role: peak
    level: L2
    intent: "сустав крупно; оранжевая линия скана идёт сверху вниз и снимает верхнюю половину корпуса — видны обмотки мотора, зубчатое колесо редуктора, диск датчика; в конце слои расходятся вдоль оси"
    scene:
      pin: sticky
      length_vh: 160
      length_vh_mobile: 130
      camera: locked-iso
      stations:
        - {id: s4, at: 0.3, describe: "скан на середине корпуса, медь мотора видна"}
        - {id: s5, at: 0.64, describe: "верхняя половина снята, видны редуктор и датчик, слои начинают расходиться"}
        - {id: s6, at: 0.95, describe: "слои разведены вдоль оси"}
    moments:
      - id: inside-scan
        class: scroll-linked
        purpose: inform
        transition_type: persistent
        effect: "effect:3d-scene"
        target: story-inside.fx-stage
        selector_hint: "canvas.stage"
        trigger: {type: scroll-scrub, subject: story-inside, range: {start: "contain 0%", end: "contain 100%"}}
        model: scrub
        tracks:
          - {property: "uniform:uScanC", from: 0.26, to: -0.015, unit_note: "плоскость отсечения в системе сустава (нормаль −Y), кромка среза светится оранжевым в полосе 18 мм (onBeforeCompile); скан 0,12–0,72; разведение слоёв 0,74–0,98"}
        easing: {none: true}
        scrub: {smoothing_s: 0.4, snap: none}
        interrupt: follow-input
        reduce: {strategy: stations, describe: "две картинки-станции: скан наполовину и слои разведены"}
        mobile: {strategy: simplified, describe: "то же, сустав меньше (масштаб 1,7), шаги внизу"}
    reduce: {strategy: stations, describe: "станции-картинки + текст шагов"}
    mobile: {strategy: simplified, describe: "холст DPR 1,25"}
    fallback: {no_js: "станции-картинки", unsupported: "станции-картинки"}
    budget: {js_kb_br: 0, loops_in_view: 0, long_frames_pct_max: 2, idle_motion_pct_s_max: 0, cls_scroll_max: 0.1, load: after-lcp}
  - id: product-demo
    block: feature-spotlight
    role: accent
    level: L1
    intent: "интерфейс приложения собирается один раз при входе в вид: пять точек траектории выезжают по очереди, путь рисуется линией"
    moments:
      - id: app-build
        class: one-shot
        purpose: inform
        transition_type: entrance
        target: product-demo.screenshot
        selector_hint: ".app"
        trigger: {type: in-view, threshold: 0.2, once: true}
        model: time
        tracks:
          - {property: opacity, from: 0.01, to: 1}
          - {property: transform, from: "translateX(-10px)", to: "none"}
          - {property: stroke-dashoffset, from: 1, to: 0, unit_note: "путь pathLength=1, 900 мс после 200 мс"}
        duration: {token: motion.marketing.duration.reveal}
        easing: {token: motion.marketing.easing.out-expo}
        stagger: {each: {token: motion.marketing.stagger.group}, order: dom, max_items: 5, total_ms_max: 700}
        repeat: once
        interrupt: jump-to-end
        reduce: {strategy: final-state, describe: "точки и путь на месте"}
        mobile: {strategy: same}
    reduce: {strategy: final-state, describe: "интерфейс целиком"}
    mobile: {strategy: stacked, describe: "список точек над видом сверху"}
    budget: {js_kb_br: 0.3, loops_in_view: 0, load: eager}
open_questions:
  - "Моменты холста описаны через uniform:* (сцена сама интерполирует позы); motion_check сверяет их выборкой стилей canvas — нужна проверка станций зондом кадров под 3D."
  - "Сглаживание кадра 0,4 с — это не перехват прокрутки (scrollY родной), но хвост картинки; порог EG-PERF-03 меряет прокрутку, а не холст."
  - "MS-05 у hero.hero-wake (class one-shot ≠ motion.kind scroll-linked у effect:3d-scene): у 3D-сцены два класса моментов на одном холсте — скраб сюжета (scroll-linked) и одно пробуждение по времени (one-shot, 1,2 с; на 6-й секунде первый экран стоит — EG-A11Y-01 PASS); motion.kind у 3d-scene в effects.yaml задан списком, MS-05 берёт класс из списка — предупреждения нет."
