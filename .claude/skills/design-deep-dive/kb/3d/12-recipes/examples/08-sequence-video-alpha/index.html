<!doctype html>
<!-- HTML — [проверено] рецепт 08: вращение предрендером — VP9 с альфой, постер-кадр, reduce → пауза -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вращение предрендером — рецепт 08</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #f1eee9, #d9d4cc);
         font: 18px/1.5 system-ui, sans-serif; color: #1d1b18; }
  figure { margin: 0; text-align: center; }
  video { width: min(80vw, 512px); aspect-ratio: 1; display: block; }
</style></head><body>
<figure>
  <!-- VP9 с альфой: Chrome/Firefox/Edge; Safari — stacked-alpha HEVC + WebGL-склейка (F1 09/06 §1.2) или постер -->
  <video id="v" src="web/turn_vp9_alpha.webm" poster="web/seq/f_0001.webp" width="512" height="512"
         autoplay muted loop playsinline aria-label="Скульптура из тёмно-синей ленты медленно вращается"></video>
  <figcaption>Скульптура «Ink» — вращение 1 с, 24 кадра</figcaption>
</figure>
<script>
  const v = document.getElementById('v');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { v.removeAttribute('autoplay'); v.pause(); }
  v.addEventListener('playing', () => { window.__ready = true; }, { once: true });
  setTimeout(() => { window.__ready = true; }, 1500);
</script>
</body></html>
