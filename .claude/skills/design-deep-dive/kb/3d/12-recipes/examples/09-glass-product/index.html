<!doctype html>
<!-- three r186 — [проверено] рецепт 09: стекло transmission + volume; ?bg=scene (фон в canvas) | ?bg=css (прозрачный canvas) -->
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Флакон — стекло в three (рецепт 09)</title>
<style>
  body { margin: 0; background: #efe9e1; font: 18px/1.5 system-ui, sans-serif; color: #1d1b18; }
  .hero { position: relative; height: 100vh; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  h1 { position: absolute; left: 6vw; top: 6vh; margin: 0; font-size: clamp(28px, 4vw, 52px); z-index: 1; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/" } }</script>
</head><body>
<div class="hero"><h1>Ambre № 9</h1><canvas id="c" aria-hidden="true"></canvas></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const bgMode = new URLSearchParams(location.search).get('bg') || 'scene';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: bgMode === 'css' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.NeutralToneMapping;                     // пара к Blender «Khronos PBR Neutral»
renderer.transmissionResolutionScale = 0.5;                         // −20 % цены прохода пропускания (3d 09/04 §3)
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;   // металлу и стеклу нужно окружение
if (bgMode === 'scene') scene.background = new THREE.Color('#EFE9E1'); // фон В СЦЕНЕ — его видит проход пропускания
const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('glass.glb');
const root = gltf.scene; scene.add(root);
const box = new THREE.Box3().setFromObject(root.getObjectByName('Bottle_Glass') || root);
const c = box.getCenter(new THREE.Vector3()), r = box.getBoundingSphere(new THREE.Sphere()).radius;
const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 10);
const dist = r / Math.sin(THREE.MathUtils.degToRad(14)) * 1.25;
camera.position.set(c.x + dist * Math.sin(0.38), c.y + dist * 0.16, c.z + dist * Math.cos(0.38)); camera.lookAt(c);
function resize() { renderer.setSize(canvas.clientWidth, canvas.clientHeight, false); camera.aspect = canvas.clientWidth / canvas.clientHeight; camera.updateProjectionMatrix(); }
resize(); addEventListener('resize', () => { resize(); if (reduce) renderer.render(scene, camera); });
await renderer.compileAsync(scene, camera);
const timer = new THREE.Timer(); timer.connect(document);
let visible = true;
new IntersectionObserver((e) => { visible = e[0].isIntersecting; }).observe(canvas);
function loop(t) {
  timer.update(t);
  if (visible && !document.hidden) { root.rotation.y = Math.sin(timer.getElapsed() * 0.4) * 0.35; renderer.render(scene, camera); }
  requestAnimationFrame(loop);
}
renderer.render(scene, camera);
window.__ready = true;
if (!reduce) requestAnimationFrame(loop);
</script>
</body></html>
