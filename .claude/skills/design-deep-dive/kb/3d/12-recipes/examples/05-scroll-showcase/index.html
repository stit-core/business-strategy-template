<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кейс на прокрутке — рецепт 05</title>
<style>
  html, body { margin: 0; background: #f4f4f5; color: #18181b; font: 18px/1.5 system-ui, sans-serif; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #story { position: relative; height: 400vh; }          /* 3 экрана прокрутки = весь клип */
  .step { position: sticky; top: 0; height: 100vh; display: flex; align-items: flex-end; padding: 0 6vw 12vh; box-sizing: border-box; pointer-events: none; }
  .step p { max-width: 28ch; margin: 0; font-size: clamp(20px, 3vw, 34px); font-weight: 600; }
  header, footer { position: relative; padding: 20vh 6vw; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<header><h1>Кейс, который открывается прокруткой</h1></header>
<section id="story"><div class="step"><p id="caption">Крышка на петле, наушники поднимаются по очереди.</p></div></section>
<footer><p>Конец истории.</p></footer>
<script type="module">
// three r186 — [проверено] страница скраба по прокрутке (3d 07/03 §3.3) с ассетом рецепта 05: клип «Reveal» → action.time, damp; кадр по габариту
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.001, 10);

const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('case_reveal.glb');
scene.add(gltf.scene);
{ // кадр по габариту открытого состояния (кейс 6 см): центр и радиус → дистанция при FOV 30°
  const box = new THREE.Box3().setFromObject(gltf.scene), c = box.getCenter(new THREE.Vector3());
  const r = box.getBoundingSphere(new THREE.Sphere()).radius * 1.35, d = r / Math.sin(THREE.MathUtils.degToRad(15));
  camera.position.set(c.x + d * 0.5, c.y + d * 0.35, c.z + d * 0.8); camera.lookAt(c.x, c.y + r * 0.25, c.z); }
const mixer = new THREE.AnimationMixer(gltf.scene);
const clip = THREE.AnimationClip.findByName(gltf.animations, 'Reveal');   // clipAction('Reveal') на gltf.scene вернёт null
const action = mixer.clipAction(clip);
action.play();                                                            // один раз; время дальше задаём сами

const story = document.getElementById('story');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const timer = new THREE.Timer(); timer.connect(document);                 // r183+: Timer вместо Clock
let target = 0, current = 0, running = false;

function progress() {                                                     // 0…1 внутри секции истории
  const r = story.getBoundingClientRect();
  return THREE.MathUtils.clamp(-r.top / (r.height - innerHeight), 0, 1);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
function draw() {
  action.time = current * clip.duration;                                  // не mixer.setTime: он заворачивает конец в 0
  mixer.update(0);
  renderer.render(scene, camera);
}
function tick(ts) {
  timer.update(ts);
  const dt = Math.min(timer.getDelta(), 0.1);
  target = progress();
  // reduced motion: без инерции и промежуточных поз — сразу «закрыто» или «открыто»
  current = reduce.matches ? (target < 0.5 ? 0 : 1) : THREE.MathUtils.damp(current, target, 10, dt);
  draw();
  window.__state = {target: +target.toFixed(4), current: +current.toFixed(4), time: +action.time.toFixed(4)};
  if (Math.abs(current - target) > 1e-4) requestAnimationFrame(tick);     // рендер только пока догоняем
  else running = false;
}
function wake() { if (!running) { running = true; requestAnimationFrame(tick); } }
addEventListener('scroll', wake, {passive: true});
addEventListener('resize', () => { resize(); wake(); });
reduce.addEventListener('change', wake);
resize(); target = current = progress(); draw();
window.__ready = true;
</script>
</body>
</html>
