  - id: SG-CONTENT-01
    name: "Каждое число, логотип, отзыв, награда — со ссылкой на fact: в page-plan"
    site_checklist: [SITE-PRF-01, SITE-PRE-18]
    phase: build
    method: {tool: plan, field: "slots data → fact:<id> (site_validate.py)"}
    threshold: {B: "доказательство без факта"}
    owner: "05/02; 08/02; 09/02"
    status: v1
  - id: SG-CONTENT-02
    name: "Форма работает: успешная отправка показывает успех и шлёт событие цели"
    site_checklist: [SITE-FRM-01, SITE-TRK-01]
    phase: build
    method: {tool: "свой стенд + events.yaml", field: "submit → состояние успеха → событие lead_submit_success в тестовый счётчик"}
    threshold: {B: "успех не показан | событие не отправлено или отправлено при ошибке валидации"}
    owner: "05/01; 07/04 §2"
    status: v1
  - id: SG-CONTENT-03
    name: "События плана страницы размечены и срабатывают (events.yaml)"
    site_checklist: [SITE-TRK-02]
    phase: build
    method: {tool: "свой стенд", field: "page-plan events[].event → вызовы ym reachGoal / gtag event в журнале стенда"}
    threshold: {S: "событие плана не срабатывает | имя не из events.yaml"}
    owner: "07/04 §2; page-plan"
    status: v1
  - id: SG-CONTENT-04
    name: "0 ошибок консоли и битых ресурсов"
    site_checklist: [SITE-OUT-05]
    phase: build
    method: {tool: "accept | probe", field: "accept.console (error), probe.console_errors, broken_images"}
    threshold: {S: "> 0"}
    owner: "09/02"
    status: v1
    maps_to: ["3d WEB-07 (Б)"]


  # ------------------------------------------------------------ SEO — уровень страницы и сайта (по head-kit.yaml 1.0)
  - id: SG-SEO-05
    name: "Open Graph: og:image абсолютный и в первом 1 МБ HTML; og:title, og:description"
    site_checklist: [SITE-SEO-08, SITE-SEO-06]
    phase: build
    method: {tool: geo, field: "флаги og-after-1mb, no-og-image, og-image-relative"}
    threshold: {S: "OG после 1 МБ HTML", D: "нет og:image | og:image относительный"}
    owner: "head-kit.yaml (hk-og)"
    status: v1
  - id: SG-SEO-06
    name: "Sitemap: 200 и XML, объявлен в robots.txt, только абсолютные канонические URL с ответом 200"
    site_checklist: [SITE-SEO-09]
    scope: site
    phase: build
    method: {tool: "ia | geo", field: "ia.sitemap.urls, ia.robots.sitemaps; head-kit site_checks.hk-site-sitemap"}
    threshold: {S: "sitemap нет или не объявлен | в sitemap неканонические, 3xx или 4xx URL"}
    owner: "head-kit.yaml (hk-site-sitemap); 06/02"
    status: v1
  - id: SG-SEO-07
    name: "Поиск по сайту, фильтры, календари закрыты: /search?q=<случайное> — Disallow одним правилом на шаблон или noindex, не 5xx"
    site_checklist: [SITE-SEO-18]
    scope: site
    phase: build
    method: {tool: "curl + geo", field: "ответ и robots для /search?q=<случайное>; crawlers.yaml rt-infinite-spaces"}
    threshold: {S: "страница поиска открыта для индексации | 5xx"}
    owner: "head-kit.yaml (hk-site-search-pages); crawlers.yaml rt-infinite-spaces"
    status: v1
  - id: SG-SEO-08
    name: "hreflang (при языковых версиях): в <head> каждой версии, взаимно, с x-default"
    site_checklist: [SITE-SEO-10, SITE-NAV-19]
    scope: site
    phase: build
    method: {tool: "ia | geo", field: "ia.summary.hreflang_pages, lang_switch; head-kit site_checks.hk-site-hreflang"}
    threshold: {S: "есть переключатель языка, нет hreflang | hreflang невзаимный"}
    owner: "head-kit.yaml (hk-site-hreflang); 06/02 §5"
    status: v1

  # ------------------------------------------------------------ NAV — навигация в HTML (по 06/02 и head-kit site_checks)
  - id: SG-NAV-01
    name: "Меню шапки (включая панели мега-меню) и телефон — ссылками <a href> в HTML сервера на каждом шаблоне"
    site_checklist: [SITE-NAV-16, SITE-OUT-13]
    phase: build
    method: {tool: "ia | anatomy", field: "ia.summary.home_header_items, header_phone (сырой HTML); anatomy header_nav_links"}
    threshold: {S: "пункты меню или телефон только после JS (ia не находит, браузер находит)"}
    owner: "06/02 §3.6; head-kit.yaml (hk-access-links, hk-site-nav-in-html)"
    status: v1
    note: "меню, которое вставляет скрипт, видно только браузерному замеру; ia_probe читает HTTP без JS"
  - id: SG-NAV-02
    name: "Крошки: только на страницах глубины ≥ 2; BreadcrumbList = видимым крошкам"
    site_checklist: [SITE-NAV-10]
    scope: site
    phase: build
    method: {tool: ia, field: "ia.summary.crumbs_inner_pct, breadcrumb_ld_pct"}
    threshold: {D: "разметка без видимых крошек или наоборот | крошки на посадочной"}
    owner: "06/02 §2.1; head-kit.yaml (hk-site-breadcrumbs)"
    status: v1
    limits: {crumbs_vs_markup_pct: 50}   # расхождение долей страниц с видимыми крошками и с разметкой, п.п.

  # ------------------------------------------------------------ MOB — телефон (по замеру живых страниц)
  - id: SG-MOB-01
    name: "Нет горизонтальной прокрутки на телефоне (390 и 360 px)"
    site_checklist: [SITE-MOB-01]
    phase: build
    method: {tool: "accept; anatomy", field: "accept acceptance[].overflow_px телефонных строк (device: mobile) на ширинах приёмки — page_accept --acceptance; без них — mobile summary.layout_zoomed (область телефона расширена), summary.overflow_x_px (ширина прокрутки минус ширина экрана) анатомии телефона лаборатории, с пометкой"}
    threshold: {B: "вылет > limits.overflow_px на телефонной ширине приёмки; без строк acceptance[] — layout_zoomed анатомии: страница шире экрана, человек прокручивает вбок (или overflow_x_px > 2 при неизвестном layout_zoomed)", D: "анатомия: overflow_x_px > 2 без расширения области — переполнение скрыто overflow-x (проверить свайпом на iOS)"}
    owner: "09/02; ux UX-MOB-01"
    status: v1
    limits: {overflow_px: 2}   # ширина прокрутки минус ширина экрана
    note: "примеры: en-headspace — дорожка карусели 1 307 px под html, body {overflow-x: hidden}, область не расширена → D; ru-azbukaokon — область 457 > 412 px → B"
    maps_to: ["замер живых страниц: 4 из 51 страницы"]
  - id: SG-MOB-02
    name: "Навигация на телефоне есть: кнопка меню или ≥ 2 видимые ссылки"
    site_checklist: [SITE-MOB-02, SITE-NAV-06]
    phase: build
    method: {tool: anatomy, field: "mobile summary.burger, header_nav_links"}
    threshold: {S: "нет кнопки меню и < 2 ссылок (подтвердить кадром; на одноэкранной арт-странице — не применять)"}
    owner: "09/02"
    status: v1
    note: "распознавание бургера в замере живых страниц — нижняя граница: у ≈ 40 % страниц меню видно, его нет или кнопка не распознана; B — после подтверждения глазами"

  # ------------------------------------------------------------ CONTENT — честность и работоспособность
  - id: SG-CONTENT-05
    name: "Нет заглушек и остатков шаблона: lorem, [PLACEHOLDER], «Feature 1», «John Doe», «fictional», example.com, href=\"#\" у призывов"
    site_checklist: [SITE-OUT-03, SITE-PRF-02]
    phase: build
    method: {tool: html, field: "текст и ссылки сохранённого HTML (page_gates.py --html)"}
    threshold: {B: "любая заглушка в видимом тексте | призыв с href=\"#\" без обработчика формы"}
    owner: "09/02; text COPY-C-04"
    status: v1
  - id: SG-CONTENT-06
    name: "Автоматические маркеры «ИИ-лендинга» (ai-landing-markers.yaml, способ DOM/SCR): нет маркеров серьёзности B"
    site_checklist: [SITE-OUT-08]
    phase: build
    method: {tool: "html + anatomy", field: "маркеры с auto: true (виджет фальшивой активности, таймер со сбросом, счётчик с 0 в HTML, кнопки-div, 100vh у hero)"}
    threshold: {B: "маркер серьёзности B", S: "маркер серьёзности S без разрешения брифа (allow)"}
    owner: "09-ai-generation-evaluation/ai-landing-markers.yaml"
    status: v1
  - id: SG-CONTENT-07
    name: "Первый экран по политике плана: при offer-cta — ≥ 1 главный призыв в первом экране десктопа и телефона (с баннером cookie, без кликов)"
    site_checklist: [SITE-STR-06, SITE-MOB-04]
    phase: build
    method: {tool: "anatomy + plan", field: "summary.cta_first_screen по устройствам; plan page.first_screen_policy"}
    threshold: {B: "offer-cta и 0 призывов в первом экране на обоих устройствах", S: "offer-cta и 0 призывов на одном устройстве | poster без призыва в шапке"}
    owner: "09/02; 03/03 §2.2"
    status: v1
    note: "M: ≥ 1 призыв в первом экране у 87 % живых страниц; распознавание призыва — эвристика, провал подтверждать кадром"

verdict:
  blocked: "есть хотя бы один провал уровня B (исключение x-gate-exception для B не действует)"
  accepted_with_notes: "нет B; есть S — каждое S исправлено или записано в page-plan x-gate-exception"
  accepted: "нет B и S"
exceptions:
  field: "page-plan page.x-gate-exception[{id: SG-*, why, who, until}] (схема page-plan v1)"
  rule: "исключение снимает S до даты until (или до следующей версии страницы); B исключением не снимается; просроченное исключение — снова S"
scope:
  page: "по умолчанию — одна страница × устройство"
  site: "строки scope: site проверяются один раз на сайт (ia_probe.py, sitemap, поиск, hreflang, крошки)"
