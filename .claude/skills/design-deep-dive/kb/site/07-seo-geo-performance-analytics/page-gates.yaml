# page-gates.yaml — единые ворота страницы (site) · v1
# Иерархия (контракт v2 §2): ворота страницы (site) выше ворот эффектов (creative) и ассетов (ai-media, 3d);
# ворота ассета не блокируют страницу за чужие байты. Пороги по профилю — budgets.yaml; автопроверка — page_gates.py v1.2.
# Строки: PERF, WEIGHT — 07/03; SEO, GEO — по head-kit.yaml 1.0; A11Y, LEGAL — 08-legal-trust-a11y; CONTENT, NAV, MOB — 09-ai-generation-evaluation.
# Связь с чек-листом: поле site_checklist — пункты 09-ai-generation-evaluation/02-site-checklist.md (SITE-*).
version: "1.4"
checked: 2026-09-24
status: released
owner: "site · 07-seo-geo-performance-analytics"
calibration: "пороги PERF и WEIGHT — лаборатория и замер живых страниц (site 02/03), без поля CrUX; строки CONTENT, NAV, MOB — самопроверка и смоук-прогон; живая фаза — пересмотр по полю"
severity:
  B: "блокер: страница не принимается, пока не исправлено"
  S: "серьёзно: исправить или записать обоснование в page-plan (x-gate-exception: {id, why, who})"
  D: "желательно: улучшение, не мешает приёмке"
phases:
  build: "приёмка собранной страницы (лаборатория, DOM, код)"
  live: "живая страница (поле CrUX или RUM, аналитика) — с 4-й недели трафика"
methods:
  anatomy: "../../scripts/site/page_anatomy.py URL OUT [--mobile] --inp → anatomy_<device>.json (поле JSON в `field`)"
  accept: "../../scripts/ai-media/page_accept.py PAGE --out DIR --budget-profile <page_type>@L<n> [--mobile --throttle] [--contrast …] → accept_<mode>.json"
  motion: "../../scripts/creative/motion_check.py PAGE --level L<n> --page-type <page_type> --out DIR → results.json, gates.json (петли всей страницы, вспышки, reduce записью; ворота эффектов)"
  probe: "../../scripts/3d/site_probe.py URL OUT (страницы с 3D) → gate_check.py --json (ворота 3D 3d; метрики страницы — зеркало)"
  gates: "../../scripts/site/page_gates.py — сводит JSON по профилю budgets.yaml и выдаёт PASS / S / B; метрики страницы, измеренные соседями (motion, probe), — зеркалом D"
  geo: "../../scripts/site/geo_probe.py"
  axe: "axe-core (I; сырой сигнал)"
  plan: "проверка page-plan и site-brief (site_validate.py); page_gates.py --plan читает budget_profile, jurisdiction, first_screen_policy, seo.indexable, x-gate-exception; --brief — юрисдикцию без плана, ai_bots_policy, уровень сайта, долю горячего мобильного трафика, ценовую полосу, рекламу Google (brief_params)"
  ia: "../../scripts/site/ia_probe.py URL --out DIR → ia.json: 404 на шаблонах, меню в HTML, sitemap, hreflang, крошки — строки scope: site"
  html: "сохранённый HTML страницы (curl или page_anatomy) — скан заглушек и маркеров ИИ-лендинга (page_gates.py --html)"
  human: "человек или судья (site 09/03)"
  rum: "RUM web-vitals или CrUX (поле)"

gates:
  # ------------------------------------------------------------ PERF — исходы скорости
  - id: SG-PERF-01
    name: "LCP телефона в лаборатории (CPU×4, 1,6 Мбит/с, RTT 150 мс)"
    site_checklist: [SITE-PERF-01]
    phase: build
    method: {tool: accept, field: "lcp.t (режим --mobile --throttle), медиана 3 прогонов"}
    threshold: {S: "profile.outcome.lcp_ms_lab.mobile.goal", B: "profile.outcome.lcp_ms_lab.mobile.poor"}
    owner: "07/03 §2.1"
    status: v1
    maps_to: ["page_accept --budget-profile: LCP при --throttle > цели профиля = WARN, > плохо = FAIL", "3d gate_check: LCP страницы — зеркало D", "ux AC-PRF-01"]
  - id: SG-PERF-02
    name: "LCP десктопа в лаборатории"
    site_checklist: [SITE-PERF-02]
    phase: build
    method: {tool: accept, field: "lcp.t (десктоп 1440×900), медиана 3 прогонов"}
    threshold: {S: "profile.outcome.lcp_ms_lab.desktop.goal", B: "profile.outcome.lcp_ms_lab.desktop.poor"}
    owner: "07/03 §2.1"
    status: v1
    maps_to: ["3d WEB-01: блокер ворот 3D — только LCP-элемент canvas; LCP страницы в отчёте gate_check.py — зеркало D этой строки; 1 000 мс — цель эталона 3d, не порог страницы"]
  - id: SG-PERF-03
    name: "CLS в лаборатории (загрузка и прокрутка всей страницы)"
    site_checklist: [SITE-PERF-03]
    phase: build
    method: {tool: anatomy, field: "fin.wv_cls — web-vitals CLS (окно сессии) после прокрутки колесом до конца страницы, оба устройства; нет fin.wv_cls — summary.cls_session (сумма всех сдвигов, верхняя оценка)"}
    threshold: {S: "profile.outcome.cls_lab.goal", B: "profile.outcome.cls_lab.poor"}
    owner: "07/03 §2.3"
    status: v1
    note: "сумма сдвигов завышала CLS прокрутки (ru-azbukaokon, телефон — 0,42 против 0,15 по web-vitals). Мерить прокруткой, а не только после загрузки: закрепление pin ScrollTrigger через position: fixed даёт CLS при прокрутке 1,6–2,0, position: sticky и pinType: 'transform' — 0, anticipatePin не помогает; колесо не считается «недавним вводом»; CLS «после загрузки» (page_accept, Lighthouse) этого не видит"
    maps_to: ["page_accept: CLS > цели профиля = WARN, > плохо = FAIL (как S и B здесь)", "3d WEB-02: CLS страницы в gate_check.py — зеркало D", "ux AC-PRF-03"]
  - id: SG-PERF-04
    name: "INP по сценарию (меню, CTA, аккордеон, фокус в поле + нажатие во время загрузки)"
    site_checklist: [SITE-PERF-04]
    phase: build
    method: {tool: anatomy, field: "summary.inp_wv_ms | summary.inp_lab_ms (--inp)"}
    threshold: {S: "profile.outcome.inp_ms_lab_scenario.goal", B: "profile.outcome.inp_ms_lab_scenario.poor"}
    owner: "07/03 §2.2"
    status: v1
    note: "сценарий после загрузки занижает INP (M: 0 из 111 прогонов > 200 мс); вместе с SG-PERF-05"
    maps_to: ["ux AC-PRF-02, AC-PRF-04 (реакция ≤ 100 мс — D)"]
  - id: SG-PERF-05
    name: "TBT (прокси INP): телефон CPU×4, десктоп"
    site_checklist: [SITE-PERF-04]
    phase: build
    method: {tool: anatomy, field: "summary.tbt_ms (до прокрутки)"}
    threshold: {S: "profile.outcome.tbt_ms_lab.<device>.goal"}
    owner: "07/03 §2.2"
    status: v1
    maps_to: ["3d WEB-03 (вклад 3D ≤ 300/150 — у 3d) и §8 (страница ≤ 600 CPU×4)", "creative ambition-levels tbt_ms_lab"]
  - id: SG-PERF-06
    name: "LCP-элемент: есть, не canvas, H1 или картинка/постер из исходного HTML; LCP-картинка без lazy"
    site_checklist: [SITE-PERF-05]
    phase: build
    method: {tool: "accept + anatomy + html", field: "lcp.tag, lcp.lazy, lcp.fetchpriority (accept); pre.lcp[] и fin.lcp[] (tag, text, size), dom.headings.h1_first_screen (anatomy); сырой HTML и CSS (--html, --css): у H1 и 4 ближайших предков — opacity: 0, visibility: hidden, классы opacity-0 и invisible, классы, которые CSS прячет (правило opacity: 0 или анимация из @keyframes с opacity: 0), скрипт разбивки строк с маской; opacity 0 < x < 0,1 и clip-path"}
    threshold: {B: "LCP нет | LCP — canvas | LCP-картинка с loading=lazy", S: "нет fetchpriority=high у LCP-картинки | LCP-ресурс не находим в HTML (data-src, JS, CSS-фон без preload) | H1 первого экрана выпал из LCP: не кандидат, итоговый LCP — другой текст (лид, H2), и в HTML или CSS есть признак невидимого первого кадра (opacity: 0, маска строк, скрытие скриптом)", D: "H1 первого экрана не кандидат LCP, итоговый LCP — текст, признаков в HTML нет (проверить появление H1; лид может быть больше H1 по площади) | H1 — кандидат, но проявляется из opacity 0 < x < 0,1 или clip-path: время LCP раньше видимости (допустимо при раскрытии ≤ 800 мс)"}
    owner: "07/03 §2.1; ai-media 10/01 §4"
    status: v1
    limits: {opacity_near_zero: 0.1}   # H1 из opacity 0 < x < 0,1 — «почти невидим»: кандидат LCP, но время LCP раньше показа
    note: "Chromium 153, 9 вариантов: H1 из opacity: 0, за маской строк (SplitText mask: lines) или скрытый скриптом кандидатом LCP не становится — LCP уходит на лид в 5 раз меньше, поле CrUX (его собирает Chrome) получает время мелкого элемента; WebKit считает H1 по моменту показа; честно — только transform. Замер: Framer (appear, opacity 0.001) — D на обоих устройствах; Lovable, телефон — D (LCP — H2, признаков нет); Durable — H1 в обёртке opacity-0, но итоговый LCP — картинка: метрику не искажает, PASS"
    maps_to: ["page_accept: LCP нет = FAIL, lazy = FAIL, без fetchpriority = WARN", "3d WEB-01 (не canvas)"]
  - id: SG-PERF-16
    name: "Видео первого экрана и LCP: LCP-элемент hero — не VIDEO без постера; постер ≥ 0,05 бит на отображаемый пиксель и не меньше видео"
    site_checklist: [SITE-PERF-13, SITE-PERF-05]
    phase: build
    method: {tool: "accept + html", field: "lcp.tag (VIDEO — LCP стал кадр ролика); media_first[] page_accept: у <video> первого экрана — атрибут poster, байты постера × 8 / видимая площадь в CSS px (энтропия Chromium), cover_share — площадь постера (poster у видео, картинка поверх видео или холста 3D) к площади медиа"}
    threshold: {S: "LCP первого экрана — VIDEO | у видео первого экрана нет poster | постер < limits.poster_bpp_min бит на отображаемый пиксель (гладкий градиент: Chromium не считает его LCP, LCP ждёт загрузку ролика) | площадь постера меньше площади видео или холста, который его сменяет (cover_share < limits.poster_area_min): LCP уходит к кадру ролика"}
    limits: {poster_bpp_min: 0.05, poster_area_min: 1.0}
    owner: "07/03 §2.1; creative 06-effects-catalog/02 §3.2; ai-media 10-web-integration/01 §4.2"
    status: v1
    note: "creative: постер AVIF 2 334 Б 1280×720 (0,020 бит/px) — LCP = VIDEO; ai-media: 0,024–0,038 бит/px не кандидат, 0,0505 — кандидат [проверено]; 3d: постер на строку меньше видео — LCP 4 656 мс (VIDEO), на 1 px шире — 596 мс [проверено]. Постер ≥ 0,05 бит/px и не меньше видео — или LCP — H1 (видео не больше текста по площади). Автопроверка — page_gates.py по отчёту page_accept.py"
  - id: SG-PERF-07
    name: "Поле p75 (живая страница): LCP, INP, CLS по телефону и десктопу"
    site_checklist: [SITE-PERF-01, SITE-PERF-03, SITE-PERF-04]
    phase: live
    method: {tool: rum, field: "p75 за 28 дней, сегменты mobile/desktop"}
    threshold: {S: "> goal (2 500 мс / 200 мс / 0,1)", B: "> poor (4 000 мс / 500 мс / 0,25)"}
    owner: "07/03 §2, §7"
    status: v1
    maps_to: ["ux AC-PRF-01…03 (p75 раздельно)"]
  - id: SG-PERF-08
    name: "Сторонние скрипты не в критическом пути"
    site_checklist: [SITE-PERF-07]
    phase: build
    method: {tool: "anatomy + код", field: "синхронные сторонние <script> в <head>; порядок тегов"}
    threshold: {S: "синхронный сторонний скрипт в <head> (кроме крошечного inline-кода согласия) | аналитика не async/defer"}
    owner: "07/03 §5.1"
    status: v1
  - id: SG-PERF-09
    name: "Тяжёлые виджеты — по видимости или по нажатию (карты, чат, запись, видео, отзывы-виджеты, соцсети)"
    site_checklist: [SITE-PERF-06]
    phase: build
    method: {tool: "anatomy", field: "network.third_party (категории chat, maps, video, booking) до первого ввода"}
    threshold: {S: "виджет грузится до ввода и до видимости своей секции"}
    owner: "07/03 §5.2; 04-blocks/blocks.yaml (слоты виджетов)"
    status: v1
  - id: SG-PERF-10
    name: "Баннер cookie (CMP) не портит скорость: async, прямо в HTML, без сдвига, «Принять» без долгой задачи"
    site_checklist: [SITE-PERF-08]
    phase: build
    method: {tool: "anatomy + accept", field: "cmp.*, CLS до и после появления, TBT/INP клика по кнопке баннера (свой стенд)"}
    threshold: {S: "баннер сдвигает содержимое (CLS) | скрипт CMP синхронный или через менеджер тегов без причины | клик «Принять» > 200 мс"}
    owner: "07/03 §5.3; право баннера — 08/01"
    status: v1
    maps_to: ["ux UX-OVL-02, AC-SCF-15 (исключение для обязательного баннера)"]
  - id: SG-PERF-11
    name: "A/B без скрытия страницы (anti-flicker) и без задержки LCP"
    site_checklist: [SITE-PERF-09]
    phase: build
    method: {tool: "код + accept", field: "стили скрытия body/html до решения клиентского A/B; LCP с тестом и без"}
    threshold: {S: "страница скрыта клиентским A/B до выбора варианта | LCP с тестом хуже, чем без, > 10 %"}
    owner: "07/04 §5.6; web.dev Optimize LCP (элемент скрыт библиотекой A/B)"
    status: v1
  - id: SG-PERF-12
    name: "Кэш CDN не ломается метками рекламы; редиректов от объявления ≤ 1"
    site_checklist: [SITE-PERF-14]
    phase: build
    method: {tool: "curl", field: "Cache-Control, ключ кэша при ?utm_*, gclid, yclid, fbclid; цепочка редиректов посадочного URL"}
    threshold: {S: "метки рекламы дают промах кэша | > 1 редиректа"}
    owner: "07/03 §5.4; web.dev Optimize LCP (TTFB)"
    status: v1
  - id: SG-PERF-13
    name: "Шрифты: текст виден до загрузки; 1–2 ключевых шрифта с preload"
    site_checklist: [SITE-PERF-10]
    phase: build
    method: {tool: "код", field: "@font-face font-display; <link rel=preload as=font>"}
    threshold: {S: "font-display auto|block у текстовых шрифтов", D: "нет preload шрифта первого экрана"}
    owner: "07/03 §2.1"
    status: v1
  - id: SG-PERF-14
    name: "Медиа с размерами (width/height или aspect-ratio); место под встраивания зарезервировано"
    site_checklist: [SITE-PERF-11]
    phase: build
    method: {tool: accept, field: "img без width/height"}
    threshold: {S: "есть картинка или iframe первого экрана без размеров"}
    owner: "07/03 §2.3; ai-media 10/04 §3.2"
    status: v1
    maps_to: ["page_accept: без width/height = WARN"]
  - id: SG-PERF-15
    name: "bfcache: нет unload/beforeunload; посадочная без Cache-Control: no-store"
    site_checklist: []
    phase: build
    method: {tool: "код + curl"}
    threshold: {D: "есть unload | no-store на публичной посадочной"}
    owner: "07/03 §2.4"
    status: v1

  # ------------------------------------------------------------ WEIGHT — вес по профилю (предупреждения)
  - id: SG-WEIGHT-01
    name: "Первый экран (load + 4–6 с без действий, с видео)"
    site_checklist: [SITE-PERF-12, SITE-PERF-13]
    phase: build
    method: {tool: "anatomy | accept", field: "first_screen.kb (page_anatomy) | no_preference.first_screen_total_kb (page_accept без --throttle: вес — прогон без замедления сети, budgets.yaml conditions.lab_weight)"}
    threshold: {S: "profile.weight.first_screen_kb.<device>"}
    owner: "07/03 §3"
    status: v1
    maps_to: ["page_accept --budget-profile: выше профиля = WARN (как S здесь)", "motion_check EG-WEIGHT-08 — зеркало D", "ai-media 01/01 §7"]
  - id: SG-WEIGHT-02
    name: "Сессия без кликов (прокрутка до конца)"
    site_checklist: [SITE-PERF-12]
    phase: build
    method: {tool: anatomy, field: "network.session_kb"}
    threshold: {S: "profile.weight.session_kb.<device>"}
    owner: "07/03 §3"
    status: v1
    maps_to: ["3d gate_check: вес страницы — зеркало D, блокер ворот 3D — доля 3D (WEB-04, SG-WEIGHT-08)", "motion_check EG-WEIGHT-09 — зеркало D"]
  - id: SG-WEIGHT-03
    name: "JS первого экрана (все источники)"
    site_checklist: [SITE-PERF-12]
    phase: build
    method: {tool: anatomy, field: "first_screen.by_type_kb.script"}
    threshold: {S: "profile.weight.js_first_screen_kb.<device>"}
    owner: "07/03 §3"
    status: v1
  - id: SG-WEIGHT-04
    name: "Шрифты за сессию"
    site_checklist: [SITE-PERF-12]
    phase: build
    method: {tool: anatomy, field: "network.by_type_kb.font"}
    threshold: {S: "profile.weight.fonts_kb.<device>"}
    owner: "07/03 §3"
    status: v1
  - id: SG-WEIGHT-05
    name: "Сторонние домены до первого ввода"
    site_checklist: [SITE-PERF-12]
    phase: build
    method: {tool: anatomy, field: "network.third_party[].first_t < t первого ввода"}
    threshold: {S: "profile.weight.third_party_origins_before_input.max"}
    owner: "07/03 §5"
    status: v1
  - id: SG-WEIGHT-06
    name: "Сторонние байты первого экрана"
    site_checklist: [SITE-PERF-12]
    phase: build
    method: {tool: anatomy, field: "сумма network.third_party[].kb с first_t ≤ окна первого экрана"}
    threshold: {S: "profile.weight.third_party_first_screen_kb.max"}
    owner: "07/03 §5"
    status: v1
  - id: SG-WEIGHT-07
    name: "HTML по сети и встроенные data:-картинки"
    site_checklist: [SITE-PERF-15]
    phase: build
    method: {tool: "anatomy + curl", field: "nav.html_kb; сумма data:image в HTML/CSS"}
    threshold: {S: "html_transfer_kb > 150 | inline_data_uri_kb > 10"}
    owner: "07/03 §3; [V:kype1JQbrks 12:26]"
    status: v1
  - id: SG-WEIGHT-08
    name: "Доля 3D и видео — ворота соседей, не страницы"
    site_checklist: [SITE-PERF-16]
    phase: build
    method: {tool: "probe (3d) через gate_check.py --json, accept (ai-media)", field: "строки ворот 3D без зеркала (WEB-01, -03…-07, -10) со статусом FAIL"}
    threshold: {D: "нарушение WEB-04/WEB-06 3d или норм ai-media — исправляет владелец ассета; страница блокируется только исходами SG-PERF"}
    owner: "07/03 §6; контракт v2 §2 (иерархия ворот)"
    status: v1
  - id: SG-WEIGHT-09
    name: "Видео первого экрана без действия пользователя — отдельной цифрой"
    site_checklist: [SITE-PERF-13, SITE-A11Y-03]
    phase: build
    method: {tool: anatomy, field: "first_screen.by_type_kb.media (тип Media CDP в окне первого экрана)"}
    threshold: {D: "видео > 0 КБ — показать отдельно; постер, reduce = 0 байт, вертикальный файл телефону — SITE-PERF-13. Порог видео по уровню — ворота эффектов EG-WEIGHT-04 (S), вес первого экрана вместе с видео — SG-WEIGHT-01 (S)"}
    owner: "07/03 §3; creative (> 5 МБ видео до прокрутки у 15 из 49 эффектных страниц)"
    status: v1
    note: "видео уже входит в SG-WEIGHT-01; строка делает его видимым отдельно (у creative — колонки kb_first_nv, video_kb_first, video_kb_total)"
    maps_to: ["creative EG-WEIGHT-04 (видео первого экрана по уровню, S)"]

  # ------------------------------------------------------------ SEO — по head-kit.yaml
  - id: SG-SEO-01
    name: "Коды и предел Googlebot: индексируемая — 200 без редиректа по UA; несуществующий URL — 404; не 5xx; HTML без сжатия < 2 МБ и H1 в первых 2 МБ; каждый CSS и JS < 2 МБ без сжатия"
