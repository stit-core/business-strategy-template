# budgets.yaml — профили бюджета страницы «тип страницы × уровень амбиций» (site)
# Человеческое описание, основания и таблица расхождений с соседями — 03-performance-budgets-gates.md.
# Ворота, которые применяют эти числа, — page-gates.yaml; автопроверка — ../../scripts/site/page_gates.py.
# Правило: вес — предупреждение, а не блокер; блокируют исходы (LCP, CLS, INP-сценарий) и
# индексируемость. Профили эффектов (JS подачи, WebGL, 3D, видео, GPU) — creative, здесь только ссылка.
version: 0
checked: 2026-09-24
status: draft
owner: "site"
profile_id_format: "<page_type>@L<n>  (page-plan.page.budget_profile, схема page-plan: ^[a-z0-9]+(-[a-z0-9]+)*@L[0-2]$)"

sources:
  S-vitals: "web.dev, Web Vitals (обн. 2024-10-31): LCP ≤ 2,5 с, INP ≤ 200 мс, CLS ≤ 0,1 на p75, раздельно телефон/десктоп"
  S-thresholds: "web.dev, Defining the CWV thresholds (обн. 2025-05-07): плохо > 4 с / > 500 мс / > 0,25; пороги по достижимости на телефоне"
  S-tbt: "web.dev, TBT (обн. 2025-10-15): < 200 мс на средней мобильной технике; прокси INP, не замена"
  S-labfield: "web.dev, Why lab and field data can be different"
  S-wa-perf: "Web Almanac 2025 Performance (2026-01): CWV хорошо — телефон 48 %, десктоп 56 %; TBT HTTP Archive телефон медиана 1 916 мс"
  S-wa-pw: "Web Almanac 2025 Page Weight (2026-01): главная медиана 2 559 / 2 862 КБ; доля прошедших CWV падает с весом"
  S-M: "замер M (02-site-types/pages.csv 15:23, valid=1: 40 десктоп + 42 телефон; лаборатория без замедления сети, телефон CPU×4)"
  S-creative-C1: "../creative/01-creative-direction/ambition-levels.yaml v0 (2026-09-24): budgets.page — предложение для P"
  S-aimedia: "../ai-media/10-web-integration/04-budgets-and-acceptance.md §1.1 (нормы ассетов первого экрана)"
  S-blender: "../3d/09-web-runtime/05-performance-a11y-fallbacks.md §1.1, §7.2 (доля 3D)"
  S-everts: "[V:cnr3CJwpaps 32:32] Tammy Everts: бюджет = худшее значение за 2–4 недели; цель отдельно"
  S-googlebot: "[V:kype1JQbrks 08:18] + документация Googlebot (2026-02-03): первые 2 МБ несжатого файла"

# ---------------------------------------------------------------- условия замера
conditions:
  field:
    what: "поле: CrUX (28 дней, p75, Chrome без iOS и без Яндекс Браузера) или свой RUM (web-vitals onLCP/onINP/onCLS)"
    percentile: 75
    segments: [mobile, desktop]
    note: "у нового сайта поля нет; поле действует с живой фазы (≥ 4 недели трафика)"
  lab_mobile:
    tool: "page_accept.py --mobile --throttle (или Lighthouse mobile)"
    device: "Pixel 7 эмуляция 412×839, DPR 2,625"
    descriptor: "Pixel 7"   # дескриптор Playwright; UA — как у самого браузера (HeadlessChrome), автоматизация не маскируется
    cpu_slowdown: 4
    network: {down_kbps: 1600, up_kbps: 750, rtt_ms: 150}
    runs: 3
    statistic: median
    note: "условия близки к Lighthouse mobile; без замедления сети (как замер M) — только для диагностики исходов"
  lab_desktop:
    tool: "page_accept.py (десктоп)"
    device: "1440×900, DPR 1"
    viewport: {width: 1440, height: 900, dpr: 1}
    cpu_slowdown: 1
    network: none
    runs: 3
    statistic: median
  lab_weight:
    what: "вес страницы (первый экран, сессия, слои веса) — отдельный прогон без замедления сети: при замедлении в окно первого экрана приходит меньше байт и вес занижен; CPU телефона — как в lab_mobile (замер M)"
    network: none
    tools: "page_anatomy.py, page_accept.py без --throttle, motion_check.py; page_accept.py --throttle вес не сравнивает"
  first_screen:
    window_after_load_s: 5
    what: "окно первого экрана: всё, что пришло по сети за load + window_after_load_s без прокрутки и кликов; видео, стартующее само, входит. Одно число для page_anatomy.py, page_accept.py и motion_check.py; окно замера жанра creative 03-live-sites-measured (load + 8 с) — описание рынка, с числами ворот не сравнивается"
  quiet:
    what: "TBT, LCP и мс кадра — только на тихой машине: утилиты замера времени (page_accept.py, motion_check.py, site_probe.py, web_view.py) сначала берут общий тяжёлый замок (тот же, что slot_run.py --heavy), потом замок браузера; пара «с 3D / без 3D» и пара с эталоном — подряд в одном прогоне"
    lock: render
    basis: "3d 15-showcase: под нагрузкой соседних прогонов TBT 634–827 мс против 76–137 мс в тишине"
  inp_scenario:
    what: "лабораторный INP по сценарию (как page_anatomy.py --inp): меню, CTA, аккордеон, фокус в поле; + одно нажатие во время загрузки (DCL + 500 мс)"
    note: "сценарий после загрузки занижает INP: M — 0 из 111 прогонов > 200 мс при TBT телефона > 200 мс у 55 %"

# ---------------------------------------------------------------- слои веса (называть слой всегда)
layers:
  first_screen_kb: "передано по сети за окно первого экрана (conditions.first_screen: load + window_after_load_s) без прокрутки и кликов, включая видео, стартующее само (ai-media 10/04 §1.2; M first_screen_kb)"
  session_kb: "передано за программную прокрутку до конца страницы без кликов (M session_kb)"
  js_first_screen_kb: "JS (все источники), переданный в слое first_screen"
  third_party_first_screen_kb: "сторонние домены (eTLD+1 ≠ сайта) в слое first_screen"
  third_party_origins_before_input: "число сторонних eTLD+1 до первого ввода пользователя"
  fonts_kb: "шрифты за сессию"
  html_transfer_kb: "HTML-документ по сети (сжатый)"
  html_uncompressed_kb: "HTML без сжатия (предел Googlebot — 2 048 КБ на файл)"
  inline_data_uri_kb: "сумма data:-URI картинок внутри HTML и CSS"
  wasm_first_screen_kb: "wasm-рантаймы подачи в слое first_screen (dotLottie ≈ 379 КБ br, Rive 272–613 КБ br) — отдельно от js_first_screen_kb; загрузка с jsDelivr или unpkg — сторонний домен (third_party_*), самохостинг — setWasmUrl (creative)"
  presentation_kb_by_mode: "JS и данные подачи — отдельно для режимов desktop, mobile, reduce (условная загрузка: закреплённая сцена GSAP 45,7 КБ br на десктопе и 3,9 КБ на телефоне и при reduce; SplitText 30 КБ против 0 — creative); пороги эффектов — creative (effects_ref), здесь — слой отчёта"

# ---------------------------------------------------------------- виды порогов
kinds:
  goal: "цель приёмки новой страницы (лаборатория) и цель поля (p75). Превышение — серьёзность из page-gates.yaml"
  poor: "граница «плохо»: превышение исхода (LCP, CLS, INP) — блокер ворот"
  budget: "бюджет регрессии живой страницы: худшее значение метрики за последние 2–4 недели, пересмотр каждые 2–4 недели (Everts); заполняется в живой фазе"

# ---------------------------------------------------------------- профили уровней (страница целиком)
levels:
  L0:
    name: "Сдержанно"
    effects_ref: "../creative/01-creative-direction/ambition-levels.yaml#levels.L0.budgets.effects"
    outcome:
      lcp_ms_field_p75: {goal: 2500, poor: 4000, basis: S-vitals}
      inp_ms_field_p75: {goal: 200, poor: 500, basis: S-vitals}
      cls_field_p75: {goal: 0.1, poor: 0.25, basis: S-vitals}
      lcp_ms_lab: {mobile: {goal: 2500, poor: 4000}, desktop: {goal: 2000, poor: 4000}, basis: "S-vitals; S-creative-C1 (десктоп 2,0)"}
      cls_lab: {goal: 0.1, poor: 0.25, basis: S-thresholds}
      inp_ms_lab_scenario: {goal: 200, poor: 500, basis: "S-vitals; занижен — см. conditions.inp_scenario"}
      tbt_ms_lab: {mobile: {goal: 200}, desktop: {goal: 150}, basis: "S-tbt; S-creative-C1"}
    weight:
      first_screen_kb: {mobile: 1500, desktop: 2500, basis: "S-creative-C1 = ai-media Q1 лидеров; M все страницы телефон медиана 2 056"}
      session_kb: {mobile: 3000, desktop: 5000, basis: "S-creative-C1; M телефон медиана 3 497"}
      js_first_screen_kb: {mobile: 300, desktop: 300, basis: "WA 2025 JS p25 270 КБ; M многостраничники медиана 283; Russell 2024 ≈ 365 КБ JS на p75-телефоне [мнение эксперта через 3d 01/02 §3.2]"}
      fonts_kb: {mobile: 150, desktop: 150, basis: "S-creative-C1; WA 2025 медиана шрифтов 122 / 139 КБ"}
      third_party_origins_before_input: {max: 1, basis: "до ввода — только CMP (0, если свой); счётчики и пиксели — после согласия (SG-LEGAL-01, позиция site 08 по умолчанию [спорно]); карты, чат, видео, запись — по видимости или нажатию (03 §5); M медиана 7"}
      third_party_first_screen_kb: {max: 200, basis: "Метрика ≈ 120 КБ за сессию (замер M; пересчёт — 124 КБ; ориентир) + CMP 16–84 КБ"}
  L1:
    name: "Выразительно"
    effects_ref: "../creative/01-creative-direction/ambition-levels.yaml#levels.L1.budgets.effects"
    outcome:
      lcp_ms_field_p75: {goal: 2500, poor: 4000, basis: S-vitals}
      inp_ms_field_p75: {goal: 200, poor: 500, basis: S-vitals}
      cls_field_p75: {goal: 0.1, poor: 0.25, basis: S-vitals}
      lcp_ms_lab: {mobile: {goal: 2500, poor: 4000}, desktop: {goal: 2500, poor: 4000}, basis: "S-vitals; S-creative-C1"}
      cls_lab: {goal: 0.1, poor: 0.25, basis: S-thresholds}
      inp_ms_lab_scenario: {goal: 200, poor: 500, basis: S-vitals}
      tbt_ms_lab: {mobile: {goal: 300}, desktop: {goal: 200}, basis: "S-creative-C1 (эффекты L1 + 1 контекст WebGL); M лидген телефон медиана 508 — L1 строже рынка"}
    weight:
      first_screen_kb: {mobile: 2000, desktop: 3500, basis: "S-creative-C1; M SaaS десктоп медиана 3 824, телефон 3 350; WA: 2–3 МБ — CWV прошли 45 % телефонных главных"}
      session_kb: {mobile: 5000, desktop: 10000, basis: "S-creative-C1; ai-media лидеры SaaS сессия 7,1 МБ"}
      js_first_screen_kb: {mobile: 450, desktop: 450, basis: "L0 + JS подачи ≤ 100 КБ (creative) + запас на аналитику; WA медиана 646 КБ"}
      fonts_kb: {mobile: 250, desktop: 250, basis: "S-creative-C1; ai-media лидеры медиана 190, Q3 328"}
      third_party_origins_before_input: {max: 2, basis: "CMP + 1 (видео-CDN); счётчики — после согласия; шрифты — со своего домена (SG-LEGAL-07)"}
      third_party_first_screen_kb: {max: 300, basis: "L0 + видеоплеер или второй счётчик"}
  L2:
    name: "Иммерсивно, «вау»"
    effects_ref: "../creative/01-creative-direction/ambition-levels.yaml#levels.L2.budgets.effects"
    three_d_ref: "../3d/09-web-runtime/05-performance-a11y-fallbacks.md §7.2 (WEB-01…16: доля 3D ≤ 820/1536 КБ, TBT 3D ≤ 300/150)"
    outcome:
      lcp_ms_field_p75: {goal: 2500, poor: 4000, basis: "S-vitals: «вау» после LCP — порог тот же"}
      inp_ms_field_p75: {goal: 200, poor: 500, basis: S-vitals}
      cls_field_p75: {goal: 0.1, poor: 0.25, basis: S-vitals}
      lcp_ms_lab: {mobile: {goal: 3000, poor: 4000}, desktop: {goal: 2500, poor: 4000}, basis: "S-creative-C1 (телефон 3,0 с — постер после прелоадера запрещён: прелоадер только по решению)"}
      cls_lab: {goal: 0.1, poor: 0.25, basis: S-thresholds}
      inp_ms_lab_scenario: {goal: 200, poor: 500, basis: S-vitals}
      tbt_ms_lab: {mobile: {goal: 600}, desktop: {goal: 300}, basis: "3d 01/02 §8 (страница CPU×4 ≤ 600); S-creative-C1"}
    weight:
      first_screen_kb: {mobile: 2500, desktop: 4000, basis: "S-creative-C1; ai-media Awwwards до прокрутки медиана 3,8 МБ"}
      session_kb: {mobile: 8000, desktop: 15000, basis: "S-creative-C1; Awwwards сессия медиана 20,9 МБ — L2 строже жанра"}
      js_first_screen_kb: {mobile: 750, desktop: 900, basis: "L1 + JS 3D 250/350 КБ br (creative, 3d); WA p75 1 233 КБ"}
      fonts_kb: {mobile: 300, desktop: 300, basis: S-creative-C1}
      third_party_origins_before_input: {max: 2, basis: "как L1"}
      third_party_first_screen_kb: {max: 300, basis: "как L1: «вау» делает свой код, а не сторонние виджеты"}

# ---------------------------------------------------------------- общие для всех уровней
all_levels:
  html_uncompressed_kb: {max: 2048, severity_hint: blocker, owner: head-kit.yaml, basis: S-googlebot}
  css_js_file_uncompressed_kb: {max: 2048, severity_hint: blocker, owner: head-kit.yaml, basis: "S-googlebot: предел на каждый файл"}
  html_transfer_kb: {goal: 150, basis: "WA 2025 HTML p90 151–155 КБ; M медиана 57 КБ"}
  inline_data_uri_kb: {goal: 10, basis: "[V:kype1JQbrks 12:26] base64 раздувает HTML; иконки SVG — допустимы"}
  lcp_resource_rules: "LCP — H1 или картинка/постер в исходном HTML; LCP-картинка без loading=lazy (блокер), с fetchpriority=high (предупреждение); не canvas; без появления из opacity 0 (S-optlcp; ai-media 01/02 §5)"

# ---------------------------------------------------------------- сетка «тип страницы → уровень»
page_type_levels:
  ref: "../../creative/01-creative-direction/ambition-levels.yaml#defaults_by_page_type"   # одна таблица умолчаний; page_gates.py, site_validate.py и plan_to_assets.py читают её
  rules:
    - "уровень страницы не выше уровня сайта в брифе (site-brief.ambition.level)"
    - "landing-lead-services: L0 по умолчанию по правилу лидогенерации услуг — доля горячего трафика с телефонов и decision_context.price_band (поля ambition-levels.yaml levels[L0].appropriate_for.lead_services)"
    - "секции lead-form и pricing — эффекты L0 при любом уровне страницы (creative CRV-AL)"
    - "отклонение от умолчания — только с причиной: site-brief.ambition.source ≠ default + note"
    - "specialist-page, location-page, documents-page, search-results-page — L0, program-catalog-page — L1 (5 активных типов словаря v1; 5 типов proposed — после решения владельца)"

# ---------------------------------------------------------------- исключения по типу страницы (накладываются на уровень)
overrides:
  landing-lead-services@L1:
    weight: {first_screen_kb: {mobile: 1500, desktop: 2500}}
    why: "вес первого экрана на телефоне всегда по L0; горячий платный трафик с телефона; M лидген РФ телефон медиана 2 296 КБ (Q1 1 344) — цель ≈ Q1 рынка"
  landing-lead-services@L2:
    weight: {first_screen_kb: {mobile: 1500, desktop: 2500}}
    why: "то же правило при любом уровне"
  thank-you-page@L0:
    weight: {first_screen_kb: {mobile: 800, desktop: 1200}, third_party_origins_before_input: {max: 1}}
    why: "служебная страница после заявки: цель Метрики и пиксели срабатывают здесь — не грузить лишнего (события — events.yaml)"
  not-found-page@L0:
    weight: {first_screen_kb: {mobile: 800, desktop: 1200}}
    why: "служебная страница"
  article-page@L0:
    weight: {fonts_kb: {mobile: 200, desktop: 200}}
    why: "текстовая страница: допустима вторая гарнитура для текста (кириллица)"

# ---------------------------------------------------------------- как разрешать профиль
resolve:
  - "1. Разобрать budget_profile '<page_type>@L<n>'; если уровня нет — умолчание типа из ambition-levels.yaml#defaults_by_page_type и правило лидогенерации услуг (levels[L0].appropriate_for.lead_services)."
  - "2. Взять levels[L<n>] (outcome, weight) + all_levels."
  - "3. Наложить overrides['<page_type>@L<n>'] (поле за полем)."
  - "4. Проверить: L<n> ≤ уровня сайта; для lead-services — правило горячего мобильного трафика."
  - "5. Секции с 3D — дополнительно ворота 3d (доля 3D) по three_d_ref; эффекты — ворота creative по effects_ref."
  - "Реализация — page_gates.py resolve_profile(); самопроверка — page_gates.py --selftest."

# ---------------------------------------------------------------- бюджеты регрессии живой страницы (Everts)
regression_budget:
  metrics: [lcp_ms_field_p75, inp_ms_field_p75, cls_field_p75, first_screen_kb, js_first_screen_kb, third_party_first_screen_kb, image_kb_first_screen]
  rule: "budget = худшее значение за последние 4 недели (RUM p75 или медиана синтетики на заданных URL); пересмотр каждые 2–4 недели, только вниз"
  alert: "нарушение бюджета → разбор: какое изменение (картинка, тег, код) его вызвало; цель (goal) не путать с бюджетом"
  pages_first: "посадочные под платный трафик, страницы услуг с формой, тарифы — там решается действие"
  status: "заполняется в живой фазе (нужен трафик и RUM или ключ CrUX API)"

