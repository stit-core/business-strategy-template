# Маркеры «ИИ-лендинга» — структурные и конверсионные приметы сборки «по умолчанию».
# Разбор и доказательства — 01-generators-and-ai-landing-markers.md; чек-лист — 02-site-checklist.md
# (пункты SITE-* ссылаются на AIL; checklist_export.py сверяет, что каждый упомянутый AIL есть здесь).
version: "1.0"
checked: "2026-09-24"
status: released
owner: "site (09-ai-generation-evaluation)"
doc: "01-generators-and-ai-landing-markers.md"
scope: >-
  Структурные и конверсионные маркеры страницы и сайта: порядок секций, первый экран, блоки, призывы и окна, формы,
  доказательства и честность, навигация и ИА, поиск и ИИ-поиск (техника), телефон, план, остатки шаблона. Визуальные
  маркеры (цвет, шрифт, эффекты, «фиолетовый градиент», стекло, движение как вкус) — creative (CRV-*); текстовые приметы
  (тире, надзаголовки, «·», словарь штампов) — text (COPY-C-18, copy_lint); приёмка ассетов — ai-media и 3d.
principle: >-
  Маркер — признак решения, принятого моделью по умолчанию, а не дефект сам по себе: у каждого есть условие, при котором
  приём законен (поле allow — это решение брифа или плана с причиной). Маркер без allow серьёзности B — блокер выдачи;
  серьёзности S — снять или разрешить брифом; D — список улучшений (SITE-OUT-08). Большинство маркеров «рынок тоже так
  делает» — генератор повторяет медиану обучающих данных; ловим медиану без причины, а не редкость.
severity_scale:
  B: "блокер: действие не выполняется, нарушен закон, посетителя обманывают, индексируемая страница не читается без JS"
  S: "серьёзно: трение, потеря доверия или шаблон без причины; снять или разрешить брифом (allow)"
  D: "желательно: отпечаток шаблона без вреда для действия"
detect_codes:
  DOM: "разбор DOM или сырого HTML (page_anatomy.py, geo_probe.py, page_gates.py --html)"
  LNT: "проверка плана и брифа до рендера (site_validate.py, vocab_lint.py)"
  AXE: "axe-core в браузере"
  SCR: "сценарий в браузере: загрузка, прокрутка, перезагрузка, повторный визит, Tab (без ввода данных и отправки)"
  IMG: "кадр первого экрана или контактный лист (1440×900, 390×844, силуэт 200 px)"
  JDG: "судья по рубрике site-rubric.json (03-expert-review-and-judge.md)"
  HUM: "человек или заказчик"
fields:
  id: "AIL-<NN>, номера стабильны, не переиспользуются"
  name: "короткое имя"
  group: "order | first-screen | blocks | proof | cta | form | nav | search | mobile | plan | legal | template"
  sign: "признак, как он выглядит на странице"
  detect: "method — коды detect_codes (первый — основной); how — как обнаружить; auto — что уже автоматизировано в базе"
  threshold: "порог срабатывания"
  severity: "B | S | D — серьёзность подтверждённого маркера на маршруте «визит → действие»"
  allow: "когда приём законен (решение брифа или плана с причиной)"
  replace_with: "чем заменить"
  site_checklist: "пункты 02-site-checklist.md"
  defects: "дефекты каталога DEF (02-site-checklist.md §4)"
  sources: "файлы базы, соседей, сестёр, гейты Hallmark, приметы LLM-вёрстки, ролики [V:id mm:ss]"
  evidence: "метки доказательности базы"
  status: "только у кандидатов: proposed — в проверки и ворота не входит до калибровки (AIL-52)"
groups:
  order: "порядок секций и сюжет"
  first-screen: "первый экран"
  blocks: "блоки и их содержание"
  proof: "доказательства, цена, честность"
  cta: "призывы и окна"
  form: "формы и «спасибо»"
  nav: "шапка, подвал, навигация, языки"
  search: "поиск и ИИ-поиск (техника)"
  mobile: "телефон"
  plan: "план страницы и аудитория"
  legal: "согласия и баннер cookie"
  template: "остатки шаблона и разметка элементов"
crosswalk_external:
  - {ext: "гейт Hallmark 6 (hero 100vh, всё по центру)", ail: [AIL-06]}
  - {ext: "гейт Hallmark 8 (Hero → 3 features → CTA → footer; отпечаток прошлой выдачи)", ail: [AIL-01, AIL-03]}
  - {ext: "гейт Hallmark 32 (повтор архетипа — сменить ручку варианта)", ail: [AIL-03, AIL-08]}
  - {ext: "гейт Hallmark 42 (Nav fingerprint)", ail: [AIL-11]}
  - {ext: "гейт Hallmark 43 (Footer fingerprint)", ail: [AIL-21]}
  - {ext: "гейт Hallmark 44 (hero в 1280×800 без прокрутки)", ail: [AIL-06]}
  - {ext: "гейт Hallmark 47 (Re-drawn chrome)", ail: [AIL-17]}
  - {ext: "гейты Hallmark 49 (двухстрочный кликабельный текст) и 56 (липкий под липкой шапкой)", ail: [], owner: "creative (визуальные); телефон — SITE-MOB-05"}
  - {ext: "LOOK-STATS-ROW (mockup_checks.py, major, --allow)", ail: [AIL-02]}
  - {ext: "LOOK-THREE-CARDS (mockup_checks.py, major, --allow)", ail: [AIL-07]}
  - {ext: "LOOK-HERO-CENTER (mockup_checks.py, major, --allow)", ail: [AIL-06]}
  - {ext: "LOOK-HERO-OVERLAY, LOOK-MARQUEE (mockup_checks.py)", ail: [], owner: "creative (визуальные приметы)"}
  - {ext: "HON-NUMBERS, HON-QUOTE, HON-FILLER (claude-design 06/04 §3 D, critical)", ail: [AIL-18, AIL-45, AIL-09]}
  - {ext: "UX F12.1 (фейковые метрики и люди), F12.3 (выдуманные функции)", ail: [AIL-18, AIL-19, AIL-14, AIL-40]}
  - {ext: "UX-AIG-01, AC-TXT-02 (проверка по связке с фактом)", ail: [AIL-18, AIL-19]}
  - {ext: "COPY-C-18 (приметы ИИ в тексте — text)", ail: [], owner: "text"}
  # зеркало crosswalk_external creative (cliche-registry.yaml): relation — термин creative относительно маркера (как в crosswalk.tsv)
  - {ext: "cliche:bento-uniform-tiles (визуал плиток: радиус, одинаковый padding)", ail: [AIL-08], relation: narrower, owner: "creative 08-uniqueness-anti-slop/cliche-registry.yaml"}
  - {ext: "cliche:dashboard-in-browser-frame (подача продукта в рамке, повороты)", ail: [AIL-17], relation: narrower, owner: "creative 08-uniqueness-anti-slop/cliche-registry.yaml"}
  - {ext: "cliche:category-rut-imagery (картинка по категории без смысла)", ail: [AIL-49], relation: equal, owner: "creative 08-uniqueness-anti-slop/cliche-registry.yaml"}
  - {ext: "cliche:aurora-blobs, cliche:floating-orbs (декоративный слой; AIL-47 — перехват нажатия над призывом)", ail: [AIL-47], relation: related, owner: "creative 08-uniqueness-anti-slop/cliche-registry.yaml"}
markers:
  - id: AIL-01
    name: "старый шаблон порядка секций"
    group: order
    sign: "Порядок «hero → 3 фичи или преимущества → отзывы → тарифы → финальный призыв → подвал» без вопроса посетителя у секций"
    detect:
      method: [JDG, DOM, LNT]
      how: "роли секций page-plan (sections[].role) или page_anatomy.py (classes, только conf ≥ 0,5): подпоследовательность hero → benefits|features → testimonials → pricing → final-cta — не меньше 4 из 5 ролей в этом порядке; у секций плана нет question"
      auto: "частично: роли — page_anatomy.py (роль верна в 62 % секций, при conf ≥ 0,5 — в 87–92 %); вердикт — судья по плану"
    threshold: "≥ 4 из 5 ролей шаблона по порядку (между ними ≤ 1 другая роль) и нет question у секций"
    severity: S
    allow: "порядок выведен из осведомлённости и типа страницы (03-page-structure/01 §3.1), у каждой секции записан вопрос посетителя; совпадение с шаблоном при выведенном порядке — не маркер"
    replace_with: "порядок из вопросов посетителя по уровню осведомлённости; макроструктура выбрана из 3 форм разных семейств (03-page-structure/01 §4.3)"
    site_checklist: [SITE-STR-01, SITE-PRE-16]
    defects: [DEF-01, DEF-02]
    sources:
      - "гейт Hallmark 8 (https://github.com/Nutlope/hallmark, skills/hallmark/references/slop-test.md)"
      - "../../claude-design/06-design-process/04-checks.md §3 C (major: форма страницы из плана)"
      - "../03-page-structure/01-narratives-and-section-order.md §3.4 [проверено: 1 из 30 живых страниц; 0 из 6 ИИ-страниц 2026]"
    evidence: ["[проверено]", "[практика]"]
    note: "Старый шаблон редок и у рынка, и у ИИ 2026 — искать прежде всего AIL-02"
    checked: "2026-09-24"
  - id: AIL-02
    name: "новый шаблон «ряд чисел ↔ фичи»"
    group: order
    sign: "Чередование полосы из 3–4 крупных чисел и сетки фич (числа → фичи → числа …); числа без подписи источника"
    detect:
      method: [DOM, JDG, LNT]
      how: "последовательность ролей: переход stats → benefits|features не меньше 2 раз; или ряд из 3–4 чисел (role proof-stats) в первых двух экранах без fact: у чисел"
      auto: "частично: роли page_anatomy.py (conf ≥ 0,5); числа без фактов — AIL-18"
    threshold: "≥ 2 переходов stats → benefits или ряд чисел без фактов в первых двух экранах"
    severity: S
    allow: "макроструктура Stat-Led с реальными фактами (fact: у каждого числа) по решению плана"
    replace_with: "одно-два числа у точки решения с подписью, источником и датой (05-conversion-funnels/02 §1.3; 04-blocks/01 §4.2)"
    site_checklist: [SITE-STR-01, SITE-PRF-04, SITE-PRF-05]
    defects: [DEF-02]
    sources:
      - "../03-page-structure/01-narratives-and-section-order.md §3.4 [проверено: переход stats → benefits 5 раз на 6 ИИ-страницах 2026]"
      - "LOOK-STATS-ROW (../../../scripts/claude-design/mockup_checks.py, major, --allow)"
      - "../../text/09-ai-generation-evaluation/03-evaluation.md (числа без факта: 1,49 у ИИ-страниц против 0,45 на 100 слов)"
    evidence: ["[проверено]", "[данные]"]
    checked: "2026-09-24"
  - id: AIL-03
    name: "общий хвост и одна форма у разных проектов"
    group: order
    sign: "Хвост «отзывы → FAQ → полоса призыва → подвал» одинаков у страниц разных задач; страница повторяет макроструктуру и варианты блоков прошлой страницы проекта того же типа"
    detect:
      method: [JDG, LNT]
      how: "последние 3–4 роли и штамп макроструктуры (page-plan.macrostructure, варианты блоков) против прошлых планов проекта; у секций хвоста нет objections"
      auto: "нет: сравнение планов проекта — скриптом по page-plan"
    threshold: "последние 3 роли и варианты совпадают с прошлой страницей того же типа, или хвост без objections в плане"
    severity: S
    allow: "страницы одного шаблона многостраничника (одинаковость — норма, 06-multipage-ia); серия посадочных одной кампании с общим хвостом по решению плана"
    replace_with: "хвост из возражений этой страницы; при повторе архетипа сменить хотя бы одну ручку варианта (гейт 32)"
    site_checklist: [SITE-STR-02, SITE-PRE-12]
    defects: [DEF-03]
    sources:
      - "гейт Hallmark 32 (тот же архетип — хотя бы одна другая ручка варианта)"
      - "гейт Hallmark 8 (структурный отпечаток прошлой выдачи в проекте)"
      - "../03-page-structure/01-narratives-and-section-order.md §3.4, §4.3"
    evidence: ["[практика]"]
    checked: "2026-09-24"
  - id: AIL-04
    name: "история плюс типовой хвост"
    group: order
    sign: "После сюжетной части (история, манифест, кино-hero) идут типовые блоки без роли: «3 фичи», «отзывы», «тарифы», «FAQ» — сайт-история превращается в шаблон"
    detect:
      method: [JDG]
      how: "у плакатной или сюжетной макроструктуры (poster, Letter, Manifesto) после истории ≥ 2 секций общего набора без question и job"
      auto: "нет"
    threshold: "≥ 2 типовых секций без вопроса после истории"
    severity: S
    allow: "типовая секция с ролью и вопросом этой страницы (цена у кампании с продажей, форма записи)"
    replace_with: "одно предложение с честным сроком и одним призывом после истории (03-page-structure/01 §3.3)"
    site_checklist: [SITE-STR-20, SITE-STR-15]
    defects: [DEF-02]
    sources:
      - "../03-page-structure/01-narratives-and-section-order.md §3.3"
      - "../../claude-design/06-design-process/05-default-look.md (три скелета витрины одного генератора: люкс, магазин, портфолио)"
    evidence: ["[практика]"]
    checked: "2026-09-24"
  - id: AIL-05
    name: "слоган вместо категории"
    group: first-screen
    sign: "H1 — слоган или абстракция («Будущее начинается здесь», «Elevate your workflow») без названия категории продукта или услуги; категории нет и в надзаголовке и лиде"
    detect:
      method: [DOM, JDG]
      how: "текст H1, надзаголовка (≤ 2 элемента над H1) и лида первого экрана против категории из брифа; судья по кадру отвечает «что это и для кого?»"
      auto: "частично: текст H1 — page_anatomy.py; наличие категории — судья или словарь категорий брифа"
    threshold: "категории нет ни в H1, ни в надзаголовке, ни в лиде первого экрана"
    severity: S
    allow: "плакат L2 для узнаваемого бренда (осведомлённость most-aware) — категория в шапке или лиде"
    replace_with: "H1 с категорией и результатом; слоган — надзаголовком или в лиде (формулировки — text)"
    site_checklist: [SITE-STR-07, SITE-BLK-06]
    defects: [DEF-07]
    sources:
      - "../03-page-structure/03-first-screen-and-mobile.md §1.2 [проверено: слоган без категории у 5 из 30 живых страниц]"
      - "COPY-R-01 (../../text/09-ai-generation-evaluation/copy-rubric.yaml)"
    evidence: ["[проверено]", "[практика]"]
    note: "Примета и рынка (5 из 30), и генераторов; ловим независимо от происхождения"
    checked: "2026-09-24"
  - id: AIL-06
    name: "hero 100vh по центру без продолжения (ложный пол)"
    group: first-screen
    sign: "Hero на всю высоту окна, всё на одной центральной оси (надзаголовок, H1, лид, кнопка); ниже — пустота или горизонтальная линия, признака продолжения нет («ложный пол», «ложное дно»)"
    detect:
      method: [SCR, IMG]
      how: "высота коробки hero / высота окна ≥ 0,95 на 1440×900 и 390×844; край следующей секции не виден; 3–4 элемента hero выровнены по центру общего контейнера; на 1280×800 H1 или призыв ниже сгиба (гейт 44)"
      auto: "частично: page_anatomy.py (first_screen, doc_h_vh); центр — LOOK-HERO-CENTER (mockup_checks.py)"
    threshold: "hero ≥ 95 % высоты окна без видимого края следующей секции, стрелки или подписи продолжения"
    severity: S
    allow: "first_screen_policy: poster (L2-кампания, портфолио, бренд-событие) с призывом в шапке и видимым признаком продолжения"
    replace_with: "offer-cta: коробка hero 60–85 % высоты окна, край следующей секции виден; не больше двух центрированных элементов (гейт 6)"
    site_checklist: [SITE-STR-09, SITE-STR-08, SITE-MOB-07]
    defects: [DEF-07]
    sources:
      - "гейт Hallmark 6 (hero min-height: 100vh и всё по центру — провал)"
      - "гейт Hallmark 44 (главное hero видно на 1280×800 без прокрутки)"
      - "../03-page-structure/03-first-screen-and-mobile.md §2.2, §2.4 [исследование: NN/g — ложный пол]"
      - "[V:F5x6ilNpfDo 25:40] (Gilis: пустота и линия — «ложное дно»; ClickShare: +33 % начали прокрутку) [кейс]"
      - "../../claude-design/06-design-process/05-default-look.md §3 (центрированный hero: витрина 5 из 13, Kilo 3 из 3)"
    evidence: ["[исследование]", "[кейс]", "[данные]"]
    checked: "2026-09-24"
  - id: AIL-07
    name: "три одинаковые карточки вместо продукта"
    group: blocks
    sign: "Три (реже 4–6) одинаковые карточки «иконка + заголовок + две строки» одной длины вместо показа продукта"
    detect:
      method: [DOM, IMG, JDG]
      how: "секция из 3–6 соседних узлов одной структуры (иконка или SVG + h3 + p); коэффициент вариации длины текстов карточек < 0,2; у SaaS или приложения нет кадра настоящего интерфейса"
      auto: "частично: LOOK-THREE-CARDS (mockup_checks.py); вариация длины — скриптом по HTML"
    threshold: "CV длины текстов карточек < 0,2 и у продукта нет block:product-showcase, block:feature-alternating или block:feature-tabs"
    severity: S
    allow: "карточки разного содержания (функция, число, цитата) или три реальных тарифа или услуги со своими фактами"
    replace_with: "продукт настоящим интерфейсом (block:product-showcase, block:feature-alternating, block:feature-tabs); фичи через задачу посетителя"
    site_checklist: [SITE-BLK-08]
    defects: []
    sources:
      - "../../ui/12-ai-generated-ui/02-codegen-tools-and-default-look.md §2.1 (центроид — три одинаковые карточки в ряд), §5 (Lovable: 3-колоночные сетки у 8 из 10)"
      - "../../text/09-ai-generation-evaluation/03-evaluation.md (карточки одной длины: CV 0,18 у ИИ против 0,40)"
      - "LOOK-THREE-CARDS (../../../scripts/claude-design/mockup_checks.py)"
      - "../04-blocks/01-blocks-catalog.md §5.1"
    evidence: ["[данные]", "[практика]"]
    checked: "2026-09-24"
  - id: AIL-08
    name: "шаблонный бенто"
    group: blocks
    sign: "Бенто-сетка из 6–9 плиток «иконка + два слова» одного вида содержания в ячейках разного размера без причины"
    detect:
      method: [JDG, IMG]
      how: "≥ 5 плиток одного вида содержания (иконка + заголовок) в сетке неравных ячеек"
      auto: "нет"
    threshold: "≥ 5 однотипных плиток"
    severity: D
    allow: "плитки разного содержания: функция, число с фактом, цитата, кадр продукта"
    replace_with: "список или чередование с реальными кадрами; бенто — только разного содержания (04-blocks/01 §5.2)"
    site_checklist: [SITE-BLK-09]
    defects: []
    sources:
      - "../04-blocks/01-blocks-catalog.md §5.2 [мнение вендора]"
      - "гейт Hallmark 32 (два бенто с одинаковыми ручками — один и тот же бенто)"
      - "../../ux/11-ai-generated-ui/01-failure-modes-catalog.md F13.1 (кластер «SaaS-card kit»)"
    evidence: ["[мнение вендора]", "[практика]"]
    checked: "2026-09-24"
  - id: AIL-09
    name: "заглушки доказательств и «честный вымысел»"
    group: proof
