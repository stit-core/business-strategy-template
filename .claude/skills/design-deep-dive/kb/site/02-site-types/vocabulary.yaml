      - {id: stat-value, kind: text, name: "Число", def: "Значение в ряду цифр — из факта"}
      - {id: stat-label, kind: text, name: "Подпись числа", def: "Что означает число"}
      - {id: stat-source, kind: text, name: "Источник числа", def: "Источник и дата числа, рейтинга, подборки отзывов"}
