      - {id: og-title, kind: text, scope: page, name: "og:title", def: "Заголовок превью ссылки"}
      - {id: og-description, kind: text, scope: page, name: "og:description", def: "Описание превью ссылки"}
      - {id: og-image-alt, kind: text, scope: page, name: "og:image:alt", def: "Текстовая альтернатива картинки превью"}
      # --- text: первый экран
      - {id: eyebrow, kind: text, name: "Надзаголовок", def: "Бирка над H1 или H2: категория, сегмент, дата и место события"}
