      - {id: promise, kind: text, name: "Обещание (смысловой слот)", def: "Суть обещания страницы (product.goal брифа холста); на странице обычно воплощается headline"}
      - {id: announcement, kind: text, name: "Строка объявления", def: "Текст строки над навигацией"}
      - {id: cta-label, kind: text, name: "Подпись главной кнопки", def: "Называет результат действия"}
      - {id: cta-secondary-label, kind: text, name: "Подпись второстепенной кнопки или ссылки", def: "Второй путь: цены, демо, подробнее"}
