# vocabulary.yaml — единый словарь идентификаторов системы генеративного дизайна сайтов (site).
# Id не переименовываются: вышедший из употребления получает status: deprecated и replaced_by; новый id — запись в своём
# пространстве имён (до подтверждения владельцем темы — status: proposed).
# Описание и правила: 02-site-types/02-vocabulary-and-crosswalk.md; соответствие старым словарям соседей, сестёр и внешних
# скиллов: 02-site-types/crosswalk.tsv; проверка файлов (от корня скилла): scripts/site/vocab_lint.py <файлы> (--selftest).
# Ссылка на id из другого файла или базы — с префиксом пространства (ref_prefixes): block:hero-media, slot:headline,
# section-role:proof-logos, page-type:landing-saas. Чужие пространства (effect:, copy-rule:, fact:, task:, recipe:) здесь
# не определяются — их ведут владельцы (foreign_prefixes).

vocabulary: site
version: 1
revision: 1
status: released           # правки — только добавления и status: deprecated
checked: 2026-09-24
owner: "site · 02-site-types"
id_pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
id_pattern_exceptions:
  ambition_level: '^L[0-2]$'   # L0, L1, L2 — уровни амбиций подачи creative (ambition-levels.yaml)
statuses:
  active: "действует"
  proposed: "предложен, ждёт подтверждения владельца темы (site 03, site 04, site 06, creative, text); использовать можно с пометкой"
  deprecated: "не использовать в новых файлах; replaced_by — замена; lint даёт предупреждение"
  out-of-scope: "вне рамок базы; нужен, чтобы метить, а не строить (замер, классификация)"
  measurement-only: "только для замеров и классификации; в site-brief, site-map, page-plan, blocks.yaml — ошибка"
ref_prefixes:
  site-type: site_type
  page-type: page_type
  section-role: section_role
  block-family: block_family
  block: block
  slot-kind: slot_kind
  slot: slot
  macrostructure: macrostructure
  first-screen-policy: first_screen_policy
  action: action
  awareness: awareness
  traffic-temperature: traffic_temperature
  traffic-source: traffic_source
  jurisdiction: jurisdiction
  ambition: ambition_level
  conversion-channel: conversion_channel
  step: procedure_step
foreign_prefixes:
  effect: "creative — effects.yaml"
  treatment: "creative — подсхема treatment, block-treatments.yaml"
  copy-rule: "text — copy-slots.yaml, линтер"
  fact: "text — facts.yaml (инвентарь доказательств заказчика)"
  task: "ai-media — коды задач routing.yaml (IMG-HERO-PHOTO …)"
  recipe: "3d — 12-recipes"
  event: "site — events.yaml (07-seo-geo-performance-analytics)"
  req: "site — legal-requirements.yaml (08-legal-trust-a11y)"
  site-pre: "site — входной контракт SITE-PRE-01…26 (09-ai-generation-evaluation)"
  def: "site — каталог дефектов DEF-01…50 (09-ai-generation-evaluation)"
  ref: "creative — библиотека референсов (запись ref:<id>)"

namespaces:

  # ---------------------------------------------------------------------------------------------------------------
  site_type:
    name: "Тип сайта"
    owner: "site 02; карты сайтов по типам — site 06"
    fields: "multipage — многостраничный ли; priority — приоритет заказчика: 1 лидогенерация услуг РФ, 2 лендинг SaaS или продукта, 3 запуск или кампания L2, 4 корпоративный многостраничник, 0 — прочие в рамках"
    values:
      - {id: landing-site, name: "Лендинг (одностраничный сайт)", def: "Сайт из одной посадочной страницы и служебных («спасибо», политика ПД, 404); одна цель — одно действие", multipage: false, priority: [1, 2, 3]}
      - {id: services-site, name: "Сайт услуг и локального бизнеса", def: "Клиника, салон, ремонт, юристы, автосервис: страницы услуг, цены, специалисты, отзывы, контакты; цель — запись, звонок, заявка", multipage: true, priority: [1]}
      - {id: corporate-site, name: "Корпоративный сайт", def: "Компания, B2B, производство, холдинг: о компании, направления, проекты, документы, контакты; цель — заявка и доверие", multipage: true, priority: [4]}
      - {id: saas-marketing-site, name: "Маркетинговый сайт SaaS или цифрового продукта", def: "Функции, сценарии, тарифы, кейсы, интеграции, блог; вход в продукт — отдельный пакет сервиса с общим DESIGN.md", multipage: true, priority: [2]}
      - {id: portfolio-site, name: "Портфолио и студия", def: "Агентство, дизайнер, архитектор, фотограф: работы — главный довод; цель — бриф или заявка", multipage: true, priority: [0]}
      - {id: event-site, name: "Сайт мероприятия", def: "Конференция, фестиваль, форум: программа, спикеры, площадка, билеты, партнёры; цель — регистрация или билет", multipage: true, priority: [0]}
      - {id: personal-brand-site, name: "Личный бренд", def: "Эксперт, автор, спикер: биография, услуги или продукты, публикации, выступления; цель — заявка, подписка, покупка", multipage: true, priority: [0]}
      - {id: school-site, name: "Школа и курсы", def: "Онлайн-школа или учебный центр: каталог программ, преподаватели, отзывы, цены; цель — заявка, покупка, пробный урок", multipage: true, priority: [0]}
      - {id: campaign-site, name: "Спецпроект или кампания из нескольких страниц", def: "Запуск, промо, коллаборация бренда из 2–6 страниц-глав (L2 по умолчанию); цель — внимание и одно действие", multipage: true, priority: [3]}
      - {id: ecommerce-store, name: "Интернет-магазин", def: "Каталог, корзина, оформление, оплата — вне рамок (будущая база); промо товара — page-type:landing-product", status: out-of-scope}
      - {id: web-app, name: "Веб-сервис после входа", def: "Кабинет, админка, SaaS-продукт — ux и ui; с сайтом — два пакета с общим DESIGN.md", status: out-of-scope}
      - {id: media-portal, name: "Медиа и новостной портал", def: "Поток публикаций, рубрики, реклама площадки", status: out-of-scope}
      - {id: docs-site, name: "Документация и база знаний", def: "Справка, API, руководства продукта", status: out-of-scope}
      - {id: marketplace, name: "Площадка многих продавцов", def: "Каталог объявлений или товаров разных продавцов", status: out-of-scope}

  # ---------------------------------------------------------------------------------------------------------------
  page_type:
    name: "Тип страницы"
    owner: "site 02; порядок секций — site 03, карты — site 06"
    fields: "class — landing | multipage | content | utility; genre — жанр text (landing, site-page, article); priority — как у site_type"
    values:
      # --- лендинги (могут жить и внутри многостраничника)
      - {id: landing-lead-services, name: "Лендинг лидогенерации услуг", def: "Заявка, звонок, расчёт или запись на услугу — локальную или B2B", class: landing, genre: landing, priority: 1}
      - {id: landing-saas, name: "Лендинг SaaS или ИИ-продукта", def: "Регистрация, пробный период или запрос демо цифрового продукта", class: landing, genre: landing, priority: 2}
      - {id: landing-product, name: "Промо товара", def: "Физический продукт или линейка («как у Apple»): покупка, предзаказ или переход к продавцу — без каталога и корзины", class: landing, genre: landing, priority: 2}
      - {id: landing-campaign, name: "Кампания, запуск, спецпроект", def: "Акция, запуск, коллаборация бренда (L2 по умолчанию): внимание и одно действие", class: landing, genre: landing, priority: 3}
      - {id: landing-event, name: "Мероприятие или вебинар", def: "Офлайн или онлайн-событие: регистрация или покупка билета до даты события", class: landing, genre: landing, priority: 0}
      - {id: landing-course, name: "Курс или программа обучения", def: "Заявка, покупка, пробный урок; решение дорогое и долгое", class: landing, genre: landing, priority: 0}
      - {id: landing-app, name: "Мобильное приложение", def: "Установка из магазина приложений; часто трафик с телефона", class: landing, genre: landing, priority: 0}
      - {id: landing-waitlist, name: "Лист ожидания, предзаказ до запуска", def: "Почта или предоплата до выхода продукта; доказательств мало, обещание — главное", class: landing, genre: landing, priority: 0}
      - {id: landing-lead-magnet, name: "Лендинг лид-магнита", def: "Полезный материал (гайд, чек-лист, шаблон, отчёт) в обмен на контакт", class: landing, genre: landing, priority: 0}
      # --- страницы многостраничника
      - {id: home-multipage, name: "Главная многостраничного сайта", def: "Кто мы, что предлагаем, куда идти дальше: маршруты к разделам и главное действие", class: multipage, genre: site-page, priority: 4}
      - {id: services-index-page, name: "Список услуг", def: "Услуги или направления со ссылками на страницы услуг и ценами «от»", class: multipage, genre: site-page, priority: 1}
      - {id: service-page, name: "Страница услуги", def: "Одна услуга: что входит, цена, процесс, доказательства, заявка", class: multipage, genre: site-page, priority: 1}
      - {id: seo-landing-page, name: "SEO-страница под запрос", def: "Услуга или категория × город, отрасль, задача; часто серия по одному шаблону", class: multipage, genre: article, priority: 1}
      - {id: feature-page, name: "Страница функции продукта", def: "Одна функция: что делает, как выглядит, для кого, переход к регистрации", class: multipage, genre: site-page, priority: 2}
      - {id: use-case-page, name: "Сценарий или решение", def: "Продукт для отрасли, роли, размера компании или задачи", class: multipage, genre: site-page, priority: 2}
      - {id: pricing-page, name: "Тарифы и цены", def: "Планы, сравнение, что входит, вопросы о цене и оплате", class: multipage, genre: site-page, priority: 2}
      - {id: comparison-page, name: "Сравнение «мы против X»", def: "Честное сравнение с одним конкурентом или способом: кому что подходит", class: multipage, genre: site-page, priority: 2}
      - {id: alternatives-page, name: "«Альтернативы X»", def: "Обзор вариантов для ищущих замену конкуренту; наш продукт среди них", class: multipage, genre: article, priority: 2}
      - {id: case-page, name: "Кейс", def: "Клиент, задача, решение, результат с числами из фактов, цитата клиента", class: multipage, genre: site-page, priority: 4}
      - {id: case-list-page, name: "Список кейсов", def: "Кейсы или проекты с фильтром по отрасли, услуге, задаче", class: multipage, genre: site-page, priority: 4}
      - {id: portfolio-page, name: "Работы, портфолио", def: "Сетка проектов студии или автора; у портфолио-сайта часто совпадает с главной", class: multipage, genre: site-page, priority: 0}
      - {id: about-page, name: "О компании", def: "История, миссия, люди, цифры, документы — доверие к исполнителю", class: multipage, genre: site-page, priority: 4}
      - {id: team-page, name: "Команда", def: "Врачи, мастера, преподаватели, эксперты: фото, опыт, специализация", class: multipage, genre: site-page, priority: 1}
      - {id: reviews-page, name: "Отзывы", def: "Подборка отзывов с источниками и рейтинги внешних площадок", class: multipage, genre: site-page, priority: 1}
      - {id: faq-page, name: "Вопросы и ответы", def: "Ответы об услугах, оплате, доставке, гарантиях; только на многостраничнике", class: multipage, genre: site-page, priority: 0}
      - {id: contacts-page, name: "Контакты", def: "Адрес, карта, телефоны, мессенджеры, часы работы, реквизиты, форма", class: multipage, genre: site-page, priority: 4}
      - {id: careers-page, name: "Вакансии", def: "Работа в компании: условия, список вакансий, отклик", class: multipage, genre: site-page, priority: 0}
      - {id: form-page, name: "Страница формы", def: "Отдельная страница с формой: запрос демо, расчёт, запись, бриф", class: multipage, genre: site-page, priority: 0}
      # --- страницы многостраничника из карт сайтов (06-multipage-ia/01 §2)
      - {id: specialist-page, name: "Страница специалиста", def: "Один специалист: врач, преподаватель, эксперт, спикер — специализация, опыт, образование, услуги или программы, запись; персональные данные — с разрешением (site 08)", class: multipage, genre: site-page, priority: 1}
      - {id: location-page, name: "Страница филиала", def: "Филиал или точка: адрес, часы, как добраться, карта, телефон, специалисты точки; только при ≥ 2 адресах, у каждой — свои факты", class: multipage, genre: site-page, priority: 1}
      - {id: program-catalog-page, name: "Каталог программ", def: "Каталог программ школы с фильтрами (направление, уровень, длительность; фильтры noindex) и хабы направлений", class: multipage, genre: site-page, priority: 0}
      - {id: documents-page, name: "Документы и допуски", def: "Лицензии, сертификаты, СРО, допуски организации (факты credential) — не юридическая политика сайта", class: multipage, genre: site-page, priority: 4}
      - {id: event-program-page, name: "Программа события", def: "Программа многодневного события: дни, треки, доклады с временем и часовым поясом", class: multipage, genre: site-page, priority: 0, status: proposed}
      - {id: speakers-page, name: "Спикеры события", def: "Хаб спикеров события: фото с согласием, роль, тема доклада, ссылка на specialist-page", class: multipage, genre: site-page, priority: 0, status: proposed}
      - {id: integrations-page, name: "Интеграции", def: "Каталог интеграций SaaS: что с чем связывается, как подключить; хаб → интеграция × N", class: multipage, genre: site-page, priority: 2, status: proposed}
      - {id: security-page, name: "Безопасность и данные", def: "Где хранятся данные, сертификаты, соответствие 152-ФЗ и GDPR, доступы — страница доверия SaaS", class: multipage, genre: site-page, priority: 2, status: proposed}
      # --- контент
      - {id: blog-index-page, name: "Список статей", def: "Блог или база знаний: рубрики, свежие материалы", class: content, genre: article, priority: 0}
      - {id: article-page, name: "Статья", def: "Статья блога или справочный материал: экспертный текст, автор, дата, источники", class: content, genre: article, priority: 0}
      # --- служебные
      - {id: thank-you-page, name: "Страница «спасибо»", def: "После действия: подтверждение, что будет дальше, следующий шаг", class: utility, genre: site-page, priority: 0}
      - {id: not-found-page, name: "Страница 404", def: "Что случилось, поиск или пути на главные разделы, главное действие", class: utility, genre: site-page, priority: 0}
      - {id: legal-page, name: "Юридическая страница", def: "Политика обработки ПД, согласие, оферта, условия, политика cookie (право — site 08)", class: utility, genre: site-page, priority: 0}
      - {id: search-results-page, name: "Результаты поиска по сайту", def: "Результаты поиска по сайту: новый сайт — путь закрыт в robots.txt (Disallow), уже в индексе — noindex до выпадения, не оба; «ничего не найдено» — как 404 с путями", class: utility, genre: site-page, priority: 0}
      - {id: html-sitemap-page, name: "HTML-карта сайта", def: "Список разделов и страниц для людей на большом сайте (≥ сотни страниц); ссылка из подвала", class: utility, genre: site-page, priority: 0, status: proposed}
      # --- вне рамок
      - {id: ecommerce-catalog-page, name: "Каталог магазина", def: "Список товаров с фильтрами — вне рамок", status: out-of-scope}
      - {id: ecommerce-product-page, name: "Карточка товара магазина", def: "PDP с корзиной — вне рамок; промо товара — landing-product", status: out-of-scope}
      - {id: web-app-screen, name: "Экран веб-сервиса", def: "Рабочий экран после входа — ux", status: out-of-scope}

  # ---------------------------------------------------------------------------------------------------------------
  section_role:
    name: "Роль секции в сюжете страницы"
    owner: "site: id — site 02, определения, обязательность и порядок — site 03; text — сюжет словами по ролям"
    fields: "group — ступень сюжета: chrome, promise, problem, value, proof, offer, risk, action, info"
    values:
      - {id: header, name: "Шапка", def: "Логотип (ссылка на главную), навигация, контакт или призыв; включает строку объявления", group: chrome}
      - {id: hero, name: "Первый экран", def: "Обещание — что это и зачем; главный призыв или признак продолжения", group: promise}
      - {id: problem, name: "Проблема", def: "Боль или ситуация посетителя, которую снимает предложение", group: problem}
      - {id: solution, name: "Решение", def: "Как продукт или услуга меняет ситуацию посетителя", group: value}
      - {id: benefits, name: "Выгоды и функции", def: "Чем предложение полезно: выгоды, функции, преимущества (обычно карточками)", group: value}
      - {id: how-it-works, name: "Как это работает", def: "Шаги использования продукта или этапы услуги", group: value}
      - {id: product-demo, name: "Показ продукта", def: "Скриншоты, мокапы, видео, живое демо", group: value}
      - {id: specs, name: "Характеристики", def: "Параметры товара, услуги или тарифа «параметр — значение»", group: value}
      - {id: audience, name: "Для кого", def: "Сегменты, роли, отрасли, сценарии: кому подойдёт и кому нет", group: value}
      - {id: integrations, name: "Интеграции и партнёры", def: "С чем работает продукт; экосистема", group: value}
      - {id: story, name: "Эпизод сюжета", def: "Манифест, глава истории, визуальная пауза без прямой продажи (сайт-история, L2)", group: value}
      - {id: proof-logos, name: "Логотипы клиентов", def: "Клиенты или партнёры как доказательство («нам доверяют»; только с разрешением)", group: proof}
      - {id: proof-stats, name: "Ряд цифр", def: "Результаты и масштаб числами — только из фактов заказчика", group: proof}
      - {id: testimonials, name: "Отзывы", def: "Отзывы клиентов: текст, видео, рейтинги площадок", group: proof}
      - {id: case-studies, name: "Кейсы", def: "Результаты клиентов: задача, решение, итог с числами", group: proof}
      - {id: awards-press, name: "Награды, пресса, документы", def: "Награды, рейтинги, публикации в СМИ, сертификаты, лицензии", group: proof}
      - {id: portfolio, name: "Работы", def: "Работы и галерея как доказательство мастерства", group: proof}
      - {id: team, name: "Команда", def: "Кто делает работу: люди, опыт, специализация", group: proof}
      - {id: services, name: "Перечень услуг", def: "Услуги или продукты с ценами «от» и ссылками на подробности", group: offer}
      - {id: offer, name: "Состав и условия", def: "Что входит, сроки, формат, старт — условия предложения, кроме цены", group: offer}
      - {id: pricing, name: "Тарифы и цены", def: "Цена, тарифы, прайс", group: offer}
      - {id: comparison, name: "Сравнение", def: "С альтернативами (конкуренты, «сделать самому», бездействие) или между тарифами", group: offer}
      - {id: promo, name: "Спецпредложение", def: "Акция, скидка, бонус с честным сроком или ограничением", group: offer}
      - {id: cross-sell, name: "Смежные предложения", def: "Приложение, смежные услуги, подарочные карты в хвосте страницы (10 из 30 страниц, позиция 0,82)", group: offer}
      - {id: guarantee, name: "Гарантии и снятие риска", def: "Возврат, договор, пробный период, бесплатный первый шаг", group: risk}
      - {id: objections, name: "Ответы на возражения", def: "Главные сомнения и ответы рядом с решением (не FAQ)", group: risk}
      - {id: faq, name: "Частые вопросы", def: "Остаточные вопросы о продукте, оплате, сроках", group: risk}
      - {id: cta-band, name: "Промежуточный призыв", def: "Призыв между секциями после довода", group: action}
      - {id: lead-form, name: "Захват заявки", def: "Форма, квиз, калькулятор, запись — захват контакта или намерения", group: action}
      - {id: final-cta, name: "Финальный призыв", def: "Последнее предложение действия в конце страницы", group: action}
      - {id: about, name: "О компании", def: "История, миссия, основатель, цифры о себе", group: info}
      - {id: contacts, name: "Контакты", def: "Адрес, карта, телефоны, мессенджеры, часы работы, реквизиты", group: info}
      - {id: event-program, name: "Программа", def: "Программа мероприятия или курса: расписание, модули, спикеры, площадка", group: info}
      - {id: article-body, name: "Тело статьи", def: "Текст статьи или справочного материала", group: info}
      - {id: related, name: "Связанные материалы", def: "Перелинковка: статьи, кейсы, услуги по теме", group: info}
      - {id: seo-text, name: "SEO-текст", def: "Текст под поисковый запрос внизу страницы (5 из 30 страниц, позиция 0,73); польза и риск — site 07, text", group: info}
      - {id: legal, name: "Юридическое", def: "Юридический документ, дисклеймер, маркировка рекламы", group: info}
      - {id: confirmation, name: "Подтверждение", def: "Действие принято: статус и следующий шаг («спасибо»)", group: info}
      - {id: not-found, name: "Страница не найдена", def: "Что случилось и куда идти (404)", group: info}
      - {id: utility, name: "Служебное", def: "Вне сюжета: баннер cookie, чат-виджет, всплывающее окно", group: chrome}
      - {id: footer, name: "Подвал", def: "Навигация, контакты, реквизиты, правовые ссылки, соцсети", group: chrome}
      - {id: other, name: "Не классифицировано", def: "Только для замеров: секция не подошла ни к одной роли", group: chrome, status: measurement-only}

  # ---------------------------------------------------------------------------------------------------------------
  block_family:
    name: "Семейство блоков"
    owner: "site 02 (id), site 04 (состав семейств и карточки блоков)"
    values:
      - {id: header-nav, name: "Шапка и навигация", def: "Шапка, строка объявления, навигация по странице, крошки"}
      - {id: hero, name: "Первый экран", def: "Варианты анатомии первого экрана"}
      - {id: proof, name: "Доказательства", def: "Логотипы, цифры, отзывы, кейсы, награды, документы"}
      - {id: value, name: "Ценность", def: "Функции, выгоды, шаги, показ продукта, для кого, текст"}
      - {id: offer, name: "Оффер", def: "Услуги, тарифы, цены, условия, акции, гарантии"}
      - {id: conversion, name: "Формы и действия", def: "Заявка, квиз, калькулятор, звонок, запись, контакты"}
      - {id: cta, name: "Призывы", def: "Полоса призыва, липкая панель, всплывающее окно"}
      - {id: faq, name: "Вопросы и ответы", def: "Блок частых вопросов"}
      - {id: about-team, name: "О компании и люди", def: "История, команда, обращение основателя, хронология, вакансии"}
      - {id: contacts, name: "Контакты и карта", def: "Контактные данные, карта, как добраться"}
      - {id: portfolio-gallery, name: "Работы и галереи", def: "Сетка работ, фотогалерея"}
      - {id: event, name: "Мероприятия", def: "Программа, спикеры"}
      - {id: course, name: "Курсы", def: "Программа курса"}
      - {id: resources-blog, name: "Материалы и блог", def: "Статьи, автор, материалы, перелинковка"}
      - {id: footer, name: "Подвал", def: "Подвал сайта"}
      - {id: utility, name: "Служебные", def: "Cookie, «спасибо», 404, юридический текст, чат"}

  # ---------------------------------------------------------------------------------------------------------------
  block:
    name: "Блок (единица анатомии: назначение и набор слотов)"
    owner: "site: id, семейство, строка — site 02; анатомия, варианты раскладки, слоты, мобильное поведение — site 04 (blocks.yaml); визуальные варианты и эффекты — creative по id блока; тексты слотов — text по id слота"
    fields: "family — block_family; serves — роли, которые блок обычно реализует; detect — подсказка распознавания в DOM для замера (site 02/03), не норма. Разная раскладка одной анатомии (split, по центру, на весь экран) — вариант блока (site 04), не отдельный id"
    values:
      # --- header-nav
      - {id: header, family: header-nav, serves: [header], name: "Шапка", def: "Логотип → главная, навигация, контакт или призыв; на телефоне — кнопка меню", detect: "<header> или role=banner вверху; ссылка логотипа на /; ≥ 2 ссылок меню"}
      - {id: announcement-bar, family: header-nav, serves: [header], name: "Строка объявления", def: "Узкая полоса над шапкой: новость, акция, событие; закрывается", detect: "полоса выше шапки, одна строка, ссылка или ×"}
      - {id: anchor-nav, family: header-nav, serves: [header], name: "Навигация по странице", def: "Якоря к секциям длинной страницы, часто липкие", detect: "≥ 3 ссылок #якорь вне шапки; sticky"}
      - {id: breadcrumbs, family: header-nav, serves: [header], name: "Хлебные крошки", def: "Путь от главной до страницы (многостраничник, с третьего уровня)", detect: "nav[aria-label*=bread], BreadcrumbList, разделители › /"}
      # --- hero
      - {id: hero-text, family: hero, serves: [hero], name: "Первый экран из текста", def: "Заголовок, лид, призыв без главного визуала (типографика)", detect: "первая секция с h1; медиа < 30 % площади первого экрана"}
      - {id: hero-media, family: hero, serves: [hero], name: "Первый экран с визуалом", def: "Текст + главный визуал: фото, рендер, иллюстрация, скриншот, видео, 3D", detect: "h1 + картинка, видео, canvas ≥ 30 % первого экрана или фон-медиа"}
      - {id: hero-form, family: hero, serves: [hero, lead-form], name: "Первый экран с формой", def: "Обещание и форма заявки в первом экране", detect: "form с полями tel, email, name в первой секции"}
      - {id: hero-input, family: hero, serves: [hero, product-demo], name: "Первый экран с полем продукта", def: "Поле запроса, поиска, адреса сайта — ценность сразу, без контакта", detect: "input text, url, search + кнопка в первой секции; нет полей контакта"}
      - {id: hero-stat, family: hero, serves: [hero, proof-stats], name: "Первый экран-число", def: "Одно крупное число из фактов как главный элемент", detect: "число кеглем ≥ h1 в первой секции"}
      - {id: hero-quote, family: hero, serves: [hero, testimonials], name: "Первый экран-цитата", def: "Отзыв или слова эксперта как главный элемент (дословно, с разрешением)", detect: "blockquote или кавычки + подпись в первой секции"}
      - {id: hero-letter, family: hero, serves: [hero, story], name: "Первый экран-письмо", def: "Обращение от первого лица без кнопок в первом экране", detect: "проза ≥ 60 слов, обращение, нет кнопок"}
      - {id: hero-carousel, family: hero, serves: [hero], name: "Первый экран-карусель", def: "Несколько сменяющихся слайдов с разными обещаниями (для конверсии — спорно, site 05)", detect: "≥ 2 слайдов, стрелки или точки, автопрокрутка"}
      # --- proof
      - {id: logo-wall, family: proof, serves: [proof-logos, integrations], name: "Логотипы", def: "Ряд или сетка логотипов клиентов, партнёров, СМИ, спонсоров", detect: "≥ 4 мелких img, svg в ряд; alt — названия компаний; подпись «клиенты», «партнёры»"}
      - {id: stat-strip, family: proof, serves: [proof-stats], name: "Ряд цифр", def: "2–5 чисел с подписями (результаты, масштаб)", detect: "≥ 2 крупных чисел с %, +, «лет»; короткие подписи"}
      - {id: testimonial-cards, family: proof, serves: [testimonials], name: "Отзывы карточками", def: "Несколько отзывов сеткой или каруселью: текст или видео, имя, фото, компания", detect: "≥ 2 блоков: цитата + имя (+ фото, должность, ★)"}
      - {id: testimonial-single, family: proof, serves: [testimonials], name: "Один крупный отзыв", def: "Одна цитата крупно с подписью", detect: "1 цитата крупным кеглем + подпись"}
      - {id: review-aggregate, family: proof, serves: [testimonials], name: "Рейтинг площадок", def: "Сводная оценка и отзывы с внешних площадок (Яндекс Карты, 2ГИС, Google, отзовики)", detect: "«4,9», звёзды, названия площадок, виджет iframe"}
      - {id: case-cards, family: proof, serves: [case-studies, portfolio], name: "Карточки кейсов", def: "Клиент или проект, задача, результат, ссылка на кейс", detect: "≥ 2 карточек со ссылками на /case, /cases, /portfolio"}
      - {id: case-study, family: proof, serves: [case-studies], name: "Кейс в секции", def: "Один кейс развёрнуто: ситуация, решение, результат, цитата", detect: "«задача», «решение», «результат» в одной секции"}
      - {id: before-after, family: proof, serves: [case-studies, portfolio], name: "До и после", def: "Сравнение состояния до и после: фото, слайдер, цифры", detect: "пары фото, слайдер-сравнение, слова «до», «после»"}
      - {id: awards-press, family: proof, serves: [awards-press], name: "Награды и пресса", def: "Награды, рейтинги, публикации в СМИ", detect: "значки наград, логотипы СМИ, «о нас пишут»"}
      - {id: credentials, family: proof, serves: [awards-press], name: "Документы и допуски", def: "Лицензии, сертификаты, допуски, членство в СРО — с номерами", detect: "сканы документов, номера лицензий, «сертификаты», «лицензия»"}
      # --- value
      - {id: feature-grid, family: value, serves: [benefits, solution, audience], name: "Сетка карточек", def: "3–6 однотипных карточек выгод или функций: иконка, заголовок, текст", detect: "≥ 3 однотипных карточек: иконка + заголовок + текст"}
      - {id: feature-bento, family: value, serves: [benefits, product-demo], name: "Бенто-сетка", def: "Неравная сетка плиток разного размера (функции, цифры, цитаты, картинки)", detect: "плитки разного размера в одной сетке"}
      - {id: feature-alternating, family: value, serves: [benefits, solution, product-demo], name: "Ряды «текст ↔ картинка»", def: "Функции рядами, медиа меняет сторону (зигзаг)", detect: "≥ 2 рядов текст + медиа со сменой стороны"}
      - {id: feature-tabs, family: value, serves: [product-demo, how-it-works, benefits], name: "Вкладки или липкая прокрутка", def: "Несколько функций в одном месте: вкладки или липкая колонка со сменой картинок", detect: "role=tablist или липкая колонка + сменяющиеся медиа"}
      - {id: feature-spotlight, family: value, serves: [product-demo, solution, story], name: "Одна функция крупно", def: "Визуал на всю ширину и короткий текст — глава продукта", detect: "медиа на всю ширину + ≤ 40 слов"}
      - {id: benefit-list, family: value, serves: [benefits, solution], name: "Список выгод", def: "Пункты списком без карточек", detect: "ul, ol ≥ 3 пунктов, галочки"}
      - {id: steps, family: value, serves: [how-it-works], name: "Шаги", def: "Нумерованные шаги использования или этапы услуги", detect: "нумерация 1…N; «шаг», «этап»"}
      - {id: product-showcase, family: value, serves: [product-demo], name: "Показ продукта", def: "Скриншот или мокап интерфейса с пояснениями", detect: "крупный скриншот или мокап, выноски"}
      - {id: video-showcase, family: value, serves: [product-demo, story, testimonials], name: "Видео с плеером", def: "Ролик о продукте или услуге с управлением (объяснение, демо, отзыв)", detect: "video[controls], iframe YouTube, VK Видео, Rutube; кнопка ▶"}
      - {id: interactive-demo, family: value, serves: [product-demo], name: "Живое демо", def: "Песочница, конфигуратор, «попробуйте» прямо на странице", detect: "интерактивные элементы вне формы контакта: слайдеры, переключатели, живой ввод"}
      - {id: audience-grid, family: value, serves: [audience], name: "Для кого", def: "Карточки сегментов, ролей, отраслей, сценариев", detect: "карточки «для …», «кому подойдёт»"}
      - {id: pain-points, family: value, serves: [problem], name: "Боли клиента", def: "Список проблем или ситуаций посетителя", detect: "«знакомо?», «вы сталкивались», список проблем"}
      - {id: integrations-grid, family: value, serves: [integrations], name: "Интеграции", def: "Логотипы сервисов и платформ со ссылками на описание", detect: "логотипы сервисов со ссылками; «интеграции»"}
      - {id: spec-sheet, family: value, serves: [specs], name: "Таблица характеристик", def: "Строки «параметр — значение»", detect: "table или dl параметр — значение"}
      - {id: prose, family: value, serves: [about, story, problem, solution, article-body, seo-text], name: "Текстовый раздел", def: "Проза без карточек: манифест, история, описание, SEO-текст", detect: "≥ 120 слов прозы без карточек"}
      - {id: media-band, family: value, serves: [story, portfolio], name: "Визуальная пауза", def: "Фото или видео на всю ширину почти без текста", detect: "медиа ≥ 80 % высоты секции; ≤ 15 слов"}
      # --- offer
      - {id: service-cards, family: offer, serves: [services, cross-sell], name: "Карточки услуг", def: "Услуги или продукты: название, цена «от», ссылка на страницу", detect: "≥ 3 карточек с названием услуги и ценой «от» или ссылкой"}
      - {id: pricing-cards, family: offer, serves: [pricing], name: "Тарифы карточками", def: "2–4 плана: цена, период, состав, кнопка", detect: "≥ 2 карточек с ценой (₽, $) и периодом, кнопки"}
      - {id: pricing-table, family: offer, serves: [pricing, services], name: "Прайс-лист", def: "Строки «услуга — цена»", detect: "таблица или список строк с ценами «от»"}
      - {id: pricing-single, family: offer, serves: [pricing, offer], name: "Одно предложение с ценой", def: "Цена и состав одного пакета, курса, билета или товара", detect: "одна цена + «что входит» + кнопка"}
      - {id: comparison-table, family: offer, serves: [comparison, pricing], name: "Таблица сравнения", def: "С альтернативами или между тарифами по строкам-признакам", detect: "таблица с ✓, ✗ по колонкам"}
      - {id: offer-details, family: offer, serves: [offer], name: "Состав и условия", def: "Что входит, сроки, формат, место, старт", detect: "«что входит», «условия», «сроки»"}
      - {id: key-facts, family: offer, serves: [offer, specs], name: "Ключевые параметры", def: "Ряд параметров предложения (старт, длительность, формат, место, цена «от») — не доказательство", detect: "2–6 пар «параметр: значение»"}
      - {id: promo-offer, family: offer, serves: [promo], name: "Спецпредложение", def: "Акция с датой окончания или лимитом из фактов (честная срочность — site 05)", detect: "«акция», «скидка до», дата окончания, таймер"}
      - {id: guarantee, family: offer, serves: [guarantee], name: "Гарантия", def: "Условия возврата, договор, пробный период, бесплатный первый шаг", detect: "«гарантия», «вернём деньги», «договор»"}
      # --- conversion
      - {id: lead-form, family: conversion, serves: [lead-form, final-cta], name: "Форма заявки", def: "Секция с формой: имя, телефон или почта, комментарий, согласие", detect: "form с полями name, tel, email, textarea; чекбокс согласия"}
      - {id: quiz, family: conversion, serves: [lead-form], name: "Квиз", def: "Многошаговый опрос с расчётом или подбором и контактом в конце", detect: "шаги «Далее», прогресс «1 из N», варианты ответов"}
      - {id: calculator, family: conversion, serves: [lead-form, pricing], name: "Калькулятор", def: "Расчёт стоимости или выгоды по параметрам с итогом на странице", detect: "поля-параметры + итог «от … ₽» без отправки"}
      - {id: callback-request, family: conversion, serves: [lead-form, final-cta], name: "Обратный звонок", def: "Телефон и удобное время для звонка", detect: "поле tel + «перезвоните», «обратный звонок»"}
      - {id: booking-widget, family: conversion, serves: [lead-form], name: "Запись на время", def: "Выбор даты, времени, специалиста или услуги", detect: "календарь, слоты времени, виджеты YCLIENTS, DIKIDI"}
      - {id: email-capture, family: conversion, serves: [lead-form, final-cta], name: "Поле почты", def: "Одна строка почты: рассылка, лист ожидания, материал", detect: "1 поле email + кнопка"}
      - {id: lead-magnet, family: conversion, serves: [lead-form], name: "Материал за контакт", def: "Обложка материала, что внутри, форма получения", detect: "обложка + «скачать», «получить» + форма"}
      - {id: contact-channels, family: conversion, serves: [final-cta, contacts], name: "Способы связи", def: "Кнопки: телефон, мессенджеры, почта, чат", detect: "ссылки tel:, mailto:, t.me, wa.me, max.ru, vk.me"}
      - {id: app-download, family: conversion, serves: [final-cta, cta-band, cross-sell], name: "Скачать приложение", def: "Бейджи магазинов приложений и QR-код", detect: "бейджи App Store, Google Play, RuStore, AppGallery; QR"}
      # --- cta
      - {id: cta-band, family: cta, serves: [cta-band, final-cta], name: "Полоса призыва", def: "Заголовок, строка и 1–2 кнопки; промежуточная или финальная", detect: "заголовок + ≤ 2 кнопок без полей формы"}
      - {id: sticky-cta, family: cta, serves: [cta-band], name: "Липкая панель призыва", def: "Кнопка, закреплённая при прокрутке (обычно внизу на телефоне)", detect: "position fixed или sticky с кнопкой"}
      - {id: capture-popup, family: cta, serves: [utility, lead-form], name: "Всплывающее окно захвата", def: "Модальное окно с формой по таймеру, прокрутке или уходу; по умолчанию выключено", detect: "модальное окно с формой без действия посетителя"}
      # --- faq
      - {id: faq, family: faq, serves: [faq, objections], name: "Вопросы и ответы", def: "Пары «вопрос — ответ»: аккордеон или открытый список", detect: "details/summary, aria-expanded, FAQPage, строки с «?»"}
      # --- about-team
      - {id: about-story, family: about-team, serves: [about], name: "О компании", def: "История, миссия, год основания, цифры о себе, фото", detect: "«о нас», «история», год основания"}
      - {id: team-grid, family: about-team, serves: [team, event-program], name: "Люди", def: "Карточки людей: фото, имя, роль, опыт (команда, врачи, преподаватели)", detect: "≥ 2 карточек: фото + имя + должность"}
      - {id: founder-note, family: about-team, serves: [about, story], name: "Обращение основателя", def: "Текст от первого лица с подписью и фото", detect: "подпись, «я», фото основателя"}
      - {id: timeline, family: about-team, serves: [about, how-it-works], name: "Хронология", def: "История или этапы на временной шкале", detect: "годы или даты по порядку"}
      - {id: job-list, family: about-team, serves: [offer], name: "Вакансии", def: "Список должностей со ссылками и откликом", detect: "список должностей; «вакансии»"}
      # --- contacts
      - {id: contact-details, family: contacts, serves: [contacts], name: "Контактные данные", def: "Адрес, телефоны, часы работы, мессенджеры, реквизиты", detect: "адрес, «часы работы», tel:, ИНН, ОГРН"}
      - {id: location-map, family: contacts, serves: [contacts, event-program], name: "Карта", def: "Карта с точкой и «как добраться»", detect: "iframe или скрипт Яндекс Карт, 2ГИС, Google Maps"}
      - {id: service-area, family: contacts, serves: [contacts, offer], name: "Зона обслуживания", def: "Куда выезжаем: районы и города, условия и цена выезда, сроки — для выездных услуг", detect: "список районов или городов, «выезд», «работаем по», карта-зона без точки"}
      # --- portfolio-gallery
      - {id: portfolio-grid, family: portfolio-gallery, serves: [portfolio], name: "Сетка работ", def: "Проекты: картинка, название, ссылка на проект", detect: "≥ 4 карточек с картинкой и названием проекта"}
      - {id: gallery, family: portfolio-gallery, serves: [portfolio, story, about], name: "Фотогалерея", def: "Фото интерьера, работ, события сеткой или каруселью", detect: "сетка или карусель ≥ 4 фото без текста карточек; лайтбокс"}
      # --- event
      - {id: event-agenda, family: event, serves: [event-program], name: "Программа мероприятия", def: "Расписание по времени или дням: доклады, секции", detect: "время «10:00», дни, доклады"}
      - {id: speakers-grid, family: event, serves: [event-program, team], name: "Спикеры", def: "Фото, имя, компания, тема выступления", detect: "фото + имя + компания + тема доклада"}
      # --- course
      - {id: curriculum, family: course, serves: [event-program], name: "Программа курса", def: "Модули и темы, часто аккордеоном", detect: "«модуль», «урок», аккордеон тем"}
      # --- resources-blog
      - {id: article-cards, family: resources-blog, serves: [related], name: "Карточки статей", def: "Статьи: дата, заголовок, анонс, ссылка", detect: "≥ 2 карточек с датой и ссылкой на /blog, /articles"}
      - {id: article-body, family: resources-blog, serves: [article-body], name: "Тело статьи", def: "Текст с подзаголовками, оглавлением, иллюстрациями", detect: "article, h2, h3, ≥ 300 слов"}
      - {id: author-bio, family: resources-blog, serves: [article-body, team], name: "Об авторе", def: "Фото, имя, опыт и регалии автора материала", detect: "фото + имя + регалии автора"}
      - {id: resource-list, family: resources-blog, serves: [related], name: "Материалы для скачивания", def: "Документы, прайсы, презентации", detect: "ссылки .pdf, .docx, .pptx; «скачать»"}
      - {id: related-links, family: resources-blog, serves: [related], name: "Связанные материалы", def: "«Читайте также»: статьи, кейсы, услуги по теме", detect: "«читайте также», «похожие», список ссылок"}
      # --- footer
      - {id: footer, family: footer, serves: [footer], name: "Подвал", def: "Навигация, контакты, реквизиты, правовые ссылки, соцсети", detect: "<footer> или role=contentinfo"}
      # --- utility
      - {id: cookie-banner, family: utility, serves: [utility], name: "Баннер cookie", def: "Уведомление или согласие на cookie (немодальное, равные «Принять» и «Отклонить» — site 08)", detect: "фиксированная панель со словами cookie, куки"}
      - {id: thank-you, family: utility, serves: [confirmation], name: "Спасибо", def: "Подтверждение действия, что будет дальше, следующий шаг", detect: "«спасибо», «заявка принята»"}
      - {id: not-found, family: utility, serves: [not-found], name: "Содержимое 404", def: "Объяснение и пути дальше", detect: "«404», «страница не найдена»"}
      - {id: legal-text, family: utility, serves: [legal], name: "Юридический текст", def: "Документ: политика, согласие, оферта, условия", detect: "длинный текст с пунктами 1.1, 1.2; «персональные данные»"}
      - {id: chat-widget, family: utility, serves: [utility], name: "Чат-виджет", def: "Сторонний виджет онлайн-чата или мессенджера в углу", detect: "Jivo, Bitrix24, Carrot quest, Intercom, Crisp; iframe в углу"}
      # --- только замер
      - {id: other, family: utility, serves: [other], name: "Не распознано", def: "Только для замеров: блок не подошёл ни к одному id", status: measurement-only}

  # ---------------------------------------------------------------------------------------------------------------
  slot_kind:
    name: "Вид слота"
    owner: "common/owners.md §Форматы обмена, формат page-plan"
    values:
      - {id: text, name: "Текст", def: "Назначение, длина, уровень заголовка; правила текста — text (copy-slots.yaml) по id слота"}
      - {id: media, name: "Медиа", def: "Картинка, видео, иконка, карта; коды задач и план ассетов — ai-media 01/01 §8"}
      - {id: 3d, name: "3D", def: "3D-объект или сцена; рецепты — 3d 12-recipes"}
      - {id: data, name: "Данные", def: "Ссылка на факт заказчика (fact:<id>) нужного вида; нет факта — нет слота"}
      - {id: action, name: "Действие", def: "Призыв, форма, ссылка, телефон, мессенджер; id действия (action) и событие аналитики"}
      - {id: treatment, name: "Подача", def: "Визуальная роль, эффект, уровень движения — значения задаёт creative"}

  # ---------------------------------------------------------------------------------------------------------------
  slot:
    name: "Слот блока"
    owner: "site: id слотов в blocks.yaml и page-plan (site 02, site 04); text — правила текстовых слотов по id (copy-slots.yaml); creative — значения treatment; ai-media — медиа по коду задачи"
    fields: "kind — slot_kind; scope — section (по умолчанию) или page (мета страницы); fact_kinds — виды фактов text facts.schema.yaml для data-слотов; текстовые id совпадают со slot_type text (временный словарь text и copy-slots.yaml) — equal"
    values:
      # --- text: мета страницы (scope: page)
      - {id: meta-title, kind: text, scope: page, name: "<title>", def: "Заголовок страницы для поиска и вкладки"}
