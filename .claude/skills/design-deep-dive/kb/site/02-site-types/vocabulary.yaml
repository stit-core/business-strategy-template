      - {id: L1, name: "Выразительно", def: "Определение — creative; умолчание для лендингов"}
      - {id: L2, name: "Иммерсивно, «вау»", def: "Определение — creative; умолчание для кампаний"}

  # ---------------------------------------------------------------------------------------------------------------
  conversion_channel:
    name: "Канал приёма целевого действия"
    owner: "site 01 (поле site-brief conversion.channels, $defs.conversion-channel); механика и число полей — site 05 (lead-forms.yaml)"
    fields: "Не путать с атрибутом channel у traffic_source (группа атрибуции — site 07). Запрет «только мессенджер, недоступный части аудитории РФ» — site 05, lead-forms.yaml forbidden"
    values:
      - {id: form, name: "Форма", def: "Лид-форма на странице или отдельной странице (lead-forms.yaml)"}
      - {id: quiz, name: "Квиз", def: "Многошаговый опрос с контактом на последнем шаге (block:quiz)"}
      - {id: calculator, name: "Калькулятор", def: "Расчёт цены по 1–3 параметрам с формой результата (block:calculator)"}
      - {id: phone, name: "Телефон", def: "Звонок по tel: (коллтрекинг — analytics.call_tracking)"}
      - {id: callback, name: "Обратный звонок", def: "Форма «перезвоните мне» (block:callback-request)"}
      - {id: messenger, name: "Мессенджер", def: "MAX, Telegram, WhatsApp, VK — по доступности аудитории (site 05/01 §6.3)"}
      - {id: chat, name: "Чат на сайте", def: "Виджет чата; сбор контакта — как форма (req:LR-RU-23)"}
      - {id: email, name: "Почта", def: "mailto: или адрес для писем"}
      - {id: booking-widget, name: "Виджет записи", def: "Запись на время со слотами (block:booking-widget)"}
      - {id: checkout, name: "Оформление заказа", def: "Оплата на сайте (промо товара, билеты) — право продажи (req:LR-RU-15)"}
      - {id: store, name: "Магазин приложений", def: "App Store, Google Play, RuStore, AppGallery"}
      - {id: external-platform, name: "Внешняя площадка", def: "Регистрация, покупка или запись на чужой платформе (Timepad, маркетплейс, агрегатор)"}

  # ---------------------------------------------------------------------------------------------------------------
  procedure_step:
    name: "Шаг процедуры «бриф → страницы»"
    owner: "site 10 (процедура: 10-playbooks-contracts/01-procedure-brief-to-pages.md); имена шагов и каталог дефектов DEF-* — site 09 (09-ai-generation-evaluation)"
    fields: "order — порядок; artifact — что остаётся на выходе; check — входной контроль (SITE-PRE, утилиты)"
    values:
      - {id: intake, order: 1, name: "Разбор и бриф", def: "Разбор сообщения заказчика, вопросы, бриф draft → proposed → approved", artifact: "site-brief.yaml", check: "SITE-PRE-01…09; site_validate.py brief"}
      - {id: proof, order: 2, name: "Доказательства", def: "Анкета доказательств, facts.yaml с источниками, датами и разрешениями", artifact: "facts.yaml (формат text)", check: "SITE-PRE-05, 06; SB-P01"}
      - {id: site-type, order: 3, name: "Тип сайта и плейбук", def: "Тип сайта и главной страницы по дереву site 02/01 §6; плейбук site 10/02, 10/03", artifact: "site_type, primary_page_type, строка плейбука", check: "SITE-PRE-02"}
      - {id: site-map, order: 4, name: "Карта сайта", def: "Страницы, шаблоны, общая шапка и подвал, перелинковка, языки, порядок сборки (многостраничник; лендинг — карта из 1 страницы и служебных)", artifact: "site-map.yaml", check: "SITE-PRE-10; site_validate.py map"}
      - {id: page-plan, order: 5, name: "Планы страниц", def: "page-plan на каждую страницу и шаблон: цель, трафик, форма, секции, слоты, события", artifact: "plans/*.yaml", check: "SITE-PRE-11…24; site_validate.py plan"}
      - {id: sister-sync, order: 6, name: "Синхронизация с сёстрами", def: "copy-deck (text), art-direction и treatment (creative), план ассетов (ai-media), 3D (3d)", artifact: "copy-deck, treatment, asset-plan, рецепты 3D", check: "SITE-PRE-25; plan_to_assets.py"}
      - {id: plan-check, order: 7, name: "Проверка до сборки", def: "Входной контракт SITE-PRE: незакрытый блокер — не собирать", artifact: "отчёт site_validate.py + SITE-PRE", check: "SITE-PRE-01…26"}
      - {id: package, order: 8, name: "Пакет для кода", def: "Манифест готовности поверхности после приёмки макета на холсте (этап package слоя дизайна): единицы, открытое, пункты после сборки с блоками приёмки site", artifact: "design/<surface>/ready.yaml", check: "SITE-PRE-26; ready.py check"}
      - {id: build-loop, order: 9, name: "Сборка", def: "Страницы <org>/site из снимка стратегии с локом отпечатков: план, тексты, факты, токены ДС, принятый макет", artifact: "сборка <org>/site, лок снимка", check: "проверки <org>/site: снимок равен локу"}
      - {id: gates, order: 10, name: "Ворота и чек-лист", def: "Ворота страницы (page-gates.yaml) и чек-лист сайта SITE-*", artifact: "отчёт page_gates.py, чек-лист", check: "page_gates.py, site-checklist.yaml"}
      - {id: fix, order: 11, name: "Правки", def: "Один дефект — одна правка; полный повтор автопроверок после правки", artifact: "журнал правок", check: "DEF-46; повтор page_gates.py"}
      - {id: acceptance, order: 12, name: "Приёмка", def: "Приёмка заказчиком: блокирующие пробелы закрыты, заглушек нет", artifact: "акт приёмки", check: "DEF-48; COPY-C-04"}
      - {id: measure, order: 13, name: "События и A/B", def: "События и цели после запуска, реестр экспериментов, A/B по методике site 07/04", artifact: "events, реестр экспериментов", check: "SITE-PRE-22; ab_plan.py"}
