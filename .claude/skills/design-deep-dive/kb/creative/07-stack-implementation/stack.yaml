# stack.yaml — каталог стека подачи: платформа браузера, библиотеки, рантаймы, фреймворки, платформы заказчика.
# Владелец: creative. Читают: подача (treatment → стек исполнителя), рецепты, ворота эффектов (вес слоя «подача»), вход холста
# (build.stack), site (стык с constraints.cms). Текст правил — 01-stack-choice.md, код — 02. Проверка — ../../../scripts/creative/validate_stack.py.
# Скоропортящееся — поле checked_at: у записи, если её сверяли позже всего каталога, иначе — у каталога. Записи поддержки
# браузеров (kind: platform) — не реже раза в месяц: Chrome (с 153, 2026-09-08) и Firefox (с 157, 2026-09-29) выходят раз в
# 2 недели; библиотеки, рантаймы и платформы — раз в квартал; всё — перед сборкой (`npm view <пакет> version dist-tags`, BCD,
# заметки к выпускам).

version: 0.1
checked_at: 2026-09-24
status: draft
measure:
  size_br: "минимальный бандл: esbuild 0.25.12, ESM, minify, production, brotli q11 (как в базе 3d); число — сценарий «типовая инициализация», словарь — ключ сцены: {<сцена>: КБ}; wasm — отдельно"
  size_net_kb: "вес по сети на странице (CDP, как ворота): {<сцена или способ загрузки>: КБ}; источник — refs записи"
  init_tbt_ms: "Chromium 153.0.8010.12 headless, CPU ×4, холодный кэш, 5 прогонов: медиана и [мин, макс]; TBT до «готово» + 3 с; load average 6,8–10,3 — сравнивать порядок, не единицы мс"
  support: "@mdn/browser-compat-data 8.1.3 (2026-09-24T13:25Z) и web-features 3.39.0; у записей с checked_at 2026-10-28 — MDN и заметки к выпускам на эту дату; текущие на 2026-10-28: Chrome 156, Firefox 159, Safari 27"
  alive: "npm registry (дата релиза последней версии, стабильных релизов за 365 дней) и GitHub API (звёзды, pushed_at), 2026-09-24; версии и даты выпусков у записей с checked_at 2026-10-28 — на эту дату"
budget_ref: "../01-creative-direction/ambition-levels.yaml#levels[*].budgets.effects.js_presentation_kb_br (по уровню)"
vocab:
  kind: {platform: "возможность браузера, 0 КБ", library: "библиотека движения, прокрутки и переходов: npm-пакет или свой набор базы (motion-kit)", runtime: "рантайм графики или анимации (WebGL, wasm)", framework: "сборка и рендеринг страниц", avoid: "не брать в новый код"}
  status: {default: "умолчание для своих уровней", conditional: "по условию из when", legacy-only: "только на существующем сайте", avoid: "не использовать"}
  effect_ids: "id каталога эффектов 06-effects-catalog/effects.yaml с префиксом effect:"

entries:

  # ---------------------------------------------------------------- платформа браузера (0 КБ)
  - id: css-animations
    name: "CSS transitions, @keyframes, @starting-style, transition-behavior"
    kind: platform
    version: null
    license: "стандарт W3C"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: "@starting-style и transition-behavior — low 2024-08-06", chrome: 117, firefox: 129, safari: "17.5"}
    use_for: [effect:hero-entrance-once, effect:marquee-logos, effect:marquee-text, effect:kinetic-headline, effect:cursor-accent]
    levels: [L0, L1, L2]
    status: default
    alternatives: [waapi, gsap]
    risks: ["LCP-элемент не анимировать из opacity: 0", "бесконечная петля > 5 с — пауза (WCAG 2.2.2)"]
    alive: {kind: web-standard}
    refs: ["01-stack-choice.md §2, §3.1"]

  - id: css-scroll-driven
    name: "CSS scroll-driven animations (animation-timeline: scroll()/view(), animation-range, timeline-scope; JS ScrollTimeline/ViewTimeline)"
    kind: platform
    version: null
    license: "стандарт W3C (Scroll-driven Animations)"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: "low 2026-10-27 (по датам выпусков: Firefox 159 — последний движок)", chrome: 115, edge: 115, safari: "26", safari_ios: "26", samsung: "23", firefox: 159, firefox_android: 159, interop: "2026", feature_check: "@supports ((animation-timeline: scroll()) and (animation-range: 0% 100%))"}
    use_for: [effect:scroll-reveal-system, effect:scroll-driven-progress, effect:parallax-layers, effect:mask-reveal, effect:sticky-stack, effect:pin-scrub-story]
    levels: [L1, L2]
    status: default
    when: "во всех движках; фолбэк — для старых версий: декоративное — без фолбэка, смысловое (текст, цифры, шаги) видно в конечном состоянии, разыгрывание по порогам — IO; pin-scrub-story на CSS — декоративный, сложный сюжет закрепления — GSAP"
    alternatives: [intersection-observer, gsap-scrolltrigger, motion]
    risks: ["старые версии (Safari < 26, Firefox < 159) — содержимое обязано быть видно без анимации", "шорткат animation после animation-timeline сбрасывает таймлайн", "scroll-timeline-polyfill не использовать", "timeline-scope в Firefox 159 не сверен", "Firefox стендом не проверялся"]
    alive: {kind: web-standard, practice: "2 из 49 наградных сайтов"}
    checked_at: 2026-10-28
    refs: ["01-stack-choice.md §3.1", "S7, S8, S10, S35, S36"]

  - id: css-scroll-triggered
    name: "CSS scroll-triggered animations (timeline-trigger, animation-trigger, trigger-scope)"
    kind: platform
    version: null
    license: "черновик CSS WG"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: false, chrome: 146, firefox: false, safari: false, note: "Chrome 146 — по умолчанию; у Gecko и WebKit сигнала нет"}
    use_for: [effect:scroll-reveal-system]
    levels: [L1, L2]
    status: conditional
    when: "только прогрессивное улучшение поверх IntersectionObserver"
    alternatives: [intersection-observer]
    risks: ["только Chrome", "синтаксис может меняться (черновик)"]
    alive: {kind: web-standard-draft}
    checked_at: 2026-10-28
    refs: ["01-stack-choice.md §3.1", "S9, S37"]

  - id: view-transitions-same-document
    name: "View Transitions, same-document (document.startViewTransition, view-transition-name/class, types)"
    kind: platform
    version: null
    license: "стандарт W3C (CSS View Transitions 1–2)"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: "low 2025-10-14", chrome: 111, firefox: 144, safari: "18", types: {chrome: 125, firefox: 147, safari: "18.2"}, scoped_element_vt: "Chrome 147 по умолчанию", interop: "2026"}
    use_for: [effect:view-transition]
    levels: [L1, L2]
    status: default
    alternatives: [gsap-flip]
    risks: ["после VT со сменой раскладки — ScrollTrigger.refresh()", "reduce: не запускать (проверка matchMedia)"]
    alive: {kind: web-standard}
    checked_at: 2026-10-28
    refs: ["01-stack-choice.md §5", "02-implementation-patterns.md §7", "S36, S37"]

  - id: view-transitions-cross-document
    name: "View Transitions, cross-document (@view-transition { navigation: auto }, pageswap/pagereveal)"
    kind: platform
    version: null
    license: "стандарт W3C (CSS View Transitions 2)"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: false, chrome: 126, safari: "18.2", samsung: "28", firefox: false, pagereveal: {chrome: 123, safari: "18.2", firefox: false}, interop: "2026"}
    use_for: [effect:page-transition]
    levels: [L1, L2]
    status: default
    when: "многостраничник (MPA); правило внутри @media (prefers-reduced-motion: no-preference); 1–3 общих view-transition-name"
    alternatives: [swup, astro-client-router]
    risks: ["Firefox — обычная навигация (межстраничные VT — в Interop 2026)", "состояние (видео, WebGL) между страницами не сохраняется — тогда swup/Astro"]
    alive: {kind: web-standard}
    checked_at: 2026-10-28
    refs: ["01-stack-choice.md §5", "S10, S11, S36"]

  - id: waapi
    name: "Web Animations API (element.animate, getAnimations, commitStyles)"
    kind: platform
    version: null
    license: "стандарт W3C"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: "high 2023-03-16", chrome: 84, firefox: 75, safari: "14"}
    use_for: [effect:counter-up, effect:magnetic-cta, effect:hero-entrance-once]
    levels: [L0, L1, L2]
    status: default
    alternatives: [motion-mini]
    risks: []
    alive: {kind: web-standard}
    refs: ["01-stack-choice.md §3.3"]

  - id: intersection-observer
    name: "IntersectionObserver + свой код (reveal, ленивый запуск, пауза вне экрана)"
    kind: platform
    version: null
    license: "стандарт W3C"
    size_br: 0.2
    init_tbt_ms: {median: 0, range: [0, 0]}
    support: {baseline: "high 2021-09-25", chrome: 58, firefox: 55, safari: "12.1"}
    use_for: [effect:scroll-reveal-system, effect:counter-up]
    levels: [L0, L1, L2]
    status: default
    alternatives: [css-scroll-driven, css-scroll-triggered]
    risks: ["requestIdleCallback нет в Safari — фолбэк setTimeout"]
    alive: {kind: web-standard}
    refs: ["02-implementation-patterns.md §3"]

  - id: css-registered-properties
    name: "@property / CSS.registerProperty (анимация градиентов, углов, чисел)"
    kind: platform
    version: null
    license: "стандарт W3C"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: "low 2024-07-09", chrome: 85, firefox: 128, safari: "16.4"}
    use_for: [effect:mesh-gradient-css, effect:counter-up]
    levels: [L0, L1, L2]
    status: default
    alternatives: [shader-code]
    risks: ["анимированный градиент на весь экран — цена перерисовки (замер — 06-effects-catalog)"]
    alive: {kind: web-standard}
    refs: ["01-stack-choice.md §2"]

  - id: html-media
    name: "<video muted loop playsinline poster>, AVIF/WebP-секвенции, SVG-зерно"
    kind: platform
    version: null
    license: "стандарт WHATWG"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: "high"}
    use_for: [effect:video-loop-hero, effect:cinemagraph, effect:grain-overlay, effect:image-sequence, effect:video-scrub]
    levels: [L0, L1, L2]
    status: default
    alternatives: [dotlottie-web, lottie-web]
    risks: ["кнопка паузы у петли > 5 с", "reduce — постер, 0 байт видео", "вес видео — отдельная метрика"]
    alive: {kind: web-standard}
    refs: ["../06-effects-catalog/02-hero-video-background.md", "ai-media 10/*"]

  - id: shader-code
    name: "Свой фрагментный шейдер на голом WebGL2 (1 полноэкранный треугольник)"
    kind: platform
    version: null
    license: "свой код"
    size_br: 1.5
    init_tbt_ms: null
    support: {baseline: "WebGL2 high 2024-03-20"}
    use_for: [effect:shader-bg, effect:holo-shader-bg]
    levels: [L1, L2]
    status: conditional
    when: "есть готовый GLSL и нет three на странице; иначе ogl или paper-shaders"
    alternatives: [paper-shaders, ogl, three]
    risks: ["потеря контекста, бюджет пикселей телефона 1,9 Мпикс (3d 16/01), пауза вне экрана — свой код"]
    alive: {kind: web-standard}
    refs: ["01-stack-choice.md §6.1"]

  # ---------------------------------------------------------------- библиотеки движения и прокрутки
  - id: motion-kit
    name: "Набор движения страницы MotionKit (свой код базы): 35 примитивов data-mk, DOM-сцены прокрутки, переключатель движения"
    kind: library
    package: "свой код базы: ../11-motion-code/examples/motion-kit.js + motion-kit.css (одно глобальное имя MotionKit)"
    version: "0.5.0"
    license: "код шаблона — лицензия репозитория (Apache-2.0)"
    size_br: {kit-min: {js: 8.0, css: 4.9}, kit-source: {js: 12.1, css: 7.9}}   # 01-kit.md §8: esbuild --minify, brotli 11 — весь набор 56,1 / 14,3 / 12,9 КБ (raw / gzip / br); исходники с комментариями: JS 45,8 / 13,9 / 12,1, CSS 41,4 / 9,2 / 7,9
    init_tbt_ms: {demo_desk: 0}   # motion_check.py desk на демо L1 (README 11-motion-code, «Цена») — не метод G/01
    support: {browsers: "все современные; прокрутка на CSS — под @supports (Chrome 115+, Safari 26+, Firefox 159+), без поддержки — конечное состояние", deps: "нет: без библиотек и сети, DOM не строит — только атрибуты, классы и CSS-переменные", canvas: "файл поддержки lib/motion-kit.js и CSS в <helmet>; на claude.ai не проверялся", scenes: "DOM-сцены scrub · beats · glide · play — пружина рантайма 3D (../../3d/16-js-scenes/)"}
    use_for: [effect:hero-entrance-once, effect:scroll-reveal-system, effect:split-text-reveal, effect:mask-reveal, effect:counter-up, effect:scroll-driven-progress, effect:parallax-layers, effect:svg-line-draw, effect:scroll-text-highlight, effect:scroll-mask-expand, effect:text-mask-media, effect:sticky-stack, effect:horizontal-scroll, effect:header-shrink-on-scroll, effect:text-path, effect:pin-scrub-story, effect:marquee-logos, effect:marquee-text, effect:rotating-badge, effect:mesh-gradient-css, effect:glow-accent, effect:magnetic-cta, effect:tilt-card, effect:cursor-accent, effect:dialog-entry-exit, effect:details-accordion, effect:button-expand-label, effect:card-flip-3d, effect:light-sweep, effect:expanding-columns, effect:view-transition, effect:page-transition, effect:motion-toggle]   # 33 эффекта — поле effects в ../11-motion-code/primitives.yaml
    levels: [L0, L1, L2]
    status: default
    when: "DOM-движение страницы на всех уровнях и на холсте — ступенью до GSAP: момент motion-spec → примитив ../11-motion-code/primitives.yaml; уровень примитива — его level_min; GSAP — в коде сайта для сюжета, которого набор не делает (сложный таймлайн, Flip); WebGL, 3D, видео, Lottie и Rive набор не исполняет"
    alternatives: [gsap, gsap-scrolltrigger, gsap-flip, css-animations]
    risks: ["на холсте claude.ai не проверялся", "приёмы без примитива (печать текста, вспышка по нажатию, перебор знаков, сравнение «до и после») — момент custom своим кодом", "состояние paused контракта data-motion в код сайта не входит"]
    alive: {kind: own-code, release: "база скилла design-deep-dive 0.5.0"}
    checked_at: 2026-10-28
    refs: ["01-stack-choice.md §1, §2", "02-implementation-patterns.md §6", "../11-motion-code/README.md", "../11-motion-code/01-kit.md §8", "../11-motion-code/04-where-it-runs.md"]

  - id: gsap
    name: "GSAP (ядро: tween, timeline, matchMedia, context, quickTo)"
    kind: library
    package: gsap
    version: "3.15.0"
    released: 2026-04-13
    license: "Standard «No Charge» (Webflow; eff. 2025-04-30, ред. 2025-05-30)"
    license_caveats: ["все плагины, включая SplitText, ScrollSmoother и MorphSVG, — бесплатно и для коммерции", "запрещено: no-code-билдер анимаций, конкурирующий с Webflow; реверс для такого продукта", "не удалять уведомления @license из бандла", "Webflow вправе менять лицензию; прекращение — за нарушение", "ИИ-генерация кода — разрешена (FAQ)"]
    size_br: 24.3
    init_tbt_ms: {median: 0, range: [0, 0]}
    support: {browsers: "все современные (ES2019+)"}
    use_for: [effect:hero-entrance-once, effect:kinetic-headline, effect:cursor-accent, effect:custom-cursor, effect:magnetic-cta]
    levels: [L1, L2]
    status: conditional
    when: "в коде сайта — сюжет, которого не делает набор движения: таймлайн 4+ шагов, Flip, синхронизация с WebGL/Lenis, quickTo для своего курсора; DOM-эффекты набора — motion-kit, одно появление — CSS"
    alternatives: [motion-kit, motion, animejs, waapi]
    risks: ["код «по памяти»: SplitText position:absolute, lineThreshold, gsap-trial", "immediateRender у from()"]
    alive: {last_release: 2026-04-13, releases_12m: 4, stars: 28610, pushed: 2026-04-13}   # 3.15.0 — последняя на 2026-10-28; счётчики — на 2026-09-24
    checked_at: 2026-10-28
    refs: ["01-stack-choice.md §3.2, §9", "S1, S2, S22, S38"]

  - id: gsap-scrolltrigger
    name: "GSAP ScrollTrigger (pin, scrub, batch, containerAnimation, matchMedia)"
    kind: library
    package: "gsap/ScrollTrigger"
    version: "3.15.0"
    license: "как gsap"
    size_br: 39.7          # с ядром
    init_tbt_ms: {median: 12, range: [0, 17], scenario: "20 секций, по триггеру со scrub"}
    support: {browsers: "все современные"}
    use_for: [effect:pin-scrub-story, effect:horizontal-scroll, effect:parallax-layers, effect:scroll-reveal-system, effect:image-sequence, effect:video-scrub, effect:3d-scene, effect:sticky-stack]
    levels: [L1, L2]
    status: conditional
    when: "то, чего CSS не делает: L1 — одна закреплённая сцена со сложным сюжетом; L2 — сцены прокрутки, синхрон с canvas и WebGL"
    alternatives: [css-scroll-driven, motion]
    risks: ["ScrollTrigger.refresh() после смены раскладки, шрифтов, VT", "ScrollTrigger у 23 из 49 наградных"]
    alive: {last_release: 2026-04-13, releases_12m: 4}
    refs: ["01-stack-choice.md §3.2", "02-implementation-patterns.md §7"]

  - id: gsap-splittext
    name: "GSAP SplitText 3.13+ (aria, autoSplit, mask, deepSlice, propIndex)"
    kind: library
    package: "gsap/SplitText"
    version: "3.15.0"
    license: "как gsap (бесплатно с 2025-04-30)"
    size_br: 42.3          # с ядром и ScrollTrigger
    init_tbt_ms: {median: 39, range: [37, 77], scenario: "ST на 20 секций + SplitText lines,words, mask"}
    support: {browsers: "все современные"}
    use_for: [effect:split-text-reveal, effect:kinetic-headline]
    levels: [L1, L2]
    status: conditional
    when: "в коде сайта, когда строки должны следовать переносу по ширине: autoSplit + onSplit, сплит после document.fonts.ready; куски в разметке (слова, строки, буквы) — примитив split набора движения"
    alternatives: [motion-kit, "Motion+ splitText — платно, недоступно"]
    risks: ["не на LCP-заголовке с opacity 0", "+≈ 27 мс TBT к ScrollTrigger"]
    alive: {last_release: 2026-04-13}
    refs: ["01-stack-choice.md §3.2", "S2"]

  - id: gsap-flip
    name: "GSAP Flip (анимация смены раскладки)"
    kind: library
    package: "gsap/Flip"
    version: "3.15.0"
    license: "как gsap"
    size_br: 31.9          # с ядром
    init_tbt_ms: {median: 1, range: [0, 57]}
    support: {browsers: "все современные"}
    use_for: [effect:view-transition]
    levels: [L1, L2]
    status: conditional
    when: "смена раскладки внутри блока там, где same-document VT не подходит (вложенные прокрутки, сложные состояния)"
    alternatives: [view-transitions-same-document]
    risks: []
    alive: {last_release: 2026-04-13}
    refs: ["01-stack-choice.md §3.2"]

  - id: gsap-scrollsmoother
    name: "GSAP ScrollSmoother"
    kind: library
    package: "gsap/ScrollSmoother"
    version: "3.15.0"
    license: "как gsap"
    size_br: 43.6          # с ядром и ScrollTrigger
    init_tbt_ms: {median: 59, range: [11, 79]}
    support: {browsers: "все современные"}
    use_for: [effect:smooth-scroll]
    levels: [L2]
    status: legacy-only
    when: "сайт уже построен на ScrollSmoother"
    alternatives: [lenis]
    risks: ["двигает контент transform внутри обёртки — fixed-элементы и якоря требуют настройки", "дороже Lenis по TBT"]
    alive: {last_release: 2026-04-13}
    refs: ["01-stack-choice.md §4"]

  - id: gsap-svg
    name: "GSAP MorphSVG, DrawSVG, MotionPath"
    kind: library
    package: "gsap/MorphSVGPlugin и др."
    version: "3.15.0"
    license: "как gsap (бесплатно с 2025-04-30)"
    size_br: 32.1          # ядро + MorphSVG
    init_tbt_ms: {median: 0, range: [0, 0]}
    support: {browsers: "все современные"}
    use_for: [effect:kinetic-headline, effect:mask-reveal]
    levels: [L1, L2]
    status: conditional
    when: "морфинг и прорисовка SVG-иллюстраций"
    alternatives: [css-animations]
    risks: []
    alive: {last_release: 2026-04-13}
    refs: ["01-stack-choice.md §3.2"]

  - id: lenis
    name: "Lenis — плавная прокрутка поверх родной"
    kind: library
    package: lenis
    version: "1.3.27"
    released: 2026-10-15
