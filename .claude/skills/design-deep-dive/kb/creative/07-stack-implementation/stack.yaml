# stack.yaml — каталог стека подачи: платформа браузера, библиотеки, рантаймы, фреймворки, платформы заказчика.
# Владелец: creative. Читают: подача (treatment → стек исполнителя), рецепты, ворота эффектов (вес слоя «подача»), вход холста
# (build.stack), site (стык с constraints.cms). Текст правил — 01-stack-choice.md, код — 02. Проверка — ../../../scripts/creative/validate_stack.py.
# Скоропортящееся: перепроверка раз в квартал и перед сборкой (`npm view <пакет> version dist-tags`, BCD) — поле checked_at.

version: 0.1
checked_at: 2026-09-24
status: draft
measure:
  size_br: "минимальный бандл: esbuild 0.25.12, ESM, minify, production, brotli q11 (как в базе 3d); число — сценарий «типовая инициализация», словарь — ключ сцены: {<сцена>: КБ}; wasm — отдельно"
  size_net_kb: "вес по сети на странице (CDP, как ворота): {<сцена или способ загрузки>: КБ}; источник — refs записи"
  init_tbt_ms: "Chromium 153.0.8010.12 headless, CPU ×4, холодный кэш, 5 прогонов: медиана и [мин, макс]; TBT до «готово» + 3 с; load average 6,8–10,3 — сравнивать порядок, не единицы мс"
  support: "@mdn/browser-compat-data 8.1.3 (2026-09-24T13:25Z) и web-features 3.39.0; текущие: Chrome 154, Edge 153, Firefox 156, Safari 27"
  alive: "npm registry (дата релиза последней версии, стабильных релизов за 365 дней) и GitHub API (звёзды, pushed_at), 2026-09-24"
budget_ref: "../01-creative-direction/ambition-levels.yaml#levels[*].budgets.effects.js_presentation_kb_br (по уровню)"
vocab:
  kind: {platform: "возможность браузера, 0 КБ", library: "npm-библиотека движения/прокрутки/переходов", runtime: "рантайм графики или анимации (WebGL, wasm)", framework: "сборка и рендеринг страниц", avoid: "не брать в новый код"}
  status: {default: "умолчание для своих уровней", conditional: "по условию из when", legacy-only: "только на существующем сайте", avoid: "не использовать"}
  effect_ids: "id каталога эффектов 06-effects-catalog/effects.yaml с префиксом effect:"

entries:

  # ---------------------------------------------------------------- платформа браузера (0 КБ)
  - id: css-animations
    name: "CSS transitions, @keyframes, @starting-style, transition-behavior"
    kind: platform
    version: null
    license: "стандарт W3C"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: "@starting-style и transition-behavior — low 2024-08-06", chrome: 117, firefox: 129, safari: "17.5"}
    use_for: [effect:hero-entrance-once, effect:marquee-logos, effect:marquee-text, effect:kinetic-headline, effect:cursor-accent]
    levels: [L0, L1, L2]
    status: default
    alternatives: [waapi, gsap]
    risks: ["LCP-элемент не анимировать из opacity: 0", "бесконечная петля > 5 с — пауза (WCAG 2.2.2)"]
    alive: {kind: web-standard}
    refs: ["01-stack-choice.md §2, §3.1"]

  - id: css-scroll-driven
    name: "CSS scroll-driven animations (animation-timeline: scroll()/view(), animation-range, timeline-scope; JS ScrollTimeline/ViewTimeline)"
    kind: platform
    version: null
    license: "стандарт W3C (Scroll-driven Animations)"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: false, chrome: 115, edge: 115, safari: "26", safari_ios: "26", samsung: "23", firefox: "только Nightly", firefox_android: false, feature_check: "@supports ((animation-timeline: scroll()) and (animation-range: 0% 100%))"}
    use_for: [effect:scroll-reveal-system, effect:scroll-driven-progress, effect:parallax-layers, effect:mask-reveal, effect:sticky-stack, effect:pin-scrub-story]
    levels: [L1, L2]
    status: default
    when: "декоративное — без фолбэка; смысловое (текст, цифры, шаги) — фолбэк IO или GSAP; pin-scrub-story на CSS — только декоративный"
    alternatives: [intersection-observer, gsap-scrolltrigger, motion]
    risks: ["нет Firefox → содержимое обязано быть видно без анимации", "шорткат animation после animation-timeline сбрасывает таймлайн", "scroll-timeline-polyfill не использовать"]
    alive: {kind: web-standard, practice: "2 из 49 наградных сайтов"}
    refs: ["01-stack-choice.md §3.1", "S7, S8, S10"]

  - id: css-scroll-triggered
    name: "CSS scroll-triggered animations (timeline-trigger, animation-trigger, trigger-scope)"
    kind: platform
    version: null
    license: "черновик CSS WG"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: false, chrome: "146 (experimental)", firefox: false, safari: false}
    use_for: [effect:scroll-reveal-system]
    levels: [L1, L2]
    status: conditional
    when: "только прогрессивное улучшение поверх IntersectionObserver"
    alternatives: [intersection-observer]
    risks: ["блог Chrome называет 145, BCD — 146; синтаксис может меняться"]
    alive: {kind: web-standard-draft}
    refs: ["01-stack-choice.md §3.1", "S9"]

  - id: view-transitions-same-document
    name: "View Transitions, same-document (document.startViewTransition, view-transition-name/class, types)"
    kind: platform
    version: null
    license: "стандарт W3C (CSS View Transitions 1–2)"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: "low 2025-10-14", chrome: 111, firefox: 144, safari: "18", types: {chrome: 125, firefox: 147, safari: "18.2"}, scoped_element_vt: "Chrome 147 exp."}
    use_for: [effect:view-transition]
    levels: [L1, L2]
    status: default
    alternatives: [gsap-flip]
    risks: ["после VT со сменой раскладки — ScrollTrigger.refresh()", "reduce: не запускать (проверка matchMedia)"]
    alive: {kind: web-standard}
    refs: ["01-stack-choice.md §5", "02-implementation-patterns.md §7"]

  - id: view-transitions-cross-document
    name: "View Transitions, cross-document (@view-transition { navigation: auto }, pageswap/pagereveal)"
    kind: platform
    version: null
    license: "стандарт W3C (CSS View Transitions 2)"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: false, chrome: 126, safari: "18.2", samsung: "28", firefox: false, pagereveal: {chrome: 123, safari: "18.2", firefox: false}}
    use_for: [effect:page-transition]
    levels: [L1, L2]
    status: default
    when: "многостраничник (MPA); правило внутри @media (prefers-reduced-motion: no-preference); 1–3 общих view-transition-name"
    alternatives: [swup, astro-client-router]
    risks: ["Firefox — обычная навигация", "состояние (видео, WebGL) между страницами не сохраняется — тогда swup/Astro"]
    alive: {kind: web-standard}
    refs: ["01-stack-choice.md §5", "S10, S11"]

  - id: waapi
    name: "Web Animations API (element.animate, getAnimations, commitStyles)"
    kind: platform
    version: null
    license: "стандарт W3C"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: "high 2023-03-16", chrome: 84, firefox: 75, safari: "14"}
    use_for: [effect:counter-up, effect:magnetic-cta, effect:hero-entrance-once]
    levels: [L0, L1, L2]
    status: default
    alternatives: [motion-mini]
    risks: []
    alive: {kind: web-standard}
    refs: ["01-stack-choice.md §3.3"]

  - id: intersection-observer
    name: "IntersectionObserver + свой код (reveal, ленивый запуск, пауза вне экрана)"
    kind: platform
    version: null
    license: "стандарт W3C"
    size_br: 0.2
    init_tbt_ms: {median: 0, range: [0, 0]}
    support: {baseline: "high 2021-09-25", chrome: 58, firefox: 55, safari: "12.1"}
    use_for: [effect:scroll-reveal-system, effect:counter-up]
    levels: [L0, L1, L2]
    status: default
    alternatives: [css-scroll-driven, css-scroll-triggered]
    risks: ["requestIdleCallback нет в Safari — фолбэк setTimeout"]
    alive: {kind: web-standard}
    refs: ["02-implementation-patterns.md §3"]

  - id: css-registered-properties
    name: "@property / CSS.registerProperty (анимация градиентов, углов, чисел)"
    kind: platform
    version: null
    license: "стандарт W3C"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: "low 2024-07-09", chrome: 85, firefox: 128, safari: "16.4"}
    use_for: [effect:mesh-gradient-css, effect:counter-up]
    levels: [L0, L1, L2]
    status: default
    alternatives: [shader-code]
    risks: ["анимированный градиент на весь экран — цена перерисовки (замер — 06-effects-catalog)"]
    alive: {kind: web-standard}
    refs: ["01-stack-choice.md §2"]

  - id: html-media
    name: "<video muted loop playsinline poster>, AVIF/WebP-секвенции, SVG-зерно"
    kind: platform
    version: null
    license: "стандарт WHATWG"
    size_br: 0
    init_tbt_ms: 0
    support: {baseline: "high"}
    use_for: [effect:video-loop-hero, effect:cinemagraph, effect:grain-overlay, effect:image-sequence, effect:video-scrub]
    levels: [L0, L1, L2]
    status: default
    alternatives: [dotlottie-web, lottie-web]
    risks: ["кнопка паузы у петли > 5 с", "reduce — постер, 0 байт видео", "вес видео — отдельная метрика"]
    alive: {kind: web-standard}
    refs: ["../06-effects-catalog/02-hero-video-background.md", "ai-media 10/*"]

  - id: shader-code
    name: "Свой фрагментный шейдер на голом WebGL2 (1 полноэкранный треугольник)"
    kind: platform
    version: null
    license: "свой код"
    size_br: 1.5
    init_tbt_ms: null
    support: {baseline: "WebGL2 high 2024-03-20"}
    use_for: [effect:shader-bg, effect:holo-shader-bg]
    levels: [L1, L2]
    status: conditional
    when: "есть готовый GLSL и нет three на странице; иначе ogl или paper-shaders"
    alternatives: [paper-shaders, ogl, three]
    risks: ["потеря контекста, бюджет пикселей телефона 1,9 Мпикс (3d 16/01), пауза вне экрана — свой код"]
    alive: {kind: web-standard}
    refs: ["01-stack-choice.md §6.1"]

  # ---------------------------------------------------------------- библиотеки движения и прокрутки
  - id: gsap
    name: "GSAP (ядро: tween, timeline, matchMedia, context, quickTo)"
    kind: library
    package: gsap
    version: "3.15.0"
    released: 2026-04-13
    license: "Standard «No Charge» (Webflow; eff. 2025-04-30, ред. 2025-05-30)"
    license_caveats: ["запрещено: no-code-билдер анимаций, конкурирующий с Webflow; реверс для такого продукта", "не удалять уведомления @license из бандла", "Webflow вправе менять лицензию; прекращение — за нарушение", "ИИ-генерация кода — разрешена (FAQ)"]
    size_br: 24.3
    init_tbt_ms: {median: 0, range: [0, 0]}
    support: {browsers: "все современные (ES2019+)"}
    use_for: [effect:hero-entrance-once, effect:kinetic-headline, effect:cursor-accent, effect:custom-cursor, effect:magnetic-cta]
    levels: [L1, L2]
    status: conditional
    when: "таймлайн 4+ шагов, синхронизация с WebGL/Lenis, quickTo для курсора; для одного появления — CSS"
    alternatives: [motion, animejs, waapi]
    risks: ["код «по памяти»: SplitText position:absolute, lineThreshold, gsap-trial", "immediateRender у from()"]
    alive: {last_release: 2026-04-13, releases_12m: 4, stars: 28610, pushed: 2026-04-13}
    refs: ["01-stack-choice.md §3.2, §9", "S1, S2, S22"]

  - id: gsap-scrolltrigger
    name: "GSAP ScrollTrigger (pin, scrub, batch, containerAnimation, matchMedia)"
    kind: library
    package: "gsap/ScrollTrigger"
    version: "3.15.0"
    license: "как gsap"
    size_br: 39.7          # с ядром
    init_tbt_ms: {median: 12, range: [0, 17], scenario: "20 секций, по триггеру со scrub"}
    support: {browsers: "все современные"}
    use_for: [effect:pin-scrub-story, effect:horizontal-scroll, effect:parallax-layers, effect:scroll-reveal-system, effect:image-sequence, effect:video-scrub, effect:3d-scene, effect:sticky-stack]
    levels: [L1, L2]
    status: conditional
    when: "L1 — одна закреплённая сцена или сюжет, который должен работать в Firefox; L2 — сцены прокрутки"
    alternatives: [css-scroll-driven, motion]
    risks: ["ScrollTrigger.refresh() после смены раскладки, шрифтов, VT", "ScrollTrigger у 23 из 49 наградных"]
    alive: {last_release: 2026-04-13, releases_12m: 4}
    refs: ["01-stack-choice.md §3.2", "02-implementation-patterns.md §7"]

  - id: gsap-splittext
    name: "GSAP SplitText 3.13+ (aria, autoSplit, mask, deepSlice, propIndex)"
    kind: library
    package: "gsap/SplitText"
    version: "3.15.0"
    license: "как gsap (бесплатно с 2025-04-30)"
    size_br: 42.3          # с ядром и ScrollTrigger
    init_tbt_ms: {median: 39, range: [37, 77], scenario: "ST на 20 секций + SplitText lines,words, mask"}
    support: {browsers: "все современные"}
    use_for: [effect:split-text-reveal, effect:kinetic-headline]
    levels: [L1, L2]
    status: default
    when: "split-заголовок; сплит после document.fonts.ready; autoSplit + onSplit"
    alternatives: ["свой split на span + CSS --i (с aria-label)", "Motion+ splitText — платно, недоступно"]
    risks: ["не на LCP-заголовке с opacity 0", "+≈ 27 мс TBT к ScrollTrigger"]
    alive: {last_release: 2026-04-13}
    refs: ["01-stack-choice.md §3.2", "S2"]

  - id: gsap-flip
    name: "GSAP Flip (анимация смены раскладки)"
    kind: library
    package: "gsap/Flip"
    version: "3.15.0"
    license: "как gsap"
    size_br: 31.9          # с ядром
    init_tbt_ms: {median: 1, range: [0, 57]}
    support: {browsers: "все современные"}
    use_for: [effect:view-transition]
    levels: [L1, L2]
    status: conditional
    when: "смена раскладки внутри блока там, где same-document VT не подходит (вложенные прокрутки, сложные состояния)"
    alternatives: [view-transitions-same-document]
    risks: []
    alive: {last_release: 2026-04-13}
    refs: ["01-stack-choice.md §3.2"]

  - id: gsap-scrollsmoother
    name: "GSAP ScrollSmoother"
    kind: library
    package: "gsap/ScrollSmoother"
    version: "3.15.0"
    license: "как gsap"
    size_br: 43.6          # с ядром и ScrollTrigger
    init_tbt_ms: {median: 59, range: [11, 79]}
    support: {browsers: "все современные"}
    use_for: [effect:smooth-scroll]
    levels: [L2]
    status: legacy-only
    when: "сайт уже построен на ScrollSmoother"
    alternatives: [lenis]
    risks: ["двигает контент transform внутри обёртки — fixed-элементы и якоря требуют настройки", "дороже Lenis по TBT"]
    alive: {last_release: 2026-04-13}
    refs: ["01-stack-choice.md §4"]

  - id: gsap-svg
    name: "GSAP MorphSVG, DrawSVG, MotionPath"
    kind: library
    package: "gsap/MorphSVGPlugin и др."
    version: "3.15.0"
    license: "как gsap (бесплатно с 2025-04-30)"
    size_br: 32.1          # ядро + MorphSVG
    init_tbt_ms: {median: 0, range: [0, 0]}
    support: {browsers: "все современные"}
    use_for: [effect:kinetic-headline, effect:mask-reveal]
    levels: [L1, L2]
    status: conditional
    when: "морфинг и прорисовка SVG-иллюстраций"
    alternatives: [css-animations]
    risks: []
    alive: {last_release: 2026-04-13}
    refs: ["01-stack-choice.md §3.2"]

  - id: lenis
    name: "Lenis — плавная прокрутка поверх родной"
    kind: library
    package: lenis
    version: "1.3.26"
    released: 2026-08-05
    license: MIT
    size_br: 4.8
    init_tbt_ms: {median: 0, range: [0, 0], with_gsap_st: {median: 13, range: [0, 56]}}
    support: {browsers: "все современные; Safari ≤ 60 fps (30 в энергосбережении); iOS < 16 — сбои syncTouch"}
    use_for: [effect:smooth-scroll]
    levels: [L2]
    status: default
    when: "только L2; anchors: true; один цикл с gsap.ticker; respectReducedMotion (по умолчанию true)"
    alternatives: [gsap-scrollsmoother, locomotive-scroll]
    risks: ["не сочетать с CSS scroll-snap (есть lenis/snap), ScrollSmoother, Locomotive", "iframe не прокручивается колесом", "@studio-freight/lenis — старое имя", "на телефоне не отключается у наградных"]
    alive: {last_release: 2026-08-05, releases_12m: 15, stars: 16000, pushed: 2026-09-22, dist_tags: {dev: "2.0.0-dev.5", framer: "1.3.25-framer"}}
    refs: ["01-stack-choice.md §4", "S6"]

  - id: motion
    name: "Motion (motion.dev) — animate (hybrid), scroll, inView, stagger"
    kind: library
    package: motion
    version: "13.4.3"
    released: 2026-09-24
    license: MIT
    license_caveats: ["splitText, motion/three, motion/vgpu, премиум-компоненты — Motion+ (платно: разовая оплата, lifetime; установка по токену; по motion.dev на 2026-09-25)"]
    size_br: {animate: 18.3, "animate+scroll+inView": 20.6}
    init_tbt_ms: {median: 0, range: [0, 0]}
    support: {browsers: "все современные; scroll() использует ScrollTimeline, где он есть"}
    use_for: [effect:hero-entrance-once, effect:scroll-reveal-system, effect:scroll-driven-progress, effect:parallax-layers, effect:magnetic-cta, effect:cursor-accent]
    levels: [L1, L2]
    status: conditional
    when: "сайт на React/Next или точечные JS-анимации без таймлайнов; для pin — position: sticky"
    alternatives: [gsap, css-scroll-driven, waapi]
    risks: ["частые релизы (75 за 12 мес.) — фиксировать версию", "framer-motion = тот же код под старым именем"]
    alive: {last_release: 2026-09-24, releases_12m: 75, stars: 33717, pushed: 2026-09-24}
    refs: ["01-stack-choice.md §3.3", "S5"]

  - id: motion-mini
    name: "Motion mini (motion/mini) — animate на WAAPI"
    kind: library
    package: "motion/mini"
    version: "13.4.3"
    license: MIT
    size_br: 3.5
    init_tbt_ms: {median: 0, range: [0, 0]}
    support: {browsers: "все с WAAPI"}
    use_for: [effect:hero-entrance-once, effect:magnetic-cta, effect:counter-up]
    levels: [L0, L1, L2]
    status: conditional
    when: "нужна пружина или последовательность без библиотеки таймлайнов; L0 — в пределах 20 КБ"
    alternatives: [waapi, css-animations]
    risks: []
    alive: {last_release: 2026-09-24}
    refs: ["01-stack-choice.md §3.3"]

  - id: motion-react
    name: "Motion for React (motion/react)"
    kind: library
    package: "motion/react"
    version: "13.4.3"
    license: MIT
    size_br: 93.8          # с React 19.3 + ReactDOM (React база — 57,9)
    init_tbt_ms: {median: 74, range: [64, 119], react_baseline: {median: 32, range: [27, 37]}}
    support: {react: "19"}
    use_for: [effect:hero-entrance-once, effect:scroll-reveal-system, effect:view-transition]
    levels: [L1, L2]
    status: conditional
    when: "только если сайт уже на React/Next (продуктовые главные Stripe, Linear, Vercel, Apple)"
    alternatives: [gsap]
    risks: ["React ради анимации не помещается в слой «подача» L1"]
    alive: {last_release: 2026-09-24}
    refs: ["01-stack-choice.md §3.3, §8"]

  - id: animejs
    name: "anime.js 4 (модульный animate, timeline, stagger)"
    kind: library
    package: animejs
    version: "4.5.0"
    released: 2026-06-22
    license: MIT
    size_br: 12.6
    init_tbt_ms: {median: 0, range: [0, 0]}
    support: {browsers: "все современные"}
    use_for: [effect:hero-entrance-once, effect:kinetic-headline]
    levels: [L1, L2]
    status: conditional
    when: "альтернатива GSAP-ядру, если лицензия GSAP неприемлема (продукт-конструктор)"
    alternatives: [gsap, motion]
    risks: ["ветка 5.0 в бете (dist-tag beta 5.0.0-beta.2)", "аналогов ScrollTrigger/SplitText с aria в стеке базы не проверяли"]
    alive: {last_release: 2026-06-22, releases_12m: 13, stars: 73093, pushed: 2026-08-21}
    refs: ["01-stack-choice.md §3.3"]

  - id: locomotive-scroll
    name: "Locomotive Scroll 5 (на Lenis)"
    kind: library
    package: locomotive-scroll
    version: "5.0.1"
    released: 2026-01-15
    license: MIT
    size_br: 7.8
    init_tbt_ms: {median: 0, range: [0, 0]}
    support: {browsers: "как Lenis"}
    use_for: [effect:smooth-scroll, effect:parallax-layers]
    levels: [L2]
    status: legacy-only
    when: "сайт уже на Locomotive"
    alternatives: [lenis]
