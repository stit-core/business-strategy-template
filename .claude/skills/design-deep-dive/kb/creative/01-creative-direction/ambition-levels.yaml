# ambition-levels.yaml — уровни амбиций подачи L0 / L1 / L2: что разрешено, что обязательно, бюджеты подачи и проекция
# уровня во вход холста. Описание и обоснование — 03-ambition-levels.md; процедура выбора уровня — там же §5.
#
# Числа уровней живут только здесь; код и соседние файлы их читают, а не повторяют:
#   spec_check.py      — пики, акценты, секции с фирменным приёмом, петли в зоне видимости, свойства движения и blur
#                        (section_distribution, signature_moves_max, motion_hints, property_exceptions);
#   marketing_audit.py — хроматические цвета первого экрана (chromatic_max);
#   effect-gates.yaml  — пороги ворот эффектов по threshold_ref (путь в levels[<уровень>]);
#   site_validate.py, page_gates.py — умолчания уровня по типу страницы и правило лидогенерации услуг
#                        (defaults_by_page_type, levels[L0].appropriate_for.lead_services);
#   вход холста        — уровень движения, стек и режим 3D исполнителя (levels[].maps_to.claude_design; правило — x-canvas-map).
#
# Два слоя бюджета:
#   budgets.effects — сколько добавляет подача (JS движения и эффектов, 3D, wasm, видео, GPU, FPS прокрутки): владелец — creative;
#   budgets.page_ref — профиль страницы целиком (исходы, вес, шрифты) ведёт site: ../site/07-seo-geo-performance-analytics/
#                     budgets.yaml; ворота эффектов берут его числа по threshold_ref «profile.*» зеркалом D.
# Величина, у которой владелец — другая база, стоит ссылкой: 3D героя и первого экрана — ворота 3d (three_d_ref),
# картинка первого экрана — бюджет ассета ai-media (hero_image_ref).
# Единицы: вес — байты «на проводе» (как считают ai-media 01/02, 3d 01/04, site 02/03: CDP / responseBodySize).
# Окно первого экрана, «сессию» и условия замера на телефоне и десктопе ведёт site:
# ../site/07-seo-geo-performance-analytics/budgets.yaml — conditions (first_screen, lab_mobile, lab_desktop) и layers.
#
# Сокращения источников: `ai-media:01-02#4.3` = ../ai-media/01-web-assets-landscape/02-live-sites-measured.md §4.3;
# `3d:01-02#3.1` = ../3d/01-web-3d-landscape/02-when-3d-budgets-loading.md §3.1.

version: "1.0"
status: draft
checked_at: "2026-09-29"
effect_gates: "09-ai-execution-evaluation/effect-gates.yaml — ворота эффектов берут пороги отсюда по threshold_ref (motion_check.py)"
owner: "creative · 01-creative-direction"
consumers:
  site: "site-brief.ambition.level, page-plan page.ambition_level и budget_profile (<page_type>@L0|L1|L2); budgets.yaml — effects_ref на levels[].budgets.effects"
  creative: "art-direction (уровень и профиль), treatment секций (level, motion_level), effects.yaml (level_min), effect-gates.yaml (threshold_ref), spec_check.py, marketing_audit.py"
  canvas: "вход холста — decisions.motion.level, decisions.motion.library, decisions.three_d, блок движения motion.md (levels[].maps_to.claude_design; правило — x-canvas-map)"
  ai-media: "visual-dna character.boldness и one_bold_move (maps_to.visual_dna)"

# ------------------------------------------------------------------------------------------------------------------
# Обязательно на всех уровнях. id с префиксом CRV- (kb/common/owners.md § Общие правила тройки). «L2+» — дополнительно на L2.
mandatory_all_levels:
  - id: CRV-AL-01
    rule: "Вариант при prefers-reduced-motion: конечные состояния без анимации появления и прокрутки, 0 байт видео при загрузке, 0 вызовов отрисовки WebGL в покое; смысл и CTA на месте (reduce, not remove — движение заменяется, а не пропадает без следа)."
    source: "WCAG 2.2 SC 2.3.3 (AAA) + техника C39; ui 08/03 §2; page_accept.py (0 байт видео, движение < 0,5 %); 3d 09/05 §5"
    label: "[стандарт] для 2.3.3; [проверено] у соседей"
  - id: CRV-AL-02
    rule: "Движение, запущенное автоматически, дольше 5 с и показанное вместе с другим контентом (бегущая строка, живой фон, видео-петля, Lottie-петля) — видимая пауза или остановка за ≤ 5 с."
    source: "WCAG 2.2 SC 2.2.2 (A) Pause, Stop, Hide; ai-media 10/02 §5 (пауза видео)"
    label: "[стандарт]"
  - id: CRV-AL-03
    rule: "Не больше 3 вспышек в секунду (стробы, мигающие переходы, быстрые смены кадра высокой яркости)."
    source: "WCAG 2.2 SC 2.3.1 (A) Three Flashes or Below Threshold"
    label: "[стандарт]"
  - id: CRV-AL-04
    rule: "Смысловой текст, заголовки, цены и CTA — в HTML (не в canvas, не в картинке, не в видео); LCP-элемент — текст, картинка или постер, не canvas."
    source: "3d 01/02 §6.1 (ИИ-краулеры JS не исполняют), 3d 01/04 (canvas не становится LCP); ai-media 10/01 §4.3"
    label: "[проверено] у соседей"
  - id: CRV-AL-05
    rule: "Фолбэк без WebGL и без JS: страница читается, CTA и форма работают; эффект — прогрессивное улучшение (@supports, проверка возможностей, matchMedia)."
    source: "3d 01/01 §1.4; 3d 09/05 §5"
    label: "[практика]"
  - id: CRV-AL-06
    rule: "Своя облегчённая версия для телефона: тяжёлые сцены — постер, видео 9:16 или 4:5 легче десктопного, 3D — половина ассетов, пиксели холста ≤ 1,9 Мпикс (DPR до 2, 3d 16/01)."
    source: "3d 01/02 §3.1, §7 (ограничения ветки «телефон основной»); ai-media 01/02 §4.3"
    label: "[практика]"
  - id: CRV-AL-07
    rule: "Клавиатура и фокус не ломаются: плавная прокрутка и перехват колеса не мешают Tab, якорям, поиску по странице; видимый фокус ≥ 3:1."
    source: "WCAG 2.2 SC 2.1.1, 2.4.7, 2.4.11 (фокус не скрыт), 1.4.11 (контраст индикатора фокуса 3:1); ux 08"
    label: "[стандарт]"
  - id: CRV-AL-08
    rule: "Контраст текста на медиа (фото, видео, шейдер, 3D, градиент) — по F83 в самой светлой точке зоны текста и по кадрам видео; иначе подложка или скрим."
    source: "ai-media 10/03 §1 и 06/03 (F83, p99,9); 3d 09/05 §5 L221–222"
    label: "[стандарт] F83; [проверено] у ai-media"
  - id: CRV-AL-09
    rule: "«Вау» догружается после LCP: 3D, шейдер, секвенции, тяжёлое видео — после load и простоя; LCP-элемент не анимируется из opacity: 0 (только transform, clip-path или появление из 0,01)."
    source: "3d 01/02 §4.1 (порядок загрузки hero, проверено); ai-media 10/01 §4.3, стр. 249–254"
    label: "[проверено] у соседей"
  - id: CRV-AL-10
    rule: "Вне экрана цикл отрисовки и петли стоят (IntersectionObserver, visibilitychange); в покое без движения — 0 кадров WebGL."
    source: "3d 01/01 §1.4; 3d 01/02 §1.3 (25 из 33 сайтов рендерят без движения)"
    label: "[проверено] у 3d"
  - id: CRV-AL-11
    rule: "Конвенции взаимодействия сохраняются на любом уровне: логотип слева со ссылкой на главную, навигация сверху, предсказуемые формы и кнопки; выразительность — в концепции, визуале, композиции, движении и тексте."
    source: "kb/common/owners.md § Общие правила тройки; ux 03/04 §12, ux 10/02 §5.3; Tuch 2012 через ui 13/02 §3.3"
    label: "[консенсус]"
  - id: CRV-AL-12
    applies_to: [L2]
    rule: "L2+: заметный переключатель «меньше движения» на странице (для тех, у кого не выставлена системная настройка), состояние запоминается; содержимое доступно без интро (кнопка «пропустить» или его отсутствие)."
    source: "WCAG 2.2 SC 2.3.3 Understanding (механизм отключения движения от взаимодействия)"
    label: "[гипотеза]"

# ------------------------------------------------------------------------------------------------------------------
levels:

  - id: L0
    name_ru: "Сдержанно"
    name_en: "restrained"
    essence: "Подача держится на типографике, композиции, цвете и реальном материале (фото работ, продукта, людей с согласием). Движение — отклик на действия и одно оркестрованное появление первого экрана. Выразительность — в качестве исполнения, а не в эффектах."
    signature_moves_max: 1          # один смелый приём (типографика, цвет, кадр, композиция), не эффект с JS
    chromatic_max: 2                # хроматических цветов в первом экране (CSS: текст, фон, границы, градиенты)
    allowed:
      - {id: css-feedback, what: "hover, focus, press, раскрытие аккордеона — CSS-переходы 100–300 мс"}
      - {id: hero-entrance-once, what: "одно появление первого экрана ≤ 600 мс без каскада по секциям; LCP-элемент не из opacity: 0"}
      - {id: static-backgrounds, what: "цвет, статичный градиент, зерно, маски, фото; смена фона секций как ритм"}
      - {id: video-on-demand, what: "сюжетное видео — постер и запуск по клику; без автозапуска"}
      - {id: quiet-loop, what: "одна тихая петля первого экрана: синемаграф ≤ 300 КБ или CSS/SVG, остановка ≤ 5 с или пауза, при reduce — постер (effect:cinemagraph)", limit: "≤ 1"}
      - {id: marquee-paused, what: "бегущая строка логотипов только из фактов заказчика, с паузой и остановкой при reduce", limit: "≤ 1 на страницу"}
    forbidden:
      - {id: webgl, why: "нет задачи, которую на L0 не решает CSS, SVG или картинка; цена TBT и батареи (3d 01/02 §1.3)"}
      - {id: smooth-scroll, why: "перехват прокрутки ломает ожидания и доступность на страницах «прочитать и решить»"}
      - {id: pin-scrub, why: "закреплённые сцены удлиняют путь к форме"}
      - {id: scroll-reveal-every-section, why: "почерк генераторов: fade-and-slide-up на каждой секции (ui 11/04 маркер 28)"}
      - {id: preloader, why: "прелоадер — только в L2-кампании по явному решению (allowed.preloader уровня L2)"}
      - {id: autoplay-video-bg, why: "сюжетное видео-фон с автозапуском: вес и отвлечение на странице с формой (site 01/02 M6); тихий синемаграф — см. quiet-loop"}
    motion_hints:                  # бюджет внимания и свойства движения уровня; нормы движения — 05-motion/01
      continuous_motions_in_view_max: {mobile: 1, desktop: 1}   # объектов-петель в зоне видимости; 3D-сцена входит в бюджет
      continuous_motions_under_text_max: 0
      properties_allowed: [transform, translate, scale, rotate, opacity, color, background-color]
      hero_entrance_ms: [300, 600]
      scroll_driven_sections_max: 0
      label: "[гипотеза]"
    budgets:
      effects:
        js_presentation_kb_br: {mobile: 20, desktop: 20, source: "без библиотек движения: CSS + до 1 малого скрипта IntersectionObserver; ср. 3d 01/03: gsap+ScrollTrigger 40 КБ br — уже выше", label: "[гипотеза]"}
        js_3d_kb_br: {mobile: 0, desktop: 0, source: "L0 без WebGL", label: "[решение уровня]"}
        webgl_contexts: {mobile: 0, desktop: 0, source: "L0 без WebGL", label: "[решение уровня]"}
        wasm_presentation_kb_br: {mobile: null, desktop: null, source: "wasm-рантаймы подачи (dotLottie, Rive) — отдельная строка, в JS первого экрана не входят; веса и версии — 07-stack-implementation/stack.yaml; число порога даст пилот с Lottie или Rive", label: "[открыто]"}
        video_autoplay_kb: {mobile: 300, desktop: 300, source: "видео за сессию без действия: только тихий синемаграф (quiet-loop); ai-media 14 демо «Лесная обжарка»: синемаграф пара 18,5 КБ в первом экране 84,8 КБ; сюжетное видео — по клику", label: "[проверено] у ai-media + [гипотеза]"}
        video_first_screen_kb: {mobile: 300, desktop: 300, source: "видео первого экрана без действия: только тихий синемаграф ≤ 300 КБ (allowed.quiet-loop)", label: "[проверено] у ai-media + [гипотеза]"}
        hero_image_ref: "ai-media/11-evaluation-qa/thresholds.yaml#thresholds.budget.image"   # бюджет ассета: картинка первого экрана, десктоп и телефон
      page_ref: "site/07-seo-geo-performance-analytics/budgets.yaml#levels.L0"
    appropriate_for:
      lead_services:               # правило лидогенерации услуг — L0 вместо умолчания типа (читают page_gates.py и site_validate.py)
        page_type: landing-lead-services
        hot_mobile_share_min: 0.5  # доля горячего трафика с телефонов: сумма share по traffic.sources[] с temperature hot и device mobile; device mixed в неё не входит
        price_bands: [low, mid]    # decision_context.price_band брифа
        otherwise: L1              # порог не достигнут — умолчание типа: L1 с L0-блоками конверсии
        no_data: L1                # данных о трафике нет — L1 и вопрос в questions[] брифа
      conditions:
        - "лидогенерация услуг — правило lead_services: L0 при горячем мобильном трафике и низкой или средней цене (карты, рекомендации, ретаргетинг, поиск с намерением); иначе L1 с L0-блоками конверсии"
        - "аудитория 45+ — предпочитает низкую визуальную сложность (Reinecke и др., CHI 2013, 548 человек, через ui 13/02 §3.1)"
        - "B2G, регулируемые отрасли (finance, medical, dietary-supplements) и страницы, где доверие важнее впечатления (taste 1.A: trust-first → MOTION 2–3)"
        - "внутренние страницы многостраничника и шаблоны серии (единство системы важнее «вау»)"
        - "сервисы и рабочие экраны — не L0, а нормы ui и ux: уровней у них нет"
    avoid_for:
      - "кампания или запуск, где впечатление и есть сообщение (landing-campaign, campaign-site)"
      - "портфолио студии и креативных профессий (работа показывает мастерство — impeccable: режим Experience)"
    section_distribution:
      rule: "все секции L0; допускается один смелый приём (типографика, цвет, кадр) в первом экране"
      peaks_min: 0
      peaks_max: 0
      accents_max: 1
      accent_sections: [hero]      # акцент L0 — только появление первого экрана
      conversion_cap: L0
    maps_to:
      claude_design:               # проекция уровня во вход холста (decisions.motion.*, decisions.three_d; правило — x-canvas-map)
        motion_level: subtle
        library: [css]
        three_d_mode: [none]
        note: "тезис и до трёх моментов; свойства — motion_hints.properties_allowed; сокращённое движение — конечное состояние"
      visual_dna: {character.boldness: restrained, one_bold_move: "обязателен, одна строка: где живёт смелость (типографика, цвет или кадр)", note: "ai-media 01/03:423 «1 смелый приём; ≤ 2 хроматических цвета» — норма именно L0"}
      taste: {MOTION_INTENSITY: [2, 4], DESIGN_VARIANCE: [3, 6], label: "[мнение вендора]"}
      impeccable_register: "Persuade (страницы продаж) или Read (статьи); Operate — сервисы, вне уровней"
      higgsfield_tier: "editorial (типографика + изображения + микродвижение)"

  - id: L1
    name_ru: "Выразительно"
    name_en: "expressive"
    essence: "Один-два фирменных приёма (эффект первого экрана, одна сцена прокрутки, живой фон) на спокойной основе L0. Приём связан с концепцией; остальные секции спокойные; блоки конверсии — L0."
    signature_moves_max: 2
    chromatic_max: 3
    allowed:
      - {id: scroll-driven, what: "анимации по прокрутке (CSS scroll-driven или ScrollTrigger)", limit: "≤ 2 секции"}
      - {id: pin-scene, what: "одна закреплённая сцена со скрабом, без изменения скорости прокрутки", limit: "≤ 1 на страницу, ≤ 150vh"}
      - {id: marquee, what: "бегущая строка с паузой", limit: "≤ 1"}
      - {id: headline-effects, what: "раскрытие заголовков по строкам и словам (split), кинетическая типографика одного заголовка"}
      - {id: shader-bg, what: "один шейдерный фон или mesh-градиент (1 контекст WebGL, пауза вне экрана)", limit: "≤ 1 контекст"}
      - {id: video-loop-hero, what: "немая видео-петля первого экрана с постером, паузой и reduce"}
      - {id: 3d-object, what: "один 3D-объект товара: предрендер, петля, model-viewer или hero-GLB после LCP (3d 01/02 §7)", limit: "≤ 1 контекст, 3D ≤ 0,8/1,5 МБ"}
      - {id: cursor-accent, what: "курсорный акцент на десктопе (магнит CTA, подсветка) без замены системного курсора"}
      - {id: view-transitions, what: "View Transitions, где поддерживается: между страницами многостраничника — нативный кросс-документный (effect:page-transition, 0 КБ JS, @supports, анимация только при prefers-reduced-motion: no-preference, ≤ 400 мс) и состояния блока (effect:view-transition); без поддержки — обычный переход (X-21)"}
    forbidden:
      - {id: smooth-scroll, why: "на L1 не нужен: сцены работают с родной прокруткой; цена — ожидания и доступность"}
      - {id: scroll-jacking, why: "изменение скорости и направления прокрутки — только L2 и только закрепление со скрабом"}
      - {id: horizontal-scroll-section, why: "L2-приём; на L1 — одна закреплённая сцена"}
      - {id: custom-cursor, why: "замена системного курсора — L2"}
      - {id: preloader, why: "прелоадер — только в L2-кампании по явному решению (allowed.preloader уровня L2)"}
      - {id: effects-in-conversion, why: "форма, цена, калькулятор — L0 (3d 01/02 §1.3: «прайсинг и лиды — 3D вредит»)"}
    motion_hints:
      continuous_motions_in_view_max: {mobile: 1, desktop: 2}   # телефон на 1 меньше, минимум 1
      continuous_motions_under_text_max: 0
      properties_allowed: [transform, translate, scale, rotate, opacity, color, background-color, clip-path, mask, filter, stroke-dashoffset, font-variation-settings, "--*", "uniform:*", view-transition]
      blur_max_px: 8               # filter: blur() не больше, в бюджете кадра и с reduce
      hero_scene_ms: [600, 1200]
      scroll_driven_sections_max: 2
      label: "[гипотеза]"
    budgets:
      effects:
        js_presentation_kb_br: {mobile: 100, desktop: 100, source: "3d 01/03 (2026-09-22): gsap + ScrollTrigger 40 КБ br, lenis 4,9, motion 22, OGL 12, @paper-design/shaders 6; + свой код ≈ 30–50 КБ", label: "[данные] + [гипотеза]"}
        js_3d_kb_br: {mobile: 200, desktop: 300, source: "3d:01-02#3.1 JS для 3D ≤ 200/300 КБ br; только при 3d-object", label: "[спорно] у 3d"}
        webgl_contexts: {mobile: 1, desktop: 1, source: "3d 09/04 §2 шейдерный фон — 1 вызов, 1,45 мс на кадр", label: "[гипотеза] + [проверено] у 3d"}
        wasm_presentation_kb_br: {mobile: null, desktop: null, source: "wasm-рантаймы подачи (dotLottie, Rive) — отдельная строка, в JS первого экрана не входят; веса и версии — 07-stack-implementation/stack.yaml; число порога даст пилот с Lottie или Rive", label: "[открыто]"}
        three_d_ref: "3d/09-web-runtime/05-performance-a11y-fallbacks.md §1.1"   # 3D героя и первого экрана — ворота 3d (§1.1, §7.2), одни на всех уровнях
        video_first_screen_kb: {mobile: 600, desktop: 1500, source: "видео первого экрана без действия — петля hero: ai-media:01-02#4.3 (петля 6–10 с, 1080p ≈ 150–200 КБ/с; 720p на телефоне)", label: "[данные]"}
        video_autoplay_session_mb: {mobile: 2, desktop: 5, source: "ai-media:01-02#4.3 (видео за сессию без явного действия пользователя)", label: "[данные] + [практика]"}
        hero_image_ref: "ai-media/11-evaluation-qa/thresholds.yaml#thresholds.budget.image"   # бюджет ассета: картинка первого экрана, десктоп и телефон
        draw_calls_max: {mobile: 30, desktop: 60, measure: "кадр в покое", source: "3d:01-02#3.1; 3d 11/05 §11 (WEB-05)", label: "[спорно] у 3d"}
        scroll_fps_min: {mobile: 30, desktop: 50, source: "3d 01/04: наградные 3D FPS прокрутки Q1 55,6, медиана 59,8 (десктоп); телефон — эмуляция", label: "[гипотеза]"}
      page_ref: "site/07-seo-geo-performance-analytics/budgets.yaml#levels.L1"
    appropriate_for:
      conditions:
        - "умолчание для лендингов по задаче страницы (таблица defaults_by_page_type); лидогенерация услуг — L1 с L0-блоками конверсии (правило levels[L0].appropriate_for.lead_services), вес первого экрана телефона — overrides профиля site"
        - "главные страницы брендов, запуски средней значимости, мероприятия (крупные — L2)"
        - "бренд с выраженным характером, которому одного L0-приёма мало"
    avoid_for:
      - "страницы, где задача — прочитать и купить быстро: тарифы, формы, сравнение (их секции — L0 внутри L1-страницы)"
      - "низкие устройства и медленная сеть как основной трафик (решает доля мобильного горячего трафика)"
    section_distribution:
      rule: "hero — L1 или L0; пиков (visual_role peak), акцентов (accent) и секций с фирменным приёмом (effects[].purpose: signature; предел — signature_moves_max) — три разные величины: счёт — 09-ai-execution-evaluation/01 §2.4, проверка — spec_check.py; остальное L0; секции конверсии (lead-form, pricing, калькулятор, квиз, final-cta с формой) — всегда L0"
      peaks_min: 0
      peaks_max: 2
      accents_max: 3
      conversion_cap: L0
    maps_to:
      claude_design:
        motion_level: expressive
        library: [css]
        library_when: {"gsap@3": "закреплённая сцена, split или scroll-driven шире CSS"}
        three_d_mode: [none, prerender, model-viewer, hero-glb]
        note: "до трёх моментов при прокрутке, отдельный проход после статичного макета; motion_cap брифа subtle — subtle"
      visual_dna: {character.boldness: balanced, one_bold_move: "фирменный приём страницы одной строкой (совпадает с art-direction.signature_move)"}
      taste: {MOTION_INTENSITY: [5, 7], DESIGN_VARIANCE: [6, 8], label: "[мнение вендора]"}
      impeccable_register: "Persuade"
      higgsfield_tier: "между editorial и cinema: 1–2 момента, без плавной прокрутки"

  - id: L2
    name_ru: "Иммерсивно, «вау»"
    name_en: "immersive"
    essence: "Страница как опыт: сквозная сцена или мир, 3D или видео-сюжет на прокрутке, переходы, «вау» в нескольких точках по ритму «спокойно ↔ эффектно». Страница L2 — это не «вау» в каждой секции: между пиками — спокойные секции, блоки конверсии — L0."
    signature_moves_max: 4
    chromatic_max: 4
    allowed:
      - {id: webgl-3d-scene, what: "3D-сцены и миры по прокрутке (бюджеты 3d 09/05 §1.1, §7.2)", limit: "≤ 2 одновременно активных контекста"}
      - {id: image-sequence, what: "секвенции кадров и видео-скраб по прокрутке", limit: "1–5 МБ, телефон — половина (3d 01/02 §7)"}
      - {id: horizontal-scroll-section, what: "горизонтальные секции в закреплении"}
      - {id: custom-cursor, what: "свой курсор на десктопе (системный — на полях ввода и при reduce)"}
      - {id: smooth-scroll, what: "плавная прокрутка (Lenis) без изменения скорости и без ломки якорей и Tab"}
      - {id: page-transitions, what: "переходы страниц на библиотеках (Barba, Swup) и JS-переходы с заставкой или шторкой; нативный кросс-документный VT — уже с L1 (view-transitions, X-21)"}
      - {id: preloader, what: "прелоадер — только кампания по явному решению (site-brief policies.preloader: on + rationale); LCP-элемент и CTA вне заставки"}
      - {id: all-l1, what: "всё, что разрешено на L1, в большем числе секций"}
    forbidden:
      - {id: text-in-canvas, why: "смысл и CTA — только HTML (CRV-AL-04)"}
      - {id: gate-before-content, why: "ворота «Enter» без доступного контента — только кампания-мир по явному решению; для продукта — потеря конверсии (3d 01/04 §7)"}
      - {id: effects-in-conversion, why: "форма, цена, калькулятор — L0"}
      - {id: scroll-speed-change, why: "перехват прокрутки с изменением скорости — никогда; только закрепление со скрабом"}
    motion_hints:
      continuous_motions_in_view_max: {mobile: 2, desktop: 3}   # телефон на 1 меньше
      continuous_motions_under_text_max: 0
      properties_allowed: [transform, translate, scale, rotate, opacity, color, background-color, clip-path, mask, filter, stroke-dashoffset, font-variation-settings, "--*", "uniform:*", view-transition, currentTime]
      blur_max_px: 8
      hero_scene_ms: [600, 1200]
      scroll_scene_length_vh: [100, 150]
      label: "[гипотеза]; длина сцены — [мнение] 3d 07/04 §5"
    budgets:
      effects:
        js_presentation_kb_br: {mobile: 150, desktop: 200, source: "3d 01/03: gsap + ScrollTrigger 40, lenis 4,9, motion 22 КБ br; переходы и курсор — свой код", label: "[данные] + [гипотеза]"}
        js_3d_kb_br: {mobile: 250, desktop: 350, source: "3d 01/03: three core 109, three + загрузчики 158, R3F + drei 286, R3F + drei + post 345 КБ br; 3d:01-02#3.1 (≤ 200/300) — для кампании мягче", label: "[данные] [спорно]"}
        webgl_contexts: {mobile: 1, desktop: 2, source: "предложение: один полноэкранный canvas на сцены; второй — только десктоп", label: "[гипотеза]"}
        wasm_presentation_kb_br: {mobile: null, desktop: null, source: "wasm-рантаймы подачи (dotLottie, Rive) — отдельная строка, в JS первого экрана не входят; веса и версии — 07-stack-implementation/stack.yaml; число порога даст пилот с Lottie или Rive", label: "[открыто]"}
        three_d_ref: "3d/09-web-runtime/05-performance-a11y-fallbacks.md §1.1"   # 3D героя и первого экрана — ворота 3d (§1.1, §7.2), одни на всех уровнях
        three_d_session_mb: {mobile: 3, desktop: 8, source: "3d:01-02#7 (история на прокрутке 5–15 МБ прогрессивно; мир 5–20 МБ); 3d 08/03 §6.5 (3D всей страницы ≤ 8–10 МБ десктоп, [мнение])", label: "[спорно]"}
        video_first_screen_kb: {mobile: 1000, desktop: 2500, source: "видео первого экрана без действия: петля hero или сюжет на постере; эффектные страницы creative 03/01 — у 15 из 49 больше 5 МБ видео до прокрутки", label: "[гипотеза]"}
        video_autoplay_session_mb: {mobile: 4, desktop: 10, source: "ai-media:01-02#4.3 (5/2 МБ для обычной страницы) × 2 для видео-сюжета; тяжелее — только после явного действия", label: "[гипотеза]"}
        draw_calls_max: {mobile: 30, desktop: 60, measure: "кадр в покое", source: "3d 11/05 §11 (WEB-05)", label: "[спорно] у 3d"}
        draw_calls_scroll_max: {mobile: 50, desktop: 100, measure: "кадр при прокрутке, сцена-«мир»", source: "3d:01-02#3.1 (≤ 100 для «мира»); 3d 11/05 §11", label: "[спорно] у 3d"}
        scroll_fps_min: {mobile: 30, desktop: 50, source: "3d 01/04 (десктоп Q1 55,6)", label: "[гипотеза]"}
      page_ref: "site/07-seo-geo-performance-analytics/budgets.yaml#levels.L2"
    appropriate_for:
      site_types: [campaign-site, portfolio-site]
      conditions:
        - "кампании и флагманские запуски, где впечатление и есть сообщение (умолчание по задаче страницы: кампании — L2)"
        - "крупное мероприятие, мода и культура, портфолио студий, рекрутинг в креативные команды"
        - "брендовый и прямой трафик, заметная доля десктопа, тёплая и лояльная аудитория"
        - "landing-product — только флагманский запуск по явному решению заказчика"
    avoid_for:
      - "лидогенерация услуг, тарифы, B2B-закупки и госсектор как основная цель"
      - "платный горячий мобильный трафик (реклама → форма)"
      - "аудитория 45+ как основная; регулируемые отрасли"
      - "SEO-посадочные: контент должен работать без JS"
    section_distribution:
      rule: "пики (visual_role peak) — по ритму в пределах peaks_min…peaks_max; между двумя пиками — хотя бы одна спокойная секция (calm или pause); hero — L2 или L1; секции конверсии — L0; story-секции могут быть L2"
      peaks_min: 2
      peaks_max: 4
      accents_max: 4
      calm_between_peaks_min: 1
      conversion_cap: L0
      label: "[гипотеза]; хореография — 05-motion/02"
    maps_to:
      claude_design:
        motion_level: cinematic
        motion_level_without_media: expressive   # нет готовых роликов 16:9 и 9:16 с постерами (ai-media) и рендера 3d
        library: ["gsap@3"]
        library_when: {"lenis@1": "плавная прокрутка"}
        three_d_mode: [hero-glb, scroll, model-viewer, prerender]
        note: "сайт-история, кино-скролл, 3D-мир"
      visual_dna: {character.boldness: bold, one_bold_move: "главный приём страницы; остальные пики перечисляются в art-direction.peaks"}
      taste: {MOTION_INTENSITY: [8, 10], DESIGN_VARIANCE: [8, 10], label: "[мнение вендора]"}
      impeccable_register: "Persuade (кампания) или Experience (портфолио)"
      higgsfield_tier: "cinema или spectacle"

# ------------------------------------------------------------------------------------------------------------------
# Уровни секций и потолки. Секционный уровень ≤ уровня страницы; роли конверсии — не выше L0.
section_caps:
  conversion_roles_max_L0: [lead-form, pricing]      # section_role словаря site
  conversion_blocks_max_L0: [lead-form, calculator, quiz, pricing-cards, pricing-table, pricing-single, email-capture, booking-widget]   # block: словаря site; плюс любая секция с action-slot form
  hero_form_rule: "block:hero-form — фон и визуал первого экрана по уровню страницы (до L1), сама форма и поля — без эффектов (L0)"
  final_cta_rule: "final-cta без формы — до L1 (accent), с формой — L0"
  chrome_roles: [header, footer, utility, legal]     # вне ритма: visual_role chrome, движение — только отклик
  label: "[практика] 3d 01/02 §1.3 + [гипотеза] для списка блоков"

# Умолчания уровня по типу страницы — по задаче страницы (сервисы L0, лендинги L1, кампании L2) и по таблице site
# 03-site-brief.md §3. Отклонение — только с причиной (site-brief ambition.source + note).
defaults_by_page_type:
  L0: [service-page, seo-landing-page, pricing-page, comparison-page, alternatives-page, faq-page, contacts-page, form-page, thank-you-page, legal-page, article-page, blog-index-page, careers-page, case-list-page, not-found-page, specialist-page, location-page, documents-page, search-results-page]
  L1: [landing-lead-services, landing-saas, landing-app, landing-product, landing-event, landing-course, landing-waitlist, landing-lead-magnet, home-multipage, services-index-page, feature-page, use-case-page, about-page, case-page, reviews-page, team-page, program-catalog-page]
  L2: [landing-campaign, portfolio-page]
  proposed:                        # типы site со status proposed (vocabulary.yaml); переносятся в L0/L1 вместе с их выпуском у site
    L0: [event-program-page, integrations-page, security-page, html-sitemap-page]   # «прочитать и найти»: расписание, каталог, доверие, навигация
    L1: [speakers-page]                                                            # витрина людей события; фото с согласием
    why: "уровень по задаче страницы — чтение и поиск → L0, витрина → L1 (site 03-site-brief.md §3); ecommerce-catalog-page и ecommerce-product-page — вне рамок site (промо товара — landing-product)"
  note: "одна таблица умолчаний уровня по типу страницы; site читает её (budgets.yaml page_type_levels — ссылка, site_validate.py, page_gates.py): service-page, seo-landing-page, pricing-page и прочие внутренние — L0 (умолчание по задаче страницы); landing-lead-services — L1 с L0-блоками конверсии, L0 — по правилу levels[L0].appropriate_for.lead_services"
  rules:
    - "уровень страницы не выше уровня сайта в брифе (site-brief ambition.level) — ограничение site"
    - "подъём внутренней страницы на уровень — только с причиной в брифе (ambition.by_page[].why)"
    - "L0 — сдержанная подача в той же визуальной системе сайта, а не «без дизайна» (формулировка site)"

# Потолок движения поверх уровня (site-brief ambition.motion_cap): визуальный уровень L1, движение — subtle.
motion_caps: [none, subtle, expressive, cinematic]

# Свойство вне properties_allowed уровня — только у названных эффектов, на любом уровне. Ключ — свойство словаря
# track.property спецификации движения или маска `--*` (любое пользовательское свойство). Свойства каждого приёма
# каталога на его минимальном уровне сверяет с этой таблицей spec_check.py levels --check (effects.yaml motion.properties).
property_exceptions:
  block-size: [effect:details-accordion]   # ::details-content аккордеона <details> — отклик по клику (motion-spec.schema.json $defs/moment)
  clip-path: [effect:mask-reveal, effect:button-expand-label, effect:expanding-columns]   # приёмы каталога уровня L0, собранные на clip-path
  filter: [effect:sticky-stack]            # приём каталога уровня L0: карточка стопки, уходящая под следующую, темнеет через filter: brightness()
  "--*": [effect:mesh-gradient-css]        # приём каталога уровня L0: mesh-градиент движется зарегистрированными пользовательскими свойствами (@property)

# Проекция уровня во вход холста — форма ключа одна у всех источников входа (references/claude-design.md § 6. Вход
# холста). Уровень страницы выбирает бриф (site-brief.ambition: level, by_page, by_section_role, motion_cap); этот файл
# даёт его перевод для исполнителя.
x-canvas-map:
  source: ambition-levels
  stages: [mockup, motion]
  files:
    brief.yaml:
      decisions.motion.level:
        rule: derive
        from: ["/levels/*/maps_to/claude_design/motion_level", "/levels/*/maps_to/claude_design/motion_level_without_media", "/motion_caps", "site-brief#/ambition/level", "site-brief#/ambition/by_page", "site-brief#/ambition/by_section_role", "site-brief#/ambition/motion_cap"]
        stages: [motion]
        note: "уровень страницы (by_page, иначе level) → maps_to.claude_design.motion_level; cinematic без готовых роликов и рендера → motion_level_without_media; сверху — motion_cap брифа в порядке motion_caps; уровень секции — by_section_role"
      decisions.motion.library:
        rule: derive
        from: ["/levels/*/maps_to/claude_design/library", "/levels/*/maps_to/claude_design/library_when"]
        stages: [motion]
        note: "стек уровня страницы; условная библиотека — по условию library_when; подача страницы может его только сузить (treatment page.motion_system.library)"
      decisions.three_d:
        rule: derive
        from: ["/levels/*/maps_to/claude_design/three_d_mode"]
        note: "режимы 3D, допустимые уровнем страницы; режим слота выбирает план ассетов (дорога 3D)"
      build.perf.effects:
        rule: derive
        from: ["/levels/*/budgets/effects"]
        note: "слой подачи уровня страницы рядом с профилем страницы (page_gates.py --resolve); вес и скорость меряются после сборки"
    pages/<page-id>/motion.md:
      свойства:
        rule: derive
        from: ["/levels/*/motion_hints/properties_allowed", "/levels/*/motion_hints/blur_max_px", "/property_exceptions"]
        stages: [motion]
        note: "свойства уровня страницы; page.properties_allowed спецификации движения их только сужает (spec_check.py spec)"
      бюджет внимания:
        rule: derive
        from: ["/levels/*/motion_hints/continuous_motions_in_view_max", "/levels/*/motion_hints/continuous_motions_under_text_max"]
        stages: [motion]
        note: "объектов-петель в зоне видимости по уровню страницы — десктоп и телефон; под читаемым текстом — ни одного"
      запрещено уровнем:
        rule: copy
        from: ["/levels/*/forbidden"]
        stages: [motion]
        note: "приёмы, запрещённые уровнем страницы, с причиной"
  drop:
    - from: ["/version", "/status", "/checked_at", "/effect_gates", "/owner", "/consumers"]
      note: "служебные поля файла"
    - from: ["/mandatory_all_levels"]
      note: "правила всех уровней — критерии приёмки (ACCEPTANCE.md, группа E) и ворота после сборки"
    - from: ["/levels/*/id", "/levels/*/name_ru", "/levels/*/name_en", "/levels/*/essence"]
      note: "уровень доходит до исполнителя переводом в decisions.motion.level"
    - from: ["/levels/*/signature_moves_max", "/levels/*/chromatic_max", "/levels/*/allowed", "/levels/*/section_distribution"]
      note: "нормы проверок подачи (spec_check.py, marketing_audit.py); приёмы уже выбраны в подаче и спецификации движения"
    - from: ["/levels/*/motion_hints/hero_entrance_ms", "/levels/*/motion_hints/hero_scene_ms", "/levels/*/motion_hints/scroll_driven_sections_max", "/levels/*/motion_hints/scroll_scene_length_vh", "/levels/*/motion_hints/label"]
      note: "числа движения исполнителю дают моменты спецификации движения и токены motion.marketing"
    - from: ["/levels/*/budgets/page_ref"]
      note: "профиль страницы — site budgets.yaml через page_gates.py --resolve (правило брифа или плана)"
    - from: ["/levels/*/appropriate_for", "/levels/*/avoid_for"]
      note: "выбор уровня — до входа холста, в брифе"
    - from: ["/levels/*/maps_to/claude_design/note", "/levels/*/maps_to/visual_dna", "/levels/*/maps_to/taste", "/levels/*/maps_to/impeccable_register", "/levels/*/maps_to/higgsfield_tier"]
      note: "пояснение и соответствия соседним шкалам — не вход холста"
    - from: ["/section_caps", "/defaults_by_page_type"]
      note: "потолки секций и умолчания уровня — выбор уровня в брифе и подаче плана"
