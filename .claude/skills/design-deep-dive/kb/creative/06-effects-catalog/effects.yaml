# effects.yaml — каталог эффектов подачи.
# Схема: effects.schema.json. Нормы — 01-effects-catalog.md; метод и сводка замеров — 03-effects-lab-method.md.
# Числа cost.* и fallback.*.measured — медианы effect_bench.py (лаборатория, Iris Xe; эмуляция телефона ≠ телефон).
version: '0.3'
checked_at: '2026-09-25'
owner: creative · 06-effects-catalog
doc: 06-effects-catalog/01-effects-catalog.md
method: '06-effects-catalog/03-effects-lab-method.md; effect_bench.py: Chromium 153.0.8010.12 и WebKit 26.6 (Playwright 1.63), десктоп 1440×900, Pixel 7
  + CPU ×4, reduce, без JS, без WebGL, без vsync'
families:
- {id: text, name_ru: Текстовые эффекты, doc: 01-effects-catalog.md §2}
- {id: marquee, name_ru: Бегущая строка, doc: 01-effects-catalog.md §3}
- {id: scroll, name_ru: 'Прокрутка: появление, прогресс, параллакс', doc: 01-effects-catalog.md §4}
