- {id: cursor, name_ru: Курсор и наведение, doc: 01-effects-catalog.md §7}
- {id: background, name_ru: 'Фоны: градиенты, шейдеры, зерно', doc: 01-effects-catalog.md §8}
- {id: surface, name_ru: 'Поверхности: стекло, свечение', doc: 01-effects-catalog.md §9}
