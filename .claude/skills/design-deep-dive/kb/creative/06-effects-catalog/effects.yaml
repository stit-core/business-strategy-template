- id: split-text-reveal
  name_ru: Раскрытие заголовка по строкам или словам
  name_en: split text reveal
  family: text
  purpose: 'Сделать ключевой заголовок событием: строки выезжают из масок один раз.'
  effect_role: [signature, support]
  level_min: L1
  limits: {per_page_L1: 2, per_page_L2: 4, max_chars_per_word_split: null}
  motion:
    kind: one-shot
    trigger: [load, in-view]
    attention_cost: 0
    duration_ms: [600, 1000]
    props: [transform]
    properties: [transform]
    rules_ref: 05-motion/01-motion-principles-and-access.md §4.2; 05-motion/03-micro-motion-and-performance.md
  implementation:
    type: js
    libs:
    - {name: gsap, version: 3.15.0, kb_br: 25.7, license: GSAP Standard No Charge, optional: true}
    - {name: gsap/SplitText, version: 3.15.0, kb_br: 3.3, license: GSAP Standard No Charge, optional: true}
    demo: lab/split-text-reveal/
    variants:
    - {id: own, type: js, demo: 'lab/split-text-reveal/?v=own', note: 'свой split по словам ≈ 0,5 КБ br + CSS-переходы'}
    - {id: none, type: css, demo: 'lab/split-text-reveal/?v=none', note: контроль LCP без эффекта}
    stack_ref: 07-stack-implementation/stack.yaml#gsap-splittext
    code_ref: 01-effects-catalog.md §2.1
  fallback:
    no_js:
      behavior: заголовок целиком, без разбиения
      measured: {content_ok: true, idle_motion_pct_s: 0.0}
    reduce:
      strategy: final-state
      note: не разбивать вовсе (библиотека не грузится)
      measured: {idle_motion_pct_s: 0.0, infinite_running: 0, draw_calls_per_frame: 0.0, videos_playing: 0, content_ok: true, bytes_br: 2556}
  mobile: {behavior: simplified, touch_alt: null, disabled_below_px: null, note: 'по словам, шаг 60 мс; длинные кириллические слова не делить на буквы'}
  a11y:
    wcag: [2.3.3, 1.3.1]
    pause_required: false
    flashes: none
    note: 'aria-label на родителе + aria-hidden у кусков (SplitText aria: ''auto'')'
