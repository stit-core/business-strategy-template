# Реестр приёмов-клише подачи сайта: визуальные и моушн-приметы «сделано по умолчанию».
# Политика и пять проверок — 01-cliche-policy.md; уникальность и вариативность — 02-uniqueness-and-variation.md.
# Проверка — ../../../scripts/creative/registry_check.py.
version: "0.1"
checked_at: "2026-09-24"
review_by: "2027-03-24"          # пересмотр раз в 6 месяцев (ui 11/04 §5)
status: draft
owner: "creative · 08-uniqueness-anti-slop"
scope: >-
  Визуальные приметы и приметы движения маркетинговой страницы (цвет, материал и поверхность, фон, 3D, типографика,
  шаблонный хром, композиция как визуал, движение, взаимодействие, подача продукта, образ). Структура и конверсия — site
  (ai-landing-markers.yaml, AIL-*); смысл и текст (тире, словарь штампов, текст надзаголовка) — text (COPY-*); приёмка ассета
  (IMG-M*, VID-M*) — ai-media; ворота 3D — 3d. На стыке запись ссылается на чужой id (поле neighbors) и не дублирует его.
principle: >-
  Клише — не запрет, а приём, выбранный никем: статистическое умолчание генератора или жанра. Приём оправдан, если проходит
  пять проверок (01-cliche-policy.md §1): концепция, бренд, исполнение, эпоха, единственность. Реестр задаёт условия
  (justify_if, twists), документ art-direction записывает исход для конкретного сайта (decisions[], cliche:<id>).
  Диагноз ставится по кластеру: одиночная примета — повод проверить решение, три и больше без решения — провал сцены.
compat:
  ail: "формат совместим с ../../site/09-ai-generation-evaluation/ai-landing-markers.yaml 1.0: severity B/S/D; justify_if ≡ allow; detect.method — коды ниже (общие с AIL: DOM, SCR, IMG, JDG, HUM, LNT)"
  art_direction: "../01-creative-direction/art-direction.schema.json $defs/decision: technique = cliche:<id>; aliases — прежние слова и id примеров (01-creative-direction/examples)"
  mockup_checks: "scripts/claude-design/mockup_checks.py: ключи --allow проверок (../../common/tells.yaml#checks, поле allow) → поле k3_allow; бриф site ambition.allow.markers"
  prefix: "пункты чек-листа — CRV-CL-*, CRV-UV-* (01, 02); маркеры реестра в проверках — cliche:<id>"
severity_scale:
  B: "блокер: нарушает WCAG A/AA или прячет смысл и действие (движение без паузы > 5 с рядом с текстом, текст нечитаем на эффекте)"
  S: "серьёзно: примета генератора или колея жанра без решения; снять или оправдать решением art-direction (justify_if)"
  D: "желательно: отпечаток шаблона без вреда; уводить при кластере и в дозе выше уровня"
status_scale:
  fresh: "редок в выдаче галерей и генераторов, не продаётся копипаст-компонентом; допустим как главный приём сцены"
  saturated: "массово в галереях, шаблонах и копипаст-китах; генератор ставит его сам — только с поворотом (twist) или в малой дозе"
  dated: "опознаётся как примета эпохи; только осознанная отсылка (ретро, пародия, фирменный архив) с названной причиной"
risk_scale:
  high: "генератор (Claude, Lovable, v0) ставит сам без просьбы; ≥ 2 независимых источника называют приметой ИИ"
  mid: "массовый жанровый приём; генератор ставит при словах брифа («премиально», «тех», «вау»)"
  low: "частый, но сам по себе не читается как ИИ; вредит только в кластере"
detect_codes:
  IMG: "кадр первого экрана или контактный лист (1440×900, 390×844; scroll_record.py, effects_probe.py sheet)"
  DOM: "computed styles и DOM (effects_probe.py, measure_ui.py, mockup_checks.py)"
  MET: "число по пикселям скриншота (доля оттенка OKLCH, colorfulness)"
  DET: "внешний детектор: impeccable detect 4.1.0 (id правила), @gessobuild/anti-slop 0.4.3 --marketing (id правила)"
  REC: "запись прокрутки: кадры и доля движущихся пикселей (scroll_record.py) — движение не видно на скриншоте"
  SCR: "сценарий в браузере: наведение, курсор, reduce, пауза"
  LNT: "проверка документа art-direction до сборки (ad_check.py): решение по cliche:<id> есть или нет"
  JDG: "судья по рубрике (../09-ai-execution-evaluation/04-effectiveness-rubric.md) по кадрам"
  HUM: "человек или заказчик"
fields:
  id: "kebab-case, латиница; стабилен, не переиспользуется; ссылка — cliche:<id>"
  aliases: "прежние слова и id (примеры 01-creative-direction/examples, бриф), которые означают эту запись"
  name_ru: "короткое имя"
  family: "color | surface | background | 3d | type | chrome | layout | motion | interaction | product | imagery | meta"
  sign: "как выглядит на странице"
  signals: "{eye: что увидеть глазом, metric: число и порог, detector: id правил внешних детекторов и наших проверок}"
  detect: "{method: [коды detect_codes], auto: что уже автоматизировано}"
  threshold: "когда примета засчитана"
  first_seen: "первые массовые появления: год и источник"
  saturated_since: "с какого года насыщен: год и источник (или null)"
  status: "fresh | saturated | dated (на checked_at)"
  severity: "B | S | D (как AIL)"
  risk: "high | mid | low"
  levels: "доза по уровню амбиций L0 / L1 / L2 (../01-creative-direction/ambition-levels.yaml)"
  justify_if: "когда приём законен — ≡ allow AIL; проверяется пятью критериями"
  twists: "повороты для насыщенного приёма (decision: twist)"
  replace_with: "чем заменить при avoid"
  cluster: "с какими записями образует кластер-провал"
  k3_allow: "ключ --allow проверки макета (../../common/tells.yaml#checks, поле allow), если проверка макета ловит эту примету; иначе null"
  neighbors: "коды маркеров соседей и сестёр; их статус на сайте — умолчание L0 (01-cliche-policy.md §4); какая запись соседа — та же примета и у кого её норма, сводит реестр примет ../../common/tells.yaml (owner, also)"
  evidence: "метки доказательности"
  checked_at: "дата проверки записи"
  review_by: "дата пересмотра"
clusters:
  # состав кластера = записи с этим id в поле cluster (источник истины — записи; registry_check.py сверяет обе стороны)
  - {id: ai-saas-2024, name_ru: "ИИ-SaaS 2023–2024", members: [purple-neon-band, purple-gradient-hero, gradient-text, neon-glow, pill-announcement-chip, accent-word-headline, overused-display-font, aurora-blobs, mesh-gradient-bg, glassmorphism-panels, dashboard-in-browser-frame, bento-uniform-tiles, logo-orbit-hero, emoji-sparkle-ai, pulsing-cta, meteor-shower, god-rays-light, flickering-grid, border-beam-shine, spotlight-card, typing-headline], source: "ui 11/04 §5; Hallmark anti-patterns Critical; ui 11/01 §18; приметы копипаст-китов на первом экране — 02-references-moodboards/04-motion-libraries-and-rules.md §3.2"}
  - {id: editorial-luxe-2025, name_ru: "«редакционный люкс» 2025–2026 (почерк генераторов макетов)", members: [dark-acid-accent, warm-paper, cream-serif-terracotta, broadsheet-hairlines, caps-eyebrow, mono-captions, meta-dots-labels, accent-word-headline, overused-display-font, webgl-centerpiece, dark-pause-section], source: "frontend-design v2–v3 кластеры 1, 2, 3, 5"}
  - {id: web3-3d-2022, name_ru: "Web3 и ИИ-3D 2021–2025", members: [purple-neon-band, aurora-blobs, iridescent-holo, chrome-liquid-metal, glass-object-pastel, particle-swarm, floating-orbs, synthwave-grid, floating-bob-loop], source: "3d 01/01 §22; ai-media 01/03 IMG-M05, M06; ai-media 11/03 §3.2 п.1"}
  - {id: studio-awwwards-kit, name_ru: "набор «наградной студии» 2019–2026", members: [section-fade-up, split-text-reveal, custom-cursor-follower, magnetic-button, marquee-strip, liquid-hover-distortion, preloader, smooth-scroll-default, circular-rotating-text, giant-display-type, variable-axis-gimmick, parallax-everything, cursor-watching-eyes], source: "creative 03/01 (частоты); 3d 01/01 §22"}
id_aliases:
  # прежние id из примеров (01-creative-direction/examples/*.json) → запись реестра; ссылка cliche:<прежний id> остаётся действительной
  latte-art-closeup: category-rut-imagery
  stock-interior-under-overlay: hero-media-veil
  preloader-percent: preloader
  purple-gradient: purple-gradient-hero
  bento: bento-uniform-tiles
  marquee: marquee-strip
  custom-cursor: custom-cursor-follower
  glassmorphism: glassmorphism-panels
watchlist:
  # Растущие приёмы: пока не приметы, но уже продаются готовыми или быстро растут. При пересмотре 2027-03 — кандидаты в saturated.
  checked_at: "2026-09-24"
  items:
    - {id_candidate: fluted-glass, name_ru: "рифлёное стекло поверх фото", evidence: "Paper Shaders fluted-glass (0.0.81) [данные]", note: "поворот для glassmorphism-panels, уже в ките"}
    - {id_candidate: css-scroll-driven-scenes, name_ru: "сцены на CSS scroll-driven", evidence: "Codrops: 1 урок 2024 → 8 уроков 2026; в продакшене 2 из 49 эффектных сайтов [данные]", note: "fresh; главный приём сцены допустим"}
    - {id_candidate: view-transition-morph, name_ru: "морфинг элементов между страницами (View Transitions)", evidence: "Codrops 2023-10-03; 1 из 49 [данные]", note: "fresh; кросс-документные — не Baseline"}
    - {id_candidate: scroll-film-scrub, name_ru: "скраб-фильм прокрутки из генерированного видео", evidence: "higgsfield-websites: animated website по умолчанию; scroll-world [мнение вендора]", note: "умолчание скилла → риск стать приметой ИИ-сайтов 2027"}
    - {id_candidate: chaos-opt-in-mode, name_ru: "«хаос-режим» по выбору посетителя (Vibes Mode)", evidence: "Afterglo «Vibes Mode» [V:J6aNMFZogyk 20:01–20:41] [кейс]", note: "не клише, а законный выход для L2-игры: включается кнопкой, есть остановка и reduce; следить за повторяемостью"}
cluster_rule: >-
  На одной сцене (экран, секция hero) три и больше записей одного кластера без решения art-direction — провал критерия
  «единственность» (01-cliche-policy.md §1.5); на странице — порог по уровню (§3.3): L0 ≤ 1 насыщенного приёма, L1 ≤ 2,
  L2 ≤ 3 с поворотом у каждого.
crosswalk_external:   # rel — по зеркалу site ai-landing-markers.yaml: AIL-08, -17 narrower; AIL-49 equal; AIL-47 related (там — перехват нажатия, B)
  - {ext: "центрированный hero 100vh, ложный пол", owner: site, id: AIL-06, here: "визуальных записей нет; композиция hero — ../04-visual-language/02"}
  - {ext: "три одинаковые карточки", owner: site, id: AIL-07, here: "—"}
  - {ext: "шаблонный бенто (≥ 5 однотипных плиток)", owner: site, id: AIL-08, rel: narrower, here: "bento-uniform-tiles — только визуал плиток (радиус, одинаковый padding)"}
  - {ext: "нарисованный хром браузера и телефона", owner: site, id: AIL-17, rel: narrower, here: "dashboard-in-browser-frame — подача продукта и повороты"}
  - {ext: "ряд чисел, числа без фактов", owner: site, id: [AIL-02, AIL-18], here: "— (решение k3:stats — twist)"}
  - {ext: "лента «Нам доверяют» без разрешения", owner: site, id: AIL-19, here: "marquee-strip — только движение ленты"}
  - {ext: "счётчик с нуля в HTML", owner: site, id: AIL-20, here: "—"}
  - {ext: "ИИ-шапка и ИИ-подвал", owner: site, id: [AIL-11, AIL-21], here: "—"}
  - {ext: "текст в canvas и видео", owner: site, id: AIL-27, here: "webgl-centerpiece, giant-display-type (кинетика — дубль в HTML)"}
  - {ext: "слайдер в hero, автокарусели", owner: site, id: AIL-36, here: "—"}
  - {ext: "прозрачный слой над призывом", owner: site, id: AIL-47, rel: related, here: "aurora-blobs, floating-orbs (декоративный слой — pointer-events: none)"}
  - {ext: "картинка без смысла над заголовком", owner: site, id: AIL-49, rel: equal, here: "category-rut-imagery"}
  - {ext: "тире, словарь штампов, текст надзаголовка", owner: text, id: "COPY-C-18, copy_lint", here: "caps-eyebrow — только визуал капса"}
  - {ext: "маркеры ассета IMG-M01…M25, VID-M01…M18", owner: ai-media, id: "../../ai-media/01-web-assets-landscape/03-ai-fit-trust-and-slop.md §5.2–5.3", here: "страничный уровень: как приём стоит на странице"}

