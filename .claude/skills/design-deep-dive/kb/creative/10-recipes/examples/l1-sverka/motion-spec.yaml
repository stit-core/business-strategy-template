# motion-spec v1 — рабочий пример L1 «Сверка» (лендинг SaaS, «продукт в движении»). Рецепт 10-recipes/02-saas-l1.md.
# Демо: сервис, банки и суммы вымышлены.
# Проверка схемой: $DDD_HOME/venv/bin/python ../../scripts/creative/spec_check.py spec 10-recipes/examples/l1-sverka/motion-spec.yaml
# Сверка сборки: python3 ../../scripts/creative/motion_check.py 10-recipes/examples/l1-sverka/index.html --level L1 --spec <этот файл>
motion_spec_version: "1.0"
id: sverka-home
example: true
status: proposed
checked_at: "2026-09-25"
refs:
  page_plan: "../../recipes/02-saas-l1.recipe.yaml#/page_plan"
  tokens: ../../../04-visual-language/marketing-tokens.json
  effects: ../../../06-effects-catalog/effects.yaml
  block_treatments: ../../../09-ai-execution-evaluation/block-treatments.yaml
level: L1
executor: {target: any, harness: any, video_in: false}
page:
  thesis: "Движется только сверка: платежи банка встают напротив своих счетов, линии связывают пары, один платёж остаётся красным — остальная страница стоит."
  character: [precise, calm]
  base: {duration_ms: 560, easing: {token: motion.marketing.easing.out-expo}}
  primitives: [fade-up, line-draw, number-tick]
  lcp: {target: hero.headline, entrance: none, note: "H1 антиквой — кандидат LCP, без анимации"}
  toggle: {required: false, attr: data-motion, states: [system, reduced, full], placement: sticky-header, remember: false}
  scroll: {smooth: false, tail_ms_max: 0, jacking: never}
  transitions: {kind: none}
  properties_allowed: [transform, translate, opacity, background-color, stroke-dashoffset, box-shadow]
  budget: {loops_in_view_max: 0, loops_in_view_max_mobile: 0, first_screen_scene_ms_max: 620, js_kb_br_effects_max: 0, long_frames_pct_max: 2, cls_scroll_max: 0.1}
  never:
    - "рамка браузера или телефона вокруг интерфейса (cliche:dashboard-in-browser-frame)"
    - "появление секций ниже сцены; счётчики у цен и тарифов"
    - "плавная прокрутка, перехват колеса, второе закрепление (L1: одна сцена ≤ 150vh)"
    - "выделенное слово в заголовке курсивом или цветом (cliche:accent-word-headline)"
sections:
  - id: hero
    block: hero-text
    role: accent
    level: L1
    intent: "заголовок стоит; лид и кнопка поднимаются один раз; ниже сгиба уже виден верх книги сверки — продолжение первого экрана"
    moments:
      - id: hero-copy-rise
        class: one-shot
        purpose: guide
        transition_type: entrance
        effect: "effect:hero-entrance-once"
        target: hero.subheadline
        selector_hint: ".hero__lead"
        stagger_targets: [hero.cta]
        trigger: {type: load}
        model: time
        tracks:
          - {property: transform, from: "translateY(var(--motion-marketing-distance-shift-reveal))", to: "none"}
          - {property: opacity, from: 0.01, to: 1}
        duration: {token: motion.marketing.duration.reveal}
        easing: {token: motion.marketing.easing.out-expo}
        stagger: {each: {token: motion.marketing.stagger.group}, order: dom, max_items: 2, total_ms_max: 620}
        repeat: once
        interrupt: jump-to-end
        lcp: not-lcp
        reduce: {strategy: final-state, describe: "лид и кнопка видны с первого кадра"}
        mobile: {strategy: same}
    reduce: {strategy: final-state, describe: "первый экран полон с первого кадра"}
    mobile: {strategy: same, describe: "то же, по центру"}
    budget: {js_kb_br: 0, loops_in_view: 0, load: eager}
  - id: product-demo
    block: product-showcase
    role: peak
    level: L1
    intent: "книга сверки закреплена на экран: пять счетов из 1С по очереди встают напротив своих платежей, линия связывает пару, строки становятся зелёными; последний платёж остаётся красным — «нет счёта»; счётчик «сопоставлено» идёт 0 → 5"
    scene:
      pin: sticky
      length_vh: 150
      length_vh_mobile: 130
      stations:
        # sticky-сцена: якорь (книга) стоит на месте всю сцену — зонд DOM «край цели» не про неё (+674 px);
        # станции — доли at, сверка кадром станции
        - {id: s1, at: 0.24, describe: "первая пара сошлась: строка 1 зелёная, линия 1 нарисована, счётчик 1"}
        - {id: s2, at: 0.54, describe: "три пары сошлись, четвёртый счёт в пути"}
        - {id: s3, at: 0.94, describe: "пять пар зелёные, платёж ИП Орлова красный с пометкой «нет счёта», счётчик 5 из 6"}
    moments:
      - id: ledger-match
        class: scroll-linked
        purpose: narrate
        transition_type: persistent
        effect: "effect:pin-scrub-story"
        target: product-demo.screenshot
        selector_hint: ".ledger__col--docs .row"
        stagger_targets: [product-demo.fx-links, product-demo.fx-flag]
        trigger: {type: scroll-scrub, subject: product-demo, range: {start: "contain 0%", end: "contain 100%"}}
        model: scrub
        tracks:
          - {property: translate, from: "0 calc(var(--from) * 100%)", to: "0 0", unit_note: "строка счёта из перемешанного слота к своей паре; пара i — окно contain (8 + 15i) % … (24 + 15i) %, движение в первых 70 % окна"}
          - {property: background-color, from: "var(--c-surface)", to: "var(--c-match)", unit_note: "в последних 28 % окна пары"}
          - {property: stroke-dashoffset, from: 1, to: 0, unit_note: "линия пары — во второй половине окна"}
          - {property: opacity, from: 0, to: 1, unit_note: "счётчик: цифры 0–5 стопкой, видна одна — 0 до 22 %, k на 22+15(k−1)…22+15k %, 5 с 82 % (середина позеленения пары); @property <integer> не годится — WebKit 26.6 не обновляет counter()"}
        easing: {none: true}
        scrub: {smoothing_s: 0, snap: none}
        interrupt: follow-input
        reduce: {strategy: final-state, describe: "пары стоят напротив, линии нарисованы, красная строка с пометкой, счётчик 5"}
        mobile: {strategy: simplified, describe: "строки 54 px, имя и сумма в две строки, та же сцена 130vh"}
    storyboard:
      frames:
        - {id: dm-s1, at: {station: s1}, viewport: desktop, describe: "Книга по центру окна: слева 6 платежей, справа счета вперемешку; первая пара зелёная", check: "строка счёта 214 на уровне платежа «Северный ветер» ±4 px"}
        - {id: dm-s3, at: {station: s3}, viewport: desktop, describe: "Все пары на местах, красная строка, счётчик 5", check: "в покое 0 % движения"}
    reduce: {strategy: final-state, describe: "книга в конечном состоянии, секция обычной высоты не нужна — остаётся 250svh с неподвижной книгой"}
    mobile: {strategy: simplified, describe: "книга уже, строки ниже; сцена 130vh"}
    fallback: {no_js: "эффект без JS — работает как есть", unsupported: "нет CSS scroll-driven (Safari до 26, Firefox до 159): конечное состояние — всё сошлось"}
    budget: {js_kb_br: 0, loops_in_view: 0, long_frames_pct_max: 2, idle_motion_pct_s_max: 0, cls_scroll_max: 0.1, load: eager}
    acceptance:
      - {id: dm-cls, check: "CLS при прокрутке ≤ 0,1 (sticky)", tool: motion_check, gate: EG-PERF-02, metric: scroll.cls, at: desktop, threshold: 0.1}
      - {id: dm-reduce, check: "в reduce книга неподвижна и в конечном состоянии", tool: motion_check, metric: rm.idle_first_pct, at: reduce, threshold: 0}
  - id: faq
    block: faq
    role: calm
    level: L0
    intent: "ответ проявляется opacity + 4 px; плюс поворачивается в крест"
    moments:
      - id: faq-open
        class: transition
        purpose: feedback
        transition_type: entrance
        target: faq.faq-a
        selector_hint: ".faq details[open] p"
        trigger: {type: click}
        model: time
        tracks:
          - {property: opacity, from: 0.01, to: 1}
          - {property: transform, from: "translateY(4px)", to: "none"}
        duration: {token: motion.marketing.duration.state}
        easing: {token: motion.marketing.easing.out-strong}
        repeat: once
        interrupt: jump-to-end
        reduce: {strategy: crossfade, describe: "180 мс без сдвига"}
        mobile: {strategy: same}
    reduce: {strategy: crossfade, describe: "180 мс"}
    mobile: {strategy: same, describe: "то же"}
    budget: {js_kb_br: 0, loops_in_view: 0, load: eager}
open_questions:
  - "Сцена задана долями одного view-timeline и var(--i) в animation-range (calc) — проверено в Chromium 153 и кадрами WebKit 26.6 Playwright (работает; счётчик на @property — нет, стоит стопка цифр); Safari на устройстве — живая фаза."
