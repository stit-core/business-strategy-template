# Рецепт 03 · Флагманский запуск продукта · L2 — машиночитаемая часть 10-recipes/03-product-launch-l2.md
recipe_version: "0.1"
id: recipe:product-launch-l2
title_ru: "Флагманский запуск продукта, L2 — история продукта: разобрать, собрать, заглянуть внутрь"
status: verified
checked_at: "2026-09-25"
site_type: landing-site
page_type: landing-product
level: L2
level_why: "флагманский запуск по явному решению заказчика (ambition.source: customer); прямой и брендовый трафик, десктоп ≥ 40 %"
budget_profile: landing-campaign@L2
when: ["есть реальный продукт или его CAD", "механика продукта — главный довод (модули, начинка, сборка)"]
not_when: ["лидогенерация с горячим мобильным трафиком", "нет продукта — 3D превращается в webgl-centerpiece"]
inputs:
  playbook: "../site/10-playbooks-contracts/02-playbooks-landings.md#5"
  art_direction_example: "01-creative-direction/examples/art-direction-kvarts.json"
  copy_deck_example: "../text/10-templates-recipes/examples/ru-kvarts-preorder.yaml"
  motion_spec_example: "10-recipes/examples/l2-zveno/motion-spec.yaml"
  video: ["V:yAWFjiaK1Ek 04:38", "V:ufHQG7fDLQc 09:13"]
concept:
  thesis: "Движется только сам продукт и только по вашей прокрутке: рука разбирается на модули, собирается поворотом колец и открывает сустав; текст стоит."
  story: {hero: "инженер цеха", conflict: "классический робот требует интегратора и месяцев", resolution: "модули собирает сам инженер за 30 минут и программирует рукой"}
  signature_move: "сборка из модулей по прокрутке + скан-проявление начинки шейдером (3d 01-01 §3.5)"
  directions: ["A «Сборочный чертёж» — тёмная студия, белые модули, оранжевый замок (выбран)", "B «Цех ночью» — световые трассы", "C «Паспорт изделия» — светлая изометрия"]
ledger:
  paper: dark
  display_style: condensed
  accent_hue: warm
  macrostructure: scroll-story
  hero_architecture: split-text-left
  main_technique: "effect:3d-scene"
  motion_signature: {entrances: "scrub-сцены со станциями; одно пробуждение", tempo: measured, curve: time-damped-scrub}
  corner_language: sharp
moodboard:
  - {role: motion, ref: "../3d/01-web-3d-landscape/04-reference-sites-measured.md#9", take: "целое → детали → целое, станции", dont_take: "ворота Enter, прелоадер, 20 МБ"}
  - {role: material, query: "студийный предметный рендер, анодированный алюминий", take: "тёмный фон, контровой свет, контактная тень", dont_take: "хром и жидкий металл"}
  - {role: antiref, query: "робот будущего лендинг", take: "—", dont_take: "частицы, неон, пурпур"}
page_plan:
  macrostructure: scroll-story
  first_screen_policy: offer-cta
  length: "9 секций"
  sections:
    - {id: header, block: "block:header", role: header, level: L0, visual_role: chrome, effects: ["effect:motion-toggle"]}
    - {id: hero, block: "block:hero-media", role: hero, level: L2, visual_role: accent, effects: ["effect:hero-entrance-once", "effect:3d-scene"], assets: [hero-visual, scene-3d], reduce: static-poster, mobile: "рука вверху кадра, текст внизу; постер 600×1300"}
    - {id: story-modules, block: "block:product-showcase", role: story, level: L2, visual_role: peak, effects: ["effect:3d-scene"], reduce: stations, mobile: "280svh, DPR 1,25"}
    - {id: specs, block: "block:key-facts", role: specs, level: L0, visual_role: calm}
    - {id: story-inside, block: "block:feature-spotlight", role: story, level: L2, visual_role: peak, effects: ["effect:3d-scene"], reduce: stations}
    - {id: product-demo, block: "block:feature-spotlight", role: product-demo, level: L1, visual_role: accent, effects: ["effect:svg-line-draw"], reduce: final-state}
    - {id: benefits, block: "block:benefit-list", role: benefits, level: L0, visual_role: calm}
    - {id: pricing, block: "block:pricing-single", role: pricing, level: L0, visual_role: calm}
    - {id: final-cta, block: "block:lead-form", role: lead-form, level: L0, visual_role: calm}
    - {id: footer, block: "block:footer", role: footer, level: L0, visual_role: chrome}
motion:
  thesis: "Продукт движется только по прокрутке; в покое 0 кадров; текст стоит."
  primitives: [fade-up, line-draw]
  peaks: [story-modules, story-inside]
  accents: [hero, product-demo]
  toggle: button
  smooth_scroll: false
  transitions: none
  loops_in_view_max: 0
  motion_spec_example: "10-recipes/examples/l2-zveno/motion-spec.yaml"
stack:
  library: ["three@0.186.1 (esbuild, 123 КБ br; сцена v2 — после светового прохода)", "motion.js", css]
  js_first_kb_br: 2.7
  notes: "three грузится после load + простоя и только при WebGL2 и не-reduce; один fixed-холст; рендер по требованию"
  platforms: {static: "как пример 10-recipes/examples/l2-zveno", tilda: "сцену выносить на static-страницу (creative 07/01 §10)"}
assets:
  - {slot: scene-3d, ladder: 3d, source: code, recipe_3d: "../3d/12-recipes/01-hero-product.md; 05-scroll-showcase.md; 08-sequence-video-alpha.md (телефон)", budget_kb: 125, note: "в проекте — CAD заказчика и запечённый свет"}
  - {slot: hero-visual, ladder: image, source: render, budget_kb: 15, note: "постер — рендер той же сцены 1600×1000 и 600×1300; v2 — 17,5 / 14,5 КБ: десктоп выше бюджета примера на 2,5 КБ после светового прохода (предел hero-изображения уровня — ambition-levels.yaml)"}
  - {slot: stations, ladder: image, source: render, budget_kb: 16, note: "5 станций 1200×750 для reduce, без JS и без WebGL; v2 — 7,4–16,2 КБ"}
  - {slot: og-image, ladder: image, source: template, task_codes: [IMG-TEXT-CYR], budget_kb: 300}
copy:
  promise: "робот, которого собирают за 30 минут"
  slots: [eyebrow, headline, subheadline, hero-proof, step-title, step-body, stat-value, stat-label, pricing-price, form-title, form-consent]
  deck_example: "../text/10-templates-recipes/examples/ru-kvarts-preorder.yaml"
  rules: ["биты истории — HTML-текст, не canvas", "характеристики — fact_ids", "призыв в шапке всегда"]
budget:
  js_presentation_kb_br: {mobile: 150, desktop: 200, example: 2.7}
  js_3d_kb_br: {mobile: 250, desktop: 350, example: 123.3}
  webgl_contexts: {mobile: 1, desktop: 2, example: 1}
  first_screen_mb: {mobile: 2.5, desktop: 4.0, example: 0.34}
  session_mb: {mobile: 8, desktop: 15, example: 0.37}
  fonts_kb: {mobile: 300, desktop: 300, example: 186.8}
  source: "ambition-levels.yaml L2; пример — прогон motion_check 0.1.3 (сцена v2)"
gates:
  tools: ["motion_check.py --level L2 --spec", "marketing_audit.py --level L2", "site_probe.py + gate_check (3d 09/05 §7.2)"]
  must_pass: [EG-PERF-08, EG-PERF-02, EG-WEIGHT-02, EG-WEIGHT-03, EG-A11Y-03, EG-A11Y-09, EG-A11Y-12, EG-FB-04, EG-FB-05]
  watch: ["EG-A11Y-27: текст первого экрана над 3D на телефоне — --contrast \"h1\" \".hero__lead\" (без затемнения под текстом H1 1,0:1)", "EG-PERF-05: загрузка сцены задачами (PMREM, compileAsync), не одной длинной", "хвост кадров ≤ 0,45 с после ввода (motion_check 0.1.2+ снимает на +0,5 с)"]
  manual: ["попарно с якорями L2 (рубрика 09-ai-execution-evaluation/effectiveness.rubric.json)", "реальный телефон: плавность и нагрев (EG-LIVE-01)"]
decisions:
  - {id: d-centerpiece, technique: "cliche:webgl-centerpiece", decision: twist, why: "3D — сам продукт и его механика; постер и станции без WebGL"}
  - {id: d-smooth, technique: "cliche:smooth-scroll-default", decision: avoid, why: "сцены на родной прокрутке, хвост только у картинки ≤ 0,45 с"}
  - {id: d-bob, technique: "cliche:floating-bob-loop", decision: avoid, why: "в покое 0 кадров; пробуждение одно и конечное"}
  - {id: d-preloader, technique: "cliche:preloader", decision: avoid, why: "постер своего рендера вместо заставки"}
  - {id: d-glow, technique: "cliche:neon-glow", decision: twist, why: "свечение — функция продукта: кольцо-замок горит, когда модуль зафиксирован и под питанием, гаснет при разборке; ровное, без пульсации и цветных теней; d-frame и d-chrome — в тексте рецепта §10 (схема: ≤ 5 решений)"}
errors: ["WebGL-центр без задачи", "рендер в покое", "LCP на canvas или заставке", "текст в canvas", "сглаживание по кадрам", "второй контекст ради проверки", "широкий игровой display"]
example:
  path: "10-recipes/examples/l2-zveno/"
  result: "прогон 1–2 (motion_check 0.1): B 0, S 4 ложные (детектор петель) → исправлено в 0.1.2; прогон 3 (сцена v2 после светового прохода, 0.1.3, 5 режимов): B 0, S 0, D 0; x-gate-exception не нужен."
