# Пути rubric — в раскладке шаблона (kb/<база>/…); source.path — от /home/mm/Документы/app-design/.
# compressed: true — WebP без потерь; false — оригинал базы байт в байт или вырезка PNG без потерь
# (3D и листы с усилением — оригиналы по решению заказчика; прочее — при любом сомнении в сжатии).
frames:
- id: '01'
  file: frames/01-zveno-v1-flat-light.png
  compressed: false
  pair: cr-zveno-light
  base: creative
  kind: defect
  level: L2
  illustrates: 'L2-сцена «Звено» кодом до светового прохода: плоский «каталожный» свет — рука висит без пола и контактной
    тени, крышки суставов — плоские чёрные диски, металл без отражений.'
  assessment: 'сила: один судья (мнение). Агент J2 по рубрике K: craft 3 (после прохода — 4). Сцена v1 проходила
    ворота на десктопе (motion_check 0.1.2, прогон K2: B 0 / S 0 / D 0) — это брак света и материала, а не годности;
    отдельный брак её страницы на телефоне — № 03.'
