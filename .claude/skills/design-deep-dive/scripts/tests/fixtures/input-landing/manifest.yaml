# Фикстура input-landing — иллюстрация для самопроверки scripts/project/canvas_input.py и прогонов входа холста
# лендинга: демо-проект фикстуры minimal (лендинг promo вымышленной студии «Отвес»: факты, голос) и свои файлы —
# остальные источники входа: бриф, план главной и план ассетов главной, смысл и иерархии, copy deck главной, бренд,
# арт-дирекция, спецификация движения, артефакт ДС, карта решений ДС и ARTIFACTS.md. План главной утверждён; copy deck —
# черновик агента (assumed): его секции и слоты носят id плана главной там, где слот есть у обоих; остальные слоты
# плана без текста — стык даёт предупреждения. Ссылки смысла, иерархий, голоса и плана на факты и смысл записаны путями
# вне проекта: к раскладке проекта их приводит фикстура package-landing. Вход directions собирается без ошибок, вход
# mockup упирается в гейт текстов и фактов. Формат манифеста — докстринг fixture_project.py.
example: true
description: лендинг promo для входа холста — бриф, план, смысл, иерархии, copy deck, план ассетов, арт-дирекция, движение, ДС
project: otves-remont-nn
extends: [minimal]
unmarked:   # артефакт ДС — в своём формате; бриф, смысл, иерархии и copy deck — в форме, которую читают утилиты
  - files/design/_design-system/project
  - files/site/promo/site-brief.yaml
  - files/site/promo/meaning.yaml
  - files/site/promo/hierarchy
  - files/site/promo/copy/home.yaml
layers:
  - files: files
